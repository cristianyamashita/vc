<!doctype html>
<html lang="en" data-theme="dark" data-wallpaper="bloom">
  <head>
    <link rel="icon" href="../assets/icons/ico/os.ico" type="image/x-icon">
    <link rel="manifest" href="../manifest.webmanifest">
    <meta name="theme-color" content="#008f7d">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Desktop</title>
    <link rel="stylesheet" href="css/os.css" />
  </head>
  <body>
    <div id="wallpaper" aria-hidden="true"></div>
    <div id="os-night-light" class="os-night-light" aria-hidden="true"></div>
    <main id="desktop" class="desktop"></main>
    <div id="desktop-widgets" class="desktop-widgets"></div>
    <div id="windows" class="window-layer"></div>
    <div id="start-menu" class="start-menu" hidden></div>
    <div id="context-menu" class="context-menu" hidden></div>
    <input id="os-wallpaper-file" type="file" accept="image/*,.png,.jpg,.jpeg,.webp,.gif,.bmp,.svg" multiple tabindex="-1" aria-hidden="true" />
    <div id="os-busy" class="os-busy" hidden role="status" aria-live="polite">
      <div class="os-busy-card">
        <div class="os-busy-spinner" aria-hidden="true"></div>
        <p id="os-busy-text"></p>
      </div>
    </div>
    <div id="os-switcher" class="os-switcher" hidden></div>
    <div id="os-snap-zone" class="os-snap-zone" hidden></div>
    <div id="os-run" class="os-run" hidden>
      <form id="os-run-form" class="os-run-dialog">
        <label for="os-run-input" data-i18n="run">Run</label>
        <input id="os-run-input" type="text" autocomplete="off" spellcheck="false">
        <p class="muted" data-i18n="runHint">Type an app name, id, or a path such as /Desktop/notes.txt</p>
      </form>
    </div>
    <div id="os-cal-flyout" class="os-cal-flyout" hidden></div>
    <div id="os-quick" class="os-quick" hidden></div>
    <div id="os-clip" class="os-clip" hidden></div>
    <div id="os-snip-overlay" class="os-snip-overlay" hidden></div>
    <footer id="taskbar" class="taskbar">
      <button type="button" id="start-btn" class="start-btn" aria-label="Start" title="Start">
        <img src="../assets/icons/svg/os.svg" alt="" />
      </button>
      <div id="taskbar-pins" class="taskbar-pins"></div>
      <div id="taskbar-apps" class="taskbar-apps"></div>
      <div id="taskbar-tray" class="taskbar-tray" role="toolbar" data-i18n-aria="tray" aria-label="Tray">
        <button type="button" id="tray-quick" class="tray-btn" data-i18n-aria="controlCenter" data-i18n-title="controlCenter" aria-label="Control Center" title="Control Center"></button>
        <button type="button" id="tray-clip" class="tray-btn" data-i18n-aria="clipboardHistory" data-i18n-title="clipboardHistory" aria-label="Clipboard history" title="Clipboard history"></button>
        <button type="button" id="tray-fullscreen" class="tray-btn" data-i18n-aria="enterFullscreen" data-i18n-title="enterFullscreen" aria-label="Fullscreen" title="Fullscreen"></button>
      </div>
      <button type="button" id="clock" class="taskbar-clock" data-i18n-aria="widgetCalendar" data-i18n-title="widgetCalendar" aria-label="Calendar" title="Calendar"></button>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="js/catalog.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/icon-color.js"></script>
    <script src="js/state.js"></script>
    <script src="js/file-apps.js"></script>
    <script src="js/builder-icons.js"></script>
    <script src="js/embed.js"></script>
    <script src="js/windows.js"></script>
    <script src="js/start-menu.js"></script>
    <script src="js/registry.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/app-builder.js"></script>
    <script src="js/fs.js"></script>
    <script src="js/file-picker.js"></script>
    <script src="js/file-explorer.js"></script>
    <script src="js/task-manager.js"></script>
    <script src="js/hotkeys.js"></script>
    <script src="js/os-desk.js"></script>
    <script src="js/os-widgets.js"></script>
    <script src="js/os-snip.js"></script>
    <script src="js/os-tray.js"></script>
    <script src="js/offline-manifest.js"></script>
    <script src="js/offline.js"></script>
    <script src="js/desktop.js"></script>
  </body>
</html>
