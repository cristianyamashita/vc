<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <link rel="icon" href="../../../assets/icons/ico/os-preview.ico" type="image/x-icon">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Preview</title>
    <link rel="stylesheet" href="../apps.css" />
    <style>
      .app-body { display: grid; place-items: center; overflow: auto; background: #111; }
      img, iframe { max-width: 100%; max-height: 100%; border: 0; background: #fff; }
      .empty { color: var(--muted); }
    </style>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-NWZDZ906DJ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-NWZDZ906DJ');
  </script>
  </head>
  <body>
    <div class="app-bar">
      <button type="button" id="open">Open</button>
      <span class="grow muted" id="name">Preview</span>
    </div>
    <div class="app-body" id="stage"><p class="empty">Open an image or PDF from File Explorer.</p></div>
    <script src="../../js/file-client.js"></script>
    <script src="../../js/app-frame.js"></script>
    <script>
      window.OSAppFrame.sync();
      const stage = document.getElementById("stage");
      function show(blob, node) {
        document.getElementById("name").textContent = (node && node.name) || "Preview";
        const url = URL.createObjectURL(blob);
        const mime = (blob.type || "").toLowerCase();
        if (mime.includes("pdf")) stage.innerHTML = `<iframe src="${url}" title="PDF" style="width:100%;height:100%"></iframe>`;
        else stage.innerHTML = `<img src="${url}" alt="">`;
      }
      const osFiles = window.OSFileClient && window.OSFileClient.connect({
        appId: "preview",
        exts: ["png", "jpg", "jpeg", "gif", "webp", "bmp", "svg", "ico", "pdf"],
        defaultExt: "png",
        defaultName: "preview.png",
        load: async (blob, node) => show(blob, node),
        serialize: async () => null,
      });
      document.getElementById("open").onclick = () => osFiles && osFiles.openPicker();
      window.OSAppFrame.onMessage();
    </script>
  </body>
</html>
