<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <link rel="icon" href="../../../assets/icons/ico/os-browser.ico" type="image/x-icon">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Browser</title>
    <link rel="stylesheet" href="../apps.css" />
    <style>
      body { display: flex; flex-direction: column; }
      .tabs { display: flex; gap: 4px; padding: 6px 8px 0; background: color-mix(in srgb, var(--panel) 80%, #000); overflow-x: auto; }
      .tab { display: flex; align-items: center; gap: 8px; border: 0; background: transparent; border-radius: 8px 8px 0 0; padding: 8px 10px; min-width: 120px; max-width: 220px; }
      .tab.active { background: var(--bg); }
      .tab span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .chrome { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; padding: 8px; border-bottom: 1px solid var(--line); background: var(--bg); }
      .modes { display: flex; gap: 4px; padding: 0 8px 8px; background: var(--bg); border-bottom: 1px solid var(--line); }
      .modes button { border: 1px solid var(--line); background: var(--panel); color: inherit; border-radius: 7px; padding: 4px 10px; font-size: 12px; }
      .modes button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
      .nav { display: flex; gap: 4px; }
      .nav button, .side-btn { width: 34px; height: 34px; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; }
      .omni { display: flex; gap: 0; }
      .omni input { flex: 1; border: 1px solid var(--line); border-radius: 18px; padding: 8px 14px; background: var(--panel); outline: none; }
      .stage { flex: 1; position: relative; min-height: 0; background: #fff; }
      iframe { width: 100%; height: 100%; border: 0; background: #fff; }
      .start, .blocked, .reader, .status { position: absolute; inset: 0; overflow: auto; padding: 28px; background: var(--bg); }
      .reader { background: #f7f4ea; color: #1b1b1b; max-width: 760px; margin: 0 auto; line-height: 1.55; }
      html[data-theme="dark"] .reader { background: #161616; color: #eee; }
      .reader pre { white-space: pre-wrap; word-break: break-word; overflow: auto; }
      .reader img { max-width: 100%; height: auto; border-radius: 8px; }
      .reader a { color: #008f7d; }
      .reader h1, .reader h2, .reader h3 { line-height: 1.25; }
      .reader .compat-note { font-size: 12px; margin-bottom: 16px; }
      .start h2, .blocked h2 { margin: 0 0 12px; }
      .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
      .tiles button, .tiles a { display: block; text-align: left; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: inherit; text-decoration: none; }
      .blocked .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
      .blocked .row button, .blocked .row a { border: 1px solid var(--line); background: var(--panel); color: inherit; border-radius: 8px; padding: 8px 12px; text-decoration: none; }
      .blocked .row button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
      .hint { position: absolute; left: 12px; right: 12px; bottom: 12px; z-index: 2; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 12px; border-radius: 10px; background: color-mix(in srgb, var(--panel) 92%, transparent); border: 1px solid var(--line); color: var(--ink); font-size: 13px; }
      .hint[hidden] { display: none; }
      .panel { position: absolute; top: 0; right: 0; bottom: 0; width: min(340px, 90%); background: var(--panel); border-left: 1px solid var(--line); padding: 14px; overflow: auto; box-shadow: var(--shadow); }
      .panel[hidden] { display: none; }
      .panel ul { list-style: none; padding: 0; margin: 0; }
      .panel li { padding: 8px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
      .cookie-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 8px 0; }
    </style>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-NWZDZ906DJ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-NWZDZ906DJ');
  </script>
  </head>
  <body>
    <div class="tabs" id="tabs"></div>
    <div class="chrome">
      <div class="nav">
        <button type="button" id="back" title="Back">←</button>
        <button type="button" id="fwd" title="Forward">→</button>
        <button type="button" id="reload" title="Reload">↻</button>
        <button type="button" id="home" title="Home">⌂</button>
      </div>
      <form class="omni" id="omni"><input id="url" type="text" spellcheck="false" placeholder="Search or enter address"></form>
      <div class="nav">
        <button type="button" id="popout" title="Open in a real tab">↗</button>
        <button type="button" id="star" title="Bookmark">☆</button>
        <button type="button" class="side-btn" id="bookmarks" title="Bookmarks">☰</button>
        <button type="button" class="side-btn" id="cookies" title="Cookies">◉</button>
      </div>
    </div>
    <div class="modes" id="modes"></div>
    <div class="stage" id="stage"></div>
    <aside class="panel" id="panel" hidden></aside>
    <script src="../../js/app-frame.js"></script>
    <script>
      const frame = window.OSAppFrame;
      const { host } = frame.sync();
      const store = host && host.OSDesk ? host.OSDesk.browserState() : { bookmarks: [], history: [], cookies: [], proxy: "" };
      const tabs = [{ id: "t1", title: "New Tab", url: "about:home", history: ["about:home"], index: 0, mode: "auto" }];
      let active = 0;
      let panelMode = null;
      let loadGen = 0;
      let blobUrl = null;

      const FRAME_BLOCKED = [
        "github.com", "gist.github.com", "google.com", "google.co.jp", "google.com.br",
        "facebook.com", "instagram.com", "twitter.com", "x.com", "linkedin.com",
        "apple.com", "icloud.com", "microsoft.com", "live.com", "office.com", "outlook.com",
        "netflix.com", "reddit.com", "tiktok.com", "chatgpt.com", "openai.com", "claude.ai",
        "amazon.com", "amazon.co.jp", "ebay.com", "paypal.com", "stripe.com",
        "notion.so", "figma.com", "discord.com", "slack.com", "spotify.com",
        "youtube.com", "twitch.tv", "yahoo.co.jp", "yahoo.com", "bing.com"
      ];

      function current() { return tabs[active]; }
      function t(key, fallback) { return frame.t(key, fallback); }
      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }
      function normalize(raw) {
        const q = String(raw || "").trim();
        if (!q || q === "about:home") return "about:home";
        if (/^about:/i.test(q)) return q.toLowerCase();
        if (/^https?:\/\//i.test(q)) return q;
        if (/^[\w.-]+\.[a-z]{2,}([/:?#].*)?$/i.test(q)) return "https://" + q;
        return "https://duckduckgo.com/?q=" + encodeURIComponent(q);
      }
      function titleOf(url) {
        if (url === "about:home") return "New Tab";
        try { return new URL(url).hostname.replace(/^www\./, ""); } catch { return url; }
      }
      function persist() {
        if (host && host.OSDesk) host.OSDesk.saveBrowser();
      }
      function remember(url) {
        if (!url || url === "about:home") return;
        store.history = [{ url, title: titleOf(url), at: Date.now() }].concat(store.history.filter((h) => h.url !== url)).slice(0, 80);
        persist();
      }
      function isLocal(url) {
        try { return new URL(url, location.href).origin === location.origin; } catch { return true; }
      }
      function rewriteForFrame(url) {
        try {
          const u = new URL(url);
          const hostName = u.hostname.replace(/^www\./, "");
          if ((hostName === "youtube.com" || hostName === "m.youtube.com") && u.pathname.indexOf("/watch") === 0) {
            const id = u.searchParams.get("v");
            if (id) return "https://www.youtube-nocookie.com/embed/" + encodeURIComponent(id);
          }
          if (hostName === "youtu.be") {
            const id = u.pathname.replace(/^\//, "").split("/")[0];
            if (id) return "https://www.youtube-nocookie.com/embed/" + encodeURIComponent(id);
          }
        } catch (_err) {}
        return url;
      }
      function likelyBlocked(url) {
        if (!url || url === "about:home" || isLocal(url)) return false;
        if (rewriteForFrame(url) !== url) return false;
        try {
          const hostName = new URL(url).hostname.replace(/^www\./, "");
          return FRAME_BLOCKED.some((h) => hostName === h || hostName.endsWith("." + h));
        } catch (_err) {
          return false;
        }
      }
      function resolvedMode(tab) {
        if (tab.mode && tab.mode !== "auto") return tab.mode;
        if (tab.url === "about:home" || isLocal(tab.url)) return "live";
        if (likelyBlocked(tab.url)) return "compat";
        return "live";
      }
      function revokeBlob() {
        if (blobUrl) {
          URL.revokeObjectURL(blobUrl);
          blobUrl = null;
        }
      }
      function customProxyUrl(url) {
        const custom = store.proxy && String(store.proxy).includes("{url}") ? String(store.proxy) : "";
        return custom ? custom.split("{url}").join(encodeURIComponent(url)) : "";
      }
      async function fetchText(url, ms) {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), ms || 18000);
        try {
          const res = await fetch(url, { signal: ctrl.signal });
          if (!res.ok) throw new Error(String(res.status));
          return await res.text();
        } finally {
          clearTimeout(timer);
        }
      }
      function jinaUrl(url) {
        return "https://r.jina.ai/" + url;
      }
      function mdLite(src) {
        const fences = [];
        let s = String(src || "").replace(/```([\s\S]*?)```/g, (_, code) => {
          fences.push(code);
          return "\u0000CODE" + (fences.length - 1) + "\u0000";
        });
        s = escapeHtml(s);
        s = s.replace(/!\[([^\]]*)\]\((https?:[^)\s]+)\)/g, (_, alt, href) => {
          return '<img alt="' + alt + '" src="' + href + '">';
        });
        s = s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, (_, label, href) => {
          return '<a href="' + href + '" data-go="' + href.replace(/"/g, "&quot;") + '">' + label + "</a>";
        });
        s = s.replace(/^### (.*)$/gm, "<h3>$1</h3>");
        s = s.replace(/^## (.*)$/gm, "<h2>$1</h2>");
        s = s.replace(/^# (.*)$/gm, "<h1>$1</h1>");
        s = s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
        s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
        s = s.replace(/^\s*[-*] (.*)$/gm, "<li>$1</li>");
        s = s.replace(/(?:<li>.*<\/li>\n?)+/g, (block) => "<ul>" + block + "</ul>");
        s = s.replace(/\n{2,}/g, "</p><p>");
        s = "<p>" + s + "</p>";
        s = s.replace(/\u0000CODE(\d+)\u0000/g, (_, i) => "<pre>" + escapeHtml(fences[Number(i)]) + "</pre>");
        return s;
      }
      function renderJinaArticle(text, url) {
        const raw = String(text || "");
        const titleMatch = raw.match(/^Title:\s*(.+)$/m);
        const title = titleMatch ? titleMatch[1].trim() : titleOf(url);
        let body = raw;
        const mdAt = raw.search(/Markdown Content:\s*/i);
        if (mdAt >= 0) body = raw.slice(mdAt).replace(/Markdown Content:\s*/i, "");
        else body = raw.replace(/^Title:.*$/m, "").replace(/^URL Source:.*$/m, "");
        return {
          title,
          html:
            `<div class="reader"><p class="muted compat-note">${escapeHtml(t("browserCompatNote", "Compatible copy — not the live site. Sign-in needs a real tab."))}</p>` +
            `<p class="muted">${escapeHtml(url)}</p>` +
            mdLite(body) +
            `</div>`,
        };
      }
      function prepareHtml(html, url) {
        let out = String(html || "");
        out = out.replace(/<meta[^>]*http-equiv\s*=\s*["']?Content-Security-Policy["']?[^>]*>/gi, "");
        out = out.replace(/<meta[^>]*http-equiv\s*=\s*["']?X-Frame-Options["']?[^>]*>/gi, "");
        out = out.replace(/(src|href)=(["'])\/\//gi, "$1=$2https://");
        const guard = `<script data-os-compat="1">(function(){var w=window;try{Object.defineProperty(w,"parent",{configurable:true,get:function(){return w}});}catch(e){}try{Object.defineProperty(w,"top",{configurable:true,get:function(){return w}});}catch(e){}try{Object.defineProperty(w,"frameElement",{configurable:true,get:function(){return null}});}catch(e){}document.addEventListener("click",function(e){var a=e.target&&e.target.closest&&e.target.closest("a[href]");if(!a)return;var href=a.href;if(!href||href.indexOf("javascript:")===0)return;if(a.target==="_blank"||a.target==="_new")return;e.preventDefault();e.stopPropagation();try{parent.postMessage({type:"os-browser-nav",url:href},"*");}catch(err){}},true);})();<\/script>`;
        const base = `<base href="${String(url).replace(/"/g, "&quot;")}">`;
        if (/<head[^>]*>/i.test(out)) out = out.replace(/<head[^>]*>/i, (m) => m + base + guard);
        else out = "<head>" + base + guard + "</head>" + out;
        return out;
      }
      function applyOriginCookies(url) {
        try {
          const u = new URL(url, location.href);
          if (u.origin !== location.origin) return;
          store.cookies.filter((c) => !c.host || c.host === u.host || c.host === location.host).forEach((c) => {
            document.cookie = c.name + "=" + encodeURIComponent(c.value) + "; path=/";
          });
        } catch (_err) {}
      }
      function paintTabs() {
        document.getElementById("tabs").innerHTML = tabs.map((tab, i) => `
          <button type="button" class="tab${i === active ? " active" : ""}" data-tab="${i}">
            <span>${escapeHtml(tab.title)}</span>
            ${tabs.length > 1 ? `<b data-close="${i}">×</b>` : ""}
          </button>`).join("") + `<button type="button" class="tab" id="newtab">+</button>`;
      }
      function paintModes() {
        const tab = current();
        const mode = tab.url === "about:home" ? "" : resolvedMode(tab);
        const btn = (id, label) =>
          `<button type="button" data-mode="${id}" class="${mode === id ? "on" : ""}">${escapeHtml(label)}</button>`;
        document.getElementById("modes").innerHTML =
          tab.url === "about:home"
            ? ""
            : btn("live", t("browserLive", "Live")) +
              btn("compat", t("browserCompat", "Compat")) +
              btn("reader", t("browserReader", "Reader"));
      }
      function startPage() {
        const marks = store.bookmarks || [];
        const recents = (store.history || []).slice(0, 8);
        const local = [
          { href: "../../index.html", name: "Desktop" },
          { href: "../../../index.html", name: "Collection" },
          { href: "../../../utils/backup.html", name: "Backup" },
        ];
        return `<div class="start">
          <h2>${escapeHtml(t("browserNewTab", "New Tab"))}</h2>
          <p class="muted">${escapeHtml(t("browserStartHint", "Sites that allow iframes open live. Sites that send X-Frame-Options (GitHub, Google, banks) open in Compat view, a proxied copy. Logins stay in a real browser tab."))}</p>
          <h3>Bookmarks</h3>
          <div class="tiles">${marks.length ? marks.map((b) => `<button type="button" data-go="${escapeHtml(b.url)}">${escapeHtml(b.title || b.url)}</button>`).join("") : `<p class="muted">☆</p>`}</div>
          <h3>This playground</h3>
          <div class="tiles">${local.map((b) => `<button type="button" data-go="${escapeHtml(b.href)}">${escapeHtml(b.name)}</button>`).join("")}</div>
          <h3>History</h3>
          <div class="tiles">${recents.map((b) => `<button type="button" data-go="${escapeHtml(b.url)}">${escapeHtml(b.title || b.url)}</button>`).join("")}</div>
        </div>`;
      }
      function blockedPage(url, err) {
        return `<div class="blocked">
          <h2>${escapeHtml(t("browserBlocked", "This site refused to be framed"))}</h2>
          <p class="muted">${escapeHtml(url)}</p>
          <p>${escapeHtml(t("browserBlockedHint", "The site sent X-Frame-Options or CSP frame-ancestors. Live iframes cannot override that. Compat view loads a copy through a proxy; use a real tab for sign-in."))}</p>
          ${err ? `<p class="muted">${escapeHtml(String(err.message || err))}</p>` : ""}
          <div class="row">
            <button type="button" class="primary" data-mode="compat">${escapeHtml(t("browserTryCompat", "Open in Compat view"))}</button>
            <button type="button" data-mode="reader">${escapeHtml(t("browserReader", "Reader"))}</button>
            <a href="${escapeHtml(url)}" target="_blank" rel="noopener">${escapeHtml(t("browserOpenTab", "Open in a real tab"))}</a>
          </div>
        </div>`;
      }
      function openExternal(url) {
        if (!url || url === "about:home") return;
        window.open(url, "_blank", "noopener");
      }
      function mountIframe(src, sandbox) {
        const stage = document.getElementById("stage");
        const safe = String(src).replace(/"/g, "&quot;");
        const box = sandbox
          ? ` sandbox="allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox allow-modals allow-presentation"`
          : "";
        stage.innerHTML = `<iframe id="view" src="${safe}" referrerpolicy="no-referrer-when-downgrade" allow="camera; microphone; fullscreen; clipboard-read; clipboard-write; autoplay"${box}></iframe><div class="hint" id="blank-hint" hidden></div>`;
        return document.getElementById("view");
      }
      function showBlankHint(url) {
        const hint = document.getElementById("blank-hint");
        if (!hint) return;
        hint.hidden = false;
        hint.innerHTML = `${escapeHtml(t("browserBlankHint", "If this page is blank, the site blocked the iframe."))}
          <button type="button" data-mode="compat">${escapeHtml(t("browserCompat", "Compat"))}</button>
          <button type="button" data-open-ext="${escapeHtml(url)}">${escapeHtml(t("browserOpenTab", "Open in a real tab"))}</button>`;
      }
      async function paintCompat(url, gen) {
        const stage = document.getElementById("stage");
        stage.innerHTML = `<div class="status"><p>${escapeHtml(t("browserCompatLoading", "Loading a compatible copy…"))}</p><p class="muted">${escapeHtml(url)}</p></div>`;
        const proxy = customProxyUrl(url);
        if (proxy) {
          try {
            const html = prepareHtml(await fetchText(proxy, 18000), url);
            if (gen !== loadGen) return;
            revokeBlob();
            blobUrl = URL.createObjectURL(new Blob([html], { type: "text/html;charset=utf-8" }));
            mountIframe(blobUrl, true);
            return;
          } catch (_err) {}
        }
        try {
          const article = renderJinaArticle(await fetchText(jinaUrl(url), 20000), url);
          if (gen !== loadGen) return;
          current().title = article.title || titleOf(url);
          paintTabs();
          stage.innerHTML = article.html;
        } catch (err) {
          if (gen !== loadGen) return;
          stage.innerHTML = blockedPage(url, err);
        }
      }
      async function paintReader(url, gen) {
        const stage = document.getElementById("stage");
        stage.innerHTML = `<div class="status"><p>${escapeHtml(t("browserReaderLoading", "Loading reader view…"))}</p></div>`;
        try {
          const article = renderJinaArticle(await fetchText(jinaUrl(url), 20000), url);
          if (gen !== loadGen) return;
          current().title = article.title || titleOf(url);
          paintTabs();
          stage.innerHTML = article.html;
        } catch (err) {
          if (gen !== loadGen) return;
          stage.innerHTML = blockedPage(url, err);
        }
      }
      function paintLive(url) {
        applyOriginCookies(url);
        const src = rewriteForFrame(url);
        const iframe = mountIframe(src, false);
        const showHint = likelyBlocked(url) || src === url;
        const timer = setTimeout(() => {
          if (showHint) showBlankHint(url);
        }, 1800);
        iframe.addEventListener("load", () => {
          clearTimeout(timer);
          try {
            const loc = iframe.contentWindow.location.href;
            if (loc && loc !== "about:blank" && loc.indexOf("blob:") !== 0) {
              const tab = current();
              tab.url = loc;
              tab.title = (iframe.contentDocument && iframe.contentDocument.title) || titleOf(loc);
              document.getElementById("url").value = loc;
              paintTabs();
              readFrameCookies(iframe);
            }
          } catch (_err) {
            current().title = titleOf(url);
            paintTabs();
            if (likelyBlocked(url)) showBlankHint(url);
          }
        });
        iframe.addEventListener("error", () => {
          clearTimeout(timer);
          current().mode = "compat";
          paintModes();
          paintStage();
        });
      }
      async function paintStage() {
        const tab = current();
        const gen = ++loadGen;
        revokeBlob();
        document.getElementById("url").value = tab.url === "about:home" ? "" : tab.url;
        paintModes();
        const stage = document.getElementById("stage");
        if (tab.url === "about:home") {
          stage.innerHTML = startPage();
          return;
        }
        const mode = resolvedMode(tab);
        if (mode === "compat") return paintCompat(tab.url, gen);
        if (mode === "reader") return paintReader(tab.url, gen);
        paintLive(tab.url);
      }
      function go(raw, fromOmni, keepMode) {
        const tab = current();
        const url = normalize(raw);
        tab.url = url;
        tab.title = titleOf(url);
        tab.mode = keepMode || (fromOmni ? "auto" : tab.mode || "auto");
        tab.history = tab.history.slice(0, tab.index + 1);
        if (tab.history[tab.history.length - 1] !== url) {
          tab.history.push(url);
          tab.index = tab.history.length - 1;
        }
        remember(url);
        paintTabs();
        paintStage();
      }
      function setMode(mode) {
        const tab = current();
        if (!tab || tab.url === "about:home") return;
        tab.mode = mode;
        paintModes();
        paintStage();
      }
      function readFrameCookies(iframe) {
        const lines = [];
        try {
          const doc = iframe.contentDocument;
          if (doc) {
            const raw = doc.cookie || "";
            lines.push(raw ? raw.split(";").map((p) => p.trim()).join("\n") : "(no document.cookie on this origin)");
          }
        } catch (_err) {
          lines.push(t("browserCookieCross", "Cross-origin frame: real cookies are sent to the site by Chromium, but this desktop cannot read HttpOnly or foreign cookies."));
        }
        store._lastRead = lines.join("\n");
      }
      function showPanel(mode) {
        const panel = document.getElementById("panel");
        if (panelMode === mode) { panel.hidden = true; panelMode = null; return; }
        panelMode = mode;
        panel.hidden = false;
        if (mode === "bookmarks") {
          panel.innerHTML = `<h3>Bookmarks</h3><ul>${(store.bookmarks || []).map((b, i) => `<li data-go="${escapeHtml(b.url)}">${escapeHtml(b.title || b.url)} <button data-forget="${i}">×</button></li>`).join("") || "<li class='muted'>—</li>"}</ul>`;
        } else if (mode === "history") {
          panel.innerHTML = `<h3>History</h3><ul>${(store.history || []).map((b) => `<li data-go="${escapeHtml(b.url)}">${escapeHtml(b.title || b.url)}</li>`).join("") || "<li class='muted'>—</li>"}</ul>`;
        } else {
          const jar = (store.cookies || []).map((c, i) => `<li>${escapeHtml(c.name)}=${escapeHtml(c.value)} <small>${escapeHtml(c.host || "")}</small> <button data-drop="${i}">×</button></li>`).join("");
          panel.innerHTML = `<h3>${escapeHtml(t("browserCookies", "Cookies"))}</h3>
            <p class="muted">${escapeHtml(t("browserCookieHint", "Same-origin pages share this playground's cookies. Compat view cannot use the site's real login cookies."))}</p>
            <pre class="muted" style="white-space:pre-wrap">${escapeHtml(store._lastRead || document.cookie || "—")}</pre>
            <h4>Jar for this origin</h4>
            <ul>${jar || "<li class='muted'>—</li>"}</ul>
            <form id="cookie-form">
              <div class="cookie-row"><input name="name" placeholder="name" required><input name="value" placeholder="value" required></div>
              <button class="primary" type="submit" style="border:0;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:8px">Add</button>
            </form>
            <h4>${escapeHtml(t("browserProxy", "Compat proxy"))}</h4>
            <p class="muted">${escapeHtml(t("browserProxyHint", "Optional. Use {url} in the template. Leave empty for the built-in proxies."))}</p>
            <form id="proxy-form">
              <input name="proxy" style="width:100%;margin:6px 0;padding:8px;border-radius:8px;border:1px solid var(--line);background:transparent;color:inherit" value="${escapeHtml(store.proxy || "")}" placeholder="https://example/{url}">
              <button class="primary" type="submit" style="border:0;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:8px">${escapeHtml(t("calSave", "Save"))}</button>
            </form>`;
        }
      }
      document.getElementById("tabs").addEventListener("click", (e) => {
        if (e.target.id === "newtab" || e.target.closest("#newtab")) {
          tabs.push({ id: "t" + Date.now(), title: "New Tab", url: "about:home", history: ["about:home"], index: 0, mode: "auto" });
          active = tabs.length - 1;
          paintTabs();
          paintStage();
          return;
        }
        const close = e.target.closest("[data-close]");
        if (close) {
          const i = Number(close.dataset.close);
          tabs.splice(i, 1);
          active = Math.max(0, Math.min(active, tabs.length - 1));
          paintTabs();
          paintStage();
          return;
        }
        const tab = e.target.closest("[data-tab]");
        if (tab) { active = Number(tab.dataset.tab); paintTabs(); paintStage(); }
      });
      document.getElementById("modes").addEventListener("click", (e) => {
        const btn = e.target.closest("[data-mode]");
        if (btn) setMode(btn.dataset.mode);
      });
      document.getElementById("omni").addEventListener("submit", (e) => {
        e.preventDefault();
        go(document.getElementById("url").value, true);
      });
      document.getElementById("back").onclick = () => {
        const tab = current();
        if (tab.index > 0) { tab.index -= 1; tab.url = tab.history[tab.index]; tab.mode = "auto"; paintTabs(); paintStage(); }
      };
      document.getElementById("fwd").onclick = () => {
        const tab = current();
        if (tab.index < tab.history.length - 1) { tab.index += 1; tab.url = tab.history[tab.index]; tab.mode = "auto"; paintTabs(); paintStage(); }
      };
      document.getElementById("reload").onclick = () => paintStage();
      document.getElementById("home").onclick = () => go("about:home", true);
      document.getElementById("popout").onclick = () => openExternal(current().url);
      document.getElementById("star").onclick = () => {
        const tab = current();
        if (tab.url === "about:home") return;
        store.bookmarks = [{ url: tab.url, title: tab.title }].concat((store.bookmarks || []).filter((b) => b.url !== tab.url));
        persist();
      };
      document.getElementById("bookmarks").onclick = () => showPanel("bookmarks");
      document.getElementById("cookies").onclick = () => showPanel("cookies");
      document.getElementById("stage").addEventListener("click", (e) => {
        const goBtn = e.target.closest("[data-go]");
        if (goBtn) {
          e.preventDefault();
          const keep = goBtn.closest(".reader") ? (current().mode === "reader" ? "reader" : "compat") : null;
          go(goBtn.dataset.go, true, keep);
          return;
        }
        const modeBtn = e.target.closest("[data-mode]");
        if (modeBtn) { setMode(modeBtn.dataset.mode); return; }
        const ext = e.target.closest("[data-open-ext]");
        if (ext) openExternal(ext.dataset.openExt);
      });
      document.getElementById("panel").addEventListener("click", (e) => {
        const goBtn = e.target.closest("[data-go]");
        if (goBtn) { go(goBtn.dataset.go, true); return; }
        const forget = e.target.closest("[data-forget]");
        if (forget) { store.bookmarks.splice(Number(forget.dataset.forget), 1); persist(); showPanel("bookmarks"); }
        const drop = e.target.closest("[data-drop]");
        if (drop) { store.cookies.splice(Number(drop.dataset.drop), 1); persist(); showPanel("cookies"); }
      });
      document.getElementById("panel").addEventListener("submit", (e) => {
        if (e.target.id === "cookie-form") {
          e.preventDefault();
          const data = new FormData(e.target);
          store.cookies.push({ name: data.get("name"), value: data.get("value"), host: location.host });
          document.cookie = data.get("name") + "=" + encodeURIComponent(data.get("value")) + "; path=/";
          persist();
          showPanel("cookies");
          return;
        }
        if (e.target.id !== "proxy-form") return;
        e.preventDefault();
        store.proxy = String(new FormData(e.target).get("proxy") || "").trim();
        persist();
        showPanel("cookies");
      });
      window.addEventListener("message", (e) => {
        const data = e.data;
        if (!data || data.type !== "os-browser-nav" || !data.url) return;
        go(data.url, true, "compat");
      });
      paintTabs();
      paintStage();
      window.OSAppFrame.onMessage();
    </script>
  </body>
</html>
