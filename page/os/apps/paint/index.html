<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <link rel="icon" href="../../../assets/icons/ico/os-paint.ico" type="image/x-icon">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Paint</title>
    <link rel="stylesheet" href="../apps.css" />
    <style>
      body { display: flex; flex-direction: column; }
      .app-bar { flex-shrink: 0; }
      .app-body { flex: 1; min-height: 0; height: auto; display: grid; place-items: center; background: #3a3a3a; overflow: auto; }
      html[data-theme="light"] .app-body { background: #cfcfcf; }
      canvas {
        background: #fff;
        cursor: crosshair;
        box-shadow: var(--shadow);
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div class="app-bar">
      <button type="button" class="app-icon-btn primary" data-tool="pencil" data-i18n-title="paintPencil" title="Pencil" aria-label="Pencil" aria-pressed="true">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 13 4.2 9.2 11.4 2l2.6 2.6-7.2 7.2z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M10.2 3.2 12.8 5.8" stroke="currentColor" stroke-width="1.3"/><path d="M3 13l2.2-.6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      </button>
      <button type="button" class="app-icon-btn" data-tool="eraser" data-i18n-title="paintEraser" title="Eraser" aria-label="Eraser" aria-pressed="false">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5.2 13.2 2.6 10.6a1.4 1.4 0 0 1 0-2l6-6a1.4 1.4 0 0 1 2 0l2.8 2.8a1.4 1.4 0 0 1 0 2l-4.6 4.6z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M4.2 13.2h9.3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M7 6.2 11.4 10.6" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
      <button type="button" class="app-icon-btn" data-tool="fill" data-i18n-title="paintFill" title="Fill" aria-label="Fill" aria-pressed="false">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.8 8.2 7.4 3.6l4.8 4.8-3.2 3.2a2.2 2.2 0 0 1-3.1 0z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M7.4 3.6 9.6 1.6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M12.4 9.4c1.4 0 2.3 1.2 2.3 2.4S13 14.4 12.4 13.2c-.7-1.2.2-3.8 0-3.8z" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
      <button type="button" class="app-icon-btn" data-tool="line" data-i18n-title="paintLine" title="Line" aria-label="Line" aria-pressed="false">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 13 13 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="3" cy="13" r="1.2" fill="currentColor"/><circle cx="13" cy="3" r="1.2" fill="currentColor"/></svg>
      </button>
      <button type="button" class="app-icon-btn" data-tool="rect" data-i18n-title="paintRect" title="Rectangle" aria-label="Rectangle" aria-pressed="false">
        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="4" width="10" height="8" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
      </button>
      <button type="button" class="app-icon-btn" data-tool="ellipse" data-i18n-title="paintOval" title="Oval" aria-label="Oval" aria-pressed="false">
        <svg viewBox="0 0 16 16" aria-hidden="true"><ellipse cx="8" cy="8" rx="5.4" ry="4.2" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
      </button>
      <span class="app-sep" aria-hidden="true"></span>
      <label class="app-color" data-i18n-title="paintColor" title="Color">
        <input id="color" type="color" value="#111111">
      </label>
      <div class="app-pop-wrap">
        <button type="button" class="app-icon-btn" id="btn-size" data-i18n-title="paintSize" title="Brush size" aria-label="Brush size" aria-expanded="false" aria-haspopup="true">
          <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="4.2" cy="8" r="1.2" fill="currentColor"/><circle cx="8.2" cy="8" r="2.1" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="12.4" cy="8" r="2.8" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
        </button>
        <div class="app-pop" id="size-pop" hidden>
          <label for="size" data-i18n="paintSize">Brush size</label>
          <div class="app-pop-row">
            <input id="size" type="range" min="1" max="40" value="4">
            <span class="app-pop-val" id="size-val">4</span>
          </div>
        </div>
      </div>
      <span class="app-sep" aria-hidden="true"></span>
      <button type="button" class="app-icon-btn" id="undo" data-i18n-title="paintUndo" title="Undo" aria-label="Undo">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.2 8.2a5.4 5.4 0 1 0 1.8-4.1" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M4.2 3.4v3.2h3.2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button type="button" class="app-icon-btn" id="clear" data-i18n-title="paintClear" title="Clear canvas" aria-label="Clear canvas">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 5h9M6.1 5V3.7A.8.8 0 0 1 6.9 2.9h2.2a.8.8 0 0 1 .8.8V5M5.2 5.6l.6 7.2a1 1 0 0 0 1 .9h2.4a1 1 0 0 0 1-.9l.6-7.2" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <span class="grow"></span>
      <button type="button" class="app-icon-btn" id="open" data-i18n-title="pickerOpen" title="Open" aria-label="Open">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 5.4V13a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V6.4a1 1 0 0 0-1-1H8L6.4 4H3a1 1 0 0 0-1 1.4z" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
      </button>
      <button type="button" class="app-icon-btn primary" id="save" data-i18n-title="npSave" title="Save" aria-label="Save">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 2.5h8.2L13.5 5v8.5h-11V2.5z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M5 2.5V6h6V2.5M5 13.5v-4h6v4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div class="app-body"><canvas id="c" width="960" height="540"></canvas></div>
    <script src="../../js/file-client.js"></script>
    <script src="../../js/app-frame.js"></script>
    <script>
      const canvas = document.getElementById("c");
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      let tool = "pencil";
      let drawing = false;
      let start = null;
      let snapshot = null;
      const undo = [];
      const sizeBtn = document.getElementById("btn-size");
      const sizePop = document.getElementById("size-pop");
      const sizeInput = document.getElementById("size");
      const sizeVal = document.getElementById("size-val");
      function pushUndo() {
        undo.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
        if (undo.length > 24) undo.shift();
      }
      function color() { return document.getElementById("color").value; }
      function size() { return Number(sizeInput.value) || 4; }
      function pos(e) {
        const r = canvas.getBoundingClientRect();
        return { x: (e.clientX - r.left) * (canvas.width / r.width), y: (e.clientY - r.top) * (canvas.height / r.height) };
      }
      function hexToRgb(hex) {
        const n = parseInt(hex.slice(1), 16);
        return [n >> 16, (n >> 8) & 255, n & 255, 255];
      }
      function setSizePop(open) {
        sizePop.hidden = !open;
        sizeBtn.setAttribute("aria-expanded", open ? "true" : "false");
        if (open) sizeInput.focus();
      }
      function flood(x, y, fill) {
        const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = img.data;
        const w = canvas.width;
        const i = (Math.floor(y) * w + Math.floor(x)) * 4;
        const target = [data[i], data[i + 1], data[i + 2], data[i + 3]];
        if (target[0] === fill[0] && target[1] === fill[1] && target[2] === fill[2] && target[3] === fill[3]) return;
        const stack = [[Math.floor(x), Math.floor(y)]];
        const seen = new Uint8Array(w * canvas.height);
        while (stack.length) {
          const [cx, cy] = stack.pop();
          if (cx < 0 || cy < 0 || cx >= w || cy >= canvas.height) continue;
          const idx = cy * w + cx;
          if (seen[idx]) continue;
          seen[idx] = 1;
          const p = idx * 4;
          if (data[p] !== target[0] || data[p + 1] !== target[1] || data[p + 2] !== target[2] || data[p + 3] !== target[3]) continue;
          data[p] = fill[0]; data[p + 1] = fill[1]; data[p + 2] = fill[2]; data[p + 3] = fill[3];
          stack.push([cx + 1, cy], [cx - 1, cy], [cx, cy + 1], [cx, cy - 1]);
        }
        ctx.putImageData(img, 0, 0);
      }
      document.querySelectorAll("[data-tool]").forEach((btn) => {
        btn.addEventListener("click", () => {
          tool = btn.dataset.tool;
          document.querySelectorAll("[data-tool]").forEach((b) => {
            const on = b === btn;
            b.classList.toggle("primary", on);
            b.setAttribute("aria-pressed", on ? "true" : "false");
          });
        });
      });
      sizeBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        setSizePop(sizePop.hidden);
      });
      sizeInput.addEventListener("input", () => { sizeVal.textContent = sizeInput.value; });
      document.addEventListener("pointerdown", (e) => {
        if (!sizePop.hidden && !e.target.closest(".app-pop-wrap")) setSizePop(false);
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && !sizePop.hidden) setSizePop(false);
      });
      canvas.addEventListener("pointerdown", (e) => {
        canvas.setPointerCapture(e.pointerId);
        const p = pos(e);
        if (tool === "fill") { pushUndo(); flood(p.x, p.y, hexToRgb(color())); return; }
        drawing = true;
        start = p;
        pushUndo();
        snapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = tool === "eraser" ? "#fff" : color();
        ctx.fillStyle = ctx.strokeStyle;
        ctx.lineWidth = size();
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        if (tool === "pencil" || tool === "eraser") {
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(p.x, p.y);
          ctx.stroke();
        }
      });
      canvas.addEventListener("pointermove", (e) => {
        if (!drawing) return;
        const p = pos(e);
        if (tool === "pencil" || tool === "eraser") {
          ctx.lineTo(p.x, p.y);
          ctx.stroke();
          return;
        }
        ctx.putImageData(snapshot, 0, 0);
        ctx.beginPath();
        if (tool === "line") { ctx.moveTo(start.x, start.y); ctx.lineTo(p.x, p.y); ctx.stroke(); }
        if (tool === "rect") ctx.strokeRect(start.x, start.y, p.x - start.x, p.y - start.y);
        if (tool === "ellipse") {
          ctx.ellipse((start.x + p.x) / 2, (start.y + p.y) / 2, Math.abs(p.x - start.x) / 2, Math.abs(p.y - start.y) / 2, 0, 0, Math.PI * 2);
          ctx.stroke();
        }
      });
      canvas.addEventListener("pointerup", () => { drawing = false; });
      document.getElementById("undo").onclick = () => { const img = undo.pop(); if (img) ctx.putImageData(img, 0, 0); };
      document.getElementById("clear").onclick = () => { pushUndo(); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, canvas.width, canvas.height); };
      window.OSAppFrame.sync();
      const osFiles = window.OSFileClient && window.OSFileClient.connect({
        appId: "paint",
        exts: ["png", "jpg", "jpeg", "webp", "bmp"],
        defaultExt: "png",
        defaultName: "drawing.png",
        load: async (blob) => {
          const img = new Image();
          img.onload = () => {
            ctx.fillStyle = "#fff";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          };
          img.src = URL.createObjectURL(blob);
        },
        serialize: async () => new Promise((resolve) => {
          canvas.toBlob((blob) => resolve({ blob, name: "drawing.png", mime: "image/png" }), "image/png");
        }),
      });
      document.getElementById("open").onclick = () => osFiles && osFiles.openPicker();
      document.getElementById("save").onclick = () => osFiles && osFiles.save();
      window.OSAppFrame.onMessage();
    </script>
  </body>
</html>
