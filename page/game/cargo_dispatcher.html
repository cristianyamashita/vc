t:'リスタート',shifts:'配送シフト',manifest:'貨物リスト',delivered:'到着',remaining:'残り',time:'時間',best:'ベスト',tip:'分岐をクリックして行き先を変更。信号をクリックして列車を停止・発進します。',ready:'経路を確認してシフトを開始。',start:'シフト開始',pause:'停止',resume:'再開',controls:'ライブ操作',legend:'マップ記号',switch:'分岐',signal:'信号',dock:'貨物ドック',again:'もう一度',next:'次のシフト',complete:'シフト完了！',completeCopy:'{n}本すべてが{t}で安全に到着しました。',crash:'衝突！',crashCopy:'同じ経路で列車が衝突しました。信号を調整して再挑戦してください。',wrong:'ドック違い！',wrongCopy:'{a}の貨物が{b}のドックに到着しました。',red:'赤い貨物',blue:'青い貨物',gold:'金の貨物',green:'緑の貨物',queued:'予定 {n}本',switchTo:'経路 → {n}',signalGreen:'信号：進行',signalRed:'信号：停止',running:'配送中…'}};let lang=localStorage.getItem('cargo-lang')||localStorage.getItem('app_lang')||'en';if(!I[lang])lang='en';const t=(k,v={})=>{let s=I[lang][k]||I.en[k]||k;for(const[a,b]of Object.entries(v))s=s.replaceAll('{'+a+'}',b);return s};
let S={level:0,trains:[],controls:{},delivered:0,elapsed:0,running:false,started:false,last:0,speed:1,result:null,spawned:new Set};const canvas=$('#board'),ctx=canvas.getContext('2d'),level=()=>LEVELS[S.level];
function loadLevel(n){S={level:n,trains:[],controls:{},delivered:0,elapsed:0,running:false,started:false,last:0,speed:1,result:null,spawned:new Set};for(const[id,node]of Object.entries(level().nodes)){if(node[2]==='switch')S.controls[id]=0;if(node[2]==='signal')S.controls[id]=true}$('#result').classList.add('hidden');renderUI();draw()}
function node(id){const n=level().nodes[id];return{id,x:n[0],y:n[1],kind:n[2],color:n[3]}}function neighbors(id){return level().edges.flatMap(e=>e[0]===id?[e[1]]:e[1]===id?[e[0]]:[])}function candidates(at,from){const routes=level().routes?.[at]?.[from];return routes||neighbors(at).filter(x=>x!==from)}

function update(dt){if(!S.running)return;S.elapsed+=dt;const sec=S.elapsed/1000;level().schedule.forEach((sp,i)=>{if(sec>=sp[0]&&!S.spawned.has(i)){S.spawned.add(i);spawn(sp,i)}});for(const train of S.trains){if(train.done)continue;if(train.at){depart(train);continue}const a=node(train.from),b=node(train.to),dist=Math.hypot(b.x-a.x,b.y-a.y);train.p+=dt*.105*S.speed/dist;if(train.p>=1){train.p=1;const arrived=b;if(arrived.kind==='dock'){if(arrived.color===train.color){train.done=true;S.delivered++}else return finish('wrong',{a:t(train.color),b:t(arrived.color)})}else{train.at=arrived.id;train.from=a.id;depart(train)}}}S.trains=S.trains.filter(x=>!x.done);const pos=S.trains.map(trainPos);for(let i=0;i<pos.length;i++)for(let j=i+1;j<pos.length;j++){if(Math.hypot(pos[i].x-pos[j].x,pos[i].y-pos[j].y)<24)return finish('crash')}if(S.delivered===level().schedule.length)finish('complete');renderMetrics()}

function toggle(){if(S.result)return;if(!S.started)S.started=true;S.running=!S.running;$('#status').textContent=t(S.running?'running':'ready');renderRun()}

function renderMetrics(){$('#delivered').textContent=S.delivered;$('#remaining').textContent=level().schedule.length-S.delivered;$('#time').textContent=formatTime(S.elapsed);$('#best').textContent=P.best[S.level]!=null?formatTime(P.best[S.level]*1000):'—'}function renderRun(){$('#play').innerHTML=(S.running?'Ⅱ ':'▶ ')+`<span>${t(S.running?'pause':S.started?'resume':'start')}</span>`;$('#slow').classList.toggle('primary',S.speed<1)}function formatTime(ms){const s=Math.floor(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function draw(){const x=ctx;x.clearRect(0,0,900,570);let g=x.createLinearGradient(0,0,0,570);g.addColorStop(0,'#173947');g.addColorStop(1,'#0f252d');x.fillStyle=g;x.fillRect(0,0,900,570);x.globalAlpha=.16;x.fillStyle='#78c6d3';for(let i=0;i<30;i++){x.beginPath();x.arc((i*83)%900,(i*137)%570,2+(i%3),0,7);x.fill()}x.globalAlpha=1;for(const[a,b]of level().edges)drawEdge(x,node(a),node(b));for(const[id]of Object.entries(level().nodes))drawNode(x,node(id));for(const tr of S.trains)drawTrain(x,tr)}
function drawEdge(x,a,b){x.lineCap='round';x.strokeStyle='#172027';x.lineWidth=19;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke();x.strokeStyle='#617581';x.lineWidth=3;x.setLineDash([9,8]);x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke();x.setLineDash([])}function drawNode(x,n){if(n.kind==='source'){x.fillStyle='#405461';x.fillRect(n.x-25,n.y-21,50,42);x.fillStyle='#eaf5f6';x.font='bold 18px system-ui';x.textAlign='center';x.fillText('▣',n.x,n.y+6)}else if(n.kind==='dock'){x.fillStyle=COLORS[n.color];x.globalAlpha=.85;x.fillRect(n.x-36,n.y-30,72,60);x.globalAlpha=1;x.fillStyle='#0c1b22';x.font='bold 11px system-ui';x.textAlign='center';x.fillText(t(n.color).split(' ')[0],n.x,n.y+4)}else if(n.kind==='signal'){const on=S.controls[n.id];x.fillStyle='#1b242a';x.beginPath();x.arc(n.x,n.y,18,0,7);x.fill();x.fillStyle=on?'#5ed595':'#ff6878';x.beginPath();x.arc(n.x,n.y,9,0,7);x.fill();x.strokeStyle=x.fillStyle;x.globalAlpha=.35;x.lineWidth=9;x.stroke();x.globalAlpha=1}else if(n.kind==='switch'){x.fillStyle='#ffae55';x.save();x.translate(n.x,n.y);x.rotate(Math.PI/4);x.fillRect(-14,-14,28,28);x.restore();x.fillStyle='#1c2427';x.font='bold 13px system-ui';x.textAlign='center';x.fillText(S.controls[n.id]+1,n.x,n.y+5)}else{x.fillStyle='#6b7f89';x.beginPath();x.arc(n.x,n.y,10,0,7);x.fill()}x.textAlign='left'}function drawTrain(x,tr){const p=trainPos(tr),a=tr.at?{x:p.x-1,y:p.y}:node(tr.from),b=tr.at?{x:p.x+1,y:p.y}:node(tr.to),angle=Math.atan2(b.y-a.y,b.x-a.x);x.save();x.translate(p.x,p.y);x.rotate(angle);x.fillStyle='#dce9ec';x.fillRect(-17,-10,34,20);x.fillStyle=COLORS[tr.color];x.fillRect(-10,-8,23,16);x.fillStyle='#172128';x.beginPath();x.arc(-10,11,4,0,7);x.arc(10,11,4,0,7);x.fill();x.restore()}
function point(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*900,y:(e.clientY-r.top)/r.height*570}}function hitControl(p){return Object.keys(S.controls).find(id=>{const n=node(id);return Math.hypot(n.x-p.x,n.y-p.y)<35})}function toast(s){const e=$('#toast');e.textContent=s;e.classList.remove('hidden');clearTimeout(toast.x);toast.x=setTimeout(()=>e.classList.add('hidden'),1700)}function translate(){$$('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));$('#lang').value=lang;document.documentElement.lang=lang;renderUI()}
let last=performance.now();function loop(now){const dt=Math.min(50,now-last);last=now;update(dt);draw();requestAnimationFrame(loop)}canvas.onclick=e=>{const id=hitControl(point(e));if(id)toggleControl(id)};$('#controls').onclick=e=>{const b=e.target.closest('[data-control]');if(b)toggleControl(b.dataset.control)};$('#levels').onclick=e=>{const b=e.target.closest('[data-level]');if(b)loadLevel(+b.dataset.level)};$('#play').onclick=toggle;$('#restart').onclick=()=>loadLevel(S.level);$('#slow').onclick=()=>{S.speed=S.speed<1?1:.55;renderRun()};$('#again').onclick=()=>loadLevel(S.level);$('#next').onclick=()=>loadLevel(Math.min(LEVELS.length-1,S.level+1));$('#lang').onchange=e=>{lang=e.target.value;localStorage.setItem('cargo-lang',lang);translate()};$('#theme').onclick=()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('cargo-theme',n)};document.documentElement.dataset.theme=localStorage.getItem('cargo-theme')||localStorage.getItem('app_theme')||'dark';translate();loadLevel(0);requestAnimationFrame(loop);
</script></body></html>
