<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102c30"><title>City Monster</title><link rel="icon" href="../../assets/icons/ico/game-city-monster.ico" type="image/x-icon"><link rel="stylesheet" href="style.css"></head>
<body><div class="app"><div class="topbar"><img src="../../assets/icons/svg/game-city-monster.svg" width="18" height="18" alt=""><h1 id="title">City Monster</h1><div class="main-tools"><button id="restart" aria-label="Restart">↻</button><button id="pause" aria-label="Pause">Ⅱ</button><button id="sound" aria-label="Sound">♪</button></div><div class="right-tools"><button id="help-button" aria-label="Help">?</button><select id="lang-switcher" aria-label="Language"><option value="en">EN</option><option value="pt">PT</option><option value="ja">JA</option></select><button id="theme-switcher" aria-label="Theme">◐</button></div></div>
<main id="stage"><div id="view"></div><div id="shade"></div><div id="hud"><div class="meters" id="meters"></div><div class="mission"><span class="pulse-dot"></span><span id="objective"></span></div><canvas id="radar" width="140" height="140" aria-label="Radar"></canvas><div id="status" role="status"></div><div id="reticle"><i></i></div><div id="hit-mark">×</div><div id="notice" role="status"></div><div class="actions" id="actions"></div><div class="dpad" id="dpad"><button data-key="KeyW" class="up" aria-label="Forward">▲</button><button data-key="KeyA" class="left" aria-label="Left">◀</button><button data-key="KeyS" class="down" aria-label="Back">▼</button><button data-key="KeyD" class="right" aria-label="Right">▶</button></div></div><div id="overlay"><section class="menu"><div class="menu-symbol" id="menu-symbol">◈</div><h2 id="menu-title"></h2><p id="menu-text"></p><div id="records"></div><div id="choices"></div><button class="primary" id="play"></button></section></div><div id="damage"></div><div id="loading"><span class="loader"></span><p id="loading-text">Loading 3D…</p><button id="retry-load" hidden>Retry</button></div></main></div>
<dialog id="help"><div class="dialog-title"><h2 id="help-title"></h2><button id="close-help" aria-label="Close">×</button></div><div id="help-copy"></div><div class="settings-row"><label for="quality" id="quality-label"></label><select id="quality"><option value="high">High</option><option value="low">Low</option></select></div></dialog>
<script type="module">import('./game.js').catch(()=>{const l=document.documentElement.lang;document.getElementById('loading-text').textContent=({en:'Unable to load the game. Check your connection and retry.',pt:'Não foi possível carregar o jogo. Verifique a conexão e tente novamente.',ja:'ゲームを読み込めません。接続を確認して再試行してください。'})[l]||'Unable to load the game.';document.getElementById('retry-load').hidden=false;document.getElementById('retry-load').onclick=()=>location.reload();document.querySelector('.loader').hidden=true;});</script></body></html>
