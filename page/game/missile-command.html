<body>
<div class="app">
<div class="topbar">
 <div class="brand"><img src="../assets/icons/svg/game-missile-command.svg" alt=""><h1>Missile Command <small>3D</small></h1></div>
 <div class="top-actions">
  <button id="pause" class="icon-button" data-title="pause" disabled>Ⅱ</button>
  <button id="restart" class="icon-button" data-title="restart" disabled>↻</button>
  <button id="sound" class="icon-button" data-title="sound" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M11 4 5 9H2v6h3l6 5zM16 9l6 6m0-6-6 6"/></svg></button>
  <button id="fullscreen" class="icon-button" data-title="fullscreen">⛶</button>
  <button id="help" class="icon-button" data-title="help">?</button>
  <select id="lang-switcher" data-title="language"><option value="en">EN</option><option value="pt">PT</option><option value="ja">JA</option></select>
  <button id="theme-switcher" class="icon-button" data-title="theme">◐</button>
 </div>
</div>
<main id="stage" class="stage">
 <canvas id="canvas" tabindex="0" data-title="canvas"></canvas>
 <div class="vignette"></div>
 <div class="hud">
  <div class="hud-block stats"><div class="stat"><span class="label" data-i18n="score"></span><strong id="score">00000</strong></div><div class="stat"><span class="label" data-i18n="wave"></span><strong id="wave">01</strong></div><div class="stat"><span class="label" data-i18n="credits"></span><strong id="credits">0</strong></div><div class="stat best-stat"><span class="label" data-i18n="best"></span><strong id="best">00000</strong></div></div>
  <div class="hud-block city-status"><span class="label" data-i18n="districts"></span><b id="cities">6 / 6</b><div id="districts" class="districts"><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
 </div>
 <div id="reticle" class="reticle" hidden><b></b></div>
 <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
 <div class="scene-caption">35° 41′ N &nbsp; 139° 41′ E<span data-i18n="sector"></span></div>
 <div class="dock" id="dock">
  <button class="battery" data-battery="0" aria-pressed="false"><span class="name" data-i18n="west"></span><kbd>1</kbd><span class="charge"><span class="meter"><i></i></span><span class="ammo">24</span></span></button>
  <button class="battery" data-battery="1" aria-pressed="true"><span class="name" data-i18n="central"></span><kbd>2</kbd><span class="charge"><span class="meter"><i></i></span><span class="ammo">24</span></span></button>
  <button class="battery" data-battery="2" aria-pressed="false"><span class="name" data-i18n="east"></span><kbd>3</kbd><span class="charge"><span class="meter"><i></i></span><span class="ammo">24</span></span></button>
  <button id="shield" class="battery shield-button"><span class="name" data-i18n="shield"></span><kbd>E</kbd><span class="charge" id="shield-status"></span></button>
 </div>
 <div id="screen-panel" class="screen-panel" hidden><img class="emblem" src="../assets/icons/svg/game-missile-command.svg" alt=""><h2 id="panel-title"></h2><p id="panel-text"></p><button id="play" class="primary"></button><button id="panel-help" class="secondary" data-i18n="how"></button></div>
 <section id="upgrade-panel" class="upgrade-panel" aria-labelledby="upgrade-title" hidden>
  <div class="upgrade-top"><div><h2 id="upgrade-title" data-i18n="upgrades"></h2><p id="upgrade-reward"></p></div><div class="wallet"><span class="label" data-i18n="credits"></span><strong id="shop-credits">0</strong></div></div>
  <div class="upgrade-content"><div class="upgrade-section" id="weapon-upgrades"><h3 data-i18n="weapons"></h3></div><div class="upgrade-section" id="city-upgrades"><h3 data-i18n="cityUpgrades"></h3></div></div>
  <div class="upgrade-footer"><span id="upgrade-feedback" role="status" aria-live="polite"></span><button id="next-wave" class="primary"></button></div>
 </section>
 <div id="flash"></div>
 <div id="loading" class="loading"><span>◇</span><p id="loading-text"></p><button id="retry" data-i18n="retry" hidden></button></div>
</main>
</div>
<dialog id="help-dialog">
 <div class="dialog-top"><h2 data-i18n="helpTitle"></h2><button id="close-help" data-i18n="close"></button></div>
 <h3 data-i18n="aimTitle"></h3><p data-i18n="aimHelp"></p>
 <h3 data-i18n="defenseTitle"></h3><p data-i18n="defenseHelp"></p>
 <h3 data-i18n="waveTitle"></h3><p data-i18n="waveHelp"></p>
 <h3 data-i18n="upgrades"></h3><p data-i18n="upgradeHelp"></p>
 <h3 data-i18n="keysTitle"></h3><p data-i18n="keysHelp"></p>
 <div class="settings-row"><label for="quality" data-i18n="quality"></label><select id="quality"><option value="high" data-i18n="high"></option><option value="low" data-i18n="low"></option></select></div>
 <p data-i18n="saveHelp"></p>
 <button id="help-restart" data-i18n="restart" disabled></button>
</dialog>

window.addEventListener('keydown',e=>{

 if($('help-dialog').open)return;
 if(e.key==='?'){e.preventDefault();openHelp();return}
 if(e.code==='Space'&&e.target.tagName==='BUTTON')return;
 if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code)){e.preventDefault();if(state==='playing'){keys.add(e.code);if(e.code==='Space'){spaceDown=true;startAudio();fire()}}return}
 if(e.repeat)return;const k=e.key.toLowerCase();if(k==='p'||k==='escape'){e.preventDefault();togglePause()}else if(k==='e')activateShield();else if(['1','2','3'].includes(k)){selected=Number(k)-1;refresh()}else if(k==='f')fullscreen();else if(k==='m')$('sound').click();
});
window.addEventListener('keyup',e=>{keys.delete(e.code);if(e.code==='Space')spaceDown=false});window.addEventListener('blur',()=>{clearInput();pause()});document.addEventListener('visibilitychange',()=>{if(document.hidden){clearInput();pause()}});
canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();pause();window.failBoot('contextError')});
new ResizeObserver(resize).observe(stage);
let last=performance.now();function frame(now){const dt=Math.min((now-last)/1000,.05);last=now;if(!document.hidden){visualTime+=dt;step(dt);waterMat.uniforms.time.value=reduced?0:visualTime;dome.visible=shieldTime>0;shieldMat.opacity=.085+Math.sin(visualTime*7)*.025;for(const b of batteries){const dir=aim.clone().sub(b.group.position).normalize();b.turret.quaternion.setFromUnitVectors(V(0,0,-1),dir)}if(noticeTime>0){noticeTime-=dt;if(noticeTime<=0)$('notice').hidden=true}shake=Math.max(0,shake-dt);$('flash').style.opacity=shake>.12?shake*.17:0;if(prefs.quality==='high')composer.render();else renderer.render(scene,camera)}requestAnimationFrame(frame)}
window.game={refresh,setTheme,get state(){return{mode:state,wave,score,best:prefs.best,cities:cities.map(c=>c.hp),ammo:batteries.map(b=>b.ammo),selected,shieldCharge,shieldTime,shots,kills,credits,upgrades:{...upgrades},maxHP:maxHP(),ammoCapacity:ammoCapacity(),blastRadius:blastRadius(),shotInterval:shotInterval(),interceptorSpeed:interceptorSpeed(),shieldDuration:shieldDuration(),shieldCapacity:shieldCapacity(),enemies:enemies.length,friends:friends.length,spawnLeft,simTime}},scene,camera};
// Deterministic stepping and scenario setup are opt-in, only for the local regression harness.
if(new URLSearchParams(location.search).has('test'))window.game.test={advance(seconds){for(let t=0;t<seconds;t+=1/60)step(1/60)},spawn:spawnEnemy,burst:(x,y)=>burst(V(x,y,0)),aim(x,y){aim.set(x,y,0)},fire,clear(){spawnLeft=0;for(const p of [...enemies])removeProjectile(p,enemies)},reset,buy:buyUpgrade};
syncDefenses();setTheme();resize();refresh();$('loading').hidden=true;requestAnimationFrame(frame);
} catch(error) {console.error(error);window.failBoot()}
</script>
</body>
</html>
