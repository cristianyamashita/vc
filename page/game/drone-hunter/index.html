<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark light"><title>Drone Hunter</title><link rel="icon" href="../../assets/icons/ico/game-drone-hunter.ico" type="image/x-icon"><link rel="stylesheet" href="styles.css"></head>
<body><div id="app"><header class="topbar"><img src="../../assets/icons/svg/game-drone-hunter.svg" width="18" height="18" alt=""><h1 id="title">Drone Hunter</h1><button id="pause" data-i18n="pause">Pause</button><button id="restart" data-i18n="restart">Restart</button><div class="spacer"></div><button id="sound" aria-label="Sound">♪</button><button id="help-button" aria-label="Help">?</button><select id="lang-switcher" aria-label="Language"><option value="en">EN</option><option value="pt">PT</option><option value="ja">JA</option></select><button id="theme-switcher" aria-label="Theme">◐</button></header>
<main id="viewport"><div id="canvas-host"></div><div id="hud" aria-live="off"></div><div id="objective"></div><div id="reticle" aria-hidden="true"></div><div id="toast" role="status"></div><div id="damage-flash" aria-hidden="true"></div><div id="panel" class="overlay"><section class="card"><div id="badge"></div><h2 id="panel-title">Drone Hunter</h2><p id="panel-text">Loading 3D scene…</p><div id="result"></div><button id="play" class="primary" disabled>Loading…</button><button id="panel-help" data-i18n="help">Help</button><button id="panel-restart" data-i18n="restart" hidden>Restart</button><div id="best"></div></section></div><div id="touch"><div class="dpad"><button data-key="KeyW" aria-label="Forward">▲</button><button data-key="KeyA" aria-label="Left">◀</button><button data-key="KeyS" aria-label="Back">▼</button><button data-key="KeyD" aria-label="Right">▶</button></div><div id="touch-actions"></div></div></main></div>
<dialog id="help"><div class="dialog-top"><h2 data-i18n="help">Help</h2><button id="close-help" aria-label="Close">×</button></div><div id="help-content"></div><label class="volume"><span data-i18n="volume">Volume</span><input id="volume" type="range" min="0" max="100" value="35"></label></dialog>
<script>
(()=>{let lang='en';try{lang=JSON.parse(localStorage.getItem('vc-drone-hunter-v1')||'{}').lang||localStorage.getItem('app_lang')||navigator.language.slice(0,2)}catch{}const t={en:['Loading 3D scene…','Unable to load the 3D engine. Check your connection and WebGL support, then retry.','Retry'],pt:['Carregando cenário 3D…','Não foi possível carregar o motor 3D. Verifique sua conexão e o suporte a WebGL e tente novamente.','Tentar novamente'],ja:['3Dシーンを読み込み中…','3Dエンジンを読み込めません。接続とWebGL対応を確認して再試行してください。','再試行']}[lang]||['Loading 3D scene…','Unable to load the 3D engine. Check your connection and WebGL support, then retry.','Retry'];document.querySelector('#panel-text').textContent=t[0];import('./game.js').catch(err=>{console.error(err);document.querySelector('#panel-text').textContent=t[1];const b=document.querySelector('#play');b.disabled=false;b.textContent=t[2];b.onclick=()=>location.reload();document.querySelector('#panel').hidden=false})})();
</script></body></html>
