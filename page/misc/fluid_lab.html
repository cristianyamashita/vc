<!doctype html><html lang="en" data-theme="dark"><head>

<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fluid Lab</title>
<style>
:root{--bg:#080b12;--panel:#101621e8;--panel2:#182130;--ink:#f0f4fb;--muted:#8b98ac;--line:#29364a;--cyan:#64e2e6;--pink:#ff70ae;--yellow:#ffd05f;--red:#ff687b;--shadow:0 24px 70px #000b}[data-theme=light]{--bg:#eaf0f5;--panel:#fbfdffed;--panel2:#fff;--ink:#172235;--muted:#68788f;--line:#d5dfeb;--cyan:#087f84;--pink:#c62d6a;--yellow:#a66c00;--red:#c4374d;--shadow:0 20px 55px #20385622}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,sans-serif;overflow:hidden}button,input,select{font:inherit;color:inherit}button{cursor:pointer}.app{height:100%;position:relative}.stage{position:absolute;inset:0;background:#05070c}.stage canvas{width:100%;height:100%;display:block;touch-action:none}.top{position:absolute;z-index:4;top:14px;left:16px;right:16px;height:58px;border:1px solid var(--line);border-radius:15px;background:var(--panel);backdrop-filter:blur(18px);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-between;padding:8px 10px 8px 14px}.brand{display:flex;gap:10px;align-items:center}.logo{width:38px;height:38px;border-radius:50% 48% 55% 45%;background:radial-gradient(circle at 32% 27%,#fff,var(--cyan) 18%,#725cff 60%,#ff70ae);transform:rotate(17deg);box-shadow:0 0 18px #68dcf755}.brand h1{font-size:16px;margin:0}.brand small{color:var(--muted)}.actions,.button-row{display:flex;gap:7px;align-items:center}.btn{border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:8px 10px;font-weight:750}.btn:hover{border-color:var(--cyan)}.btn.primary{background:var(--cyan);border-color:var(--cyan);color:#071519}.btn.active{border-color:var(--pink);color:var(--pink)}.btn.icon{width:38px;height:38px;padding:0}.lang{padding:8px;border:1px solid var(--line);background:var(--panel2);border-radius:9px}.controls{position:absolute;z-index:4;left:16px;top:87px;bottom:16px;width:250px;border:1px solid var(--line);border-radius:16px;background:var(--panel);backdrop-filter:blur(18px);box-shadow:var(--shadow);padding:14px;overflow:auto;display:flex;flex-direction:column;gap:15px}.section{display:grid;gap:9px}.section-title{font-size:9px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:850}.presets{display:grid;grid-template-columns:1fr 1fr;gap:7px}.preset{height:52px;border:1px solid var(--line);border-radius:9px;background:var(--p);position:relative;overflow:hidden}.preset.active{box-shadow:0 0 0 2px var(--cyan)}.preset span{position:absolute;left:5px;bottom:5px;background:#071019b8;color:#fff;border-radius:4px;padding:2px 5px;font-size:9px}.field{display:grid;gap:4px}.field-head{display:flex;justify-content:space-between;font-size:11px}.field-head span{color:var(--cyan);font:10px ui-monospace}input[type=range]{width:100%;accent-color:var(--cyan)}select{width:100%;border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:8px}.audio{border:1px solid var(--line);background:var(--panel2);border-radius:11px;padding:10px;display:grid;gap:8px}.audio p{margin:0;color:var(--muted);font-size:10px}.meter{height:5px;border-radius:99px;background:var(--line);overflow:hidden}.meter span{display:block;width:0;height:100%;background:linear-gradient(90deg,var(--cyan),var(--pink),var(--yellow))}.stats{margin-top:auto;display:flex;justify-content:space-between;color:#c6d3e7aa;font:10px ui-monospace}.hint{position:absolute;z-index:3;left:50%;bottom:24px;transform:translateX(-50%);background:#060a10a6;color:#dce8f8b0;border:1px solid #ffffff18;border-radius:99px;padding:6px 11px;font-size:10px;pointer-events:none}.palette{display:flex;gap:6px}.palette button{width:27px;height:27px;border:2px solid transparent;border-radius:50%;background:var(--c);padding:0}.palette button.active{border-color:#fff;box-shadow:0 0 0 2px var(--cyan)}.toast{position:fixed;z-index:8;right:18px;bottom:18px;background:#f0f5ff;color:#101722;padding:9px 14px;border-radius:9px;box-shadow:var(--shadow)}.hidden{display:none!important}@media(max-width:650px){.top{left:8px;right:8px;top:8px}.brand small,.action-label{display:none}.controls{left:8px;right:8px;top:auto;bottom:8px;width:auto;height:170px;display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:10px;padding:10px}.controls .section:nth-of-type(2){display:none}.presets{grid-template-columns:repeat(3,1fr)}.preset:nth-child(n+4){display:none}.audio p,.stats,.hint{display:none}.audio{padding:7px}.stage{bottom:150px}}
</style></head><body><div class="app"><div class="stage"><canvas id="fluid"></canvas></div><header class="top"><div class="brand"><div class="logo"></div><div><h1>Fluid Lab</h1><small data-i18n="subtitle">Paint motion into color</small></div></div><div class="actions"><button class="btn" id="pause">Ⅱ <span class="action-label" data-i18n="pause">Pause</span></button><button class="btn" id="clear">× <span class="action-label" data-i18n="clear">Clear</span></button><button class="btn" id="save">⇩ <span class="action-label" data-i18n="save">Save image</span></button><select id="lang" class="lang"><option value="en">EN</option><option value="pt">PT</option><option value="ja">JA</option></select><button class="btn icon" id="theme" aria-label="Theme">◐</button></div></header>
<aside class="controls"><section class="section"><div class="section-title" data-i18n="looks">Fluid looks</div><div id="presets" class="presets"></div><div class="section-title" data-i18n="inkColor">Ink color</div><div id="palette" class="palette"></div></section><section class="section"><div class="section-title" data-i18n="physics">Flow physics</div><div class="field"><div class="field-head"><label data-i18n="force">Brush force</label><span id="force-v"></span></div><input id="force" type="range" min="2" max="40" value="22"></div><div class="field"><div class="field-head"><label data-i18n="size">Brush size</label><span id="size-v"></span></div><input id="size" type="range" min="2" max="18" value="8"></div><div class="field"><div class="field-head"><label data-i18n="swirl">Swirl</label><span id="swirl-v"></span></div><input id="swirl" type="range" min="0" max="100" value="55"></div><div class="field"><div class="field-head"><label data-i18n="fade">Dissipation</label><span id="fade-v"></span></div><input id="fade" type="range" min="1" max="30" value="8"></div><select id="quality"><option value="120">Low · 120p</option><option value="180" selected>Balanced · 180p</option><option value="260">High · 260p</option></select></section><section class="section"><div class="section-title" data-i18n="audioReact">Audio reaction</div><div class="audio"><div class="button-row"><button class="btn" id="mic">● <span data-i18n="microphone">Microphone</span></button><button class="btn" id="audio-file">♪</button><input id="file" type="file" accept="audio/*" hidden></div><div class="meter"><span id="meter"></span></div><p data-i18n="audioHelp">Use a microphone or audio file. Bass injects waves and color.</p></div></section><div class="stats"><span id="fps">60 FPS</span><span id="particles">180×101</span></div></aside><div class="hint" data-i18n="hint">Drag or touch the canvas. Faster gestures create stronger currents.</div><div id="toast" class="toast hidden"></div></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const PRESETS=[{id:'aurora',name:['Aurora','Aurora','オーロラ'],bg:[2,5,14],colors:[[70,255,210],[100,110,255],[255,80,190]],swirl:68,fade:7},{id:'ink',name:['Ink','Tinta','インク'],bg:[235,230,214],colors:[[15,20,35],[45,63,100],[145,42,82]],swirl:45,fade:4},{id:'fire',name:['Fire','Fogo','炎'],bg:[8,2,1],colors:[[255,55,10],[255,155,20],[255,235,90]],swirl:58,fade:12},{id:'ocean',name:['Deep ocean','Oceano','深海'],bg:[0,13,25],colors:[[0,110,255],[30,235,220],[120,80,255]],swirl:52,fade:6},{id:'smoke',name:['Smoke','Fumaça','煙'],bg:[9,10,13],colors:[[215,225,240],[110,125,150],[70,75,90]],swirl:35,fade:3}];
const I={en:{subtitle:'Paint motion into color',pause:'Pause',resume:'Resume',clear:'Clear',save:'Save image',looks:'Fluid looks',inkColor:'Ink color',physics:'Flow physics',force:'Brush force',size:'Brush size',swirl:'Swirl',fade:'Dissipation',audioReact:'Audio reaction',microphone:'Microphone',audioHelp:'Use a microphone or audio file. Bass injects waves and color.',hint:'Drag or touch the canvas. Faster gestures create stronger currents.',micOn:'Microphone is reacting.',micOff:'Audio reaction stopped.',micError:'Microphone access was not available.',saved:'Image saved.'},pt:{subtitle:'Pinte movimento com cor',pause:'Pausar',resume:'Continuar',clear:'Limpar',save:'Salvar imagem',looks:'Estilos de fluido',inkColor:'Cor da tinta',physics:'Física do fluxo',force:'Força do pincel',size:'Tamanho do pincel',swirl:'Redemoinho',fade:'Dissipação',audioReact:'Reação ao áudio',microphone:'Microfone',audioHelp:'Use o microfone ou um arquivo de áudio. Os graves injetam ondas e cor.',hint:'Arraste ou toque na tela. Gestos rápidos criam correntes mais fortes.',micOn:'Microfone reagindo ao som.',micOff:'Reação ao áudio desligada.',micError:'Não foi possível acessar o microfone.',saved:'Imagem salva.'},ja:{subtitle:'動きを色で描く',pause:'停止',resume:'再開',clear:'クリア',save:'画像を保存',looks:'流体スタイル',inkColor:'インク色',physics:'流れの物理',force:'ブラシの力',size:'ブラシサイズ',swirl:'渦',fade:'消散',audioReact:'オーディオ反応',microphone:'マイク',audioHelp:'マイクまたは音声ファイルを使用。低音が波と色を生みます。',hint:'キャンバスをドラッグ／タッチ。速い動きほど強い流れになります。',micOn:'マイクの音に反応しています。',micOff:'オーディオ反応を停止しました。',micError:'マイクを利用できませんでした。',saved:'画像を保存しました。'}};let lang=localStorage.getItem('fluid-lang')||localStorage.getItem('app_lang')||'en';if(!I[lang])lang='en';const t=k=>I[lang][k]||I.en[k]||k;
const canvas=$('#fluid'),cx=canvas.getContext('2d',{alpha:false});let W,H,N,u,v,ut,vt,r,g,b,rt,gt,bt,p,div,curl,img,preset=PRESETS[0],colorIndex=0,paused=false,pointer=null,last=performance.now(),frames=0,fpsTime=last,audioCtx,analyser,audioSource,stream,audioEl,energy=0;
function init(res=180){W=+res;H=Math.max(70,Math.round(W*innerHeight/innerWidth));N=W*H;[u,v,ut,vt,r,g,b,rt,gt,bt,p,div,curl]=Array.from({length:13},()=>new Float32Array(N));canvas.width=W;canvas.height=H;img=cx.createImageData(W,H);$('#particles').textContent=W+'×'+H}
function idx(x,y){return x+y*W}function sample(a,x,y){x=Math.max(.5,Math.min(W-1.5,x));y=Math.max(.5,Math.min(H-1.5,y));const x0=x|0,y0=y|0,fx=x-x0,fy=y-y0,i=idx(x0,y0);return a[i]*(1-fx)*(1-fy)+a[i+1]*fx*(1-fy)+a[i+W]*(1-fx)*fy+a[i+W+1]*fx*fy}
function advect(dst,src,uu,vv,dt){for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){const i=idx(x,y);dst[i]=sample(src,x-uu[i]*dt,y-vv[i]*dt)}}
function project(){p.fill(0);for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){const i=idx(x,y);div[i]=-.5*(u[i+1]-u[i-1]+v[i+W]-v[i-W])}for(let k=0;k<9;k++)for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){const i=idx(x,y);p[i]=(div[i]+p[i-1]+p[i+1]+p[i-W]+p[i+W])*.25}for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){const i=idx(x,y);u[i]-=.5*(p[i+1]-p[i-1]);v[i]-=.5*(p[i+W]-p[i-W])}}
function vorticity(amount){for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){const i=idx(x,y);curl[i]=.5*(v[i+1]-v[i-1]-u[i+W]+u[i-W])}for(let y=2;y<H-2;y++)for(let x=2;x<W-2;x++){const i=idx(x,y),dx=Math.abs(curl[i+1])-Math.abs(curl[i-1]),dy=Math.abs(curl[i+W])-Math.abs(curl[i-W]),len=Math.hypot(dx,dy)+.001,force=curl[i]*amount;u[i]+=dy/len*force;v[i]-=dx/len*force}}
function step(){ut.set(u);vt.set(v);advect(u,ut,ut,vt,.22);advect(v,vt,ut,vt,.22);vorticity(+$('#swirl').value/900||.06);project();rt.set(r);gt.set(g);bt.set(b);advect(r,rt,u,v,.22);advect(g,gt,u,v,.22);advect(b,bt,u,v,.22);const fade=1-(+$('#fade').value/10000);for(let i=0;i<N;i++){u[i]*=.995;v[i]*=.995;r[i]*=fade;g[i]*=fade;b[i]*=fade}}
function inject(x,y,dx,dy,amount=1,ci=colorIndex){const rad=+$('#size').value,force=+$('#force').value,col=preset.colors[ci%preset.colors.length];for(let oy=-rad;oy<=rad;oy++)for(let ox=-rad;ox<=rad;ox++){const px=Math.round(x+ox),py=Math.round(y+oy);if(px<1||py<1||px>=W-1||py>=H-1)continue;const d2=ox*ox+oy*oy;if(d2>rad*rad)continue;const q=Math.exp(-d2/(rad*rad*.42))*amount,i=idx(px,py);u[i]+=dx*force*.12*q;v[i]+=dy*force*.12*q;r[i]+=col[0]/255*q*1.2;g[i]+=col[1]/255*q*1.2;b[i]+=col[2]/255*q*1.2}}
function render(){const d=img.data,bg=preset.bg;for(let i=0,j=0;i<N;i++,j+=4){const rr=1-Math.exp(-Math.max(0,r[i])*1.4),gg=1-Math.exp(-Math.max(0,g[i])*1.4),bb=1-Math.exp(-Math.max(0,b[i])*1.4),lum=Math.min(1,(rr+gg+bb)*.26);d[j]=Math.min(255,bg[0]*(1-lum)+rr*255);d[j+1]=Math.min(255,bg[1]*(1-lum)+gg*255);d[j+2]=Math.min(255,bg[2]*(1-lum)+bb*255);d[j+3]=255}cx.putImageData(img,0,0)}
function audioLevel(){if(!analyser)return 0;const a=new Uint8Array(analyser.frequencyBinCount);analyser.getByteFrequencyData(a);let sum=0,n=Math.min(24,a.length);for(let i=1;i<n;i++)sum+=a[i];return sum/n/255}
function audioInject(now){energy=energy*.78+audioLevel()*.22;$('#meter').style.width=Math.min(100,energy*150)+'%';if(energy>.025){const x=W*(.5+Math.sin(now*.0013)*.22),y=H*.88,burst=energy*3;inject(x,y,Math.cos(now*.003)*3,-5-energy*12,burst,(now/900|0)%preset.colors.length)}}
function loop(now){const dt=now-last;last=now;if(!paused){audioInject(now);step();render()}frames++;if(now-fpsTime>700){$('#fps').textContent=Math.round(frames*1000/(now-fpsTime))+' FPS';frames=0;fpsTime=now}requestAnimationFrame(loop)}
function setPreset(id){preset=PRESETS.find(x=>x.id===id)||PRESETS[0];$('#swirl').value=preset.swirl;$('#fade').value=preset.fade;renderPresets();clearFluid();updateValues();localStorage.setItem('fluid-preset',id)}function clearFluid(){[u,v,ut,vt,r,g,b,rt,gt,bt,p,div,curl].forEach(a=>a.fill(0));render()}
function renderPresets(){$('#presets').innerHTML=PRESETS.map(p=>`<button class="preset ${p.id===preset.id?'active':''}" data-preset="${p.id}" style="--p:linear-gradient(135deg,rgb(${p.colors[0]}),rgb(${p.colors[1]}),rgb(${p.colors[2]}))"><span>${p.name[lang==='pt'?1:lang==='ja'?2:0]}</span></button>`).join('');$('#palette').innerHTML=preset.colors.map((c,i)=>`<button data-color="${i}" class="${i===colorIndex?'active':''}" style="--c:rgb(${c})"></button>`).join('')}
function point(e){const rect=canvas.getBoundingClientRect();return{x:(e.clientX-rect.left)/rect.width*W,y:(e.clientY-rect.top)/rect.height*H}}async function startMic(){if(stream)return stopAudio();try{audioCtx=audioCtx||new(window.AudioContext||webkitAudioContext);stream=await navigator.mediaDevices.getUserMedia({audio:true});audioSource=audioCtx.createMediaStreamSource(stream);analyser=audioCtx.createAnalyser();analyser.fftSize=256;audioSource.connect(analyser);$('#mic').classList.add('active');toast(t('micOn'))}catch(e){toast(t('micError'))}}function stopAudio(){stream?.getTracks().forEach(x=>x.stop());stream=null;audioEl?.pause();audioEl=null;analyser=null;$('#mic').classList.remove('active');toast(t('micOff'))}async function useFile(file){stopAudio();audioCtx=audioCtx||new(window.AudioContext||webkitAudioContext);audioEl=new Audio(URL.createObjectURL(file));audioEl.loop=true;audioSource=audioCtx.createMediaElementSource(audioEl);analyser=audioCtx.createAnalyser();analyser.fftSize=256;audioSource.connect(analyser);analyser.connect(audioCtx.destination);await audioEl.play();$('#mic').classList.add('active')}
function updateValues(){$('#force-v').textContent=$('#force').value;$('#size-v').textContent=$('#size').value;$('#swirl-v').textContent=$('#swirl').value+'%';$('#fade-v').textContent=$('#fade').value}function translate(){$$('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));$('#lang').value=lang;document.documentElement.lang=lang;renderPresets()}function toast(s){const e=$('#toast');e.textContent=s;e.classList.remove('hidden');clearTimeout(toast.x);toast.x=setTimeout(()=>e.classList.add('hidden'),1900)}
canvas.onpointerdown=e=>{pointer=point(e);canvas.setPointerCapture(e.pointerId);inject(pointer.x,pointer.y,0,-2)};canvas.onpointermove=e=>{if(!pointer)return;const q=point(e),dx=q.x-pointer.x,dy=q.y-pointer.y;inject(q.x,q.y,dx,dy,1);pointer=q};canvas.onpointerup=()=>pointer=null;$('#presets').onclick=e=>{const b=e.target.closest('[data-preset]');if(b)setPreset(b.dataset.preset)};$('#palette').onclick=e=>{const b=e.target.closest('[data-color]');if(b){colorIndex=+b.dataset.color;renderPresets()}};['force','size','swirl','fade'].forEach(id=>$('#'+id).oninput=updateValues);$('#quality').onchange=e=>{init(e.target.value);clearFluid();localStorage.setItem('fluid-quality',e.target.value)};$('#pause').onclick=()=>{paused=!paused;$('#pause').innerHTML=(paused?'▶ ':'Ⅱ ')+`<span class="action-label">${t(paused?'resume':'pause')}</span>`};$('#clear').onclick=clearFluid;$('#save').onclick=()=>{const a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download='fluid-lab.png';a.click();toast(t('saved'))};$('#mic').onclick=startMic;$('#audio-file').onclick=()=>$('#file').click();$('#file').onchange=e=>e.target.files[0]&&useFile(e.target.files[0]);$('#lang').onchange=e=>{lang=e.target.value;localStorage.setItem('fluid-lang',lang);translate()};$('#theme').onclick=()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('fluid-theme',n)};document.documentElement.dataset.theme=localStorage.getItem('fluid-theme')||localStorage.getItem('app_theme')||'dark';$('#quality').value=localStorage.getItem('fluid-quality')||180;init($('#quality').value);preset=PRESETS.find(x=>x.id===localStorage.getItem('fluid-preset'))||PRESETS[0];translate();updateValues();setPreset(preset.id);requestAnimationFrame(loop);
</script></body></html>
