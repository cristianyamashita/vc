  if (!all.length) {
    list.innerHTML = `<div style="padding:10px;color:var(--muted);text-align:center">${tr('noSaved')}</div>`;
    return;
  }
  all.sort((a,b) => (b.savedAt||'').localeCompare(a.savedAt||''));
  all.forEach(p => {
    const item = document.createElement('div'); item.className = 'mli';
    const d = p.savedAt ? new Date(p.savedAt).toLocaleString() : '';
    item.innerHTML = `<span>${p.name}</span><span class="mli-date">${d}</span>`;
    item.addEventListener('click', () => {
      document.querySelectorAll('.mli').forEach(i => i.classList.remove('sel'));
      item.classList.add('sel');
      selProject = p.name;
    });
    list.appendChild(item);
  });
}

function loadSampleProject() {
  clearScene();
  uidSeq = 1;

  const ard = addComp(new ArduinoUno(uid('ard')), -2.5, 0);
  const pwr = addComp(new PowerSource(uid('pwr')), -6.5, -3);
  const res = addComp(new Resistor(uid('res')),   3,   -3);
  const led = addComp(new LED(uid('led')),         5,   -3.5);
  const btn = addComp(new PushButton(uid('btn')), -5.5, -3.5);
  const sw  = addComp(new ToggleSwitch(uid('sw')), -5.5, 2);
  const mot = addComp(new DCMotor(uid('mot')),     5.5,  1.5);
  const srv = addComp(new Servo(uid('srv')),       5.5,  4.5);
  const seg = addComp(new SevenSeg(uid('seg')),    0.5,  5.5);
  const pst = addComp(new Piston(uid('pst')),     -2,    5.5);
  const pb  = addComp(new Protoboard(uid('pb')),   1,   -5);

  // LED circuit: D0 → Resistor → LED A+, PowerSource GND → LED K–
  createWire(ard, 0, res, 0);
  createWire(res, 1, led, 0);
  createWire(pwr, 1, led, 1);

  // Button: VCC → Button B, Button A → D2
  createWire(pwr, 0, btn, 1);
  createWire(btn, 0, ard, 2);

  // Switch: VCC → COM, OUT → D4
  createWire(pwr, 0, sw, 0);
  createWire(sw,  1, ard, 4);

  // Motor: D3 → +, GND → –
  createWire(ard, 3, mot, 0);
  createWire(pwr, 1, mot, 1);

  // Servo: D6 → SIG, VCC → VCC, GND → GND
  createWire(ard, 6, srv, 2);
  createWire(pwr, 0, srv, 1);
  createWire(pwr, 1, srv, 0);

  // Piston: D5 → +, GND → –
  createWire(ard, 5, pst, 0);
  createWire(pwr, 1, pst, 1);

  // 7-Seg: D7–D13 → a–g, VCC → VCC, GND → GND
  for (let i = 0; i < 7; i++) createWire(ard, 7 + i, seg, i);
  createWire(pwr, 0, seg, 8);
  createWire(pwr, 1, seg, 7);

  // Protoboard: connect power rails
  createWire(pwr, 0, pb, 0);
  createWire(pwr, 1, pb, 12);

  // Load sample code
  ard.code = SAMPLE_CODE;
  refreshBoardSel();
  loadCodeFromBoard();

  camera.position.set(0, 17, 13);
  controls.target.set(0, 0, 0);
  controls.update();
  clog('Sample project loaded! Click ▶ Run to simulate.', 'lo');
  clog('Press button or toggle the switch to interact.', 'li');
}

const rh = document.getElementById('rhandle');

rh.addEventListener('mousedown', e => { rDrag=true; rY0=e.clientY; rH0=btm.offsetHeight; e.preventDefault(); });
document.addEventListener('mousemove', e => {
  if (!rDrag) return;
  btm.style.height = Math.min(480, Math.max(80, rH0 + rY0 - e.clientY)) + 'px';
});
document.addEventListener('mouseup', () => { rDrag = false; });

// Prevent browser scroll/zoom while mouse is over the 3D viewport
// (OrbitControls only prevents wheel when controls.enabled=true;
// this covers drag/place/wiring modes where enabled=false)
cwrap.addEventListener('wheel',         e => e.preventDefault(), { passive: false });
cwrap.addEventListener('gesturestart',  e => e.preventDefault(), { passive: false });
cwrap.addEventListener('gesturechange', e => e.preventDefault(), { passive: false });

function resize() {
  const w = cwrap.clientWidth, h = cwrap.clientHeight;
  renderer.setSize(w, h);
  labelRenderer.setSize(w, h);
  cvs.style.width  = w + 'px';
  cvs.style.height = h + 'px';

  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(cwrap);

//  Minimap
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const mmCanvas = document.getElementById('minimap');
const mmCtx = mmCanvas.getContext('2d');
const MM_W = 186, MM_H = 114;
const WX = 21, WZ = 15; // world half-extents

const MM_COLS = {
  ArduinoUno:'#4fc3f7', LED:'#ffee22', PushButton:'#ff4444',
  ToggleSwitch:'#ffaa00', DCMotor:'#44ff88', Servo:'#8888ff',
  SevenSeg:'#ff88ff', Piston:'#00ffcc', Resistor:'#ffaa44',
  Protoboard:'#4488ff', PowerSource:'#ffdd44'
};

function worldToMM(wx, wz) {
  return {
    px: Math.round((wx + WX) / (WX * 2) * MM_W),
    py: Math.round((wz + WZ) / (WZ * 2) * MM_H)
  };
}

function drawMinimap() {
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  mmCtx.clearRect(0, 0, MM_W, MM_H);
  // Background
  mmCtx.fillStyle = isDark ? 'rgba(13,17,23,0.9)' : 'rgba(240,242,245,0.92)';
  mmCtx.fillRect(0, 0, MM_W, MM_H);
  // Workbench border
  mmCtx.strokeStyle = isDark ? '#30363d' : '#c8d0d8';
  mmCtx.lineWidth = 1;
  mmCtx.strokeRect(0.5, 0.5, MM_W - 1, MM_H - 1);
  // Light grid
  mmCtx.strokeStyle = isDark ? '#1e2530' : '#dde3ec';
  mmCtx.lineWidth = 0.5;
  for (let x = 0; x <= MM_W; x += MM_W / 8) { mmCtx.beginPath(); mmCtx.moveTo(x, 0); mmCtx.lineTo(x, MM_H); mmCtx.stroke(); }
  for (let y = 0; y <= MM_H; y += MM_H / 5) { mmCtx.beginPath(); mmCtx.moveTo(0, y); mmCtx.lineTo(MM_W, y); mmCtx.stroke(); }

  // Components as dots
  components.forEach(c => {
    const { px, py } = worldToMM(c.group.position.x, c.group.position.z);
    const col = MM_COLS[c.type] || '#888';
    // Shadow
    mmCtx.fillStyle = 'rgba(0,0,0,0.4)';
    mmCtx.beginPath(); mmCtx.arc(px + 0.5, py + 0.5, 4, 0, Math.PI * 2); mmCtx.fill();
    // Dot
    mmCtx.fillStyle = col;
    mmCtx.beginPath(); mmCtx.arc(px, py, 4, 0, Math.PI * 2); mmCtx.fill();
    // Initial letter
    mmCtx.fillStyle = '#000';
    mmCtx.font = 'bold 6px monospace';
    mmCtx.textAlign = 'center';
    mmCtx.textBaseline = 'middle';
    mmCtx.fillText(c.type[0], px, py);
  });

  // Camera target crosshair
  const { px, py } = worldToMM(controls.target.x, controls.target.z);
  mmCtx.strokeStyle = isDark ? 'rgba(255,255,255,0.7)' : 'rgba(0,0,0,0.5)';
  mmCtx.lineWidth = 1;
  mmCtx.beginPath();
  mmCtx.moveTo(Math.max(0, px - 8), py); mmCtx.lineTo(Math.min(MM_W, px + 8), py);
  mmCtx.moveTo(px, Math.max(0, py - 8)); mmCtx.lineTo(px, Math.min(MM_H, py + 8));
  mmCtx.stroke();
  // Small circle at target
  mmCtx.beginPath(); mmCtx.arc(px, py, 3, 0, Math.PI * 2);
  mmCtx.strokeStyle = '#4fc3f7'; mmCtx.lineWidth = 1.5; mmCtx.stroke();
}

mmCanvas.addEventListener('click', e => {
  const r = mmCanvas.getBoundingClientRect();
  const mx = (e.clientX - r.left) * (MM_W / r.width);
  const my = (e.clientY - r.top)  * (MM_H / r.height);
  const wx = mx / MM_W * (WX * 2) - WX;
  const wz = my / MM_H * (WZ * 2) - WZ;
  const dx = camera.position.x - controls.target.x;
  const dy = camera.position.y - controls.target.y;
  const dz = camera.position.z - controls.target.z;
  controls.target.set(wx, 0, wz);
  camera.position.set(wx + dx, dy + 0, wz + dz);
  controls.update();
});

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  Animation loop
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
let lastT = performance.now();
function animate() {
  requestAnimationFrame(animate);
  const now = performance.now();
  const dt = Math.min((now - lastT) / 1000, 0.05);
  lastT = now;
  controls.update();
  components.forEach(c => c.tick(dt));
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
  drawMinimap();
}
animate();

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  Init
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
applyTheme(localStorage.getItem('elab3d_theme') || 'dark');
initCodeEditor();
setLang(lang);
renderDocs();
clog('3D Electronics Lab ready. Place an Arduino from the palette!', 'lo');
clog('Click a pin to start a wire. Right-click a wire to delete it.', 'li');

  </script>
