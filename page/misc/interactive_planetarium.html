<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const DATA=[
 {id:'mercury',names:['Mercury','Mercúrio','水星'],desc:['A cratered world racing close to the Sun.','Um mundo de crateras que corre perto do Sol.','太陽のすぐ近くを高速で回る、クレーターに覆われた世界。'],color:'#a99b8e',size:1,dist:16,year:88,day:58.6,diameter:'4,879 km',moons:0,type:'rock'},
 {id:'venus',names:['Venus','Vênus','金星'],desc:['Cloud-wrapped, intensely hot, and slowly rotating.','Coberto por nuvens, extremamente quente e de rotação lenta.','厚い雲に覆われた高温の惑星。ゆっくり逆向きに自転します。'],color:'#d9a85d',size:1.7,dist:22,year:224.7,day:-243,diameter:'12,104 km',moons:0,type:'cloud'},
 {id:'earth',names:['Earth','Terra','地球'],desc:['A living ocean world with a dynamic atmosphere.','Um mundo oceânico vivo com atmosfera dinâmica.','海と生命、変化し続ける大気を持つ私たちの惑星。'],color:'#3f86c7',size:1.8,dist:29,year:365.25,day:1,diameter:'12,742 km',moons:1,type:'earth'},
 {id:'mars',names:['Mars','Marte','火星'],desc:['A cold desert shaped by volcanoes, canyons, and ancient water.','Um deserto frio moldado por vulcões, cânions e água antiga.','火山や峡谷、かつての水に形作られた冷たい砂漠。'],color:'#bd5938',size:1.25,dist:37,year:687,day:1.03,diameter:'6,779 km',moons:2,type:'rock'},
 {id:'jupiter',names:['Jupiter','Júpiter','木星'],desc:['The giant world of powerful storms and striped clouds.','O gigante de tempestades poderosas e nuvens listradas.','強大な嵐と縞模様の雲を持つ巨大惑星。'],color:'#d3a77d',size:4.8,dist:50,year:4333,day:.41,diameter:'139,820 km',moons:95,type:'gas'},
 {id:'saturn',names:['Saturn','Saturno','土星'],desc:['An airy giant encircled by countless particles of ice and rock.','Um gigante leve cercado por incontáveis partículas de gelo e rocha.','無数の氷と岩の粒子からなる環を持つ巨大惑星。'],color:'#e1c58a',size:4.1,dist:64,year:10759,day:.45,diameter:'116,460 km',moons:146,type:'gas',ring:true},
 {id:'uranus',names:['Uranus','Urano','天王星'],desc:['An ice giant rotating on its side beneath a blue-green haze.','Um gigante de gelo que gira de lado sob uma névoa azul-esverdeada.','青緑の霞に包まれ、横倒しで自転する氷の巨大惑星。'],color:'#8ed5d8',size:2.8,dist:77,year:30687,day:.72,diameter:'50,724 km',moons:28,type:'ice'},
 {id:'neptune',names:['Neptune','Netuno','海王星'],desc:['A distant blue world swept by the fastest winds in the Solar System.','Um mundo azul distante varrido pelos ventos mais rápidos do Sistema Solar.','太陽系で最も速い風が吹く、遠く青い世界。'],color:'#476fdd',size:2.7,dist:90,year:60190,day:.67,diameter:'49,244 km',moons:16,type:'ice'}];
const I={en:{subtitle:'Interactive solar system',overview:'Overview',worlds:'Worlds',diameter:'Diameter',day:'Day',year:'Year',moons:'Moons',focusNote:'Drag to orbit · scroll to zoom · click a world',timeSpeed:'Time speed',hint:'Drag space to look around. Select Earth for a detailed globe.',loading:'Building the solar system…',daysSecond:'{n} days/s',paused:'Paused',earthTexture:'Loading detailed Earth surface…'},pt:{subtitle:'Sistema solar interativo',overview:'Visão geral',worlds:'Mundos',diameter:'Diâmetro',day:'Dia',year:'Ano',moons:'Luas',focusNote:'Arraste para orbitar · role para aproximar · clique em um mundo',timeSpeed:'Velocidade do tempo',hint:'Arraste o espaço para olhar ao redor. Selecione a Terra para um globo detalhado.',loading:'Construindo o sistema solar…',daysSecond:'{n} dias/s',paused:'Pausado',earthTexture:'Carregando superfície detalhada da Terra…'},ja:{subtitle:'インタラクティブ太陽系',overview:'全体表示',worlds:'惑星',diameter:'直径',day:'自転周期',year:'公転周期',moons:'衛星',focusNote:'ドラッグ：回転 · ホイール：ズーム · 惑星をクリック',timeSpeed:'時間の速さ',hint:'ドラッグで視点を回転。地球を選ぶと詳細な地球儀になります。',loading:'太陽系を構築中…',daysSecond:'毎秒 {n} 日',paused:'停止中',earthTexture:'高精細な地球表面を読み込み中…'}};let lang=localStorage.getItem('planetarium-lang')||localStorage.getItem('app_lang')||'en';if(!I[lang])lang='en';const t=(k,v={})=>{let s=I[lang][k]||I.en[k]||k;for(const[a,b]of Object.entries(v))s=s.replaceAll('{'+a+'}',b);return s};
let scene,camera,renderer,planets=[],selected=null,simDays=0,last=performance.now(),paused=false,speed=30,yaw=.65,pitch=.48,distance=125,target=new THREE.Vector3,desiredTarget=new THREE.Vector3,drag=null,moved=false,ray=new THREE.Raycaster,mouse=new THREE.Vector2;
function proceduralTexture(d){const c=document.createElement('canvas');c.width=1024;c.height=512;const x=c.getContext('2d'),base=d.color;x.fillStyle=base;x.fillRect(0,0,c.width,c.height);const seed=DATA.indexOf(d)+7,rand=mulberry(seed*999);if(d.type==='gas'||d.type==='ice'||d.type==='cloud'){for(let y=0;y<c.height;y+=8){const light=Math.sin(y*.075+seed)*13+(rand()-.5)*9;x.fillStyle=shade(base,light);x.fillRect(0,y,c.width,9)}for(let i=0;i<90;i++){x.globalAlpha=.05+rand()*.12;x.fillStyle=rand()>.5?'#fff':'#442b24';x.beginPath();x.ellipse(rand()*1024,rand()*512,30+rand()*150,3+rand()*17,0,0,7);x.fill()}}else{for(let i=0;i<1700;i++){x.globalAlpha=.04+rand()*.15;x.fillStyle=rand()>.5?'#fff':'#170d09';const r=1+rand()*12;x.beginPath();x.arc(rand()*1024,rand()*512,r,0,7);x.fill()}for(let i=0;i<35;i++){x.globalAlpha=.1;x.strokeStyle='#2a1710';x.lineWidth=2+rand()*4;x.beginPath();x.arc(rand()*1024,rand()*512,7+rand()*25,0,7);x.stroke()}}x.globalAlpha=1;const tex=new THREE.CanvasTexture(c);tex.colorSpace=THREE.SRGBColorSpace;tex.anisotropy=4;return tex}
function shade(hex,p){const n=parseInt(hex.slice(1),16),r=Math.max(0,Math.min(255,(n>>16)+p)),g=Math.max(0,Math.min(255,((n>>8)&255)+p)),b=Math.max(0,Math.min(255,(n&255)+p));return`rgb(${r},${g},${b})`}function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function init(){if(!window.THREE)return;scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x060910,.0017);camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,700);renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;$('#viewport').append(renderer.domElement);makeStars();const sun=new THREE.Mesh(new THREE.SphereGeometry(7,48,32),new THREE.MeshBasicMaterial({color:0xffb84a}));scene.add(sun);const glow=new THREE.Mesh(new THREE.SphereGeometry(8.4,32,24),new THREE.MeshBasicMaterial({color:0xff9a35,transparent:true,opacity:.18,side:THREE.BackSide,blending:THREE.AdditiveBlending}));scene.add(glow);scene.add(new THREE.PointLight(0xfff0ce,900,300,1.45));scene.add(new THREE.AmbientLight(0x526a9c,1.1));DATA.forEach((d,i)=>addPlanet(d,i));loadEarth();selectPlanet('earth');bind();setTimeout(()=>$('#loader').classList.add('hidden'),650);requestAnimationFrame(loop)}
function makeStars(){const n=3800,a=new Float32Array(n*3),rand=mulberry(7362);for(let i=0;i<n;i++){const r=130+rand()*320,th=rand()*Math.PI*2,ph=Math.acos(2*rand()-1);a[i*3]=r*Math.sin(ph)*Math.cos(th);a[i*3+1]=r*Math.cos(ph);a[i*3+2]=r*Math.sin(ph)*Math.sin(th)}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(a,3));scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0xdde8ff,size:.75,sizeAttenuation:true,transparent:true,opacity:.85})))}
function addPlanet(d,i){const geo=new THREE.SphereGeometry(d.size,48,32),mat=new THREE.MeshStandardMaterial({map:proceduralTexture(d),roughness:d.type==='earth'?.75:.9,metalness:0}),mesh=new THREE.Mesh(geo,mat);mesh.userData={planet:d};const group=new THREE.Group;group.add(mesh);scene.add(group);if(d.ring){const ring=new THREE.Mesh(new THREE.RingGeometry(d.size*1.35,d.size*2.15,96),new THREE.MeshStandardMaterial({color:0xdac594,side:THREE.DoubleSide,transparent:true,opacity:.72,roughness:1}));ring.rotation.x=Math.PI/2.25;mesh.add(ring)}if(d.id==='earth'){const atm=new THREE.Mesh(new THREE.SphereGeometry(d.size*1.055,40,28),new THREE.MeshBasicMaterial({color:0x6ab7ff,transparent:true,opacity:.13,side:THREE.BackSide,blending:THREE.AdditiveBlending}));mesh.add(atm);const clouds=new THREE.Mesh(new THREE.SphereGeometry(d.size*1.018,48,32),new THREE.MeshPhongMaterial({transparent:true,opacity:.36,depthWrite:false}));clouds.userData.clouds=true;mesh.add(clouds)}const pts=[];for(let j=0;j<=128;j++){const a=j/128*Math.PI*2;pts.push(new THREE.Vector3(Math.cos(a)*d.dist,0,Math.sin(a)*d.dist))}const orbit=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:0x33455f,transparent:true,opacity:.5}));scene.add(orbit);planets.push({d,group,mesh,angle:i*.73+.4})}
function loadEarth(){const p=planets.find(x=>x.d.id==='earth'),loader=new THREE.TextureLoader;loader.setCrossOrigin('anonymous');loader.load('https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg',tex=>{tex.colorSpace=THREE.SRGBColorSpace;tex.anisotropy=renderer.capabilities.getMaxAnisotropy();p.mesh.material.map=tex;p.mesh.material.needsUpdate=true},undefined,()=>{});loader.load('https://threejs.org/examples/textures/planets/earth_clouds_1024.png',tex=>{tex.colorSpace=THREE.SRGBColorSpace;const cloud=p.mesh.children.find(x=>x.userData.clouds);if(cloud){cloud.material.map=tex;cloud.material.needsUpdate=true}},undefined,()=>{})}
function updatePlanets(dt){for(const p of planets){p.angle+=dt*speed/Math.max(88,p.d.year)*.55;const x=Math.cos(p.angle)*p.d.dist,z=Math.sin(p.angle)*p.d.dist;p.group.position.set(x,0,z);p.mesh.rotation.y+=dt*speed/Math.max(.4,Math.abs(p.d.day))*0.018;const cloud=p.mesh.children.find(x=>x.userData.clouds);if(cloud)cloud.rotation.y+=dt*.035}simDays+=dt*speed;const date=new Date(Date.UTC(2026,0,1)+simDays*86400000);$('#date').textContent=new Intl.DateTimeFormat(lang,{year:'numeric',month:'short',day:'numeric',timeZone:'UTC'}).format(date)}
function updateCamera(){if(selected){const p=planets.find(x=>x.d.id===selected);desiredTarget.copy(p.group.position)}else desiredTarget.set(0,0,0);target.lerp(desiredTarget,.055);pitch=Math.max(-1.35,Math.min(1.35,pitch));distance=Math.max(selected?planets.find(x=>x.d.id===selected).d.size*2.8+3:32,Math.min(220,distance));const cp=Math.cos(pitch);camera.position.set(target.x+distance*cp*Math.cos(yaw),target.y+distance*Math.sin(pitch),target.z+distance*cp*Math.sin(yaw));camera.lookAt(target)}
function selectPlanet(id){selected=id;const p=planets.find(x=>x.d.id===id),d=p.d;distance=Math.max(8,d.size*5.2);desiredTarget.copy(p.group.position);$('#planet-name').textContent=d.names[lang==='pt'?1:lang==='ja'?2:0];$('#planet-desc').textContent=d.desc[lang==='pt'?1:lang==='ja'?2:0];$('#diameter').textContent=d.diameter;$('#day').textContent=(Math.abs(d.day)<2?Math.abs(d.day).toFixed(2):Math.abs(d.day).toFixed(1))+' d';$('#year').textContent=d.year.toLocaleString(lang)+' d';$('#moons').textContent=d.moons;$('#info').style.setProperty('--planet-color',d.color);$$('.planet-btn').forEach(b=>b.classList.toggle('active',b.dataset.planet===id))}
function overview(){selected=null;desiredTarget.set(0,0,0);distance=125;yaw=.65;pitch=.48;$$('.planet-btn').forEach(b=>b.classList.remove('active'))}
function renderList(){$('#planet-list').innerHTML=DATA.map(d=>`<button class="planet-btn ${d.id===selected?'active':''}" data-planet="${d.id}"><i class="planet-dot" style="--p:${d.color}"></i><span><strong>${d.names[lang==='pt'?1:lang==='ja'?2:0]}</strong><small>${d.year.toLocaleString(lang)} d</small></span></button>`).join('')}
function speedFrom(v){if(v==0)return 0;return Math.round(Math.pow(+v/20,2)*6)}function updateSpeed(){speed=speedFrom($('#speed').value);paused=speed===0;$('#speed-label').textContent=speed?t('daysSecond',{n:speed}):t('paused');$('#pause').textContent=speed?'Ⅱ':'▶';localStorage.setItem('planetarium-speed',$('#speed').value)}
function bind(){const c=renderer.domElement;c.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,yaw,pitch};moved=false;c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>4)moved=true;yaw=drag.yaw-dx*.006;pitch=drag.pitch+dy*.005};c.onpointerup=e=>{if(!moved){const r=c.getBoundingClientRect();mouse.x=(e.clientX-r.left)/r.width*2-1;mouse.y=-(e.clientY-r.top)/r.height*2+1;ray.setFromCamera(mouse,camera);const hit=ray.intersectObjects(planets.map(x=>x.mesh),false)[0];if(hit)selectPlanet(hit.object.userData.planet.id)}drag=null};c.addEventListener('wheel',e=>{e.preventDefault();distance*=Math.exp(e.deltaY*.001)},{passive:false});$('#planet-list').onclick=e=>{const b=e.target.closest('[data-planet]');if(b)selectPlanet(b.dataset.planet)};$('#overview').onclick=overview;$('#speed').value=localStorage.getItem('planetarium-speed')||45;$('#speed').oninput=updateSpeed;updateSpeed();$('#pause').onclick=()=>{if(speed){$('#speed').dataset.last=$('#speed').value;$('#speed').value=0}else $('#speed').value=$('#speed').dataset.last||45;updateSpeed()};addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})}
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(!paused)updatePlanets(dt);updateCamera();renderer.render(scene,camera);requestAnimationFrame(loop)}function translate(){$$('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));$('#lang').value=lang;document.documentElement.lang=lang;renderList();if(selected)selectPlanet(selected);updateSpeed()}function toast(s){const e=$('#toast');e.textContent=s;e.classList.remove('hidden');clearTimeout(toast.x);toast.x=setTimeout(()=>e.classList.add('hidden'),1900)}
$('#lang').onchange=e=>{lang=e.target.value;localStorage.setItem('planetarium-lang',lang);translate()};$('#theme').onclick=()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('planetarium-theme',n)};document.documentElement.dataset.theme=localStorage.getItem('planetarium-theme')||localStorage.getItem('app_theme')||'dark';translate();init();
</script></body></html>
