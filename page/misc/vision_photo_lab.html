<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vision Photo Lab</title>
    <link
      rel="icon"
      href="../assets/icons/ico/misc-vision_photo_lab.ico"
      type="image/x-icon"
    />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f171a;
        --panel: #172226;
        --soft: #203035;
        --border: #32454a;
        --text: #e8f2f1;
        --muted: #9eb3b5;
        --accent: #008f7d;
      }
      :root[data-theme="light"] {
        color-scheme: light;
        --bg: #edf3f2;
        --panel: #fff;
        --soft: #f1f6f5;
        --border: #cedcda;
        --text: #1c3030;
        --muted: #526d6a;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font:
          13px/1.45 system-ui,
          -apple-system,
          "Segoe UI",
          "Noto Sans JP",
          sans-serif;
      }
      button,
      select,
      input {
        font: inherit;
        color: inherit;
      }
      button,
      select {
        height: 30px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--soft);
        padding: 0 9px;
      }
      button {
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        border-color: var(--accent);
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      button[aria-pressed="true"],
      .primary {
        background: var(--accent);
        border-color: var(--accent);
        color: white;
      }
      :focus-visible {
        outline: 2px solid #40cdb5;
        outline-offset: 2px;
      }
      [hidden] {
        display: none !important;
      }
      .app {
        height: 100%;
        display: grid;
        grid-template-rows: 44px minmax(0, 1fr);
      }
      .topbar {
        height: 44px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 10px;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
        min-width: 0;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 15px;
        font-weight: 650;
        white-space: nowrap;
      }
      .brand img {
        width: 18px;
        height: 18px;
      }
      .tools {
        display: flex;
        gap: 6px;
        margin-left: auto;
      }
      .icon-btn {
        width: 30px;
        padding: 0;
      }
      .main {
        min-height: 0;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 244px;
        padding: 10px;
        gap: 10px;
      }
      .workspace {
        min-width: 0;
        min-height: 0;
        display: grid;
        grid-template-rows: 34px minmax(0, 1fr) auto;
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
      }
      .toolbar {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 2px 6px;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
      }
      .toolbar button {
        height: 27px;
        font-size: 12px;
      }
      .toolbar .zoom {
        display: flex;
        align-items: center;
        gap: 4px;
        margin-left: auto;
      }
      .zoom input {
        width: 75px;
        accent-color: var(--accent);
      }
      #viewport {
        position: relative;
        overflow: auto;
        min-height: 0;
        background: #090f13;
        overscroll-behavior: contain;
      }
      #viewport.drag-over {
        outline: 3px solid #40cdb5;
        outline-offset: -3px;
      }
      #mat {
        display: grid;
        place-items: center;
        min-width: 100%;
        min-height: 100%;
        width: max-content;
        height: max-content;
        padding: 12px;
      }
      #canvas {
        display: block;
        touch-action: none;
        box-shadow: 0 3px 24px #0006;
        max-width: none;
      }
      #canvas.draggable {
        cursor: grab;
      }
      #canvas.draggable.panning {
        cursor: grabbing;
      }
      #canvas.selecting {
        cursor: crosshair;
      }
      .empty {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 24px;
        text-align: center;
        color: #a4b8bb;
      }
      .empty svg {
        width: 60px;
        height: 60px;
        color: #3ab6a5;
      }
      .empty p {
        margin: 0;
      }
      .statusbar {
        padding: 7px 10px;
        background: var(--panel);
        border-top: 1px solid var(--border);
        font-size: 12px;
        color: var(--muted);
        overflow-wrap: anywhere;
      }
      #status.error {
        color: #ed886f;
      }
      #status[data-busy="true"]::before {
        content: "◌ ";
        color: #40cdb5;
      }
      .sidebar {
        overflow: auto;
        min-height: 0;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        gap: 10px;
      }
      .panel {
        padding: 10px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      .panel h2 {
        font-size: 13px;
        margin: 0 0 8px;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin: 6px 0;
      }
      .row:last-child {
        margin-bottom: 0;
      }
      .row input[type="checkbox"] {
        accent-color: var(--accent);
        width: 15px;
        height: 15px;
        margin: 0;
      }
      .layer {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .swatch {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--color);
      }
      .muted {
        color: var(--muted);
        font-size: 12px;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
        text-align: center;
      }
      .stat {
        background: var(--soft);
        border-radius: 6px;
        padding: 7px 2px;
      }
      .stat b {
        display: block;
        font-size: 20px;
      }
      .stat span {
        font-size: 11px;
        color: var(--muted);
      }
      .exports {
        display: flex;
        gap: 8px;
      }
      .exports button {
        flex: 1;
      }
      .exports + p {
        margin: 8px 0 0;
      }
      #file-info {
        margin-top: 8px;
        overflow-wrap: anywhere;
      }
      #results-info {
        margin: 9px 0 0;
      }
      #point-info {
        font-variant-numeric: tabular-nums;
        min-height: 28px;
        margin: 6px 0 0;
      }
      .sidebar > .panel:nth-child(2) {
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      .sidebar.expressions-active > .panel:first-child h2,
      .sidebar.expressions-active #file-info,
      .sidebar.expressions-active #results-info {
        display: none;
      }
      .sidebar.expressions-active > .panel:first-child .row {
        margin: 0;
      }
      .sidebar.expressions-active .stats {
        display: flex;
        justify-content: space-between;
        margin-top: 6px;
      }
      .sidebar.expressions-active .stat {
        display: flex;
        align-items: baseline;
        gap: 4px;
        padding: 0;
        background: none;
      }
      .sidebar.expressions-active .stat b {
        font-size: 14px;
      }
      #layers-view {
        min-height: 0;
        overflow: auto;
      }
      #expressions-view {
        flex: 1;
        min-height: 0;
        overflow: hidden;
      }
      #face-details {
        height: 100%;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      #face-details > :not(#expression-list) {
        flex-shrink: 0;
      }
      .inspector-tabs {
        display: flex;
        gap: 4px;
        margin-bottom: 8px;
      }
      .inspector-tabs button {
        flex: 1;
        min-width: 0;
        padding: 0 6px;
        font-size: 12px;
      }
      .inspector-tabs button[aria-selected="true"] {
        background: var(--accent);
        color: white;
      }
      #detection-mode {
        max-width: 160px;
        min-width: 0;
      }
      #face-index {
        min-width: 0;
        flex: 1;
      }
      #face-preview {
        display: block;
        width: 100%;
        height: 128px;
        background: #090f13;
        border-radius: 6px;
        cursor: zoom-in;
      }
      #face-quality {
        margin: 6px 0;
      }
      #expression-list {
        min-height: 0;
        flex: 1;
        overflow: auto;
        scrollbar-gutter: stable;
      }
      .expression {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 34px;
        column-gap: 6px;
        margin: 6px 0;
        font-size: 12px;
      }
      .expression span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .expression output {
        text-align: right;
        font-variant-numeric: tabular-nums;
        color: var(--muted);
      }
      .expression progress {
        grid-column: 1 / -1;
        width: 100%;
        height: 4px;
        border: 0;
        border-radius: 2px;
        accent-color: var(--accent);
      }
      .expression progress::-webkit-progress-bar {
        background: var(--soft);
        border-radius: 2px;
      }
      .expression progress::-webkit-progress-value {
        background: var(--accent);
        border-radius: 2px;
      }
      .expression progress::-moz-progress-bar {
        background: var(--accent);
        border-radius: 2px;
      }
      .range {
        width: 90px;
        accent-color: var(--accent);
      }
      dialog {
        background: var(--panel);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 10px;
        width: min(560px, calc(100vw - 28px));
        max-height: calc(100vh - 28px);
        padding: 0;
      }
      dialog::backdrop {
        background: #0009;
      }
      .dialog-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 14px;
        border-bottom: 1px solid var(--border);
        font-size: 15px;
        font-weight: 600;
      }
      .dialog-body {
        padding: 12px 14px;
        overflow: auto;
      }
      .dialog-body p {
        margin: 0 0 12px;
      }
      .dialog-body a {
        color: #37bca6;
      }
      @media (max-width: 720px) {
        .main {
          grid-template-columns: minmax(0, 1fr);
          grid-template-rows: minmax(170px, 1fr) minmax(0, 180px);
          padding: 8px;
          gap: 8px;
        }
        .sidebar {
          display: grid;
          grid-template-columns: repeat(3, minmax(185px, 1fr));
          grid-template-rows: minmax(0, 1fr);
          overflow: auto;
        }
        .panel {
          padding: 10px;
        }
        #expressions-view {
          overflow: auto;
        }
        #face-details {
          height: auto;
        }
        #expression-list {
          max-height: 174px;
          flex: none;
        }

        .brand span {
          display: none;
        }
        .topbar {
          gap: 6px;
          padding: 0 8px;
        }
        .toolbar button {
          padding: 0 6px;
        }
        .zoom input {
          width: 48px;
        }
      }
      @media (max-width: 390px) {
        #zoom-label {
          display: none;
        }
        .topbar button {
          padding: 0 7px;
        }
        .tools {
          gap: 4px;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <img
            src="../assets/icons/svg/misc-vision_photo_lab.svg"
            alt=""
          /><span data-i18n="title">Vision Photo Lab</span>
        </div>
        <button id="upload" data-i18n="upload">Open photo</button
        ><button id="analyze" class="primary" data-i18n="analyze" disabled>
          Analyze all
        </button>
        <div class="tools">
          <button id="help-btn" class="icon-btn" data-title="help">?</button
          ><select id="lang-switcher" aria-label="Language">
            <option value="en">EN</option>
            <option value="pt">PT</option>
            <option value="ja">JA</option></select
          ><button id="theme-switcher" class="icon-btn" data-title="theme">
            ◐
          </button>
        </div>
      </header>
      <main class="main">
        <section class="workspace">
          <div class="toolbar">
            <button
              id="select-area"
              aria-pressed="false"
              data-i18n="select"
              disabled
            >
              Select area</button
            ><button id="full-image" data-i18n="whole" disabled>
              Whole photo</button
            ><label class="zoom"
              ><span id="zoom-label" data-i18n="zoom">Zoom</span
              ><input
                id="zoom"
                type="range"
                min="100"
                max="400"
                step="25"
                value="100"
              /><output id="zoom-value">100%</output></label
            >
          </div>
          <div id="viewport">
            <div id="mat" hidden>
              <canvas
                id="canvas"
                role="img"
                aria-label="Photo and detected landmarks"
              ></canvas>
            </div>
            <div class="empty" id="empty">
              <svg
                viewBox="0 0 64 64"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                aria-hidden="true"
              >
                <rect x="6" y="9" width="52" height="46" rx="6" />
                <circle cx="32" cy="23" r="5" />
                <path d="M32 28v13m-12-9 12 4 12-4M32 41l-9 10m9-10 9 10" />
                <circle cx="20" cy="32" r="2" />
                <circle cx="44" cy="32" r="2" />
              </svg>
              <p data-i18n="drop">
                Drop or paste a photo here, or open a file.
              </p>
              <button id="empty-upload" class="primary" data-i18n="upload">
                Open photo
              </button>
            </div>
          </div>
          <div class="statusbar">
            <span id="status" role="status" aria-live="polite"></span>
          </div>
        </section>
        <aside class="sidebar">
          <section class="panel">
            <h2 data-i18n="detection">Detection</h2>
            <label class="row"
              ><span data-i18n="mode">Mode</span
              ><select id="detection-mode">
                <option value="all" data-i18n="modeAll">
                  Body, face & hands
                </option>
                <option value="faces" data-i18n="modeFaces">Faces only</option>
              </select></label
            >
            <label class="row"
              ><span id="limit-label" data-i18n="limit">Maximum people</span
              ><select id="limit">
                <option>1</option>
                <option>2</option>
                <option selected>4</option>
                <option>6</option>
                <option>10</option>
              </select></label
            >
            <div class="stats">
              <div class="stat">
                <b id="body-count">—</b><span data-i18n="bodies">Bodies</span>
              </div>
              <div class="stat">
                <b id="face-count">—</b><span data-i18n="faces">Faces</span>
              </div>
              <div class="stat">
                <b id="hand-count">—</b><span data-i18n="hands">Hands</span>
              </div>
            </div>
            <p id="results-info" class="muted"></p>
            <div id="file-info" class="muted"></div>
          </section>
          <section class="panel">
            <div class="inspector-tabs" role="tablist" data-label="detection">
              <button
                id="layers-tab"
                role="tab"
                aria-controls="layers-view"
                aria-selected="true"
                data-i18n="layers"
              >
                Visible layers
              </button>
              <button
                id="expressions-tab"
                role="tab"
                aria-controls="expressions-view"
                aria-selected="false"
                data-i18n="expressions"
              >
                Expressions
              </button>
            </div>
            <div id="layers-view" role="tabpanel" aria-labelledby="layers-tab">
              <label class="row"
                ><span data-i18n="photo">Photo</span
                ><input id="layer-photo" type="checkbox" checked /></label
              ><label class="row"
                ><span class="layer"
                  ><i class="swatch" style="--color: #55efc4"></i
                  ><span data-i18n="body">Body skeleton</span></span
                ><input id="layer-body" type="checkbox" checked /></label
              ><label class="row"
                ><span class="layer"
                  ><i class="swatch" style="--color: #75caff"></i
                  ><span data-i18n="face">Face & irises</span></span
                ><input id="layer-face" type="checkbox" checked /></label
              ><label class="row"
                ><span class="layer"
                  ><i class="swatch" style="--color: #ffcd70"></i
                  ><span data-i18n="fingers">Hands & fingers</span></span
                ><input id="layer-hands" type="checkbox" checked /></label
              ><label class="row"
                ><span data-i18n="mesh">Dense face mesh</span
                ><input id="layer-mesh" type="checkbox" checked /></label
              ><label class="row"
                ><span data-i18n="points">Landmark dots</span
                ><input id="layer-points" type="checkbox" checked /></label
              ><label class="row"
                ><span data-i18n="visibility">Body visibility</span
                ><input
                  id="visibility"
                  class="range"
                  type="range"
                  min="0"
                  max="100"
                  step="5"
                  value="35"
              /></label>
              <p id="point-info" class="muted" aria-live="off"></p>
            </div>
            <div
              id="expressions-view"
              role="tabpanel"
              aria-labelledby="expressions-tab"
              hidden
            >
              <p id="face-empty" class="muted" data-i18n="faceEmpty">
                Analyze a photo to inspect facial movements.
              </p>
              <div id="face-details" hidden>
                <div class="row">
                  <select id="face-index" data-label="chooseFace"></select
                  ><button id="focus-face" data-i18n="focusFace">Focus</button>
                </div>
                <canvas
                  id="face-preview"
                  width="440"
                  height="300"
                  data-label="facePreview"
                ></canvas>
                <div id="face-quality" class="muted"></div>
                <div class="row">
                  <span class="muted" data-i18n="movements"
                    >Estimated movements</span
                  ><label class="layer muted"
                    ><input id="all-expressions" type="checkbox" /><span
                      data-i18n="allSignals"
                      >All 52</span
                    ></label
                  >
                </div>
                <div id="expression-list"></div>
              </div>
            </div>
          </section>
          <section class="panel">
            <div class="exports">
              <button id="export-png" disabled>PNG</button
              ><button id="export-json" disabled>JSON</button>
            </div>
          </section>
        </aside>
      </main>
    </div>
    <input
      id="file"
      type="file"
      accept="image/jpeg,image/png,image/webp,image/avif,image/bmp"
      hidden
    />
    <dialog id="help">
      <div class="dialog-top">
        <span data-i18n="help">Help</span
        ><button id="help-close" class="icon-btn" data-title="close">×</button>
      </div>
      <div class="dialog-body">
        <p data-i18n="helpStart"></p>
        <p data-i18n="helpArea"></p>
        <p data-i18n="helpDetails"></p>
        <p data-i18n="helpExpressions"></p>
        <p data-i18n="helpLimits"></p>
        <p data-i18n="helpExport"></p>
        <p data-i18n="helpPrivacy"></p>
        <a
          href="https://ai.google.dev/edge/mediapipe/solutions/vision/pose_landmarker"
          target="_blank"
          rel="noopener"
          >MediaPipe — Google AI Edge</a
        >
      </div>
    </dialog>
    <script src="../os/js/embed.js"></script>

          }
          const b = best;
          $("point-info").textContent = b
            ? t(b.kind) +
              " " +
              (b.i + 1) +
              (b.hand ? " · " + t(b.hand === "Left" ? "left" : "right") : "") +
              " · " +
              t("point") +
              " " +
              b.j +
              " · x " +
              Math.round(b.q.x * image.naturalWidth) +
              ", y " +
              Math.round(b.q.y * image.naturalHeight) +
              " px"
            : t("hover");
        });
        canvas.addEventListener("pointerup", (e) => {
          if (pan) {
            pan = null;
            canvas.classList.remove("panning");
            if (canvas.hasPointerCapture(e.pointerId))
              canvas.releasePointerCapture(e.pointerId);
            return;
          }
          if (!drag) return;
          drag.end = pointAt(e);
          const r = currentRegion();
          drag = null;
          if (
            r.width * image.naturalWidth >= 32 &&
            r.height * image.naturalHeight >= 32
          ) {
            region = r;
            status("areaReady");
            setSelecting(false);
          } else {
            status("smallArea", true);
            draw();
          }
          if (canvas.hasPointerCapture(e.pointerId))
            canvas.releasePointerCapture(e.pointerId);
        });
        canvas.addEventListener("pointercancel", () => {
          drag = null;
          pan = null;
          canvas.classList.remove("panning");
          draw();
        });
        $("select-area").onclick = () => {
          setSelecting(!selecting);
          status(selecting ? "areaHint" : "loaded");
        };
        $("full-image").onclick = () => {
          region = null;
          setSelecting(false);
          status(results ? "pending" : "loaded");
        };
        for (const id of ["upload", "empty-upload"])
          $(id).onclick = () => $("file").click();
        $("file").onchange = (e) => openFile(e.target.files[0]);
        $("analyze").onclick = analyze;
        const viewport = $("viewport");
        const transferFile = (transfer) => {
          const files = Array.from(transfer?.files || []);
          return (
            files.find((file) => file.type.startsWith("image/")) || files[0]
          );
        };
        document.addEventListener("dragover", (e) => {
          if (!Array.from(e.dataTransfer?.types || []).includes("Files"))
            return;
          e.preventDefault();
          e.dataTransfer.dropEffect = busy ? "none" : "copy";
          if (!busy) viewport.classList.add("drag-over");
        });
        document.addEventListener("dragleave", (e) => {
          if (!e.relatedTarget) viewport.classList.remove("drag-over");
        });
        document.addEventListener("dragend", () =>
          viewport.classList.remove("drag-over"),
        );
        document.addEventListener("drop", (e) => {
          viewport.classList.remove("drag-over");
          const file = transferFile(e.dataTransfer);
          if (!file) return;
          e.preventDefault();
          openFile(file);
        });
        document.addEventListener("paste", (e) => {
          if (
            busy ||
            e.target.isContentEditable ||
            e.target.matches(
              'textarea, input[type="text"], input[type="search"], input[type="url"], input[type="email"], input[type="password"], input[type="number"], input[type="tel"]',
            )
          )
            return;
          const item = Array.from(e.clipboardData?.items || []).find(
            (item) => item.kind === "file" && item.type.startsWith("image/"),
          );
          const file = item?.getAsFile() || transferFile(e.clipboardData);
          if (!file || !file.type.startsWith("image/")) return;
          e.preventDefault();
          openFile(file);
        });
        for (const n of layerNames)
          $("layer-" + n).onchange = () => {
            save();
            draw();
          };
        $("visibility").oninput = () => {
          save();
          draw();
        };
        $("detection-mode").onchange = () => {
          save();
          modeLabels();
          if ($("detection-mode").value === "faces")
            setInspector("expressions");
          if (image) status(results ? "pending" : "loaded");
        };
        $("limit").onchange = () => {
          save();
          if (image) status(results ? "pending" : "loaded");
        };
        $("zoom").oninput = fit;
        new ResizeObserver(fit).observe(viewport);
        $("lang-switcher").onchange = (e) => {
          lang = e.target.value;
          try {
            localStorage.setItem("app_lang", lang);
          } catch {}
          translate();
        };
        $("theme-switcher").onclick = () => {
          const theme =
            document.documentElement.dataset.theme === "dark"
              ? "light"
              : "dark";
          document.documentElement.dataset.theme = theme;
          try {
            localStorage.setItem("app_theme", theme);
          } catch {}
        };
        $("help-btn").onclick = () => {
          if (!$("help").open) $("help").showModal();
        };
        $("help-close").onclick = () => $("help").close();
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape" && selecting) {
            setSelecting(false);
            status(image ? "loaded" : "ready");
          }
          if (
            e.key === "?" &&
            !/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)
          ) {
            e.preventDefault();
            $("help-btn").click();
          }
        });
        function download(blob, ext) {
          const url = URL.createObjectURL(blob),
            link = document.createElement("a");
          link.href = url;
          link.download =
            (fileName.replace(/\.[^.]+$/, "") || "photo") + "-landmarks." + ext;
          link.click();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
        }
        $("export-png").onclick = async () => {
          if (!image || busy) return;
          busy = true;
          controls();
          const old = statusKey;
          status("saving");
          await paint();
          try {
            const output = document.createElement("canvas");
            output.width = image.naturalWidth;
            output.height = image.naturalHeight;
            render(output.getContext("2d"), output.width, output.height);
            const blob = await new Promise((resolve) =>
              output.toBlob(resolve, "image/png"),
            );
            if (!blob) throw Error("PNG");
            download(blob, "png");
            status(old);
          } catch (error) {
            console.error(error);
            status("exportError", true);
          } finally {
            busy = false;
            controls();
          }
        };
        $("export-json").onclick = () => {
          if (!results || busy) return;
          try {
            const data = {
              schema: "vision-photo-lab/v1",
              source: {
                name: fileName,
                width: image.naturalWidth,
                height: image.naturalHeight,
              },
              coordinates: {
                x: "normalized by original image width",
                y: "normalized by original image height",
                z: "model-relative depth scaled by analyzed region width; origins differ across detectors, not metric",
                pixelX: "original image pixels",
                pixelY: "original image pixels",
                association:
                  "Body, face and hand detections are independent; indices do not identify the same person.",
              },
              region: results.region,
              modelInput: results.input,
              maximumPeople: results.limit,
              analysisMode: results.mode,
              facialExpressions: {
                type: "52 MediaPipe facial movement blendshapes",
                scores: "activation from 0 to 1, not emotion probabilities",
                laterality: "the subject's left and right",
              },
              models: {
                package: "@mediapipe/tasks-vision@0.10.14",
                face: "face_landmarker/float16/1",
                ...(results.mode === "all"
                  ? {
                      pose: "pose_landmarker_full/float16/1",
                      hand: "hand_landmarker/float16/1",
                    }
                  : {}),
              },
            };
            for (const kind of ["bodies", "faces", "hands"])
              data[kind] = results[kind].map((entity) => ({
                ...entity,
                landmarks: entity.landmarks.map((p, index) => ({
                  index,
                  ...p,
                  pixelX: p.x * image.naturalWidth,
                  pixelY: p.y * image.naturalHeight,
                })),
              }));
            download(
              new Blob([JSON.stringify(data, null, 2)], {
                type: "application/json",
              }),
              "json",
            );
          } catch (error) {
            console.error(error);
            status("exportError", true);
          }
        };
        if ($("detection-mode").value === "faces") setInspector("expressions");
        translate();
        controls();
      })();
    </script>
  </body>
</html>
