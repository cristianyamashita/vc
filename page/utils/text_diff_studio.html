<header class="top"><div class="brand"><div class="mark">Δ</div><div><h1>Text Diff Studio</h1><small data-i18n="subtitle">Compare text with clarity</small></div></div><div class="actions"><button class="btn" id="sample" data-i18n="sample">Sample</button><button class="btn" id="swap">⇄ <span class="action-label" data-i18n="swap">Swap</span></button><button class="btn" id="patch">⧉ <span class="action-label" data-i18n="copyPatch">Copy patch</span></button><select id="lang" class="lang"><option value="en">EN</option><option value="pt">PT</option><option value="ja">JA</option></select><button class="btn icon" id="theme" aria-label="Theme">◐</button></div></header>
<main class="page"><div class="optionbar"><div class="option-row"><label class="switch"><input id="ignore-space" type="checkbox"><span data-i18n="ignoreSpace">Ignore whitespace</span></label><label class="switch"><input id="ignore-case" type="checkbox"><span data-i18n="ignoreCase">Ignore case</span></label><label class="switch"><input id="show-all" type="checkbox"><span data-i18n="showAll">Show unchanged lines</span></label></div><button class="btn" id="clear" data-i18n="clear">Clear</button></div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const I={en:{subtitle:'Compare text with clarity',sample:'Sample',swap:'Swap',copyPatch:'Copy patch',ignoreSpace:'Ignore whitespace',ignoreCase:'Ignore case',showAll:'Show unchanged lines',clear:'Clear',original:'Original',revised:'Revised',leftHint:'Paste the original text…',rightHint:'Paste the revised text…',added:'Added',removed:'Removed',changed:'Changed',similarity:'Similarity',comparison:'Side-by-side comparison',empty:'Enter text above to see the differences.',lines:'{n} lines',identical:'Texts are identical',differences:'{n} differences',copied:'Patch copied.',copyFailed:'Could not copy.',tooLarge:'Large input: showing a simplified comparison.'},pt:{subtitle:'Compare textos com clareza',sample:'Exemplo',swap:'Trocar',copyPatch:'Copiar patch',ignoreSpace:'Ignorar espaços',ignoreCase:'Ignorar maiúsculas',showAll:'Mostrar linhas sem alteração',clear:'Limpar',original:'Original',revised:'Revisado',leftHint:'Cole o texto original…',rightHint:'Cole o texto revisado…',added:'Adicionadas',removed:'Removidas',changed:'Alteradas',similarity:'Similaridade',comparison:'Comparação lado a lado',empty:'Digite ou cole textos acima para ver as diferenças.',lines:'{n} linhas',identical:'Os textos são idênticos',differences:'{n} diferenças',copied:'Patch copiado.',copyFailed:'Não foi possível copiar.',tooLarge:'Texto grande: exibindo uma comparação simplificada.'},ja:{subtitle:'テキストの違いを明確に比較',sample:'サンプル',swap:'入れ替え',copyPatch:'パッチをコピー',ignoreSpace:'空白を無視',ignoreCase:'大文字小文字を無視',showAll:'変更のない行も表示',clear:'クリア',original:'変更前',revised:'変更後',leftHint:'元のテキストを貼り付け…',rightHint:'変更後のテキストを貼り付け…',added:'追加',removed:'削除',changed:'変更',similarity:'類似度',comparison:'左右比較',empty:'上にテキストを入力すると差分が表示されます。',lines:'{n}行',identical:'テキストは同一です',differences:'差分 {n}件',copied:'パッチをコピーしました。',copyFailed:'コピーできませんでした。',tooLarge:'長い入力のため簡易比較を表示しています。'}};
let lang=localStorage.getItem('diff-lang')||localStorage.getItem('app_lang')||'en';if(!I[lang])lang='en';const t=(k,v={})=>{let s=I[lang][k]||I.en[k]||k;for(const[a,b]of Object.entries(v))s=s.replaceAll('{'+a+'}',b);return s};let latest=[];
function norm(s){if($('#ignore-space').checked)s=s.replace(/\s+/g,' ').trim();if($('#ignore-case').checked)s=s.toLocaleLowerCase(lang);return s}
function myers(a,b){if(a.length+b.length>7000)return simpleDiff(a,b);const n=a.length,m=b.length,max=n+m,v=new Map([[1,0]]),trace=[];for(let d=0;d<=max;d++){trace.push(new Map(v));for(let k=-d;k<=d;k+=2){let x;if(k===-d||(k!==d&&(v.get(k-1)??-Infinity)<(v.get(k+1)??-Infinity)))x=v.get(k+1)??0;else x=(v.get(k-1)??0)+1;let y=x-k;while(x<n&&y<m&&norm(a[x])===norm(b[y])){x++;y++}v.set(k,x);if(x>=n&&y>=m)return backtrack(trace,a,b)}}return[]}
function backtrack(trace,a,b){let x=a.length,y=b.length,out=[];for(let d=trace.length-1;d>=0;d--){const v=trace[d],k=x-y,prevK=k===-d||(k!==d&&(v.get(k-1)??-Infinity)<(v.get(k+1)??-Infinity))?k+1:k-1,prevX=v.get(prevK)??0,prevY=prevX-prevK;while(x>prevX&&y>prevY){out.push({type:'equal',left:a[x-1],right:b[y-1]});x--;y--}if(d===0)break;if(x===prevX){out.push({type:'add',right:b[y-1]});y--}else{out.push({type:'del',left:a[x-1]});x--}}return out.reverse()}
function simpleDiff(a,b){const out=[],n=Math.max(a.length,b.length);for(let i=0;i<n;i++){if(i<a.length&&i<b.length&&norm(a[i])===norm(b[i]))out.push({type:'equal',left:a[i],right:b[i]});else{if(i<a.length)out.push({type:'del',left:a[i]});if(i<b.length)out.push({type:'add',right:b[i]})}}return out}
function align(ops){const rows=[];for(let i=0;i<ops.length;){if(ops[i].type==='equal'){rows.push(ops[i++]);continue}const del=[],add=[];while(i<ops.length&&ops[i].type!=='equal'){(ops[i].type==='del'?del:add).push(ops[i]);i++}for(let j=0;j<Math.max(del.length,add.length);j++)rows.push(del[j]&&add[j]?{type:'change',left:del[j].left,right:add[j].right}:del[j]||add[j])}let l=0,r=0;return rows.map(x=>({...x,leftNo:x.left!==undefined?++l:null,rightNo:x.right!==undefined?++r:null}))}
function tokenDiff(a,b){const A=a.split(/(\s+|\b)/),B=b.split(/(\s+|\b)/),n=A.length,m=B.length;if(n*m>30000)return[esc(a),esc(b)];const dp=Array.from({length:n+1},()=>new Uint16Array(m+1));for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=A[i]===B[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);let i=0,j=0,la='',rb='';while(i<n||j<m){if(i<n&&j<m&&A[i]===B[j]){la+=esc(A[i]);rb+=esc(B[j]);i++;j++}else if(j<m&&(i===n||dp[i][j+1]>=dp[i+1][j])){rb+='<mark class="ins">'+esc(B[j++])+'</mark>'}else{la+='<mark class="del">'+esc(A[i++])+'</mark>'}}return[la,rb]}
function compare(){const left=$('#left').value.split('\n'),right=$('#right').value.split('\n'),has=$('#left').value||$('#right').value;$('#left-count').textContent=t('lines',{n:$('#left').value?left.length:0});$('#right-count').textContent=t('lines',{n:$('#right').value?right.length:0});$('#empty').classList.toggle('hidden',!!has);$('#diff-scroll').classList.toggle('hidden',!has);if(!has){latest=[];setMetrics(0,0,0,100);return}latest=align(myers(left,right));const stats={add:0,del:0,change:0};latest.forEach(x=>{if(x.type!=='equal')stats[x.type]++});const equal=latest.filter(x=>x.type==='equal').length,similarity=Math.round(equal/Math.max(left.length,right.length,1)*100);setMetrics(stats.add,stats.del,stats.change,similarity);$('#status').textContent=(stats.add+stats.del+stats.change)?t('differences',{n:stats.add+stats.del+stats.change}):t('identical');renderRows()}
function renderRows(){const show=$('#show-all').checked,context=3,rows=[];latest.forEach((x,i)=>{if(!show&&x.type==='equal'){const near=latest.slice(Math.max(0,i-context),i+context+1).some(y=>y.type!=='equal');if(!near){if(!rows.length||rows.at(-1)!=='gap')rows.push('gap');return}}rows.push(x)});$('#diff-body').innerHTML=rows.map(x=>{if(x==='gap')return'<tr class="gap"><td colspan="4">•••</td></tr>';let l=x.left==null?'':esc(x.left),r=x.right==null?'':esc(x.right);if(x.type==='change')[l,r]=tokenDiff(x.left,x.right);return `<tr class="${x.type}"><td class="ln left-ln">${x.leftNo??''}</td><td class="code left-code">${l}</td><td class="ln right-ln">${x.rightNo??''}</td><td class="code right-code">${r}</td></tr>`}).join('')}
function setMetrics(a,d,c,s){$('#added').textContent=a;$('#removed').textContent=d;$('#changed').textContent=c;$('#similarity').textContent=s+'%'}
function makePatch(){const a=$('#left').value.split('\n'),b=$('#right').value.split('\n'),out=['--- original','+++ revised','@@ -1,'+a.length+' +1,'+b.length+' @@'];for(const x of myers(a,b)){if(x.type==='equal')out.push(' '+x.left);else if(x.type==='del')out.push('-'+x.left);else out.push('+'+x.right)}return out.join('\n')}
async function copyPatch(){try{await navigator.clipboard.writeText(makePatch());toast(t('copied'))}catch{toast(t('copyFailed'))}}function sample(){const a=`function greet(name) {\n  const message = "Hello, " + name;\n  console.log(message);\n  return true;\n}\n\ngreet("Tokyo");`,b=`function greet(name, language = "en") {\n  const greeting = language === "ja" ? "こんにちは" : "Hello";\n  const message = \`${'${greeting}'}, ${'${name}'}!\`;\n  console.log(message);\n  return message;\n}\n\ngreet("Tokyo", "ja");`;$('#left').value=a;$('#right').value=b;compare()}
function esc(s){return String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function toast(s){const e=$('#toast');e.textContent=s;e.classList.remove('hidden');clearTimeout(toast.x);toast.x=setTimeout(()=>e.classList.add('hidden'),2200)}function tr(){$$('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));$$('[data-i18n-placeholder]').forEach(e=>e.placeholder=t(e.dataset.i18nPlaceholder));$('#lang').value=lang;document.documentElement.lang=lang;compare()}
let timer;['left','right'].forEach(id=>$('#'+id).addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(compare,180)}));['ignore-space','ignore-case'].forEach(id=>$('#'+id).onchange=compare);$('#show-all').onchange=renderRows;$('#sample').onclick=sample;$('#clear').onclick=()=>{$('#left').value=$('#right').value='';compare()};$('#swap').onclick=()=>{const x=$('#left').value;$('#left').value=$('#right').value;$('#right').value=x;compare()};$('#patch').onclick=copyPatch;$('#lang').onchange=e=>{lang=e.target.value;localStorage.setItem('diff-lang',lang);tr()};$('#theme').onclick=()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('diff-theme',n)};document.documentElement.dataset.theme=localStorage.getItem('diff-theme')||localStorage.getItem('app_theme')||'dark';tr();
</script></body></html>
