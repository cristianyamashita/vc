<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="title">Clock & Timer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/fontawesome/css/all.min.css">
  <style>
    :root {
      --bg-color: #1a1a1a;
      --text-color: #f0f0f0;
      --card-bg-color: #2a2a2a;
      --border-color: #444;
      --accent-color: #0d6efd;
      --green: #198754;
      --yellow: #ffc107;
      --red: #dc3545;
    }

    html[data-theme="light"] {
      --bg-color: #f8f9fa;
      --text-color: #212529;
      --card-bg-color: #fff;
      --border-color: #dee2e6;
      --accent-color: #0d6efd;
      --green: #198754;
      --yellow: #ffc107;
      --red: #dc3545;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      margin: 0;
    }

    .container-fluid {
      padding-top: 20px;
      padding-bottom: 20px;
      flex: 1;
    }

    .card {
      background-color: var(--card-bg-color);
      border-color: var(--border-color);
    }

    .card-header {
      border-bottom-color: var(--border-color);
    }

    .nav.nav-tabs .nav-link {
        color: var(--text-color);
        color: var(--text-color);
    }

    .nav.nav-tabs .nav-link.active {
        background-color: var(--card-bg-color);
        border-color: var(--border-color) var(--border-color) var(--card-bg-color);
        color: var(--text-color);
    }

    .navbar-brand {
      color: var(--text-color);
    }

    .display {
        font-size: 3.5rem;
        font-weight: bold;
        text-align: center;
        margin: 20px 0;
        font-family: 'Courier New', Courier, monospace;
        color: var(--text-color);
    }

    .form-control, .form-select {
      background-color: var(--card-bg-color);
      color: var(--text-color);
      border-color: var(--border-color);
    }

    .form-control:focus, .form-select:focus {
      background-color: var(--card-bg-color);
      color: var(--text-color);
      border-color: var(--accent-color);
      box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
    }

    .form-label,
    .text-muted,
    .unit-timing-info,
    .unit-timing-progress-label {
      color: var(--text-color) !important;
    }

    #countdown-days::placeholder,
    #countdown-hours::placeholder,
    #countdown-minutes::placeholder,
    #countdown-seconds::placeholder {
      color: var(--text-color);
      opacity: 1;
    }

    .progress {
      height: 1.25rem;
      background-color: var(--border-color);
    }
  </style>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-NWZDZ906DJ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-NWZDZ906DJ');
  </script>
</head>
<body>

  <nav class="navbar navbar-expand-lg" style="background-color: var(--card-bg-color); border-bottom: 1px solid var(--border-color);">
    <div class="container-fluid">
      <a class="navbar-brand" href="#" data-i18n="title">Clock & Timer</a>
      <div class="d-flex ms-auto">
        <select id="lang-switcher" class="form-select form-select-sm me-2" style="width: auto;">
          <option value="en">English</option>
          <option value="pt">Português</option>
          <option value="ja">日本語</option>
        </select>
        <button id="theme-switcher" class="btn btn-sm btn-outline-secondary">
          <i class="fas fa-moon"></i>
        </button>
      </div>
    </div>
  </nav>

  <div class="container-fluid">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="card">
            <div class="card-header">
                <ul class="nav nav-tabs card-header-tabs" id="myTab" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="stopwatch-tab" data-bs-toggle="tab" data-bs-target="#stopwatch" type="button" role="tab" aria-controls="stopwatch" aria-selected="true" data-i18n="stopwatch">Stopwatch</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="countdown-tab" data-bs-toggle="tab" data-bs-target="#countdown" type="button" role="tab" aria-controls="countdown" aria-selected="false" data-i18n="countdown">Countdown</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="clock-tab" data-bs-toggle="tab" data-bs-target="#clock" type="button" role="tab" aria-controls="clock" aria-selected="false" data-i18n="clock">Clock</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="unit-timing-tab" data-bs-toggle="tab" data-bs-target="#unit-timing" type="button" role="tab" aria-controls="unit-timing" aria-selected="false" data-i18n="unitTiming">Unit Timing</button>
                    </li>
                </ul>
            </div>
            <div class="card-body">
                <div class="tab-content" id="myTabContent">
                    <!-- Stopwatch -->
                    <div class="tab-pane fade show active" id="stopwatch" role="tabpanel" aria-labelledby="stopwatch-tab">
                        <div class="display" id="stopwatch-display">00:00:00.000</div>
                        <div class="text-center">
                            <button class="btn btn-lg btn-success" id="stopwatch-start" data-i18n="start">Start</button>
                            <button class="btn btn-lg btn-danger" id="stopwatch-stop" data-i18n="stop">Stop</button>
                            <button class="btn btn-lg btn-warning" id="stopwatch-reset" data-i18n="reset">Reset</button>
                        </div>
                    </div>
                    <!-- Countdown -->
                    <div class="tab-pane fade" id="countdown" role="tabpanel" aria-labelledby="countdown-tab">
                        <div class="display" id="countdown-display">00:00:00</div>
                        <div class="input-group mb-3">
                            <input type="number" id="countdown-days" class="form-control" placeholder="Days" data-i18n-placeholder="days">
                            <input type="number" id="countdown-hours" class="form-control" placeholder="Hours" data-i18n-placeholder="hours">
                            <input type="number" id="countdown-minutes" class="form-control" placeholder="Minutes" data-i18n-placeholder="minutes">
                            <input type="number" id="countdown-seconds" class="form-control" placeholder="Seconds" data-i18n-placeholder="seconds">
                        </div>
                        <div class="text-center">
                            <button class="btn btn-lg btn-success" id="countdown-start" data-i18n="start">Start</button>
                            <button class="btn btn-lg btn-danger" id="countdown-stop" data-i18n="stop">Stop</button>
                            <button class="btn btn-lg btn-warning" id="countdown-reset" data-i18n="reset">Reset</button>
                        </div>
                    </div>
                    <!-- Clock -->
                    <div class="tab-pane fade" id="clock" role="tabpanel" aria-labelledby="clock-tab">
                        <div class="display" id="clock-display">00:00:00</div>
                    </div>
                    <!-- Unit Timing -->
                    <div class="tab-pane fade" id="unit-timing" role="tabpanel" aria-labelledby="unit-timing-tab">
                        <div class="row g-3 mb-3">
                            <div class="col-12">
                                <label for="unit-timing-quantity" class="form-label" data-i18n="unitQuantity">Number of units</label>
                                <input type="number" id="unit-timing-quantity" class="form-control" min="1" step="1" placeholder="Units" data-i18n-placeholder="units">
                            </div>
                            <div class="col-6 col-md-4">
                                <label for="unit-timing-hours" class="form-label" data-i18n="hours">Hours</label>
                                <input type="number" id="unit-timing-hours" class="form-control" min="0" step="1" placeholder="Hours" data-i18n-placeholder="hours">
                            </div>
                            <div class="col-6 col-md-4">
                                <label for="unit-timing-minutes" class="form-label" data-i18n="minutes">Minutes</label>
                                <input type="number" id="unit-timing-minutes" class="form-control" min="0" step="1" placeholder="Minutes" data-i18n-placeholder="minutes">
                            </div>
                            <div class="col-6 col-md-4">
                                <label for="unit-timing-seconds" class="form-label" data-i18n="seconds">Seconds</label>
                                <input type="number" id="unit-timing-seconds" class="form-control" min="0" step="1" placeholder="Seconds" data-i18n-placeholder="seconds">
                            </div>
                        </div>
                        <div class="text-center">
                            <div class="small text-muted" data-i18n="totalTimeRemaining">Total time remaining</div>
                            <div class="display" id="unit-timing-display">00:00:00</div>
                            <div class="mb-3 unit-timing-info"><span data-i18n="unitsRemaining">Units remaining</span>: <strong id="unit-timing-remaining-units">0</strong></div>
                            <div class="mb-3 unit-timing-info"><span data-i18n="finishesAt">Finishes at</span>: <strong id="unit-timing-end-time">—</strong></div>
                            <div class="text-start mb-3">
                                <div class="small mb-1 unit-timing-progress-label" data-i18n="unitProgress">Current unit progress</div>
                                <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-label="Current unit progress">
                                    <div class="progress-bar bg-success" id="unit-timing-unit-progress" style="width: 0%"></div>
                                </div>
                                <div class="small mt-3 mb-1 unit-timing-progress-label" data-i18n="totalProgress">Total progress</div>
                                <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-label="Total progress">
                                    <div class="progress-bar bg-info" id="unit-timing-total-progress" style="width: 0%"></div>
                                </div>
                            </div>
                            <button class="btn btn-lg btn-success" id="unit-timing-start" data-i18n="start">Start</button>
                            <button class="btn btn-lg btn-danger" id="unit-timing-stop" data-i18n="stop">Stop</button>
                            <button class="btn btn-lg btn-warning" id="unit-timing-reset" data-i18n="reset">Reset</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const i18n = {
        en: {
          title: "Clock & Timer",
          stopwatch: "Stopwatch",
          countdown: "Countdown",
          clock: "Clock",
          unitTiming: "Unit Timing",
          unitQuantity: "Number of units",
          units: "Units",
          totalTimeRemaining: "Total time remaining",
          unitsRemaining: "Units remaining",
          finishesAt: "Finishes at",
          unitProgress: "Current unit progress",
          totalProgress: "Total progress",
          start: "Start",
          stop: "Stop",
          reset: "Reset",
          days: "Days",
          hours: "Hours",
          minutes: "Minutes",
          seconds: "Seconds",
        },
        pt: {
          title: "Relógio & Cronômetro",
          stopwatch: "Cronômetro",
          countdown: "Contagem Regressiva",
          clock: "Relógio",
          unitTiming: "Tempo por Unidade",
          unitQuantity: "Quantidade de unidades",
          units: "Unidades",
          totalTimeRemaining: "Tempo total restante",
          unitsRemaining: "Unidades restantes",
          finishesAt: "Termina em",
          unitProgress: "Progresso da unidade atual",
          totalProgress: "Progresso total",
          start: "Iniciar",
          stop: "Parar",
          reset: "Zerar",
          days: "Dias",
          hours: "Horas",
          minutes: "Minutos",
          seconds: "Segundos",
        },
        ja: {
          title: "時計とタイマー",
          stopwatch: "ストップウォッチ",
          countdown: "カウントダウン",
          clock: "時計",
          unitTiming: "単位ごとの時間",
          unitQuantity: "単位数",
          units: "単位",
          totalTimeRemaining: "残り合計時間",
          unitsRemaining: "残りの単位数",
          finishesAt: "終了予定",
          unitProgress: "現在の単位の進捗",
          totalProgress: "全体の進捗",
          start: "スタート",
          stop: "ストップ",
          reset: "リセット",
          days: "日",
          hours: "時間",
          minutes: "分",
          seconds: "秒",
        }
      };

      // --- Elements ---
      const langSwitcher = document.getElementById('lang-switcher');
      const themeSwitcher = document.getElementById('theme-switcher');

      // Stopwatch
      const stopwatchDisplay = document.getElementById('stopwatch-display');
      const stopwatchStartBtn = document.getElementById('stopwatch-start');
      const stopwatchStopBtn = document.getElementById('stopwatch-stop');
      const stopwatchResetBtn = document.getElementById('stopwatch-reset');

      // Countdown
      const countdownDisplay = document.getElementById('countdown-display');
      const countdownDaysInput = document.getElementById('countdown-days');
      const countdownHoursInput = document.getElementById('countdown-hours');
      const countdownMinutesInput = document.getElementById('countdown-minutes');
      const countdownSecondsInput = document.getElementById('countdown-seconds');
      const countdownStartBtn = document.getElementById('countdown-start');
      const countdownStopBtn = document.getElementById('countdown-stop');
      const countdownResetBtn = document.getElementById('countdown-reset');

      // Clock
      const clockDisplay = document.getElementById('clock-display');

      // Unit Timing
      const unitTimingQuantityInput = document.getElementById('unit-timing-quantity');
      const unitTimingHoursInput = document.getElementById('unit-timing-hours');
      const unitTimingMinutesInput = document.getElementById('unit-timing-minutes');
      const unitTimingSecondsInput = document.getElementById('unit-timing-seconds');
      const unitTimingDisplay = document.getElementById('unit-timing-display');
      const unitTimingRemainingUnits = document.getElementById('unit-timing-remaining-units');
      const unitTimingEndTime = document.getElementById('unit-timing-end-time');
      const unitTimingUnitProgress = document.getElementById('unit-timing-unit-progress');
      const unitTimingTotalProgress = document.getElementById('unit-timing-total-progress');
      const unitTimingStartBtn = document.getElementById('unit-timing-start');
      const unitTimingStopBtn = document.getElementById('unit-timing-stop');
      const unitTimingResetBtn = document.getElementById('unit-timing-reset');

      // --- State ---
      let currentLanguage = localStorage.getItem('app_lang') || 'en';
      let currentTheme = localStorage.getItem('app_theme') || 'dark';

      // Stopwatch state
      let stopwatchInterval;
      let stopwatchStartTime;
      let stopwatchElapsedTime = 0;

      // Countdown state
      let countdownInterval;
      let countdownTotalSeconds = 0;

      // Unit Timing state
      let unitTimingInterval;
      let unitTimingTotalSeconds = 0;
      let unitTimingUnitSeconds = 0;
      let unitTimingInitialTotalSeconds = 0;
      let unitTimingInputSignature = '';
      let unitTimingLastTick;

      // --- I18n & Theme ---
      const applyI18n = () => {
        const lang = i18n[currentLanguage] || i18n.en;
        document.querySelectorAll('[data-i18n]').forEach(el => {
          const key = el.getAttribute('data-i18n');
          if (lang[key]) el.innerText = lang[key];
        });
        document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
          const key = el.getAttribute('data-i18n-placeholder');
          if (lang[key]) el.placeholder = lang[key];
        });
        document.title = lang.title;
      };

      const applyTheme = (theme) => {
        document.documentElement.setAttribute('data-theme', theme);
        const icon = themeSwitcher.querySelector('i');
        icon.className = theme === 'light' ? 'fas fa-moon' : 'fas fa-sun';
        localStorage.setItem('app_theme', theme);
      };

      // --- Clock ---
      const updateClock = () => {
        const now = new Date();
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const seconds = String(now.getSeconds()).padStart(2, '0');
        clockDisplay.textContent = `${hours}:${minutes}:${seconds}`;
      };

      // --- Stopwatch ---
      const formatStopwatchTime = (time) => {
        const date = new Date(time);
        const minutes = String(date.getUTCMinutes()).padStart(2, '0');
        const seconds = String(date.getUTCSeconds()).padStart(2, '0');
        const milliseconds = String(date.getUTCMilliseconds()).padStart(3, '0');
        return `${minutes}:${seconds}:${milliseconds}`;
      };

      const startStopwatch = () => {
        stopwatchStartTime = Date.now() - stopwatchElapsedTime;
        stopwatchInterval = setInterval(() => {
          stopwatchElapsedTime = Date.now() - stopwatchStartTime;
          stopwatchDisplay.textContent = formatStopwatchTime(stopwatchElapsedTime);
        }, 10);
        stopwatchStartBtn.disabled = true;
        stopwatchStopBtn.disabled = false;
      };

      const stopStopwatch = () => {
        clearInterval(stopwatchInterval);
        stopwatchStartBtn.disabled = false;
        stopwatchStopBtn.disabled = true;
      };

      const resetStopwatch = () => {
        clearInterval(stopwatchInterval);
        stopwatchElapsedTime = 0;
        stopwatchDisplay.textContent = formatStopwatchTime(0);
        stopwatchStartBtn.disabled = false;
        stopwatchStopBtn.disabled = true;
      };

      // --- Countdown ---
        const formatCountdownTime = (totalSeconds) => {
            if (totalSeconds < 0) totalSeconds = 0;
            const days = Math.floor(totalSeconds / (3600 * 24));
            const hours = Math.floor((totalSeconds % (3600 * 24)) / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;

            let format = '';
            if (days > 0) {
              format += `${String(days).padStart(2, '0')}:`;
            }
            format += `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            return format;
        };

      const startCountdown = () => {
        const days = parseInt(countdownDaysInput.value) || 0;
        const hours = parseInt(countdownHoursInput.value) || 0;
        const minutes = parseInt(countdownMinutesInput.value) || 0;
        const seconds = parseInt(countdownSecondsInput.value) || 0;
        countdownTotalSeconds = (days * 86400) + (hours * 3600) + (minutes * 60) + seconds;

        if (countdownTotalSeconds <= 0) return;

        clearInterval(countdownInterval);
        countdownDisplay.textContent = formatCountdownTime(countdownTotalSeconds);

        countdownInterval = setInterval(() => {
          countdownTotalSeconds--;
          countdownDisplay.textContent = formatCountdownTime(countdownTotalSeconds);
          if (countdownTotalSeconds <= 0) {
            clearInterval(countdownInterval);
            alert('Countdown finished!');
            resetCountdown();
          }
        }, 1000);

        countdownStartBtn.disabled = true;
        countdownStopBtn.disabled = false;
      };

      const stopCountdown = () => {
          clearInterval(countdownInterval);
          countdownStartBtn.disabled = false;
          countdownStopBtn.disabled = true;
      };

      const resetCountdown = () => {
        clearInterval(countdownInterval);
        countdownTotalSeconds = 0;
        countdownDisplay.textContent = formatCountdownTime(0);
        countdownDaysInput.value = '';
        countdownHoursInput.value = '';
        countdownMinutesInput.value = '';
        countdownSecondsInput.value = '';
        countdownStartBtn.disabled = false;
        countdownStopBtn.disabled = true;
      };

      // --- Unit Timing ---
      const formatDateTime = (date) => {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        const hours = String(date.getHours()).padStart(2, '0');
        const minutes = String(date.getMinutes()).padStart(2, '0');
        const seconds = String(date.getSeconds()).padStart(2, '0');
        return `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
      };

      const updateUnitTimingDisplay = () => {
        unitTimingDisplay.textContent = formatCountdownTime(Math.ceil(unitTimingTotalSeconds));
        const remainingUnits = unitTimingTotalSeconds > 0 && unitTimingUnitSeconds > 0
          ? Math.ceil(unitTimingTotalSeconds / unitTimingUnitSeconds)
          : 0;
        unitTimingRemainingUnits.textContent = remainingUnits;
        unitTimingEndTime.textContent = unitTimingTotalSeconds > 0
          ? formatDateTime(new Date(Date.now() + unitTimingTotalSeconds * 1000))
          : '—';
        const totalProgress = unitTimingInitialTotalSeconds > 0
          ? Math.min(100, Math.max(0, ((unitTimingInitialTotalSeconds - unitTimingTotalSeconds) / unitTimingInitialTotalSeconds) * 100))
          : 0;
        const unitRemainder = unitTimingUnitSeconds > 0
          ? unitTimingTotalSeconds % unitTimingUnitSeconds
          : 0;
        const unitProgress = unitTimingTotalSeconds > 0 && unitTimingUnitSeconds > 0
          ? unitRemainder === 0
            ? 0
            : Math.min(100, Math.max(0, ((unitTimingUnitSeconds - unitRemainder) / unitTimingUnitSeconds) * 100))
          : unitTimingTotalSeconds <= 0 && unitTimingInitialTotalSeconds > 0 ? 100 : 0;
        unitTimingUnitProgress.style.width = `${unitProgress}%`;
        unitTimingTotalProgress.style.width = `${totalProgress}%`;
        unitTimingUnitProgress.parentElement.setAttribute('aria-valuenow', Math.round(unitProgress));
        unitTimingTotalProgress.parentElement.setAttribute('aria-valuenow', Math.round(totalProgress));
      };

      const startUnitTiming = () => {
        const quantity = parseInt(unitTimingQuantityInput.value, 10) || 0;
        const unitSeconds =
            (parseInt(unitTimingHoursInput.value, 10) || 0) * 3600 +
            (parseInt(unitTimingMinutesInput.value, 10) || 0) * 60 +
            (parseInt(unitTimingSecondsInput.value, 10) || 0);
        const inputSignature = `${quantity}:${unitSeconds}`;
        if (unitTimingTotalSeconds <= 0 || inputSignature !== unitTimingInputSignature) {
          if (quantity <= 0 || unitSeconds <= 0) return;
          unitTimingUnitSeconds = unitSeconds;
          unitTimingTotalSeconds = quantity * unitTimingUnitSeconds;
          unitTimingInitialTotalSeconds = unitTimingTotalSeconds;
          unitTimingInputSignature = inputSignature;
        }

        clearInterval(unitTimingInterval);
        unitTimingLastTick = Date.now();
        updateUnitTimingDisplay();
        unitTimingInterval = setInterval(() => {
          const now = Date.now();
          unitTimingTotalSeconds = Math.max(0, unitTimingTotalSeconds - (now - unitTimingLastTick) / 1000);
          unitTimingLastTick = now;
          updateUnitTimingDisplay();
          if (unitTimingTotalSeconds <= 0) {
            clearInterval(unitTimingInterval);
            unitTimingInterval = null;
            unitTimingStartBtn.disabled = false;
            unitTimingStopBtn.disabled = true;
          }
        }, 250);
        unitTimingStartBtn.disabled = true;
        unitTimingStopBtn.disabled = false;
      };

      const stopUnitTiming = () => {
        if (unitTimingInterval) {
          const now = Date.now();
          unitTimingTotalSeconds = Math.max(0, unitTimingTotalSeconds - (now - unitTimingLastTick) / 1000);
        }
        clearInterval(unitTimingInterval);
        unitTimingInterval = null;
        updateUnitTimingDisplay();
        unitTimingStartBtn.disabled = false;
        unitTimingStopBtn.disabled = true;
      };

      const resetUnitTiming = () => {
        clearInterval(unitTimingInterval);
        unitTimingTotalSeconds = 0;
        unitTimingUnitSeconds = 0;
        unitTimingInitialTotalSeconds = 0;
        unitTimingInputSignature = '';
        unitTimingLastTick = null;
        unitTimingDisplay.textContent = formatCountdownTime(0);
        unitTimingRemainingUnits.textContent = '0';
        unitTimingEndTime.textContent = '—';
        unitTimingUnitProgress.style.width = '0%';
        unitTimingTotalProgress.style.width = '0%';
        unitTimingQuantityInput.value = '';
        unitTimingHoursInput.value = '';
        unitTimingMinutesInput.value = '';
        unitTimingSecondsInput.value = '';
        unitTimingStartBtn.disabled = false;
        unitTimingStopBtn.disabled = true;
      };

      // --- Event Listeners ---
      langSwitcher.addEventListener('change', (e) => {
        currentLanguage = e.target.value;
        localStorage.setItem('app_lang', currentLanguage);
        applyI18n();
      });

      themeSwitcher.addEventListener('click', () => {
        currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
        applyTheme(currentTheme);
      });

      stopwatchStartBtn.addEventListener('click', startStopwatch);
      stopwatchStopBtn.addEventListener('click', stopStopwatch);
      stopwatchResetBtn.addEventListener('click', resetStopwatch);

      countdownStartBtn.addEventListener('click', startCountdown);
      countdownStopBtn.addEventListener('click', stopCountdown);
      countdownResetBtn.addEventListener('click', resetCountdown);

      unitTimingStartBtn.addEventListener('click', startUnitTiming);
      unitTimingStopBtn.addEventListener('click', stopUnitTiming);
      unitTimingResetBtn.addEventListener('click', resetUnitTiming);

      // --- Initial Setup ---
      langSwitcher.value = currentLanguage;
      applyI18n();
      applyTheme(currentTheme);
      setInterval(updateClock, 1000);
      updateClock(); // Initial call
      stopwatchStopBtn.disabled = true;
      countdownStopBtn.disabled = true;
      unitTimingStopBtn.disabled = true;
    });
  </script>
</body>
</html>
