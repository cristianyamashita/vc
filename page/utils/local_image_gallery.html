<!DOCTYPE html>
<html lang="pt" data-theme="dark">
<head>
    <link rel="icon" href="../assets/icons/ico/utils-local_image_gallery.ico" type="image/x-icon">

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Local Image Gallery</title>
  <style>
    :root {
      --bg: #101214;
      --bg-soft: #181c20;
      --panel: rgba(24, 28, 32, 0.86);
      --panel-strong: rgba(16, 18, 20, 0.94);
      --ink: #f6f4ee;
      --muted: #aeb6bb;
      --border: rgba(255, 255, 255, 0.13);
      --accent: #23c39b;
      --accent-strong: #13a981;
      --danger: #ff6b6b;
      --shadow: 0 22px 60px rgba(0, 0, 0, 0.32);
      --tile: 210px;
      --radius: 8px;
    }

    html[data-theme="light"] {
      --bg: #f5f7f8;
      --bg-soft: #e5ebed;
      --panel: rgba(255, 255, 255, 0.88);
      --panel-strong: rgba(255, 255, 255, 0.98);
      --ink: #161a1d;
      --muted: #5d686e;
      --border: rgba(18, 25, 30, 0.14);
      --accent: #087f6d;
      --accent-strong: #056856;
      --danger: #c92a2a;
      --shadow: 0 22px 52px rgba(35, 47, 54, 0.14);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      overflow: hidden;
      color: var(--ink);
      font: 14px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
      background:
        linear-gradient(135deg, color-mix(in srgb, var(--accent) 18%, transparent), transparent 34%),
        linear-gradient(315deg, rgba(255, 107, 107, 0.14), transparent 35%),
        linear-gradient(180deg, var(--bg), var(--bg-soft));
      background-attachment: fixed;
    }

    button, input, select { font: inherit; }
    button:focus-visible,
    input:focus-visible,
    select:focus-visible {
      outline: 2px solid color-mix(in srgb, var(--accent) 70%, transparent);
      outline-offset: 1px;
    }

    .app {
      height: 100%;
      display: grid;
      grid-template-rows: auto 1fr;
      min-height: 0;
    }

    .topbar {
      height: 44px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 8px 0 12px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      backdrop-filter: blur(16px);
      min-width: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
      white-space: nowrap;
    }

    .brand img { width: 18px; height: 18px; }

    h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0;
    }

    .status {
      flex: 1 1 0;
      min-width: 0;
      color: var(--muted);
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      flex: 0 1 auto;
      min-width: 0;
    }

    .btn,
    .chip {
      height: 30px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--panel-strong);
      color: var(--ink);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      padding: 0 10px;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      transition: border-color 0.16s ease, background 0.16s ease;
    }

    .btn:hover {
      border-color: color-mix(in srgb, var(--accent) 52%, var(--border));
    }

    .btn.primary {
      color: #fff;
      border-color: transparent;
      background: linear-gradient(180deg, var(--accent), var(--accent-strong));
    }

    .btn.icon {
      width: 30px;
      min-width: 30px;
      padding: 0;
      font-size: 14px;
    }

    .segmented {
      display: flex;
      gap: 2px;
      padding: 2px;
      height: 30px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--panel-strong);
    }

    .segmented button {
      min-width: 30px;
      height: 24px;
      padding: 0 8px;
      border: 1px solid transparent;
      border-radius: 4px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
    }

    .segmented button.active {
      color: #fff;
      background: var(--accent-strong);
    }

    .size-control {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 8px;
    }

    .size-control span,
    .sort-control span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .sort-control {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 0 6px;
    }

    .sort-control select {
      min-width: 70px;
      border: 0;
      background: transparent;
      color: var(--ink);
      outline: 0;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .sort-control option,
    #lang-switcher option {
      background: var(--panel-strong);
      color: var(--ink);
    }

    #lang-switcher {
      height: 30px;
      padding: 0 4px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--panel-strong);
      color: var(--ink);
      font-size: 13px;
      cursor: pointer;
    }

    input[type="range"] {
      width: 90px;
      accent-color: var(--accent);
    }

    .content {
      min-height: 0;
      overflow: auto;
      padding: 12px;
    }

    .dropzone {
      height: 100%;
      display: grid;
      place-items: center;
      padding: 14px;
      border: 1px dashed color-mix(in srgb, var(--accent) 36%, var(--border));
      border-radius: var(--radius);
      background: color-mix(in srgb, var(--panel) 74%, transparent);
    }

    .welcome {
      width: min(520px, 100%);
      display: grid;
      gap: 10px;
      text-align: center;
      justify-items: center;
    }

    .welcome h2 {
      margin: 0;
      font-size: 16px;
      line-height: 1.3;
      letter-spacing: 0;
    }

    .welcome p {
      max-width: 460px;
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .notice {
      color: var(--muted);
      font-size: 12px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, var(--tile)), 1fr));
      align-content: start;
      gap: 10px;
    }

    .gallery.masonry {
      display: block;
      column-width: var(--tile);
      column-gap: 10px;
    }

    .photo {
      width: 100%;
      aspect-ratio: 1;
      display: block;
      object-fit: cover;
      border: 0;
      border-radius: 4px;
      background: var(--panel-strong);
      cursor: zoom-in;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
      transition: transform 0.18s ease, filter 0.18s ease;
    }

    .gallery.masonry .photo {
      aspect-ratio: auto;
      height: auto;
      margin: 0 0 10px;
      break-inside: avoid;
      object-fit: contain;
    }

    .photo:hover {
      transform: translateY(-2px);
      filter: saturate(1.08) contrast(1.03);
    }

    .empty {
      height: 100%;
      display: grid;
      place-items: center;
      color: var(--muted);
      text-align: center;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--panel);
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      place-items: center;
      padding: 14px;
      background: rgba(0, 0, 0, 0.9);
      cursor: zoom-out;
    }

    .modal.open { display: grid; }

    .modal-download {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 21;
      height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 12px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 6px;
      background: rgba(16, 18, 20, 0.82);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      box-shadow: 0 16px 42px rgba(0, 0, 0, 0.36);
      cursor: pointer;
    }

    .modal-download:hover {
      background: rgba(35, 195, 155, 0.92);
    }

    .modal img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 4px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.56);
    }

    /* Help dialog */
    dialog.help {
      width: min(560px, calc(100vw - 32px));
      max-height: calc(100vh - 32px);
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--panel-strong);
      color: var(--ink);
    }
    html[data-theme="dark"] dialog.help { background: #181c20; }
    html[data-theme="light"] dialog.help { background: #ffffff; }
    dialog.help::backdrop { background: rgb(0 0 0 / 45%); }
    .dlg-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-bottom: 1px solid var(--border); font-weight: 700; }
    .dlg-body { padding: 12px 14px 16px; font-size: 13px; }
    .dlg-body h3 { margin: 12px 0 6px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
    .dlg-body p { margin: 0 0 8px; }
    .dlg-body ul { margin: 0; padding-left: 18px; }
    .dlg-body li { margin: 3px 0; }

    .hidden { display: none !important; }

    @media (max-width: 900px) {
      .status { display: none; }
      .size-control span, .sort-control span { display: none; }
    }

    @media (max-width: 720px) {
      .topbar { height: auto; min-height: 44px; flex-wrap: wrap; padding: 6px 8px; }
      .toolbar { flex-wrap: wrap; justify-content: flex-start; }
      input[type="range"] { width: 70px; }
    }
  </style>

</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <img src="../assets/icons/svg/utils-local_image_gallery.svg" alt="">
        <h1 data-i18n="title">Galeria Local</h1>
      </div>
      <div class="status" id="status" data-i18n="statusIdle">Escolha uma pasta para ver as imagens, sem upload.</div>
      <div class="toolbar">
        <button class="btn primary" id="pickBtn" type="button" data-i18n="pickFolder">Escolher pasta</button>
        <label class="chip size-control" for="sizeRange">
          <span data-i18n="size">Tamanho</span>
          <input id="sizeRange" type="range" min="110" max="420" step="10" value="210" />
        </label>
        <div class="segmented layout-selector" aria-label="Layout">
          <button type="button" data-layout="grid" data-i18n="layoutGrid">Grid</button>
          <button type="button" data-layout="masonry" data-i18n="layoutMasonry">Masonry</button>
        </div>
        <label class="chip sort-control" for="sortBy">
          <span data-i18n="sort">Ordenar</span>
          <select id="sortBy">
            <option value="name" data-i18n="sortName">Nome</option>
            <option value="size" data-i18n="sortSize">Tamanho</option>
            <option value="date" data-i18n="sortDate">Data</option>
          </select>
        </label>
        <button class="btn icon" id="sortDirectionBtn" type="button" aria-label="Crescente" title="Crescente">↑</button>
        <button class="btn icon" id="helpBtn" type="button" aria-label="Ajuda" title="Ajuda">?</button>
        <select id="lang-switcher" aria-label="Language">
          <option value="en">EN</option>
          <option value="pt">PT</option>
          <option value="ja">JA</option>
        </select>
        <button class="btn icon" id="theme-switcher" type="button" aria-label="Tema" title="Tema">◐</button>
      </div>
    </header>

    <div class="content">
      <section class="dropzone" id="welcome">
        <div class="welcome">
          <h2 data-i18n="welcomeTitle">Suas fotos, direto do disco.</h2>
          <p data-i18n="welcomeText">A página lê apenas a pasta que você permitir. As imagens ficam no seu computador e são mostradas localmente no navegador.</p>
          <button class="btn primary" id="welcomePickBtn" type="button" data-i18n="pickFolder">Escolher pasta</button>
          <div class="notice" id="supportNotice"></div>
        </div>
      </section>

      <section class="gallery hidden" id="gallery" aria-live="polite"></section>
      <section class="empty hidden" id="empty" data-i18n="empty">Nenhuma imagem compatível foi encontrada nessa pasta.</section>
    </div>
  </main>

  <dialog class="help" id="helpDialog" aria-labelledby="helpTitle">
    <div class="dlg-head"><span id="helpTitle" data-i18n="help">Ajuda</span><button class="btn icon" id="helpClose" type="button" aria-label="Fechar">✕</button></div>
    <div class="dlg-body" id="helpBody"></div>
  </dialog>

  <div class="modal" id="modal" aria-hidden="true">
    <a class="modal-download" id="modalDownload" href="#" download data-i18n="download">Baixar</a>
    <img id="modalImg" alt="" />
  </div>

  <input class="hidden" id="folderInput" type="file" accept="image/*" webkitdirectory multiple />

  <script>
    const translations = {
      pt: {
        title: "Galeria Local",
        statusIdle: "Escolha uma pasta para ver as imagens, sem upload.",
        pickFolder: "Escolher pasta",
        download: "Baixar",
        size: "Tamanho",
        layoutGrid: "Grid",
        layoutMasonry: "Masonry",
        sort: "Ordenar",
        sortName: "Nome",
        sortSize: "Tamanho",
        sortDate: "Data",
        ascending: "Crescente",
        descending: "Decrescente",
        welcomeTitle: "Suas fotos, direto do disco.",
        welcomeText: "A página lê apenas a pasta que você permitir. As imagens ficam no seu computador e são mostradas localmente no navegador.",
        unsupported: "Este navegador não suporta escolha moderna de diretórios. Usando o seletor compatível, quando disponível.",
        loading: "Carregando imagens...",
        loaded: "{count} imagem(ns) em {folder}",
        empty: "Nenhuma imagem compatível foi encontrada nessa pasta.",
        cancelled: "Seleção cancelada.",
        error: "Não foi possível ler a pasta escolhida.",
        help: "Ajuda",
        theme: "Tema",
        close: "Fechar",
        helpUsage: "Como usar",
        helpItems: [
          "<b>Escolher pasta</b> abre o seletor de pastas do navegador; nada é enviado para servidores.",
          "<b>Tamanho</b> ajusta a largura das miniaturas.",
          "<b>Grid</b> recorta as imagens em quadrados; <b>Masonry</b> mostra a proporção original.",
          "<b>Ordenar</b> por nome, tamanho ou data; a seta alterna crescente/decrescente.",
          "Clique em uma imagem para ampliá-la; clique fora ou pressione <b>Esc</b> para fechar. Use <b>Baixar</b> para salvar a imagem.",
          "Pressione <b>?</b> para abrir esta ajuda."
        ]
      },
      en: {
        title: "Local Gallery",
        statusIdle: "Choose a folder to view images, with no upload.",
        pickFolder: "Choose folder",
        download: "Download",
        size: "Size",
        layoutGrid: "Grid",
        layoutMasonry: "Masonry",
        sort: "Sort",
        sortName: "Name",
        sortSize: "Size",
        sortDate: "Date",
        ascending: "Ascending",
        descending: "Descending",
        welcomeTitle: "Your photos, straight from disk.",
        welcomeText: "This page reads only the folder you allow. Images stay on your computer and are shown locally in the browser.",
        unsupported: "This browser does not support the modern directory picker. Using the compatible picker when available.",
        loading: "Loading images...",
        loaded: "{count} image(s) in {folder}",
        empty: "No compatible images were found in this folder.",
        cancelled: "Selection cancelled.",
        error: "Could not read the selected folder.",
        help: "Help",
        theme: "Theme",
        close: "Close",
        helpUsage: "How to use",
        helpItems: [
          "<b>Choose folder</b> opens the browser folder picker; nothing is uploaded to any server.",
          "<b>Size</b> changes the thumbnail width.",
          "<b>Grid</b> crops images to squares; <b>Masonry</b> keeps the original aspect ratio.",
          "<b>Sort</b> by name, size or date; the arrow toggles ascending/descending.",
          "Click an image to enlarge it; click outside or press <b>Esc</b> to close. Use <b>Download</b> to save the image.",
          "Press <b>?</b> to open this help."
        ]
      },
      ja: {
        title: "ローカルギャラリー",
        statusIdle: "アップロードせず、フォルダを選んで画像を表示します。",
        pickFolder: "フォルダを選択",
        download: "ダウンロード",
        size: "サイズ",
        layoutGrid: "グリッド",
        layoutMasonry: "Masonry",
        sort: "並び替え",
        sortName: "名前",
        sortSize: "サイズ",
        sortDate: "日付",
        ascending: "昇順",
        descending: "降順",
        welcomeTitle: "写真をディスクから直接表示。",
        welcomeText: "許可したフォルダだけを読み取ります。画像はコンピューター上に残り、ブラウザ内でローカル表示されます。",
        unsupported: "このブラウザは新しいフォルダ選択に対応していません。利用可能な場合は互換ピッカーを使います。",
        loading: "画像を読み込み中...",
        loaded: "{count} 枚の画像: {folder}",
        empty: "このフォルダに対応画像が見つかりませんでした。",
        cancelled: "選択がキャンセルされました。",
        error: "選択したフォルダを読み取れませんでした。",
        help: "ヘルプ",
        theme: "テーマ",
        close: "閉じる",
        helpUsage: "使い方",
        helpItems: [
          "<b>フォルダを選択</b> でブラウザのフォルダ選択を開きます。サーバーには何も送信されません。",
          "<b>サイズ</b> でサムネイルの幅を変えます。",
          "<b>グリッド</b> は正方形に切り抜き、<b>Masonry</b> は元の縦横比で表示します。",
          "<b>並び替え</b> は名前・サイズ・日付。矢印で昇順/降順を切り替えます。",
          "画像をクリックすると拡大表示します。外側をクリックするか <b>Esc</b> で閉じます。<b>ダウンロード</b> で保存できます。",
          "<b>?</b> キーでこのヘルプを開きます。"
        ]
      }
    };

    const imageExtensions = /\.(avif|bmp|gif|heic|heif|jpeg|jpg|png|svg|webp)$/i;
    const state = {
      lang: localStorage.getItem("local-gallery-lang") || detectLanguage(),
      theme: localStorage.getItem("local-gallery-theme") || "dark",
      layout: localStorage.getItem("local-gallery-layout") || "grid",
      sortBy: localStorage.getItem("local-gallery-sort-by") || "name",
      sortDirection: localStorage.getItem("local-gallery-sort-direction") || "asc",
      files: [],
      folderName: "",
      urls: []
    };

    const root = document.documentElement;
    const statusEl = document.getElementById("status");
    const galleryEl = document.getElementById("gallery");
    const welcomeEl = document.getElementById("welcome");
    const emptyEl = document.getElementById("empty");
    const modalEl = document.getElementById("modal");
    const modalImg = document.getElementById("modalImg");
    const modalDownload = document.getElementById("modalDownload");
    const folderInput = document.getElementById("folderInput");
    const supportNotice = document.getElementById("supportNotice");
    const sortByEl = document.getElementById("sortBy");
    const sortDirectionBtn = document.getElementById("sortDirectionBtn");
    const langSwitcher = document.getElementById("lang-switcher");
    const helpDialog = document.getElementById("helpDialog");

    function renderHelp() {
      const items = translations[state.lang].helpItems || translations.pt.helpItems;
      document.getElementById("helpBody").innerHTML =
        `<p>${t("welcomeText")}</p><h3>${t("helpUsage")}</h3><ul>${items.map((item) => `<li>${item}</li>`).join("")}</ul>`;
    }

    function detectLanguage() {
      const lang = (navigator.language || "pt").toLowerCase();
      if (lang.startsWith("ja")) return "ja";
      if (lang.startsWith("en")) return "en";
      return "pt";
    }

    function t(key, values = {}) {
      let text = translations[state.lang][key] || translations.pt[key] || key;
      Object.entries(values).forEach(([name, value]) => {
        text = text.replace(`{${name}}`, value);
      });
      return text;
    }

    function applyLanguage() {
      root.lang = state.lang;
      document.querySelectorAll("[data-i18n]").forEach((el) => {
        el.textContent = t(el.dataset.i18n);
      });
      langSwitcher.value = state.lang;
      document.querySelectorAll("[data-layout]").forEach((button) => {
        button.classList.toggle("active", button.dataset.layout === state.layout);
      });
      updateSortDirectionButton();
      [["helpBtn", "help"], ["theme-switcher", "theme"], ["helpClose", "close"]].forEach(([id, key]) => {
        const el = document.getElementById(id);
        el.title = t(key);
        el.setAttribute("aria-label", t(key));
      });
      renderHelp();
      if (!("showDirectoryPicker" in window)) {
        supportNotice.textContent = t("unsupported");
      }
    }

    function applyTheme() {
      root.dataset.theme = state.theme;
      localStorage.setItem("local-gallery-theme", state.theme);
    }

    function applyLayout() {
      galleryEl.classList.toggle("masonry", state.layout === "masonry");
      document.querySelectorAll("[data-layout]").forEach((button) => {
        button.classList.toggle("active", button.dataset.layout === state.layout);
      });
      localStorage.setItem("local-gallery-layout", state.layout);
    }

    function setStatus(key, values) {
      statusEl.textContent = t(key, values);
    }

    function clearObjectUrls() {
      state.urls.forEach((url) => URL.revokeObjectURL(url));
      state.urls = [];
    }

    function resetGallery() {
      clearObjectUrls();
      galleryEl.innerHTML = "";
      galleryEl.classList.add("hidden");
      emptyEl.classList.add("hidden");
      welcomeEl.classList.add("hidden");
    }

    function compareFiles(a, b) {
      let result = 0;
      if (state.sortBy === "size") {
        result = a.size - b.size;
      } else if (state.sortBy === "date") {
        result = a.lastModified - b.lastModified;
      } else {
        result = a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: "base" });
      }

      if (result === 0) {
        result = a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: "base" });
      }

      return state.sortDirection === "asc" ? result : -result;
    }

    function sortedFiles(files) {
      return [...files].sort(compareFiles);
    }

    function updateSortDirectionButton() {
      const label = state.sortDirection === "asc" ? t("ascending") : t("descending");
      sortDirectionBtn.textContent = state.sortDirection === "asc" ? "↑" : "↓";
      sortDirectionBtn.setAttribute("aria-label", label);
      sortDirectionBtn.title = label;
    }

    async function pickFolder() {
      if ("showDirectoryPicker" in window) {
        try {
          setStatus("loading");
          const handle = await window.showDirectoryPicker({ mode: "read" });
          const files = await readDirectory(handle);
          loadFiles(files, handle.name);
        } catch (error) {
          if (error && error.name === "AbortError") {
            setStatus("cancelled");
          } else {
            console.error(error);
            setStatus("error");
          }
        }
        return;
      }

      folderInput.click();
    }

    async function readDirectory(dirHandle) {
      const files = [];
      for await (const entry of dirHandle.values()) {
        if (entry.kind !== "file" || !imageExtensions.test(entry.name)) continue;
        const file = await entry.getFile();
        if (file.type.startsWith("image/") || imageExtensions.test(file.name)) {
          files.push(file);
        }
      }
      return files;
    }

    function loadFiles(files, folderName) {
      state.files = files;
      state.folderName = folderName || "";
      renderFiles();
    }

    function renderFiles() {
      resetGallery();
      const files = sortedFiles(state.files);
      if (!files.length) {
        emptyEl.classList.remove("hidden");
        setStatus("loaded", { count: 0, folder: state.folderName });
        return;
      }

      const fragment = document.createDocumentFragment();
      files.forEach((file) => {
        const url = URL.createObjectURL(file);
        state.urls.push(url);
        const img = document.createElement("img");
        img.className = "photo";
        img.src = url;
        img.alt = file.name;
        img.title = file.name;
        img.loading = "lazy";
        img.decoding = "async";
        img.addEventListener("click", () => openModal(url, file.name));
        fragment.appendChild(img);
      });

      galleryEl.appendChild(fragment);
      galleryEl.classList.remove("hidden");
      setStatus("loaded", { count: files.length, folder: state.folderName });
    }

    function openModal(src, fileName) {
      modalImg.src = src;
      modalImg.alt = fileName;
      modalImg.title = fileName;
      modalDownload.href = src;
      modalDownload.download = fileName;
      modalDownload.title = fileName;
      modalEl.classList.add("open");
      modalEl.setAttribute("aria-hidden", "false");
    }

    function closeModal() {
      modalEl.classList.remove("open");
      modalEl.setAttribute("aria-hidden", "true");
      modalImg.removeAttribute("src");
      modalImg.removeAttribute("title");
      modalDownload.removeAttribute("href");
      modalDownload.removeAttribute("download");
      modalDownload.removeAttribute("title");
    }

    document.getElementById("pickBtn").addEventListener("click", pickFolder);
    document.getElementById("welcomePickBtn").addEventListener("click", pickFolder);
    document.getElementById("sizeRange").addEventListener("input", (event) => {
      root.style.setProperty("--tile", `${event.target.value}px`);
    });
    sortByEl.value = state.sortBy;
    sortByEl.addEventListener("change", (event) => {
      state.sortBy = event.target.value;
      localStorage.setItem("local-gallery-sort-by", state.sortBy);
      if (state.files.length) renderFiles();
    });
    sortDirectionBtn.addEventListener("click", () => {
      state.sortDirection = state.sortDirection === "asc" ? "desc" : "asc";
      localStorage.setItem("local-gallery-sort-direction", state.sortDirection);
      updateSortDirectionButton();
      if (state.files.length) renderFiles();
    });
    document.getElementById("theme-switcher").addEventListener("click", () => {
      state.theme = state.theme === "dark" ? "light" : "dark";
      applyTheme();
    });
    langSwitcher.addEventListener("change", () => {
      state.lang = langSwitcher.value;
      localStorage.setItem("local-gallery-lang", state.lang);
      applyLanguage();
    });
    document.getElementById("helpBtn").addEventListener("click", () => helpDialog.showModal());
    document.getElementById("helpClose").addEventListener("click", () => helpDialog.close());
    helpDialog.addEventListener("click", (event) => { if (event.target === helpDialog) helpDialog.close(); });
    document.querySelectorAll("[data-layout]").forEach((button) => {
      button.addEventListener("click", () => {
        state.layout = button.dataset.layout;
        applyLayout();
      });
    });
    folderInput.addEventListener("change", () => {
      const files = Array.from(folderInput.files || [])
        .filter((file) => file.type.startsWith("image/") || imageExtensions.test(file.name));
      const firstPath = files[0] && files[0].webkitRelativePath;
      const folderName = firstPath ? firstPath.split("/")[0] : "";
      loadFiles(files, folderName);
      folderInput.value = "";
    });
    modalEl.addEventListener("click", closeModal);
    modalDownload.addEventListener("click", (event) => event.stopPropagation());
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && modalEl.classList.contains("open")) closeModal();
      const tag = (document.activeElement && document.activeElement.tagName) || "";
      if (event.key === "?" && !helpDialog.open && !/INPUT|TEXTAREA|SELECT/.test(tag) && !(document.activeElement && document.activeElement.isContentEditable)) {
        event.preventDefault();
        helpDialog.showModal();
      }
    });
    window.addEventListener("beforeunload", clearObjectUrls);

    applyTheme();
    applyLayout();
    applyLanguage();
    if (!("showDirectoryPicker" in window)) {
      supportNotice.textContent = t("unsupported");
    }
  </script>
</body>
</html>
