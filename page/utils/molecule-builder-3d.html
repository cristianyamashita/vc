bindScene({down(e){const i=atomHit(e);if(i<0)return false;const point=modelGroup.localToWorld(atoms[i].p.clone()),normal=camera.getWorldDirection(new THREE.Vector3());if(!e.shiftKey)atomGrab={index:i,target:atoms[i].p.clone()};runAction(()=>{});return{index:i,bond:e.shiftKey,point,normal,offset:point.clone().sub(pointerPlane(e,point,normal))}},drag(e,g){if(!g.saved){remember();g.saved=true}if(g.bond){const j=atomHit(e),end=j>=0?modelGroup.localToWorld(atoms[j].p.clone()):pointerPlane(e,g.point,g.normal);if(end)updateLine(bondPreview,[modelGroup.localToWorld(atoms[g.index].p.clone()),end])}else{const p=pointerPlane(e,g.point,g.normal);if(p)atomGrab.target.copy(modelGroup.worldToLocal(p.add(g.offset)));labelAt(e,'pull')}},up(e,g){atomGrab=null;bondPreview.visible=false;if(g.bond){const j=atomHit(e);if(j>=0&&j!==g.index){selected=[g.index,j];connect()}}else if(!g.moved){if(selected.includes(g.index))selected=selected.filter(i=>i!==g.index);else{if(selected.length===2)selected.shift();selected.push(g.index)}}else selected=[g.index];refresh()},cancel(){atomGrab=null;bondPreview.visible=false},hover(e){labelAt(e,atomHit(e)>=0?(e.shiftKey?'link':'pull'):'addHint')}});

wrapStep(h=>{if(atomGrab){const a=atoms[atomGrab.index];if(a){const force=atomGrab.target.clone().sub(a.p).multiplyScalar(95).addScaledVector(a.v,-8);a.v.addScaledVector(force,h/Math.sqrt(elements[a.element].mass));if(a.v.length()>12)a.v.setLength(12)}}cameraKeys(h)});
wrapDraw(()=>{for(const a of atoms)if(!a.m.userData.symbol){const c=document.createElement('canvas');c.width=c.height=64;const ctx=c.getContext('2d');ctx.fillStyle='#10242b';ctx.beginPath();ctx.arc(32,32,25,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f5ffff';ctx.font='bold 34px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(a.element,32,34);const texture=new THREE.CanvasTexture(c);texture.colorSpace=THREE.SRGBColorSpace;const sprite=new THREE.Sprite(new THREE.SpriteMaterial({map:texture,depthTest:false}));sprite.position.y=elements[a.element].r+.23;sprite.scale.set(.35,.35,1);sprite.renderOrder=15;a.m.add(sprite);a.m.userData.symbol=true}});

const STEP=1/120;let accumulator=0,last=performance.now(),tick=0;
function advance(n=1){for(let i=0;i<n;i++){app.step?.(STEP);tick++}app.draw?.(0);return app.inspect?.()??{tick}}
window.lab={key:KEY,app,scene,camera,renderer,orbit,advance,pause,save,exportJSON,get state(){return app.inspect?.()??{}},get messages(){return messages}};
