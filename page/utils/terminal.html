    * { box-sizing: border-box; }

    button, textarea, select, input { font: inherit; color: inherit; }

      grid-template-columns: minmax(0, 1fr) 280px;
      transition: grid-template-columns .22s cubic-bezier(.22, 1, .36, 1);
    }
    html[data-side="closed"] .shell { grid-template-columns: minmax(0, 1fr) 0; }
    .term-wrap { position: relative; min-width: 0; min-height: 0; height: 100%; overflow: hidden; }
    .term {
      height: 100%;
      min-height: 0;
      overflow: auto;
      padding: 16px 18px 28px;
      font: 13.5px/1.5 "IBM Plex Mono", ui-monospace, monospace;
      background: var(--panel);
      cursor: text;
      user-select: text;
      -webkit-user-select: text;

    .term .line { white-space: pre-wrap; overflow-wrap: anywhere; }
    .term .err { color: var(--red); }
    .term .dim { color: var(--muted); }
    .term .gold { color: var(--gold); }
    .term .prompt-line { display: flex; gap: 8px; align-items: flex-start; }
    .ps1 { color: var(--accent); font-weight: 600; white-space: nowrap; }
    #cmd {
      flex: 1;
      min-width: 0;
      border: 0;
      outline: 0;
      resize: none;
      background: transparent;
      padding: 0;
      margin: 0;
      line-height: 1.5;
      font: inherit;
      color: var(--ink);
      overflow: hidden;
    }
    .hint { color: var(--muted); pointer-events: none; }
    .side {
      min-width: 0;
      border-left: 1px solid var(--line);
      background: color-mix(in srgb, var(--bg) 55%, var(--panel));
      overflow: hidden;
    }
    html[data-side="closed"] .side {
      background: transparent;
      border-left-color: transparent;
    }
    .side-body {
      width: 280px;
      height: 100%;
      overflow: auto;
      padding: 16px;
    }
    .side-toggle {
      position: absolute;
      top: 8px;
      right: 4px;
      z-index: 3;
      width: 18px;
      height: 26px;
      padding: 0;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      opacity: .4;
      display: grid;
      place-items: center;
      transition: opacity .15s ease, color .15s ease, background .15s ease;
    }
    html[data-side="closed"] .side-toggle { right: 6px; opacity: .55; }
    .side-toggle:hover,
    .side-toggle:focus-visible {
      opacity: 1;
      color: var(--accent);
      background: color-mix(in srgb, var(--panel) 82%, transparent);
      outline: 0;
    }
    .side-toggle svg {
      width: 11px;
      height: 11px;

      stroke: currentColor;
      stroke-width: 1.55;
      stroke-linecap: round;
      stroke-linejoin: round;

      color: var(--muted);

      border-radius: 8px;

    .cheat span { color: var(--muted); font-size: 11px; }
    .overlay {

    .cursor {

      background: var(--cursor);
      color: var(--accent-ink);
    }

    .status {

      padding: 4px 12px;

      color: var(--accent-ink);
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-weight: 600;
    }
    .status.cmd { background: var(--ink); color: var(--bg); }
    .ime {
      position: absolute;
      opacity: 0;
      pointer-events: none;
      width: 8px;
      height: 18px;
      border: 0;
      padding: 0;
    }
    .pager-body {

    }
    .nano-body {
      flex: 1; display: flex; flex-direction: column;

    }

function isOsHosted() {
  try {
    return !!(window.parent && window.parent !== window && window.parent.OSFS);
  } catch (_err) {
    return false;
  }
}

function applyHostGlass() {
  try {
    if (!window.parent || window.parent === window || !window.parent.document) return;
    const src = window.parent.document.documentElement;
    const styles = window.parent.getComputedStyle(src);
    const pct = (src.style.getPropertyValue("--glass-pct") || styles.getPropertyValue("--glass-pct") || "100%").trim();
    const blur = (src.style.getPropertyValue("--glass-blur") || styles.getPropertyValue("--glass-blur") || "0px").trim();
    document.documentElement.style.setProperty("--glass-pct", pct);
    document.documentElement.style.setProperty("--glass-blur", blur);
    document.documentElement.style.background = "transparent";
    document.documentElement.dataset.glass = src.dataset.glass || "";
    const os = window.parent.OS;
    if (os) {
      if (os.theme) document.documentElement.dataset.theme = os.theme === "light" ? "light" : "dark";
      if (os.lang && I[os.lang] && os.lang !== lang) {
        lang = os.lang;
        applyChrome();
      }
    }
  } catch (_err) {}
}

window.addEventListener("message", (e) => {
  if (e.origin !== location.origin || !e.data || e.data.type !== "os-host-sync") return;
  applyHostGlass();
});

}
function modeStr(node) {
  const m = node.mode ?? (node.type === "dir" ? 0o755 : 0o644);
  const tch = node.type === "dir" ? "d" : node.type === "link" ? "l" : "-";
  const bits = (n) => ((n & 4) ? "r" : "-") + ((n & 2) ? "w" : "-") + ((n & 1) ? "x" : "-");
  return tch + bits((m >> 6) & 7) + bits((m >> 3) & 7) + bits(m & 7);
}

function createLocalFs() {
  const ROOT_ID = "root";
  const HOME_DIR_ID = "home";
  const USER_DIR_ID = "home-user";
  const TMP_ID = "tmp";
  const BIN_ID = "bin";
  const nodes = new Map();
  const TEXT_EXTS = ["txt", "md", "json", "js", "css", "html", "htm", "xml", "tsv", "log", "ini", "yaml", "yml", "py", "ts", "tsx", "jsx", "sh", "sql"];
  let db = null;

  function nid() {
    return "n_" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
  }
  function extOf(name) {
    const text = String(name || "");
    const i = text.lastIndexOf(".");
    return i > 0 ? text.slice(i + 1).toLowerCase() : "";

  function folder(id, parentId, name, system) {
    const tnow = now();
    return { id, parentId, name, kind: "folder", mime: "", size: 0, createdAt: tnow, modifiedAt: tnow, system: !!system, content: "", encoding: "utf8" };
  }
  function seed() {
    nodes.clear();
    nodes.set(ROOT_ID, folder(ROOT_ID, null, "/", true));
    nodes.set(HOME_DIR_ID, folder(HOME_DIR_ID, ROOT_ID, "home", true));
    nodes.set(USER_DIR_ID, folder(USER_DIR_ID, HOME_DIR_ID, "user", true));
    nodes.set(BIN_ID, folder(BIN_ID, ROOT_ID, "bin", true));
    nodes.set(TMP_ID, folder(TMP_ID, ROOT_ID, "tmp", false));
    const tnow = now();
    nodes.set("readme", {
      id: "readme",
      parentId: USER_DIR_ID,
      name: "notes.txt",
      kind: "file",
      mime: "text/plain",
      size: 0,
      createdAt: tnow,
      modifiedAt: tnow,
      system: false,
      encoding: "utf8",

  function txDone(tx) {

      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
      tx.onabort = () => reject(tx.error || new Error("aborted"));
    });
  }
  async function persistNodes() {
    if (!db) return;
    const tx = db.transaction(["nodes", "meta"], "readwrite");
    tx.objectStore("nodes").clear();
    const store = tx.objectStore("nodes");
    for (const node of nodes.values()) store.put(node, node.id);
    tx.objectStore("meta").put({ savedAt: now() }, "info");

    return new Promise((resolve, reject) => {

    db = await openDb();

    const store = tx.objectStore("nodes");
    const rows = await new Promise((resolve, reject) => {
      const req = store.getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => reject(req.error);
    });
    await txDone(tx);
    nodes.clear();
    rows.forEach((node) => { if (node && node.id) nodes.set(node.id, node); });

  async function blobToRecord(blob, mime) {

const INTERACTIVE = new Set(["vim", "vi", "nano", "less", "more"]);

async function runStage(argv, stdin, { live = false } = {}) {
  if (!argv.length) return ok(stdin || "");
  const local = argv.slice();
  while (local.length && /^[A-Za-z_][A-Za-z0-9_]*=/.test(local[0])) {
    const a = local.shift();
    const eq = a.indexOf("=");
    env[a.slice(0, eq)] = a.slice(eq + 1);
  }
  if (!local.length) return ok();
  let name = local[0];
  let args = local.slice(1);
  if (aliases[name] && !COMMANDS[name]) {
    const expanded = tokenize(expandVars(aliases[name])).filter((x) => x.kind === "word").map((x) => x.raw);
    name = expanded[0];
    args = expanded.slice(1).concat(args);
  }
  const prevLive = stageLive;
  stageLive = live;
  try {
    if (name.includes("/") || name.startsWith(".")) {
      const p = normalize(name);
      const n = await getNode(p);
      if (n && n.type === "file") return runScript(await readFile(p), { live });
      return err(`${name}: No such file or directory`, 127);
    }
    const fn = COMMANDS[name];
    if (fn) {
      const result = await fn(args, stdin || "");
      return result || ok();
    }
    const script = await lookupPathScript(name);
    if (script) return runScript(await readFile(script), { live });
    return err(`${name}: command not found`, 127);
  } finally {
    stageLive = prevLive;
  }
}

function splitStages(tokens) {
  const jobs = [];
  let cur = { stages: [[]], op: null };
  const pushWord = (w) => cur.stages[cur.stages.length - 1].push(w);
  for (let i = 0; i < tokens.length; i++) {
    const tok = tokens[i];
    if (tok.kind === "op" && tok.raw === "|") { cur.stages.push([]); continue; }
    if (tok.kind === "op") {
      jobs.push(cur);
      cur = { stages: [[]], op: tok.raw };
      continue;
    }
    if (tok.kind === "redir") {
      const next = tokens[++i];
      if (!next || next.kind !== "word") continue;
      const stage = cur.stages[cur.stages.length - 1];
      stage.redir = stage.redir || {};
      const target = next.raw;
      if (tok.type === ">") stage.redir.out = { path: target, append: false };
      if (tok.type === ">>") stage.redir.out = { path: target, append: true };
      if (tok.type === "2>" || tok.type === "2>>") stage.redir.err = { path: target, append: tok.type === "2>>" };
      if (tok.type === "<") stage.redir.inn = target;
      continue;
    }
    pushWord(tok);
  }
  jobs.push(cur);
  return jobs;
}

async function expandWords(toks) {
  const words = [];
  for (const tok of toks) {
    if (!tok || tok.kind !== "word") continue;
    const expanded = tok.expand === false ? tok.raw : expandVars(tok.raw);
    const braced = tok.globok ? expandBraceWord(expanded) : [expanded];
    for (const b of braced) {
      const parts = tok.globok ? await expandGlob(b) : [b];
      words.push(...parts);
    }
  }
  return words;
}

async function runPipeline(stages, { live = false } = {}) {
  let stdin = "";
  let last = ok();
  for (let s = 0; s < stages.length; s++) {
    if (abortRun) return err("", 130);
    const stage = stages[s];
    const words = await expandWords(stage);
    const redir = stage.redir;
    if (redir?.inn) {
      try { stdin = await readFile(normalize(redir.inn)); }
      catch (e) { return err(e.message); }
    }
    const stream = live && stages.length === 1 && !redir?.out;
    if (words[0] && INTERACTIVE.has(words[0]) && s === stages.length - 1 && !redir?.out) {
      last = await runInteractive(words, stdin);
    } else {
      last = await runStage(words, stdin, { live: stream });
    }
    if (redir?.out) {
      try { await writeFile(normalize(redir.out.path), last.stdout || "", { append: redir.out.append }); last.stdout = ""; }
      catch (e) { last = err(e.message); }
    }
    if (redir?.err && last.stderr) {
      try { await writeFile(normalize(redir.err.path), last.stderr, { append: redir.err.append }); last.stderr = ""; }
      catch (e) { last = err(e.message); }
    }
    stdin = last.stdout || "";
  }
  return last;
}

const COMPOUND = new Set(["for", "while", "until", "if"]);

function skipSeps(toks, pos) {

}

}

}

}

  if (w === "while" || w === "until") return parseWhile(toks, pos);
  if (w === "if") return parseIf(toks, pos);
  const tokens = [];
  while (pos.i < toks.length) {
    const t = toks[pos.i];
    if (t.kind === "op" && t.raw === ";") break;
    if (t.kind === "word" && stop.has(t.raw) && isCmdStart(tokens)) break;
    if (t.kind === "word" && COMPOUND.has(t.raw) && isCmdStart(tokens) && tokens.length) break;

  const elifs = [];
  while (peekWord(toks, pos) === "elif") {
    pos.i++;
    const c = parseStmts(toks, pos, new Set(["then"]));
    expectWord(toks, pos, "then");
    const b = parseStmts(toks, pos, new Set(["elif", "else", "fi"]));

  }

async function runJobs(tokens, { live = false } = {}) {
  const jobs = splitStages(tokens);
  let last = ok();
  for (const job of jobs) {
    if (abortRun) return err("", 130);
    if (job.op === "&&" && last.code) continue;
    if (job.op === "||" && !last.code) continue;
    const stream = live && job.stages.length === 1 && !job.stages[0]?.redir?.out;
    last = await runPipeline(job.stages, { live: stream });

async function runStmt(stmt, live) {
  if (abortRun) return err("", 130);
  if (stmt.type === "for") {
    const items = await expandWords(stmt.words);
    let last = ok();
    let stdout = "";
    let stderr = "";
    let n = 0;
    for (const item of items) {
      if (abortRun) return { stdout, stderr, code: 130, printed: !!live };
      if (++n > 10000) return err("for: too many iterations");
      env[stmt.name] = item;
      last = await runStmts(stmt.body, live);
      stdout += last.stdout || "";
      stderr += last.stderr || "";
    }
    return { stdout, stderr, code: last.code, printed: !!live };
  }
  if (stmt.type === "while") {
    let last = ok();
    let stdout = "";
    let stderr = "";
    for (let n = 0; n < 10000; n++) {
      if (abortRun) return { stdout, stderr, code: 130, printed: !!live };
      const cond = await runStmts(stmt.cond, false);
      if (stmt.until ? !cond.code : cond.code) break;
      last = await runStmts(stmt.body, live);
      stdout += last.stdout || "";
      stderr += last.stderr || "";
    }
    return { stdout, stderr, code: last.code, printed: !!live };
  }
  if (stmt.type === "if") {
    let last = await runStmts(stmt.cond, false);
    if (!last.code) return runStmts(stmt.then, live);
    for (const br of stmt.elifs) {
      last = await runStmts(br.cond, false);
      if (!last.code) return runStmts(br.body, live);
    }
    if (stmt.else) return runStmts(stmt.else, live);
    return ok();
  }
  return runJobs(stmt.tokens, { live });
}

async function runStmts(stmts, live) {
  let last = ok();
  let stdout = "";
  let stderr = "";
  for (const st of stmts) {
    if (abortRun) return { stdout, stderr, code: 130, printed: !!live };
    last = await runStmt(st, live);
    stdout += last.stdout || "";
    stderr += last.stderr || "";
  }
  return { stdout, stderr, code: last.code, printed: !!(live || last.printed) };
}

async function runSource(src, { live = false } = {}) {
  const toks = tokenize(src);
  const pos = { i: 0 };
  let stmts;
  try {
    stmts = parseStmts(toks, pos, new Set());
    skipSeps(toks, pos);
    if (pos.i < toks.length) {
      const t = toks[pos.i];
      return err(`syntax error near unexpected token \`${t.raw || t.type}\``);
    }
  } catch (e) {
    return err(e.message || String(e));
  }
  const res = await runStmts(stmts, live);
  if (abortRun) {
    if (live) appendLine("^C", "err");
    lastExit = 130;
    env["?"] = "130";
    return { stdout: res.stdout, stderr: live ? "" : "^C\n", code: 130, printed: !!live };
  }
  lastExit = res.code;
  env["?"] = String(lastExit);
  scheduleSave();
  return res;
}

async function execLine(line, { record = true, live = true } = {}) {
  const trimmed = line.trim();
  if (!trimmed) return ok();
  if (record) history.push(line);
  abortRun = false;
  return runSource(line, { live });
}

async function runScript(content, { live = false } = {}) {

}

async function complete() {

  const pathNames = start === 0 ? await pathCommandNames() : [];

  let pool = names.filter((n) => n.startsWith(prefix));
  if (prefix.includes("/") || prefix.startsWith("~") || prefix.startsWith(".")) {
    const abs = normalize(prefix);
    const dir = prefix.endsWith("/") ? abs : dirName(abs);
    const base = prefix.endsWith("/") ? "" : baseName(abs);
    const kids = await children(dir);
    pool = [];

      const n = baseName(kid);
      if (!n.startsWith(base)) continue;
      const typedDir = prefix.endsWith("/") ? prefix : prefix.slice(0, prefix.length - base.length);
      pool.push(typedDir + n + ((await isDir(kid)) ? "/" : ""));

  }
  if (!pool.length) return;
  if (completeState && completeState.prefix === prefix) {
    completeState.i = (completeState.i + 1) % pool.length;

  try {
    const res = await execLine(line);
    printResult(res);
  } catch (err2) {
    appendLine(String(err2.message || err2), "err");
  }
  busy = false;
  updatePs1();
  autosize();
  if (!hasTermSelection()) {
    $("#cmd").focus();
    scrollTermToEnd();
  }
});
$("#cmd").addEventListener("input", () => { completeState = null; autosize(); });
$("#cmd").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    if (!busy) $("#prompt-form").requestSubmit();
    return;
  }
  if (e.key === "Tab") { e.preventDefault(); complete().catch(() => {}); }
  if (e.key === "l" && e.ctrlKey) { e.preventDefault(); $("#out").innerHTML = ""; }
  if (e.key === "u" && e.ctrlKey) { e.preventDefault(); $("#cmd").value = ""; }
  if (e.key === "ArrowUp") {
    e.preventDefault();
    if (histIdx === -1) histDraft = $("#cmd").value;
    if (!history.length) return;
    histIdx = histIdx === -1 ? history.length - 1 : Math.max(0, histIdx - 1);
    $("#cmd").value = history[histIdx];
    autosize();
  }
  if (e.key === "ArrowDown") {
    e.preventDefault();
    if (histIdx === -1) return;
    histIdx++;
    if (histIdx >= history.length) { histIdx = -1; $("#cmd").value = histDraft; }
    else $("#cmd").value = history[histIdx];
    autosize();
  }
});
$("#term").addEventListener("mousedown", (e) => {
  termMouseDown = { x: e.clientX, y: e.clientY };
});
$("#term").addEventListener("click", (e) => {
  if (vim || $("#nano").classList.contains("open") || $("#pager").classList.contains("open")) return;
  if (e.target.closest("#cmd")) return;
  if (hasTermSelection()) return;
  if (termMouseDown && (Math.abs(e.clientX - termMouseDown.x) > 3 || Math.abs(e.clientY - termMouseDown.y) > 3)) return;
  $("#cmd").focus();
});
$("#cheat").addEventListener("click", (e) => {
  const b = e.target.closest("[data-cmd]");
  if (!b) return;
  $("#cmd").value = b.dataset.cmd;
  $("#cmd").focus();
});
$("#side-toggle").addEventListener("click", (e) => {
  e.preventDefault();
  const next = document.documentElement.dataset.side === "closed" ? "open" : "closed";
  document.documentElement.dataset.side = next;
  try { localStorage.setItem("term-side", next); } catch (_err) {}
  applySide();
  $("#cmd").focus();
});
function hasTermSelection() {
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed || !sel.toString()) return false;
  const cmd = $("#cmd");
  if (cmd && sel.anchorNode && cmd.contains(sel.anchorNode) && (!sel.focusNode || cmd.contains(sel.focusNode))) {
    return cmd.selectionStart !== cmd.selectionEnd;
  }
  const term = $("#term");
  return !!(term && sel.anchorNode && term.contains(sel.anchorNode));
}
function cmdHasSelection() {
  const cmd = $("#cmd");
  return !!(cmd && cmd.selectionStart !== cmd.selectionEnd);
}
function handleCopyOrIntr(e) {
  if (e.key.toLowerCase() !== "c") return;
  if (e.metaKey && !e.ctrlKey) return;
  if (!e.ctrlKey) return;
  if (vim || $("#nano").classList.contains("open") || $("#pager").classList.contains("open")) return;
  if (hasTermSelection() || cmdHasSelection()) return;
  e.preventDefault();
  if (busy) abortRun = true;
  else $("#cmd").value = "";
}

function handleClearChord(e) {
  if (vim || $("#nano").classList.contains("open") || $("#pager").classList.contains("open")) {
    keyChord = null;
    return false;
  }
  const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (keyChord === "cmdk") {
    keyChord = null;
    clearTimeout(keyChordTimer);
    if (key === "k" && !e.altKey && !e.shiftKey) {
      e.preventDefault();
      e.stopPropagation();
      $("#out").innerHTML = "";
      return true;
    }
    return false;
  }
  if (e.metaKey && key === "k" && !e.ctrlKey && !e.altKey && !e.shiftKey) {
    e.preventDefault();
    keyChord = "cmdk";
    clearTimeout(keyChordTimer);
    keyChordTimer = setTimeout(() => { keyChord = null; }, 1000);
    return true;
  }
  return false;
}

document.addEventListener("keydown", (e) => {
  if (handleClearChord(e)) e.stopPropagation();
}, true);

document.addEventListener("keydown", (e) => {
  handleCopyOrIntr(e);
  if (vim) { vimHandle(e); return; }
  if ($("#pager").classList.contains("open")) {
    if (e.key === "q" || e.key === "Escape") { e.preventDefault(); closePager(); }
    if (e.key === "j" || e.key === "ArrowDown") $("#pager-body").scrollTop += 24;
    if (e.key === "k" || e.key === "ArrowUp") $("#pager-body").scrollTop -= 24;
    if (e.key === " ") { e.preventDefault(); $("#pager-body").scrollTop += 200; }
    return;
  }
  if ($("#nano").classList.contains("open")) {
    if (e.ctrlKey && e.key.toLowerCase() === "x") { e.preventDefault(); closeNano(); }
    if (e.ctrlKey && e.key.toLowerCase() === "o") { e.preventDefault(); nanoSave(); }
    if (e.ctrlKey && e.key.toLowerCase() === "k") {
      e.preventDefault();
      const ta = $("#nano-text");
      const v = ta.value;
      const start = v.lastIndexOf("\n", ta.selectionStart - 1) + 1;
      const end = v.indexOf("\n", ta.selectionStart);
      const cutEnd = end < 0 ? v.length : end + 1;
      ta.value = v.slice(0, start) + v.slice(cutEnd);
    }
  }
});
$("#vim-ime").addEventListener("input", (e) => {
  if (!vim || vim.mode !== "i") { e.target.value = ""; return; }
  if (e.isComposing) return;
  const v = e.target.value;
  if (v) { vimInsert(v); e.target.value = ""; renderVim(); }
});
window.addEventListener("resize", () => { if (vim) renderVim(); });

boot();
</script>
