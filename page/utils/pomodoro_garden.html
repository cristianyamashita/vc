</style></head><body><header class="top"><div class="brand"><div class="logo">♧</div><div><h1>Pomodoro Garden</h1><small data-i18n="subtitle">Focus grows here</small></div></div><div class="actions"><button class="btn" id="sound">♪ <span class="action-label" data-i18n="sound">Sound</span></button><button class="btn danger" id="clear-garden" data-i18n="clearGarden">Clear garden</button><select id="lang" class="lang"><option value="en">EN</option><option value="pt">PT</option><option value="ja">JA</option></select><button class="btn icon" id="theme" aria-label="Theme">◐</button></div></header>

function totalSeconds(mode=S.mode){return(S[mode]||S.focus)*60}function save(){localStorage.setItem(KEY,JSON.stringify(S))}function dateKey(d=new Date()){return d.toLocaleDateString('sv-SE')}
