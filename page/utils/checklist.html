<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <link rel="icon" href="../assets/icons/ico/utils-checklist.ico" type="image/x-icon">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checklist Manager</title>
  <link rel="stylesheet" href="../assets/fontawesome/css/all.min.css">
  <style>
    :root {
      --bg: #111615; --panel: #1a2120; --panel-2: #212a29; --border: #2e3a38;
      --text: #e8efee; --muted: #8a9a97; --accent: #1fb5a0; --accent-strong: #008f7d;
      --accent-soft: rgba(31, 181, 160, .12); --neg: #e07a6a; --ok: #3fb950;
      --badge-daily: #2f7ae5; --badge-monthly: #7d55c7; --badge-activity: #008f7d;
      --done-opacity: .45;
    }
    html[data-theme="light"] {
      --bg: #f3f6f5; --panel: #ffffff; --panel-2: #f5f8f7; --border: #d7e0de;
      --text: #172120; --muted: #62716e; --accent: #008f7d; --accent-strong: #006056;
      --accent-soft: rgba(0, 143, 125, .09); --neg: #c0392b; --ok: #1a7f37;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif; overflow: hidden; }
    button, input, select, textarea { font: inherit; color: inherit; }
    [hidden] { display: none !important; }
    .app { display: grid; grid-template-rows: auto 1fr; height: 100%; }

    /* Top bar */
    .topbar { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 8px 0 12px; background: var(--panel); border-bottom: 1px solid var(--border); min-width: 0; }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; white-space: nowrap; }
    .brand img { width: 18px; height: 18px; }
    .tabs { display: flex; gap: 2px; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 9px; border: 0; border-radius: 6px; background: none; color: var(--muted); font-size: 13px; white-space: nowrap; cursor: pointer; }
    .tab:hover { background: var(--panel-2); color: var(--text); }
    .tab[aria-selected="true"] { background: var(--accent-strong); color: #fff; }
    .tools { display: flex; align-items: center; gap: 6px; margin-left: auto; }
    .icon-btn { display: grid; place-items: center; width: 30px; height: 30px; padding: 0; border: 1px solid var(--border); border-radius: 6px; background: var(--panel-2); cursor: pointer; }
    .icon-btn:hover { border-color: var(--accent); color: var(--accent); }
    select { height: 30px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel-2); padding: 0 6px; font-size: 13px; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

    /* Layout */
    main { min-height: 0; overflow: auto; }
    .panel { max-width: 780px; margin: 0 auto; padding: 12px 14px 16px; display: flex; flex-direction: column; gap: 10px; }
    .toolbar { display: flex; align-items: center; gap: 8px; min-height: 32px; }
    .toolbar h2 { margin: 0; font-size: 14px; font-weight: 600; }
    .spacer { flex: 1; }
    .muted { color: var(--muted); }
    .small { font-size: 12px; }
    input[type="text"], textarea { min-width: 0; padding: 0 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel-2); color: var(--text); }
    input[type="text"] { height: 32px; }
    textarea { padding: 6px 8px; resize: vertical; width: 100%; }
    input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); }
    input[type="checkbox"] { width: 16px; height: 16px; margin: 0; accent-color: var(--accent-strong); flex-shrink: 0; cursor: pointer; }
    label.field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
    label.field input, label.field select { color: var(--text); font-size: 14px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel-2); cursor: pointer; white-space: nowrap; }
    .btn:hover:not(:disabled) { border-color: var(--accent); }
    .btn.primary { background: var(--accent-strong); border-color: var(--accent-strong); color: #fff; }
    .btn.danger { color: var(--neg); }
    .btn.danger:hover { border-color: var(--neg); }
    .btn.sm { height: 28px; padding: 0 8px; font-size: 12px; }
    .btn.sq { width: 30px; padding: 0; }
    .ibtn { background: none; border: 0; color: var(--muted); cursor: pointer; padding: 4px 6px; border-radius: 5px; font-size: 12px; line-height: 1.3; }
    .ibtn:hover:not(:disabled) { color: var(--text); background: var(--panel-2); }
    .ibtn:disabled { opacity: .3; cursor: default; }
    .ibtn.active { color: var(--accent); }
    .ibtn.danger:hover:not(:disabled) { color: var(--neg); }
    .badge { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 11px; font-weight: 600; color: #fff; }
    .bg-daily { background: var(--badge-daily); }
    .bg-monthly { background: var(--badge-monthly); }
    .bg-activity { background: var(--badge-activity); }
    .empty { text-align: center; color: var(--muted); padding: 32px 12px; }
    .empty i { display: block; font-size: 28px; opacity: .4; margin-bottom: 8px; }
    .list { display: flex; flex-direction: column; gap: 6px; }

    /* Template cards */
    .card-row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; }
    .card-row.click { cursor: pointer; }
    .card-row.click:hover { border-color: var(--accent); }
    .card-info { flex: 1; min-width: 0; }
    .card-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-meta { color: var(--muted); font-size: 12px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .progress-mini { height: 4px; border-radius: 3px; background: var(--panel-2); margin-top: 5px; overflow: hidden; }
    .progress-mini > div { height: 100%; background: var(--accent); }

    /* Editor */
    .editor-grid { display: grid; grid-template-columns: 1fr 180px; gap: 10px; }
    .editor-item { display: flex; align-items: center; gap: 4px; padding: 4px 6px 4px 8px; background: var(--panel); border: 1px solid var(--border); border-radius: 6px; }
    .editor-item-label { flex: 1; word-break: break-word; }
    .indent-mark { display: inline-block; width: 10px; height: 10px; margin-right: 3px; border-left: 2px solid var(--border); border-bottom: 2px solid var(--border); border-radius: 0 0 0 3px; }
    .add-row { display: flex; gap: 8px; }
    .add-row input { flex: 1; }

    /* Run */
    .run-name-input { flex: 1; max-width: 420px; font-weight: 600; }
    .progress-badge { color: var(--muted); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .run-item-row { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: var(--panel); border: 1px solid var(--border); border-radius: 6px; }
    .run-item-row:hover { background: var(--panel-2); }
    .run-item-label { flex: 1; user-select: none; cursor: pointer; }
    .run-item-label.done { text-decoration: line-through; opacity: var(--done-opacity); }
    .checked-at { font-size: 11px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
    .note-collapse { display: none; padding: 4px 0 0 34px; }
    .note-collapse.open { display: block; }
    .note-collapse textarea { font-size: 13px; }

    /* Quick list */
    .q-item { display: flex; align-items: center; gap: 8px; padding: 5px 6px 5px 10px; min-height: 36px; background: var(--panel); border: 1px solid var(--border); border-radius: 6px; }
    .q-item .q-text { flex: 1; min-width: 0; word-break: break-word; }
    .q-item input[type="text"] { flex: 1; height: 26px; }
    .q-item.completed .q-text { text-decoration: line-through; opacity: .6; }
    .q-actions { display: flex; gap: 2px; flex-shrink: 0; }
    details.done-box { border: 1px solid var(--border); border-radius: 8px; background: var(--panel); }
    details.done-box > summary { display: flex; align-items: center; gap: 8px; padding: 6px 10px; cursor: pointer; font-size: 13px; font-weight: 600; list-style: none; user-select: none; }
    details.done-box > summary::-webkit-details-marker { display: none; }
    details.done-box > summary i { font-size: 11px; color: var(--muted); transition: transform .15s; }
    details.done-box[open] > summary i { transform: rotate(90deg); }
    details.done-box .list { padding: 0 8px 8px; }
    details.done-box .q-item { background: var(--panel-2); }
    .count { color: var(--muted); font-weight: 400; font-size: 12px; }

    /* Dialogs */
    dialog { width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 32px); padding: 0; border: 1px solid var(--border); border-radius: 10px; background: var(--panel); color: var(--text); }
    dialog.sm { width: min(400px, calc(100vw - 32px)); }
    dialog::backdrop { background: rgb(0 0 0 / 45%); }
    .dlg-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-bottom: 1px solid var(--border); font-weight: 600; }
    .dlg-body { padding: 12px 14px 14px; overflow: auto; }
    .dlg-body h3 { margin: 12px 0 6px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
    .dlg-body p { margin: 0 0 8px; }
    .dlg-body ul { margin: 0; padding-left: 18px; }
    .dlg-body li { margin: 3px 0; }
    .dlg-body li.active b { color: var(--accent); }
    .dlg-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--border); }

    @media (max-width: 860px) { .brand span { display: none; } }
    @media (max-width: 720px) {
      .tab span { display: none; }
      .editor-grid { grid-template-columns: 1fr; }
    }
  </style>

<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><img src="../assets/icons/svg/utils-checklist.svg" alt=""><span data-i18n="title">Checklist Manager</span></div>
      <nav class="tabs" id="tabs" role="tablist"></nav>
      <div class="tools">
        <button class="icon-btn" id="help-btn" type="button" data-i18n-title="help"><i class="fa-solid fa-circle-question"></i></button>
        <select id="lang-switcher" aria-label="Language">
          <option value="en">EN</option>
          <option value="pt">PT</option>
          <option value="ja">JA</option>
        </select>
        <button class="icon-btn" id="theme-switcher" type="button" data-i18n-title="theme"><i class="fa-solid fa-sun"></i></button>
      </div>
    </header>

    <main id="main">
      <!-- VIEW: Templates list (#templates) -->
      <section class="panel" id="view-templates" hidden>
        <div class="toolbar">
          <h2 data-i18n="myChecklists">My Checklists</h2>
          <span class="spacer"></span>
          <button class="btn primary sm" id="btn-new-template" type="button"><i class="fa-solid fa-plus"></i><span data-i18n="newChecklist">New Checklist</span></button>
        </div>
        <div id="templates-list" class="list"></div>
        <div id="templates-empty" class="empty" hidden>
          <i class="fa-solid fa-clipboard-list"></i>
          <span data-i18n="noChecklists">No checklists yet. Create one to get started.</span>
        </div>
      </section>

      <!-- VIEW: Template editor (inside #templates) -->
      <section class="panel" id="view-editor" hidden>
        <div class="toolbar">
          <button class="btn sm sq" id="btn-editor-back" type="button" data-i18n-title="back"><i class="fa-solid fa-arrow-left"></i></button>
          <h2 id="editor-title" data-i18n="newChecklist">New Checklist</h2>
          <span class="spacer"></span>
          <button id="btn-cancel-edit" class="btn sm" type="button" data-i18n="cancel">Cancel</button>
          <button id="btn-save-tpl" class="btn primary sm" type="button" data-i18n="save">Save</button>
        </div>
        <div class="editor-grid">
          <label class="field"><span data-i18n="checklistName">Name</span><input id="tpl-name" type="text"></label>
          <label class="field"><span data-i18n="checklistType">Type</span>
            <select id="tpl-type" style="height:32px">
              <option value="daily" data-i18n="typeDaily">Daily</option>
              <option value="monthly" data-i18n="typeMonthly">Monthly</option>
              <option value="activity" data-i18n="typeActivity">Activity</option>
            </select>
          </label>
        </div>
        <div class="small muted" data-i18n="items">Items</div>
        <div class="add-row">
          <input id="new-item-input" type="text" data-i18n-placeholder="addItemPlaceholder">
          <button id="btn-add-item" class="btn sq" type="button" data-i18n-title="addItem"><i class="fa-solid fa-plus"></i></button>
        </div>
        <div id="items-list" class="list"></div>
        <div id="items-empty" class="small muted" hidden data-i18n="noItems">No items yet.</div>
      </section>

      <!-- VIEW: History (#runs) -->
      <section class="panel" id="view-history" hidden>
        <div class="toolbar"><h2 data-i18n="history">History</h2></div>
        <div id="history-list" class="list"></div>
        <div id="history-empty" class="empty" hidden>
          <i class="fa-solid fa-clock-rotate-left"></i>
          <span data-i18n="noHistory">No checklist history yet.</span>
        </div>
      </section>

      <!-- VIEW: Run (inside #runs) -->
      <section class="panel" id="view-run" hidden>
        <div class="toolbar">
          <button class="btn sm sq" id="btn-run-back" type="button" data-i18n-title="back"><i class="fa-solid fa-arrow-left"></i></button>
          <input id="run-name-input" type="text" class="run-name-input">
          <span id="run-progress-badge" class="progress-badge">0/0</span>
        </div>
        <div id="run-items-list" class="list"></div>
        <label class="field"><span data-i18n="generalNotes">General Notes</span>
          <textarea id="run-general-notes" rows="3"></textarea>
        </label>
      </section>

      <!-- VIEW: Quick list (#quick) — data in localStorage "todo_tasks" -->
      <section class="panel" id="view-quick" hidden>
        <form id="task-form" class="add-row" autocomplete="off">
          <input type="text" id="task-input" data-i18n-placeholder="qPlaceholder">
          <button type="submit" class="btn primary"><i class="fa-solid fa-plus"></i><span data-i18n="qAdd">Add</span></button>
        </form>
        <div class="toolbar" style="min-height:0"><h2><span data-i18n="qTodo">To-Do</span> <span class="count" id="q-todo-count"></span></h2></div>
        <div id="task-list" class="list"></div>
        <div id="task-empty" class="empty" hidden>
          <i class="fa-solid fa-list-check"></i>
          <span data-i18n="qEmpty">Nothing to do. Add a task above.</span>
        </div>
        <details class="done-box" id="completed-box">
          <summary><i class="fa-solid fa-chevron-right"></i><span data-i18n="qCompleted">Completed</span> <span class="count" id="q-done-count"></span></summary>
          <div id="completed-list" class="list"></div>
        </details>
      </section>
    </main>
  </div>

  <!-- Help -->
  <dialog id="help">
    <div class="dlg-head"><span id="help-title"></span><button class="icon-btn" id="help-close" type="button" data-i18n-title="close"><i class="fa-solid fa-xmark"></i></button></div>
    <div class="dlg-body" id="help-body"></div>
  </dialog>

  <!-- Confirm delete -->
  <dialog id="confirm-modal" class="sm">
    <div class="dlg-head"><span data-i18n="confirmDeleteTitle">Confirm Delete</span></div>
    <div class="dlg-body" id="confirm-modal-body"></div>
    <div class="dlg-foot">
      <button type="button" class="btn sm" id="confirm-cancel-btn" data-i18n="cancel">Cancel</button>
      <button type="button" class="btn sm danger" id="confirm-ok-btn" data-i18n="confirmDeleteBtn">Delete</button>
    </div>
  </dialog>

  <!-- New run -->
  <dialog id="run-modal" class="sm">
    <div class="dlg-head"><span data-i18n="newRun">New Run</span></div>
    <div class="dlg-body">
      <label class="field"><span data-i18n="runName">Run Name</span><input id="new-run-name" type="text"></label>
    </div>
    <div class="dlg-foot">
      <button type="button" class="btn sm" id="run-cancel-btn" data-i18n="cancel">Cancel</button>
      <button type="button" class="btn sm primary" id="run-start-btn" data-i18n="startRun">Start</button>
    </div>
  </dialog>

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };
  const $ = id => document.getElementById(id);

  let lang = store.get('app_lang') || store.get('checklist_lang') || 'en';
  if (!I18N[lang]) lang = 'en';

  function t(key, ...args) {
    const v = I18N[lang]?.[key] ?? I18N.en[key] ?? key;
    return typeof v === 'function' ? v(...args) : v;
  }

  function applyI18n() {
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const v = t(el.getAttribute('data-i18n'));
      if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') el.placeholder = v;
      else el.textContent = v;
    });
    document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
      el.placeholder = t(el.getAttribute('data-i18n-placeholder'));
    });
    document.querySelectorAll('[data-i18n-title]').forEach(el => {
      el.title = t(el.getAttribute('data-i18n-title'));
      el.setAttribute('aria-label', el.title);
    });
    $('lang-switcher').value = lang;
    document.documentElement.lang = lang === 'ja' ? 'ja' : lang === 'pt' ? 'pt-BR' : 'en';
    renderTabs();
    renderHelp();
    document.title = `${t('tab_' + activeTab)} · ${t('title')}`;
  }

  /* =========================================================
     Theme
  ========================================================= */
  let theme = store.get('app_theme') || store.get('checklist_theme') || 'dark';
  if (theme !== 'light') theme = 'dark';
  function applyTheme() {
    document.documentElement.setAttribute('data-theme', theme);
    $('theme-switcher').querySelector('i').className = theme === 'dark' ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
  }

  /* =========================================================
     IndexedDB helpers
  ========================================================= */
  const DB_NAME = 'ChecklistDB';
  const DB_VERSION = 1;
  let _db = null;

  function openDB() {
    return new Promise((resolve, reject) => {
      if (_db) return resolve(_db);
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = e => {
        const d = e.target.result;
        if (!d.objectStoreNames.contains('templates'))
          d.createObjectStore('templates', { keyPath: 'id', autoIncrement: true });
        if (!d.objectStoreNames.contains('runs'))
          d.createObjectStore('runs', { keyPath: 'id', autoIncrement: true });
      };
      req.onsuccess = () => { _db = req.result; resolve(_db); };
      req.onerror  = () => reject(req.error);
    });
  }

  function idbGetAll(store) {
    return openDB().then(db => new Promise((resolve, reject) => {
      const req = db.transaction(store, 'readonly').objectStore(store).getAll();
      req.onsuccess = () => resolve(req.result);
      req.onerror  = () => reject(req.error);
    }));
  }

  function idbGet(store, id) {
    return openDB().then(db => new Promise((resolve, reject) => {
      const req = db.transaction(store, 'readonly').objectStore(store).get(id);
      req.onsuccess = () => resolve(req.result);
      req.onerror  = () => reject(req.error);
    }));
  }

  function idbPut(store, obj) {
    return openDB().then(db => new Promise((resolve, reject) => {
      const req = db.transaction(store, 'readwrite').objectStore(store).put(obj);
      req.onsuccess = () => resolve(req.result);
      req.onerror  = () => reject(req.error);
    }));
  }

  function idbDelete(store, id) {
    return openDB().then(db => new Promise((resolve, reject) => {
      const req = db.transaction(store, 'readwrite').objectStore(store).delete(id);
      req.onsuccess = () => resolve();
      req.onerror  = () => reject(req.error);
    }));
  }

  /* =========================================================
     Utilities
  ========================================================= */
  function esc(s) {
    return String(s ?? '')
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  function genId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function stampNow() {
    const d = new Date();
    const p = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`;
  }

  function locale() { return lang === 'ja' ? 'ja-JP' : lang === 'pt' ? 'pt-BR' : 'en-US'; }
  function displayDate(ts) { return new Date(ts).toLocaleString(locale()); }

  function typeBadgeClass(type) {
    return type === 'daily' ? 'bg-daily' : type === 'monthly' ? 'bg-monthly' : 'bg-activity';
  }

  function typeLabel(type) {
    const map = { daily: 'typeDaily', monthly: 'typeMonthly', activity: 'typeActivity' };
    return t(map[type] || 'typeActivity');
  }

  /* =========================================================
     Tabs (URL hash) and views
  ========================================================= */
  const TABS = [
    { id: 'templates', icon: 'fa-solid fa-clipboard-list' },
    { id: 'runs',      icon: 'fa-solid fa-clock-rotate-left' },
    { id: 'quick',     icon: 'fa-solid fa-list-check' },
  ];
  const TAB_KEY = 'checklist_tab';
  const VIEW_TAB = { 'view-templates': 'templates', 'view-editor': 'templates', 'view-history': 'runs', 'view-run': 'runs', 'view-quick': 'quick' };
  const ALL_VIEWS = Object.keys(VIEW_TAB);
  let activeTab = 'templates';

  function renderTabs() {
    const nav = $('tabs');
    nav.innerHTML = '';
    TABS.forEach(tab => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'tab';
      btn.setAttribute('role', 'tab');
      btn.dataset.tab = tab.id;
      btn.title = t('tab_' + tab.id);
      btn.innerHTML = `<i class="${tab.icon}" aria-hidden="true"></i><span></span>`;
      btn.querySelector('span').textContent = t('tab_' + tab.id);
      btn.setAttribute('aria-selected', String(tab.id === activeTab));
      btn.addEventListener('click', () => selectTab(tab.id));
      nav.appendChild(btn);
    });
  }

  function markTab(id) {
    activeTab = id;
    store.set(TAB_KEY, id);
    document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === id)));
    if (location.hash.slice(1) !== id) history.replaceState(null, '', '#' + id);
    document.title = `${t('tab_' + id)} · ${t('title')}`;
    renderHelp();
  }

  function showView(id) {
    ALL_VIEWS.forEach(v => { $(v).hidden = v !== id; });
    if (VIEW_TAB[id] !== activeTab) markTab(VIEW_TAB[id]);
    $('main').scrollTop = 0;
  }

  function activeView() {
    return ALL_VIEWS.find(v => !$(v).hidden);
  }

  async function selectTab(id) {
    if (!TABS.some(tab => tab.id === id)) id = 'templates';
    if (autoSaveTimer) await flushAutoSave();
    markTab(id);
    if (id === 'templates') showTemplates();
    else if (id === 'runs') showHistory();
    else showQuick();
  }

  /* =========================================================
     Templates list view
  ========================================================= */
  async function showTemplates() {
    showView('view-templates');
    const templates = await idbGetAll('templates');
    const list = $('templates-list');
    const empty = $('templates-empty');
    if (!templates.length) {
      list.innerHTML = '';
      empty.hidden = false;
      return;
    }
    empty.hidden = true;
    templates.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
    list.innerHTML = templates.map(tpl => `
      <div class="card-row">
        <div class="card-info">
          <div class="card-name">${esc(tpl.name)}</div>
          <div class="card-meta">
            <span class="badge ${typeBadgeClass(tpl.type)}">${esc(typeLabel(tpl.type))}</span>
            &nbsp;${esc(t('itemCount', tpl.items.length))}
          </div>
        </div>
        <div class="card-actions">
          <button class="btn sm primary" type="button" onclick="openNewRunModal(${tpl.id})"
            title="${esc(t('startRun'))}"><i class="fa-solid fa-play"></i></button>
          <button class="btn sm" type="button" onclick="startEditTemplate(${tpl.id})"
            title="${esc(t('edit'))}"><i class="fa-solid fa-pencil"></i></button>
          <button class="btn sm danger" type="button" onclick="promptDeleteTemplate(${tpl.id})"
            title="${esc(t('delete'))}"><i class="fa-solid fa-trash"></i></button>
        </div>
      </div>
    `).join('');
  }

  /* =========================================================
     Template editor
  ========================================================= */
  let editorItems = [];
  let editorTplId = null;

  function startNewTemplate() {
    editorTplId = null;
    editorItems = [];
    $('tpl-name').value = '';
    $('tpl-type').value = 'daily';
    $('editor-title').setAttribute('data-i18n', 'newChecklist');
    showView('view-editor');
    applyI18n();
    renderEditorItems();
    $('tpl-name').focus();
  }

  async function startEditTemplate(id) {
    const tpl = await idbGet('templates', id);
    if (!tpl) return;
    editorTplId = id;
    editorItems = JSON.parse(JSON.stringify(tpl.items || []));
    $('tpl-name').value = tpl.name;
    $('tpl-type').value = tpl.type;
    $('editor-title').setAttribute('data-i18n', 'editChecklist');
    showView('view-editor');
    applyI18n();
    renderEditorItems();
    $('tpl-name').focus();
  }

  function renderEditorItems() {
    const list  = $('items-list');
    const empty = $('items-empty');
    if (!editorItems.length) {
      list.innerHTML = '';
      empty.hidden = false;
      return;
    }
    empty.hidden = true;
    list.innerHTML = editorItems.map((item, i) => {
      const px = item.indent * 22;
      const indentVisual = '<span class="indent-mark"></span>'.repeat(item.indent);
      return `
        <div class="editor-item" style="padding-left:${8 + px}px">
          ${indentVisual}
          <span class="editor-item-label">${esc(item.label)}</span>
          <button class="ibtn ${item.allowNote ? 'active' : ''}" type="button" onclick="itemToggleNote(${i})"
            title="${esc(t('allowNote'))}"><i class="fa-solid fa-note-sticky"></i></button>
          <button class="ibtn" type="button" onclick="itemIndent(${i},-1)" title="${esc(t('indentLess'))}"
            ${item.indent === 0 ? 'disabled' : ''}><i class="fa-solid fa-outdent"></i></button>
          <button class="ibtn" type="button" onclick="itemIndent(${i},1)" title="${esc(t('indentMore'))}"
            ${item.indent >= 3 ? 'disabled' : ''}><i class="fa-solid fa-indent"></i></button>
          <button class="ibtn" type="button" onclick="itemMove(${i},-1)" title="${esc(t('moveUp'))}"
            ${i === 0 ? 'disabled' : ''}><i class="fa-solid fa-arrow-up"></i></button>
          <button class="ibtn" type="button" onclick="itemMove(${i},1)" title="${esc(t('moveDown'))}"
            ${i === editorItems.length - 1 ? 'disabled' : ''}><i class="fa-solid fa-arrow-down"></i></button>
          <button class="ibtn danger" type="button" onclick="itemDelete(${i})" title="${esc(t('delete'))}">
            <i class="fa-solid fa-xmark"></i></button>
        </div>`;
    }).join('');
  }

  function editorAddItem() {
    const input = $('new-item-input');
    const label = input.value.trim();
    if (!label) return;
    editorItems.push({ id: genId(), label, indent: 0, allowNote: false });
    input.value = '';
    renderEditorItems();
    input.focus();
  }

  function itemMove(i, dir) {
    const j = i + dir;
    if (j < 0 || j >= editorItems.length) return;
    [editorItems[i], editorItems[j]] = [editorItems[j], editorItems[i]];
    renderEditorItems();
  }

  function itemIndent(i, dir) {
    editorItems[i].indent = Math.max(0, Math.min(3, editorItems[i].indent + dir));
    renderEditorItems();
  }

  function itemToggleNote(i) {
    editorItems[i].allowNote = !editorItems[i].allowNote;
    renderEditorItems();
  }

  function itemDelete(i) {
    editorItems.splice(i, 1);
    renderEditorItems();
  }

  async function saveTemplateForm() {
    const name = $('tpl-name').value.trim();
    if (!name) { $('tpl-name').focus(); return; }
    const now = Date.now();
    let createdAt = now;
    if (editorTplId) {
      const ex = await idbGet('templates', editorTplId);
      createdAt = ex?.createdAt ?? now;
    }
    const tpl = { name, type: $('tpl-type').value, items: editorItems, createdAt, updatedAt: now };
    if (editorTplId) tpl.id = editorTplId;
    await idbPut('templates', tpl);
    showTemplates();
  }

  async function promptDeleteTemplate(id) {
    const tpl = await idbGet('templates', id);
    showConfirmModal(
      `${esc(t('deleteTemplate'))}<br><strong>${esc(tpl?.name)}</strong><br>
       <small class="muted">${esc(t('confirmDeleteMsg'))}</small>`,
      () => idbDelete('templates', id).then(showTemplates)
    );
  }

  /* =========================================================
     New Run dialog
  ========================================================= */
  let pendingTplId = null;
  const runModal = $('run-modal');

  async function openNewRunModal(tplId) {
    const tpl = await idbGet('templates', tplId);
    if (!tpl) return;
    pendingTplId = tplId;
    $('new-run-name').value = `${tpl.name}_${stampNow()}`;
    runModal.showModal();
    $('new-run-name').select();
  }

  async function startRun() {
    const name = $('new-run-name').value.trim();
    if (!name) return;
    runModal.close();
    const tpl = await idbGet('templates', pendingTplId);
    if (!tpl) return;
    const run = {
      templateId: tpl.id,
      templateName: tpl.name,
      templateType: tpl.type,
      name,
      createdAt: Date.now(),
      items: JSON.parse(JSON.stringify(tpl.items)),
      itemStates: tpl.items.map(item => ({ itemId: item.id, done: false, note: '' })),
      generalNote: '',
    };
    run.id = await idbPut('runs', run);
    prevView = 'view-templates';
    currentRun = run;
    renderRunView();
  }

  /* =========================================================
     Run view
  ========================================================= */
  let currentRun = null;
  let prevView = 'view-templates';
  let autoSaveTimer = null;

  async function openRun(id) {
    const run = await idbGet('runs', id);
    if (!run) return;
    prevView = 'view-history';
    currentRun = run;
    renderRunView();
  }

  function renderRunView() {
    showView('view-run');
    const run = currentRun;
    $('run-name-input').value = run.name;
    $('run-general-notes').value = run.generalNote || '';
    updateProgress();

    const stateMap = {};
    (run.itemStates || []).forEach(s => { stateMap[s.itemId] = s; });

    $('run-items-list').innerHTML = (run.items || []).map(item => {
      const s = stateMap[item.id] || { done: false, note: '' };
      const px = item.indent * 24;
      const noteOpen = item.allowNote && s.note;
      const caText = s.done && s.checkedAt ? formatCheckedAt(s.checkedAt) : '';
      const caTitle = s.done && s.checkedAt ? displayDate(s.checkedAt) : '';
      const iid = esc(item.id);
      return `
        <div class="run-item" style="padding-left:${px}px">
          <div class="run-item-row">
            <input type="checkbox" id="cb-${iid}" ${s.done ? 'checked' : ''}
              onchange="toggleDone('${iid}', this.checked)">
            <label class="run-item-label${s.done ? ' done' : ''}" for="cb-${iid}">${esc(item.label)}</label>
            <span class="checked-at" id="ca-${iid}" title="${esc(caTitle)}"
              ${!caText ? 'style="display:none"' : ''}>${esc(caText)}</span>
            ${item.allowNote ? `
              <button class="ibtn" type="button" onclick="toggleNote('${iid}')" title="${esc(t('noteHint'))}">
                <i class="fa-solid fa-chevron-${noteOpen ? 'up' : 'down'}" id="ni-${iid}"></i>
              </button>` : ''}
          </div>
          ${item.allowNote ? `
            <div class="note-collapse${noteOpen ? ' open' : ''}" id="nc-${iid}">
              <textarea rows="2" placeholder="${esc(t('noteHint'))}"
                oninput="noteInput('${iid}', this.value)">${esc(s.note || '')}</textarea>
            </div>` : ''}
        </div>`;
    }).join('');
  }

  function updateProgress() {
    if (!currentRun) return;
    const total = (currentRun.itemStates || []).length;
    const done  = (currentRun.itemStates || []).filter(s => s.done).length;
    $('run-progress-badge').textContent = t('progress', done, total);
  }

  function formatCheckedAt(ts) {
    const d = new Date(ts);
    const isToday = d.toDateString() === new Date().toDateString();
    return isToday
      ? d.toLocaleTimeString(locale(), { hour: '2-digit', minute: '2-digit' })
      : d.toLocaleString(locale(), { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
  }

  function toggleDone(itemId, checked) {
    const s = currentRun.itemStates.find(s => s.itemId === itemId);
    if (s) {
      s.done = checked;
      s.checkedAt = checked ? Date.now() : null;
    }
    const lbl = document.querySelector(`label[for="cb-${CSS.escape(itemId)}"]`);
    if (lbl) lbl.classList.toggle('done', checked);
    const ca = $(`ca-${itemId}`);
    if (ca) {
      if (checked && s?.checkedAt) {
        ca.textContent = formatCheckedAt(s.checkedAt);
        ca.title = displayDate(s.checkedAt);
        ca.style.display = '';
      } else {
        ca.textContent = '';
        ca.style.display = 'none';
      }
    }
    updateProgress();
    scheduleAutoSave();
  }

  function toggleNote(itemId) {
    const col  = $(`nc-${itemId}`);
    const icon = $(`ni-${itemId}`);
    if (!col) return;
    const open = col.classList.toggle('open');
    if (icon) icon.className = open ? 'fa-solid fa-chevron-up' : 'fa-solid fa-chevron-down';
  }

  function noteInput(itemId, value) {
    const s = currentRun.itemStates.find(s => s.itemId === itemId);
    if (s) s.note = value;
    scheduleAutoSave();
  }

  function scheduleAutoSave() {
    if (autoSaveTimer) clearTimeout(autoSaveTimer);
    autoSaveTimer = setTimeout(flushAutoSave, 500);
  }

  async function flushAutoSave() {
    if (autoSaveTimer) clearTimeout(autoSaveTimer);
    autoSaveTimer = null;
    if (!currentRun?.id) return;
    const v = $('run-name-input').value.trim();
    if (v) currentRun.name = v;
    currentRun.generalNote = $('run-general-notes').value;
    await idbPut('runs', currentRun);
  }

  $('run-name-input').addEventListener('input', scheduleAutoSave);
  $('run-general-notes').addEventListener('input', scheduleAutoSave);

  /* =========================================================
     History view
  ========================================================= */
  async function showHistory() {
    showView('view-history');
    const runs = await idbGetAll('runs');
    const list  = $('history-list');
    const empty = $('history-empty');
    if (!runs.length) {
      list.innerHTML = '';
      empty.hidden = false;
      return;
    }
    empty.hidden = true;
    runs.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    list.innerHTML = runs.map(run => {
      const total = (run.itemStates || []).length;
      const done  = (run.itemStates || []).filter(s => s.done).length;
      const pct   = total ? Math.round(done / total * 100) : 0;
      return `
        <div class="card-row click" onclick="openRun(${run.id})" title="${esc(t('open'))}">
          <div class="card-info">
            <div class="card-name">${esc(run.name)}</div>
            <div class="card-meta">
              <span class="badge ${typeBadgeClass(run.templateType || 'activity')}">${esc(typeLabel(run.templateType || 'activity'))}</span>
              &nbsp;${esc(run.templateName)} &middot; ${esc(displayDate(run.createdAt))} &middot; ${done}/${total}
            </div>
            <div class="progress-mini"><div style="width:${pct}%"></div></div>
          </div>
          <div class="card-actions" onclick="event.stopPropagation()">
            <button class="btn sm danger" type="button" onclick="promptDeleteRun(${run.id})"
              title="${esc(t('delete'))}"><i class="fa-solid fa-trash"></i></button>
          </div>
        </div>`;
    }).join('');
  }

  async function promptDeleteRun(id) {
    const run = await idbGet('runs', id);
    showConfirmModal(
      `${esc(t('deleteRunMsg'))}<br><strong>${esc(run?.name)}</strong><br>
       <small class="muted">${esc(t('confirmDeleteMsg'))}</small>`,
      () => idbDelete('runs', id).then(showHistory)
    );
  }

  /* =========================================================
     Quick list (former todo.html) — localStorage "todo_tasks"
     Format: { todo: [string], completed: [string] }
  ========================================================= */
  const TODO_KEY = 'todo_tasks';
  let tasks = { todo: [], completed: [] };

  function loadTasks() {
    let data = null;
    try { data = JSON.parse(store.get(TODO_KEY)); } catch {}
    tasks = {
      todo: Array.isArray(data?.todo) ? data.todo : [],
      completed: Array.isArray(data?.completed) ? data.completed : [],
    };
  }

  function saveTasks() {
    store.set(TODO_KEY, JSON.stringify(tasks));
  }

  function showQuick() {
    showView('view-quick');
    loadTasks();
    renderTasks();
  }

  function renderTasks() {
    $('task-list').innerHTML = tasks.todo.map((task, i) => `
      <div class="q-item" data-index="${i}">
        <input type="checkbox" data-act="complete" aria-label="${esc(t('qCompleted'))}">
        <span class="q-text">${esc(task)}</span>
        <div class="q-actions">
          <button class="ibtn" type="button" data-act="edit" title="${esc(t('qEdit'))}"><i class="fa-solid fa-pencil"></i></button>
        </div>
      </div>`).join('');
    $('completed-list').innerHTML = tasks.completed.map((task, i) => `
      <div class="q-item completed" data-index="${i}">
        <span class="q-text">${esc(task)}</span>
        <div class="q-actions">
          <button class="ibtn" type="button" data-act="undo" title="${esc(t('qUndo'))}"><i class="fa-solid fa-rotate-left"></i></button>
          <button class="ibtn danger" type="button" data-act="delete" title="${esc(t('qDelete'))}"><i class="fa-solid fa-trash"></i></button>
        </div>
      </div>`).join('');
    $('task-empty').hidden = tasks.todo.length > 0;
    $('q-todo-count').textContent = tasks.todo.length ? `(${tasks.todo.length})` : '';
    $('q-done-count').textContent = `(${tasks.completed.length})`;
    $('completed-box').hidden = tasks.completed.length === 0;
  }

  $('task-form').addEventListener('submit', e => {
    e.preventDefault();
    const input = $('task-input');
    const text = input.value.trim();
    if (!text) return;
    loadTasks();
    tasks.todo.push(text);
    input.value = '';
    saveTasks();
    renderTasks();
  });

  function startEditTask(row, index) {
    const span = row.querySelector('.q-text');
    const input = document.createElement('input');
    input.type = 'text';
    input.value = tasks.todo[index];
    span.replaceWith(input);
    input.focus();
    let finished = false;
    const finish = save => {
      if (finished) return;
      finished = true;
      const text = input.value.trim();
      if (save && text) {
        tasks.todo[index] = text;
        saveTasks();
      }
      renderTasks();
    };
    input.addEventListener('blur', () => finish(true));
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); finish(true); }
      else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); finish(false); }
    });
  }

  $('task-list').addEventListener('click', e => {
    const row = e.target.closest('.q-item');
    if (!row) return;
    const index = Number(row.dataset.index);
    const act = e.target.closest('[data-act]')?.dataset.act;
    if (act === 'complete') {
      const [done] = tasks.todo.splice(index, 1);
      tasks.completed.push(done);
      saveTasks();
      renderTasks();
    } else if (act === 'edit') {
      startEditTask(row, index);
    }
  });

  $('completed-list').addEventListener('click', e => {
    const row = e.target.closest('.q-item');
    if (!row) return;
    const index = Number(row.dataset.index);
    const act = e.target.closest('[data-act]')?.dataset.act;
    if (act === 'undo') {
      const [task] = tasks.completed.splice(index, 1);
      tasks.todo.push(task);
      saveTasks();
      renderTasks();
    } else if (act === 'delete') {
      showConfirmModal(
        `${esc(t('qDeleteConfirm'))}<br><strong>${esc(tasks.completed[index])}</strong>`,
        () => { tasks.completed.splice(index, 1); saveTasks(); renderTasks(); }
      );
    }
  });

  window.addEventListener('storage', e => {
    if (e.key === TODO_KEY && activeView() === 'view-quick') { loadTasks(); renderTasks(); }
  });

  /* =========================================================
     Confirm dialog
  ========================================================= */
  let confirmCb = null;
  const confirmModal = $('confirm-modal');

  function showConfirmModal(msg, cb) {
    $('confirm-modal-body').innerHTML = msg;
    confirmCb = cb;
    confirmModal.showModal();
    $('confirm-ok-btn').focus();
  }

  $('confirm-ok-btn').addEventListener('click', () => {
    confirmModal.close();
    if (confirmCb) { const cb = confirmCb; confirmCb = null; cb(); }
  });
  $('confirm-cancel-btn').addEventListener('click', () => confirmModal.close());
  confirmModal.addEventListener('close', () => { confirmCb = null; });

  /* =========================================================
     Help
  ========================================================= */
  const help = $('help');
  function renderHelp() {
    $('help-title').textContent = t('title');
    const items = TABS.map(tab => `<li class="${tab.id === activeTab ? 'active' : ''}"><b>${esc(t('tab_' + tab.id))}</b> — ${esc(t('d_' + tab.id))}</li>`).join('');
    $('help-body').innerHTML = `<p>${esc(t('helpIntro'))}</p><h3>${esc(t('helpViews'))}</h3><ul>${items}</ul><h3>${esc(t('helpKeys'))}</h3><p>${t('k_help')}</p>`;
  }
  $('help-btn').addEventListener('click', () => help.showModal());
  $('help-close').addEventListener('click', () => help.close());
  help.addEventListener('click', e => { if (e.target === help) help.close(); });
  [confirmModal, runModal].forEach(d => d.addEventListener('click', e => { if (e.target === d) d.close(); }));
  document.addEventListener('keydown', e => {
    if (e.key === '?' && !document.querySelector('dialog[open]') && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) {
      e.preventDefault();
      help.showModal();
    }
  });

  /* =========================================================
     Event wiring
  ========================================================= */
  $('btn-new-template').addEventListener('click', startNewTemplate);
  $('btn-editor-back').addEventListener('click', showTemplates);
  $('btn-cancel-edit').addEventListener('click', showTemplates);
  $('btn-save-tpl').addEventListener('click', saveTemplateForm);
  $('btn-add-item').addEventListener('click', editorAddItem);
  $('new-item-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); editorAddItem(); }
  });
  $('btn-run-back').addEventListener('click', async () => {
    if (autoSaveTimer) await flushAutoSave();
    prevView === 'view-history' ? showHistory() : showTemplates();
  });
  $('run-start-btn').addEventListener('click', startRun);
  $('run-cancel-btn').addEventListener('click', () => runModal.close());
  $('new-run-name').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); startRun(); }
  });

  $('tabs').addEventListener('keydown', e => {
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    const i = TABS.findIndex(tab => tab.id === activeTab);
    const next = TABS[(i + (e.key === 'ArrowRight' ? 1 : -1) + TABS.length) % TABS.length].id;
    selectTab(next).then(() => document.querySelector(`.tab[data-tab="${next}"]`)?.focus());
  });
  window.addEventListener('hashchange', () => {
    const id = location.hash.slice(1);
    if (id && id !== activeTab) selectTab(id);
  });

  $('lang-switcher').addEventListener('change', e => {
    lang = I18N[e.target.value] ? e.target.value : 'en';
    store.set('app_lang', lang);
    applyI18n();
    const v = activeView();
    if      (v === 'view-templates') showTemplates();
    else if (v === 'view-history')   showHistory();
    else if (v === 'view-run' && currentRun) renderRunView();
    else if (v === 'view-editor')    renderEditorItems();
    else if (v === 'view-quick')     renderTasks();
  });

  $('theme-switcher').addEventListener('click', () => {
    theme = theme === 'dark' ? 'light' : 'dark';
    store.set('app_theme', theme);
    applyTheme();
  });

  /* =========================================================
     Init
  ========================================================= */
  (function init() {
    const first = location.hash.slice(1) || store.get(TAB_KEY) || 'templates';
    activeTab = TABS.some(tab => tab.id === first) ? first : 'templates';
    applyTheme();
    applyI18n();
    selectTab(activeTab);
  })();
  </script>
</body>
</html>
