<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="title">Age Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../assets/fontawesome/css/all.min.css" />
    <style>
      :root {
        --bg-color: #1a1a1a;
        --text-color: #f0f0f0;
        --card-bg-color: #2a2a2a;
        --border-color: #444;
        --accent-color: #0d6efd;
        --muted-color: #aaa;
      }

      html[data-theme='light'] {
        --bg-color: #f8f9fa;
        --text-color: #212529;
        --card-bg-color: #fff;
        --border-color: #dee2e6;
        --accent-color: #0d6efd;
        --muted-color: #6c757d;
      }

      body {
        background-color: var(--bg-color);
        color: var(--text-color);
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        margin: 0;
      }

      .container-fluid {
        padding-top: 20px;
        padding-bottom: 20px;
        flex: 1;
      }

      .card {
        background-color: var(--card-bg-color);
        border-color: var(--border-color);
      }

      .card-header {
        border-bottom-color: var(--border-color);
      }

      .navbar-brand,
      .form-label {
        color: var(--text-color);
      }

      .form-control {
        background-color: var(--card-bg-color);
        color: var(--text-color);
        border-color: var(--border-color);
      }

      .form-control:focus {
        background-color: var(--card-bg-color);
        color: var(--text-color);
        border-color: var(--accent-color);
        box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
      }

      .result-box {
        background-color: rgba(13, 110, 253, 0.08);
        border: 1px solid var(--accent-color);
        border-radius: 10px;
        padding: 20px 24px;
        margin-top: 20px;
      }

      .result-main {
        font-size: 2rem;
        font-weight: 700;
        color: var(--accent-color);
        line-height: 1.2;
      }

      .result-sub {
        font-size: 0.95rem;
        color: var(--muted-color);
        margin-top: 10px;
      }

      .result-sub .sub-item {
        display: inline-block;
        margin-right: 18px;
      }

      .help-text {
        font-size: 0.85rem;
        color: var(--muted-color);
        margin-bottom: 6px;
      }

      .empty-state {
        text-align: center;
        padding: 32px 0;
        color: var(--muted-color);
      }

      .date-hint {
        font-size: 0.8rem;
        color: var(--muted-color);
        margin-top: 4px;
      }
    </style>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-NWZDZ906DJ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-NWZDZ906DJ');
    </script>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg" style="background-color: var(--card-bg-color); border-bottom: 1px solid var(--border-color)">
      <div class="container-fluid">
        <a class="navbar-brand" href="#" data-i18n="title">Age Calculator</a>
        <div class="d-flex ms-auto gap-2">
          <select id="lang-switcher" class="form-select form-select-sm" style="width: auto;">
            <option value="en">English</option>
            <option value="pt">Português</option>
            <option value="ja">日本語</option>
          </select>
          <button id="theme-switcher" class="btn btn-sm btn-outline-secondary" type="button" title="Toggle theme">
            <i class="fas fa-moon"></i>
          </button>
        </div>
      </div>
    </nav>

    <div class="container-fluid">
      <div class="row justify-content-center">
        <div class="col-xl-5 col-lg-6 col-md-8 col-sm-10">
          <div class="card">
            <div class="card-header">
              <h4 class="mb-0" data-i18n="cardTitle">Calculate Your Age</h4>
            </div>
            <div class="card-body">
              <div class="mb-3">
                <label class="form-label" for="birth-date" data-i18n="birthLabel">Date of Birth</label>
                <input type="date" id="birth-date" class="form-control" />
                <div class="date-hint" id="date-hint" data-i18n="dateHint">Enter your date of birth to calculate your age.</div>
              </div>

              <div id="result-area" style="display: none;">
                <div class="result-box">
                  <div class="help-text" data-i18n="ageLabel">Age</div>
                  <div class="result-main" id="result-main"></div>
                  <div class="result-sub" id="result-sub"></div>
                </div>
              </div>

              <div id="empty-state" class="empty-state">
                <i class="fas fa-birthday-cake fa-2x mb-3" style="opacity:0.3"></i>
                <div data-i18n="emptyState">Enter your date of birth above to see your age.</div>
              </div>

              <div id="error-state" style="display: none;" class="alert alert-danger mt-3" data-i18n="errorFuture">
                The date of birth cannot be in the future.
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      const i18n = {
        en: {
          title: "Age Calculator",
          cardTitle: "Calculate Your Age",
          birthLabel: "Date of Birth",
          dateHint: "Enter your date of birth to calculate your age.",
          ageLabel: "Age",
          emptyState: "Enter your date of birth above to see your age.",
          errorFuture: "The date of birth cannot be in the future.",
          themeBtn: "Toggle theme",
          years: "years",
          year: "year",
          months: "months",
          month: "month",
          days: "days",
          day: "day",
          totalMonths: "Total months",
          totalDays: "Total days",
          totalWeeks: "Total weeks",
          and: "and"
        },
        pt: {
          title: "Calculadora de Idade",
          cardTitle: "Calcule sua Idade",
          birthLabel: "Data de Nascimento",
          dateHint: "Insira sua data de nascimento para calcular sua idade.",
          ageLabel: "Idade",
          emptyState: "Insira sua data de nascimento acima para ver sua idade.",
          errorFuture: "A data de nascimento não pode ser no futuro.",
          themeBtn: "Alternar tema",
          years: "anos",
          year: "ano",
          months: "meses",
          month: "mês",
          days: "dias",
          day: "dia",
          totalMonths: "Total de meses",
          totalDays: "Total de dias",
          totalWeeks: "Total de semanas",
          and: "e"
        },
        ja: {
          title: "年齢計算機",
          cardTitle: "年齢を計算する",
          birthLabel: "生年月日",
          dateHint: "生年月日を入力して年齢を計算します。",
          ageLabel: "年齢",
          emptyState: "上に生年月日を入力すると年齢が表示されます。",
          errorFuture: "生年月日を未来の日付にすることはできません。",
          themeBtn: "テーマを切り替え",
          years: "年",
          year: "年",
          months: "ヶ月",
          month: "ヶ月",
          days: "日",
          day: "日",
          totalMonths: "合計月数",
          totalDays: "合計日数",
          totalWeeks: "合計週数",
          and: ""
        }
      };

      document.addEventListener('DOMContentLoaded', () => {
        const langSwitcher = document.getElementById('lang-switcher');
        const themeSwitcher = document.getElementById('theme-switcher');
        const birthDate = document.getElementById('birth-date');
        const resultArea = document.getElementById('result-area');
        const resultMain = document.getElementById('result-main');
        const resultSub = document.getElementById('result-sub');
        const emptyState = document.getElementById('empty-state');
        const errorState = document.getElementById('error-state');

        // --- Language ---
        let currentLang = localStorage.getItem('agecalc_lang') || 'en';

        function applyI18n(lang) {
          const t = i18n[lang];
          document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (t[key] !== undefined) el.textContent = t[key];
          });
          document.documentElement.lang = lang;
          document.title = t.title;
        }

        langSwitcher.value = currentLang;
        langSwitcher.addEventListener('change', () => {
          currentLang = langSwitcher.value;
          localStorage.setItem('agecalc_lang', currentLang);
          applyI18n(currentLang);
          calculate();
        });

        // --- Theme ---
        let currentTheme = localStorage.getItem('agecalc_theme') || 'dark';

        function applyTheme(theme) {
          document.documentElement.setAttribute('data-theme', theme);
          themeSwitcher.innerHTML = theme === 'dark'
            ? '<i class="fas fa-sun"></i>'
            : '<i class="fas fa-moon"></i>';
        }

        applyTheme(currentTheme);
        themeSwitcher.addEventListener('click', () => {
          currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
          localStorage.setItem('agecalc_theme', currentTheme);
          applyTheme(currentTheme);
        });

        // --- Restore saved birth date ---
        const savedDate = localStorage.getItem('agecalc_birthdate');
        if (savedDate) birthDate.value = savedDate;

        birthDate.addEventListener('change', () => {
          localStorage.setItem('agecalc_birthdate', birthDate.value);
          calculate();
        });

        // --- Age calculation ---
        function calculateAge(birthDateStr) {
          const today = new Date();
          const birth = new Date(birthDateStr);

          // Normalize to avoid timezone offsets shifting the date
          const todayY = today.getFullYear();
          const todayM = today.getMonth();
          const todayD = today.getDate();
          const birthY = birth.getFullYear();
          const birthM = birth.getMonth();
          const birthD = birth.getDate();

          if (birth > today) return null;

          let years = todayY - birthY;
          let months = todayM - birthM;
          let days = todayD - birthD;

          if (days < 0) {
            months--;
            const prevMonth = new Date(todayY, todayM, 0);
            days += prevMonth.getDate();
          }
          if (months < 0) {
            years--;
            months += 12;
          }

          // Total values
          const msPerDay = 1000 * 60 * 60 * 24;
          const totalMs = today - birth;
          const totalDays = Math.floor(totalMs / msPerDay);
          const totalWeeks = Math.floor(totalDays / 7);
          const totalMonths = years * 12 + months;

          return { years, months, days, totalDays, totalWeeks, totalMonths };
        }

        function pluralOrSingular(value, singular, plural, lang) {
          if (lang === 'ja') return value + singular;
          return value === 1 ? `${value} ${singular}` : `${value} ${plural}`;
        }

        function calculate() {
          const t = i18n[currentLang];
          const val = birthDate.value;

          if (!val) {
            resultArea.style.display = 'none';
            errorState.style.display = 'none';
            emptyState.style.display = 'block';
            return;
          }

          const result = calculateAge(val);

          if (!result) {
            resultArea.style.display = 'none';
            emptyState.style.display = 'none';
            errorState.style.display = 'block';
            errorState.textContent = t.errorFuture;
            return;
          }

          errorState.style.display = 'none';
          emptyState.style.display = 'none';
          resultArea.style.display = 'block';

          const { years, months, days, totalDays, totalWeeks, totalMonths } = result;

          // Main line: X years, X months and X days
          const yStr = pluralOrSingular(years, t.year, t.years, currentLang);
          const mStr = pluralOrSingular(months, t.month, t.months, currentLang);
          const dStr = pluralOrSingular(days, t.day, t.days, currentLang);

          let mainText;
          if (currentLang === 'ja') {
            mainText = `${yStr}　${mStr}　${dStr}`;
          } else {
            mainText = `${yStr}, ${mStr} ${t.and} ${dStr}`;
          }
          resultMain.textContent = mainText;

          // Sub line: totals
          const tmStr = pluralOrSingular(totalMonths, t.month, t.months, currentLang);
          const twStr = pluralOrSingular(totalWeeks, '', '', currentLang);
          const tdStr = pluralOrSingular(totalDays, t.day, t.days, currentLang);

          if (currentLang === 'ja') {
            resultSub.innerHTML =
              `<span class="sub-item">${t.totalMonths}: <strong>${totalMonths}${t.month}</strong></span>` +
              `<span class="sub-item">${t.totalWeeks}: <strong>${totalWeeks}</strong></span>` +
              `<span class="sub-item">${t.totalDays}: <strong>${totalDays}${t.day}</strong></span>`;
          } else {
            resultSub.innerHTML =
              `<span class="sub-item">${t.totalMonths}: <strong>${totalMonths}</strong></span>` +
              `<span class="sub-item">${t.totalWeeks}: <strong>${totalWeeks}</strong></span>` +
              `<span class="sub-item">${t.totalDays}: <strong>${totalDays}</strong></span>`;
          }
        }

        // Init
        applyI18n(currentLang);
        calculate();
      });
    </script>
  </body>
</html>
