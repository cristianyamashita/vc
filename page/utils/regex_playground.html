</head><body><header class="top"><div class="brand"><div class="logo">.*</div><div><h1>Regex Playground</h1><small data-i18n="subtitle">Build, test, and understand patterns</small></div></div><div class="actions"><button class="btn" id="copy">⧉ <span class="action-label" data-i18n="copy">Copy regex</span></button><button class="btn" id="save">♡ <span class="action-label" data-i18n="save">Save</span></button><select id="lang" class="lang"><option value="en">EN</option><option value="pt">PT</option><option value="ja">JA</option></select><button class="btn icon" id="theme" aria-label="Theme">◐</button></div></header>

<main class="main"><section class="pattern-card"><div class="pattern-row"><span class="slash">/</span><input id="pattern" value="(?&lt;user&gt;[\w.-]+)@(?&lt;domain&gt;[\w.-]+\.\w{2,})" spellcheck="false" aria-label="Regular expression"><div class="flags"><button class="flag-btn active" data-flag="g">g</button><button class="flag-btn active" data-flag="i">i</button><button class="flag-btn" data-flag="m">m</button><button class="flag-btn" data-flag="s">s</button><button class="flag-btn active" data-flag="u">u</button><span class="slash">/</span></div></div><div id="error" class="error hidden"></div><div class="stats"><span><strong id="match-count">0</strong> <span data-i18n="matches">matches</span></span><span><strong id="time">0.0</strong> ms</span><span id="valid" style="color:var(--lime)" data-i18n="valid">Valid expression</span></div></section>
