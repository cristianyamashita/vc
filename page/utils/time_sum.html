<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <link rel="icon" href="../assets/icons/ico/utils-time_sum.ico" type="image/x-icon">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="title">Time Sum</title>
    <style>
      :root {
        --bg: #111615;
        --panel: #1a2120;
        --panel-2: #212a29;
        --border: #2e3a38;
        --text: #e8efee;
        --muted: #8a9a97;
        --accent: #1fb5a0;
        --accent-strong: #008f7d;
        --accent-soft: rgba(31, 181, 160, 0.12);
        --warn: #e0a84a;
        --warn-soft: rgba(224, 168, 74, 0.14);
        --neg: #e07a6a;
        --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
        --mono: ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace;
        --line-h: 26px;
      }
      html[data-theme='light'] {
        --bg: #f3f6f5;
        --panel: #ffffff;
        --panel-2: #f7faf9;
        --border: #d7e0de;
        --text: #172120;
        --muted: #62716e;
        --accent: #008f7d;
        --accent-strong: #006056;
        --accent-soft: rgba(0, 143, 125, 0.09);
        --warn: #a86a08;
        --warn-soft: rgba(200, 130, 10, 0.12);
        --neg: #c0392b;
        --shadow: 0 10px 30px rgba(20, 40, 38, 0.08);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 20px;
        border-bottom: 1px solid var(--border);
        background: var(--panel);
        position: sticky;
        top: 0;
        z-index: 5;
      }
      header .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.05rem; }
      header .brand img { width: 26px; height: 26px; border-radius: 6px; }
      header .spacer { flex: 1; }
      select, button {
        font: inherit;
        color: var(--text);
        background: var(--panel-2);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 6px 10px;
        cursor: pointer;
      }
      button:hover, select:hover { border-color: var(--accent); }
      button.primary { background: var(--accent-strong); border-color: var(--accent-strong); color: #fff; }
      button.primary:hover { filter: brightness(1.1); }
      .icon-btn { width: 36px; height: 34px; padding: 0; display: inline-grid; place-items: center; }
      .icon-btn svg { width: 18px; height: 18px; }

      main {
        width: 100%;
        max-width: 980px;
        margin: 0 auto;
        padding: 20px 16px 40px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        flex: 1;
      }
      .hint { color: var(--muted); font-size: 0.9rem; line-height: 1.5; margin: 0; }
      .hint code {
        font-family: var(--mono);
        background: var(--accent-soft);
        color: var(--accent);
        padding: 1px 5px;
        border-radius: 4px;
      }
      .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
      .toolbar label { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 0.9rem; cursor: pointer; }
      .toolbar .spacer { flex: 1; }

      .editor {
        display: grid;
        grid-template-columns: 44px 1fr 150px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: var(--shadow);
        overflow: hidden;
        height: 420px;
        min-height: 200px;
        resize: vertical;
      }
      .editor:focus-within { border-color: var(--accent); }
      .gutter, .running {
        overflow: hidden;
        font-family: var(--mono);
        font-size: 13px;
        line-height: var(--line-h);
        padding: 12px 0;
        background: var(--panel-2);
        user-select: none;
      }
      .gutter { text-align: right; padding-right: 10px; color: var(--muted); border-right: 1px solid var(--border); }
      .running { border-left: 1px solid var(--border); padding-left: 12px; padding-right: 12px; }
      .gutter div, .running div { height: var(--line-h); white-space: nowrap; }
      .gutter .cur { color: var(--accent); font-weight: 700; }
      .running .ok { color: var(--muted); }
      .running .ok b { color: var(--text); font-weight: 600; }
      .running .neg b { color: var(--neg); }
      .running .bad { color: var(--warn); }
      .running .skip { color: var(--muted); opacity: 0.55; }
      textarea {
        width: 100%;
        height: 100%;
        border: 0;
        outline: 0;
        resize: none;
        padding: 12px 14px;
        margin: 0;
        background: transparent;
        color: var(--text);
        font-family: var(--mono);
        font-size: 15px;
        line-height: var(--line-h);
        white-space: pre;
        overflow: auto;
        tab-size: 4;
      }
      textarea::placeholder { color: var(--muted); opacity: 0.7; }

      .result {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: var(--shadow);
        padding: 20px;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 16px 24px;
        align-items: center;
      }
      .result .label { color: var(--muted); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.06em; }
      .total {
        font-family: var(--mono);
        font-size: clamp(2.4rem, 8vw, 4rem);
        font-weight: 700;
        color: var(--accent);
        line-height: 1.1;
        font-variant-numeric: tabular-nums;
        word-break: break-all;
      }
      .total.neg { color: var(--neg); }
      .copy-wrap { display: flex; flex-direction: column; gap: 8px; align-items: stretch; }
      .stats {
        grid-column: 1 / -1;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 10px;
      }
      .stat { background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
      .stat .k { color: var(--muted); font-size: 0.78rem; }
      .stat .v { font-family: var(--mono); font-size: 1.05rem; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }
      .warnings {
        grid-column: 1 / -1;
        background: var(--warn-soft);
        color: var(--warn);
        border-radius: 8px;
        padding: 8px 12px;
        font-size: 0.88rem;
      }
      .warnings[hidden] { display: none; }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%) translateY(20px);
        background: var(--accent-strong);
        color: #fff;
        padding: 8px 16px;
        border-radius: 8px;
        opacity: 0;
        pointer-events: none;
        transition: all 0.2s ease;
      }
      .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

      @media (max-width: 640px) {
        header { padding: 10px 12px; }
        header .brand span { display: none; }
        .editor { grid-template-columns: 34px 1fr 96px; height: 340px; }
        .running { font-size: 11px; padding-left: 6px; padding-right: 6px; }
        .running .lbl { display: none; }
        .result { grid-template-columns: 1fr; }
      }
    </style>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-NWZDZ906DJ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-NWZDZ906DJ');
    </script>
  </head>
  <body>
    <header>
      <div class="brand">
        <img src="../assets/icons/svg/utils-time_sum.svg" alt="" />
        <span data-i18n="title">Time Sum</span>
      </div>
      <div class="spacer"></div>
      <select id="lang" aria-label="Language">
        <option value="en">EN</option>
        <option value="pt">PT</option>
        <option value="ja">JA</option>
      </select>
      <button id="theme" class="icon-btn" type="button" data-i18n-title="themeBtn" title="Toggle theme"></button>
    </header>

    <main>
      <p class="hint" data-i18n-html="hint">
        One entry per line in <code>MM:SS</code> or <code>HH:MM:SS</code>. Free text around the times is fine. Start a line with <code>-</code> to subtract it.
      </p>

      <div class="toolbar">
        <label><input type="checkbox" id="autoFormat" checked /> <span data-i18n="autoFormat">Auto-format to HH:MM:SS when leaving a line</span></label>
        <div class="spacer"></div>
        <button id="formatAll" type="button" data-i18n="formatAll">Format all</button>
        <button id="example" type="button" data-i18n="example">Example</button>
        <button id="clear" type="button" data-i18n="clear">Clear</button>
      </div>

      <div class="editor" id="editor">
        <div class="gutter" id="gutter"></div>
        <textarea id="input" spellcheck="false" wrap="off" autocomplete="off" data-i18n-placeholder="placeholder"></textarea>
        <div class="running" id="running"></div>
      </div>

      <section class="result" aria-live="polite">
        <div>
          <div class="label" data-i18n="total">Total</div>
          <div class="total" id="total">00:00:00</div>
        </div>
        <div class="copy-wrap">
          <button id="copy" class="primary" type="button" data-i18n="copy">Copy total</button>
        </div>
        <div class="stats">
          <div class="stat"><div class="k" data-i18n="entries">Entries</div><div class="v" id="sEntries">0</div></div>
          <div class="stat"><div class="k" data-i18n="average">Average</div><div class="v" id="sAvg">00:00:00</div></div>
          <div class="stat"><div class="k" data-i18n="decimalHours">Decimal hours</div><div class="v" id="sHours">0</div></div>
          <div class="stat"><div class="k" data-i18n="totalMinutes">Total minutes</div><div class="v" id="sMinutes">0</div></div>
          <div class="stat"><div class="k" data-i18n="totalSeconds">Total seconds</div><div class="v" id="sSeconds">0</div></div>
        </div>
        <div class="warnings" id="warnings" hidden></div>
      </section>
    </main>

    <div class="toast" id="toast"></div>

    <script>
      (() => {
        const i18n = {
          en: {
            title: 'Time Sum',
            themeBtn: 'Toggle theme',
            hint: 'One entry per line in <code>MM:SS</code> or <code>HH:MM:SS</code>. Free text around the times is fine. Start a line with <code>-</code> to subtract it.',
            autoFormat: 'Auto-format to HH:MM:SS when leaving a line',
            formatAll: 'Format all',
            example: 'Example',
            clear: 'Clear',
            placeholder: 'Intro 03:25\nChapter 1  12:40\n1:02:15\n...',
            total: 'Total',
            copy: 'Copy total',
            copied: 'Copied!',
            entries: 'Entries',
            average: 'Average',
            decimalHours: 'Decimal hours',
            totalMinutes: 'Total minutes',
            totalSeconds: 'Total seconds',
            invalidLines: 'Ignored lines with invalid times (minutes/seconds must be below 60): {lines}',
            confirmClear: 'Clear all entries?',
            exampleText: 'Intro 03:25\nChapter 1 - 12:40\nChapter 2 - 1:02:15\n08:05\n- Break 02:00',
          },
          pt: {
            title: 'Somador de Tempo',
            themeBtn: 'Alternar tema',
            hint: 'Uma entrada por linha no formato <code>MM:SS</code> ou <code>HH:MM:SS</code>. Pode haver texto livre ao redor dos tempos. Comece a linha com <code>-</code> para subtrair.',
            autoFormat: 'Formatar para HH:MM:SS ao sair da linha',
            formatAll: 'Formatar tudo',
            example: 'Exemplo',
            clear: 'Limpar',
            placeholder: 'Intro 03:25\nCapítulo 1  12:40\n1:02:15\n...',
            total: 'Total',
            copy: 'Copiar total',
            copied: 'Copiado!',
            entries: 'Entradas',
            average: 'Média',
            decimalHours: 'Horas decimais',
            totalMinutes: 'Total de minutos',
            totalSeconds: 'Total de segundos',
            invalidLines: 'Linhas ignoradas com tempo inválido (minutos/segundos devem ser menores que 60): {lines}',
            confirmClear: 'Limpar todas as entradas?',
            exampleText: 'Intro 03:25\nCapítulo 1 - 12:40\nCapítulo 2 - 1:02:15\n08:05\n- Pausa 02:00',
          },
          ja: {
            title: '時間合計',
            themeBtn: 'テーマを切り替え',
            hint: '1行に1つ、<code>MM:SS</code> または <code>HH:MM:SS</code> 形式で入力します。時間の前後に自由なテキストを書けます。行頭に <code>-</code> を付けると減算します。',
            autoFormat: '行を離れたら HH:MM:SS に自動整形',
            formatAll: 'すべて整形',
            example: 'サンプル',
            clear: 'クリア',
            placeholder: 'イントロ 03:25\n第1章  12:40\n1:02:15\n...',
            total: '合計',
            copy: '合計をコピー',
            copied: 'コピーしました！',
            entries: 'エントリー数',
            average: '平均',
            decimalHours: '時間（小数）',
            totalMinutes: '合計分',
            totalSeconds: '合計秒',
            invalidLines: '無効な時間の行を無視しました（分・秒は60未満）：{lines}',
            confirmClear: 'すべての入力をクリアしますか？',
            exampleText: 'イントロ 03:25\n第1章 - 12:40\n第2章 - 1:02:15\n08:05\n- 休憩 02:00',
          },
        };

        const STORE_TEXT = 'timeSum_text';
        const STORE_AUTO = 'timeSum_autoFormat';
        const store = {
          get(k) { try { return localStorage.getItem(k); } catch { return null; } },
          set(k, v) { try { localStorage.setItem(k, v); } catch {} },
        };

        const $ = (id) => document.getElementById(id);
        const input = $('input');
        const gutter = $('gutter');
        const running = $('running');
        const autoFormat = $('autoFormat');

        // A time token: H:MM:SS or M:SS, not glued to other digits/colons.
        const TOKEN = /(?<![\d:])(\d+):(\d{1,2})(?::(\d{1,2}))?(?![\d:])/g;

        let lang = store.get('app_lang') || 'en';
        if (!i18n[lang]) lang = 'en';
        const t = (k) => (i18n[lang] && i18n[lang][k]) || i18n.en[k] || k;

        const pad = (n) => String(n).padStart(2, '0');
        function fmt(sec) {
          const neg = sec < 0;
          sec = Math.abs(Math.round(sec));
          const h = Math.floor(sec / 3600);
          const m = Math.floor((sec % 3600) / 60);
          const s = sec % 60;
          return (neg ? '-' : '') + pad(h) + ':' + pad(m) + ':' + pad(s);
        }

        // Returns { seconds, sign, tokens, invalid, empty }
        function parseLine(line) {
          const trimmed = line.trim();
          if (!trimmed) return { empty: true };
          const sign = trimmed.startsWith('-') ? -1 : 1;
          let seconds = 0, tokens = 0, invalid = false;
          for (const m of line.matchAll(TOKEN)) {
            tokens++;
            let h = 0, mi, s;
            if (m[3] !== undefined) { h = +m[1]; mi = +m[2]; s = +m[3]; if (mi >= 60) invalid = true; }
            else { mi = +m[1]; s = +m[2]; }
            if (s >= 60) invalid = true;
            seconds += h * 3600 + mi * 60 + s;
          }
          return { seconds: seconds * sign, sign, tokens, invalid, empty: false };
        }

        // Rewrites valid tokens in a line to HH:MM:SS (carrying MM overflow into hours).
        function normalizeLine(line) {
          return line.replace(TOKEN, (full, a, b, c) => {
            let sec;
            if (c !== undefined) {
              if (+b >= 60 || +c >= 60) return full;
              sec = +a * 3600 + +b * 60 + +c;
            } else {
              if (+b >= 60) return full;
              sec = +a * 60 + +b;
            }
            return fmt(sec);
          });
        }

        function lineIndexAt(pos) {
          let n = 0;
          const v = input.value;
          for (let i = 0; i < pos && i < v.length; i++) if (v.charCodeAt(i) === 10) n++;
          return n;
        }

        function normalizeLineAt(idx, useEditing = true) {
          const lines = input.value.split('\n');
          if (idx < 0 || idx >= lines.length) return;
          const before = lines[idx];
          const after = normalizeLine(before);
          if (after === before) return;
          let offset = 0;
          for (let i = 0; i < idx; i++) offset += lines[i].length + 1;
          const { selectionStart: ss, selectionEnd: se } = input;
          const lineEnd = offset + before.length;
          const delta = after.length - before.length;
          // Replace through the editing API so undo keeps working where supported.
          let ok = false;
          if (useEditing && document.activeElement === input) {
            input.setSelectionRange(offset, lineEnd);
            try { ok = document.execCommand('insertText', false, after); } catch {}
          }
          if (!ok || input.value.split('\n')[idx] !== after) {
            lines[idx] = after;
            input.value = lines.join('\n');
          }
          const shift = (p) => (p > lineEnd ? p + delta : p <= offset ? p : Math.min(p, offset + after.length));
          input.setSelectionRange(shift(ss), shift(se));
        }

        let lastLine = 0;
        let normalizing = false;
        function checkLineChange() {
          if (normalizing) return;
          const cur = lineIndexAt(input.selectionStart);
          if (cur !== lastLine) {
            const prev = lastLine;
            lastLine = cur;
            if (autoFormat.checked) {
              normalizing = true;
              normalizeLineAt(prev);
              normalizing = false;
              lastLine = lineIndexAt(input.selectionStart);
            }
          }
          renderGutter();
        }

        function render() {
          const lines = input.value.split('\n');
          let total = 0, count = 0, absTotal = 0;
          const invalidLines = [];
          const rows = [];
          lines.forEach((line, i) => {
            const r = parseLine(line);
            if (r.empty) { rows.push('<div></div>'); return; }
            if (r.invalid) { invalidLines.push(i + 1); rows.push('<div class="bad">⚠</div>'); return; }
            if (!r.tokens) { rows.push('<div class="skip">—</div>'); return; }
            total += r.seconds;
            count++;
            rows.push(`<div class="ok${r.sign < 0 ? ' neg' : ''}"><b>${fmt(total)}</b></div>`);
          });
          running.innerHTML = rows.join('');
          renderGutter(lines.length);

          const totalEl = $('total');
          totalEl.textContent = fmt(total);
          totalEl.classList.toggle('neg', total < 0);
          $('sEntries').textContent = count;
          $('sAvg').textContent = fmt(count ? total / count : 0);
          $('sHours').textContent = +(total / 3600).toFixed(4);
          $('sMinutes').textContent = +(total / 60).toFixed(2);
          $('sSeconds').textContent = total;

          const w = $('warnings');
          if (invalidLines.length) {
            w.hidden = false;
            w.textContent = t('invalidLines').replace('{lines}', invalidLines.join(', '));
          } else w.hidden = true;

          syncScroll();
          store.set(STORE_TEXT, input.value);
        }

        let gutterCount = -1, gutterCur = -1;
        function renderGutter(count) {
          if (count === undefined) count = input.value.split('\n').length;
          const cur = document.activeElement === input ? lineIndexAt(input.selectionStart) : -1;
          if (count === gutterCount && cur === gutterCur) return;
          gutterCount = count; gutterCur = cur;
          let html = '';
          for (let i = 0; i < count; i++) html += `<div${i === cur ? ' class="cur"' : ''}>${i + 1}</div>`;
          gutter.innerHTML = html;
          syncScroll();
        }

        function syncScroll() {
          gutter.scrollTop = input.scrollTop;
          running.scrollTop = input.scrollTop;
        }

        function formatAll() {
          const v = input.value;
          const nv = v.split('\n').map(normalizeLine).join('\n');
          if (nv === v) return;
          input.focus();
          input.select();
          let ok = false;
          try { ok = document.execCommand('insertText', false, nv); } catch {}
          if (!ok) input.value = nv;
          input.setSelectionRange(0, 0);
          lastLine = 0;
          render();
        }

        function toast(msg) {
          const el = $('toast');
          el.textContent = msg;
          el.classList.add('show');
          clearTimeout(toast._t);
          toast._t = setTimeout(() => el.classList.remove('show'), 1400);
        }

        // i18n
        function applyLang() {
          document.documentElement.lang = lang;
          document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t(el.dataset.i18n); });
          document.querySelectorAll('[data-i18n-html]').forEach((el) => { el.innerHTML = t(el.dataset.i18nHtml); });
          document.querySelectorAll('[data-i18n-title]').forEach((el) => { el.title = t(el.dataset.i18nTitle); });
          document.querySelectorAll('[data-i18n-placeholder]').forEach((el) => { el.placeholder = t(el.dataset.i18nPlaceholder); });
          document.title = t('title');
          $('lang').value = lang;
          render();
        }

        // Theme
        const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
        const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
        function applyTheme(theme) {
          document.documentElement.dataset.theme = theme;
          $('theme').innerHTML = theme === 'dark' ? SUN : MOON;
          store.set('app_theme', theme);
        }

        // Events
        input.addEventListener('input', render);
        input.addEventListener('scroll', syncScroll);
        input.addEventListener('keyup', checkLineChange);
        input.addEventListener('mouseup', checkLineChange);
        input.addEventListener('focus', () => { lastLine = lineIndexAt(input.selectionStart); renderGutter(); });
        document.addEventListener('selectionchange', () => { if (document.activeElement === input) checkLineChange(); });
        input.addEventListener('blur', () => {
          if (autoFormat.checked) {
            normalizing = true;
            normalizeLineAt(lastLine, false);
            normalizing = false;
            render();
          }
          renderGutter();
        });

        autoFormat.addEventListener('change', () => store.set(STORE_AUTO, autoFormat.checked ? '1' : '0'));
        $('formatAll').addEventListener('click', formatAll);
        $('example').addEventListener('click', () => {
          input.value = t('exampleText');
          lastLine = 0;
          render();
          input.focus();
          input.setSelectionRange(input.value.length, input.value.length);
          lastLine = lineIndexAt(input.selectionStart);
        });
        $('clear').addEventListener('click', () => {
          if (input.value.trim() && !confirm(t('confirmClear'))) return;
          input.value = '';
          lastLine = 0;
          render();
          input.focus();
        });
        $('copy').addEventListener('click', async () => {
          const txt = $('total').textContent;
          try { await navigator.clipboard.writeText(txt); }
          catch {
            const ta = document.createElement('textarea');
            ta.value = txt; document.body.appendChild(ta); ta.select();
            document.execCommand('copy'); ta.remove();
          }
          toast(t('copied'));
        });
        $('lang').addEventListener('change', (e) => { lang = e.target.value; store.set('app_lang', lang); applyLang(); });
        $('theme').addEventListener('click', () => applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'));

        // Init
        applyTheme(store.get('app_theme') === 'light' ? 'light' : 'dark');
        autoFormat.checked = store.get(STORE_AUTO) !== '0';
        input.value = store.get(STORE_TEXT) || '';
        applyLang();
      })();
    </script>
  </body>
</html>
