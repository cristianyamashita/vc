<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <script id="hub-guard">/* Generated by scripts/build_hubs.py - edit the config there, not this file. */(function(){if(/[?&]hub=1(&|$)/.test(location.search)){document.documentElement.dataset.hub='1';return;}var h=location.hash?':'+location.hash.slice(1):'';location.replace("pixel_studio.html#vintage"+h);})();</script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Art Editor - Vintage Style</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <script>
        (function () {
            var theme = null;
            try { theme = localStorage.getItem('app_theme'); } catch (_) {}
            document.documentElement.dataset.theme = theme === 'light' ? 'light' : 'dark';
        })();
    </script>
    <style>
        :root {
            --machine-bg: linear-gradient(145deg, #f95738, #e84855);
            --machine-border: #4a4a4a;
            --screen-bg: #f3f3f3;
            --screen-border: #2c2c2c;
            --button-bg: linear-gradient(145deg, #00a8e8, #007ea7);
            --button-hover-bg: linear-gradient(145deg, #00bfff, #0096c7);
            --button-text: #ffffff;
            --text-color: #1a1a1a;
            --shadow-color: rgba(0,0,0,0.2);
            --highlight-color: rgba(255,255,255,0.3);
        }

        html, body { height: 100%; }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            background-color: #1e1e24;
            font-family: 'Press Start 2P', cursive;
            color: var(--text-color);
            padding: 8px;
            box-sizing: border-box;
            overflow: hidden;
        }

        html[data-theme="light"] body { background-color: #e7e4dc; }

        *, *::before, *::after { box-sizing: border-box; }

        #vintage-machine {
            --canvas-size: min(480px, calc(100vh - 16px - 12px - 28px - 30px));
            background: var(--machine-bg);
            border-radius: 22px;
            padding: 14px 16px;
            border: 6px solid var(--machine-border);
            box-shadow: 0 10px 24px rgba(0,0,0,0.4), inset 0 0 20px var(--shadow-color);
            display: flex;
            align-items: stretch;
            max-width: 100%;
            max-height: 100%;
            position: relative;
        }

        #vintage-machine::before, #vintage-machine::after {
            content: '';
            position: absolute;
            width: 10px;
            height: 10px;
            background: #ffdd00;
            border-radius: 50%;
            border: 2px solid var(--machine-border);
            box-shadow: 0 0 6px #ffdd00;
        }

        #vintage-machine::before {
            top: 4px;
            left: 4px;
        }

        #vintage-machine::after {
            top: 4px;
            right: 4px;
        }

        #header {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        #title {
            font-size: 13px;
            line-height: 1.4;
            color: var(--button-text);
            text-shadow: 2px 2px 0px var(--machine-border);
            margin: 0;
        }

        #language-selector {
            margin-top: 8px;
            display: flex;
            gap: 6px;
            justify-content: center;
        }

        html[data-hub] #language-selector { display: none; }

        .lang-btn {
            background: #4caf50;
            border: 2px solid var(--machine-border);
            font-family: inherit;
            font-size: 10px;
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
        }

        .lang-btn:hover {
            transform: translateY(-2px);
            background: #66bb6a;
        }
        
        .lang-btn.active {
            background: #81c784;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.3);
        }

        #main-content {
            display: flex;
            align-items: stretch;
            gap: 14px;
            min-height: 0;
        }

        #canvas-container {
            background-color: var(--screen-bg);
            border: 5px solid var(--screen-border);
            border-radius: 12px;
            padding: 10px;
            box-shadow: inset 0 0 15px var(--shadow-color);
            flex: none;
        }

        #pixel-canvas {
            cursor: crosshair;
            background-color: white;
            display: block;
            width: var(--canvas-size);
            height: var(--canvas-size);
        }

        #controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            width: 290px;
            min-height: 0;
            overflow: auto;
            background: rgba(0,0,0,0.1);
            padding: 12px;
            border-radius: 12px;
        }

        #color-palette {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 6px;
        }

        .color-swatch {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid transparent;
            transition: all 0.2s ease;
            box-shadow: 0 2px 5px var(--shadow-color);
        }

        .color-swatch:hover {
            transform: scale(1.1);
        }

        .color-swatch.selected {
            border-color: #fff;
            box-shadow: 0 0 10px #fff, 0 0 5px #000;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        label {
            font-size: 11px;
            color: var(--button-text);
            text-shadow: 1px 1px 2px var(--machine-border);
        }

        select, .btn {
            font-family: 'Press Start 2P', cursive;
            min-height: 32px;
            padding: 6px 12px;
            border-radius: 8px;
            border: 3px solid var(--machine-border);
            font-size: 11px;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 4px 0px var(--machine-border);
            transition: all 0.1s ease-in-out;
        }

        select {
            background: #fff;
            color: var(--text-color);
        }

        .btn {
            background: var(--button-bg);
            color: var(--button-text);
            text-transform: uppercase;
        }

        .btn:hover {
            background: var(--button-hover-bg);
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0px var(--machine-border);
        }

        .btn.help-btn {
            width: 32px;
            padding: 0;
            flex: none;
            box-shadow: 0 3px 0px var(--machine-border);
        }

        #action-buttons {
            display: flex;
            gap: 12px;
            margin-top: 4px;
        }

        #help-dialog {
            width: min(480px, calc(100vw - 32px));
            max-height: calc(100vh - 32px);
            padding: 0;
            border: 4px solid var(--machine-border);
            border-radius: 14px;
            background: #fffaf0;
            color: var(--text-color);
            font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans JP", sans-serif;
            font-size: 14px;
            line-height: 1.5;
        }

        #help-dialog::backdrop { background: rgb(0 0 0 / 45%); }

        #help-dialog .dlg-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 8px 12px;
            background: var(--machine-bg);
            color: #fff;
            font-weight: 700;
        }

        #help-dialog .dlg-head button {
            width: 28px;
            height: 28px;
            border: 2px solid var(--machine-border);
            border-radius: 6px;
            background: #fff;
            cursor: pointer;
            font-size: 16px;
            line-height: 1;
        }

        #help-dialog .dlg-body { padding: 10px 12px 12px; overflow: auto; }
        #help-dialog h3 { margin: 10px 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; opacity: .7; }
        #help-dialog p { margin: 0 0 6px; }
        #help-dialog ul { margin: 0; padding-left: 18px; }

        @media (max-width: 720px) {
            body {
                align-items: flex-start;
                overflow: auto;
                height: auto;
                min-height: 100%;
            }
            #vintage-machine {
                --canvas-size: min(480px, calc(100vw - 16px - 12px - 32px - 30px));
                max-height: none;
            }
            #main-content {
                flex-direction: column;
                align-items: center;
            }
            #controls {
                width: 100%;
                overflow: visible;
            }
        }
    </style>

</head>
<body>

<div id="vintage-machine">
    <div id="main-content">
        <div id="canvas-container">
            <canvas id="pixel-canvas" width="480" height="480"></canvas>
        </div>

        <div id="controls">
            <div id="header">
                <h1 id="title">Pixel Art Editor</h1>
                <button class="btn help-btn" id="help-btn" type="button" title="Help" aria-label="Help">?</button>
            </div>
            <div id="language-selector">
                <button class="lang-btn" data-lang="pt">PT</button>
                <button class="lang-btn active" data-lang="en">EN</button>
                <button class="lang-btn" data-lang="ja">JA</button>
            </div>

            <div id="color-palette"></div>

            <div class="control-group">
                <label for="grid-size" id="grid-size-label">Grid Size</label>
                <select id="grid-size">
                    <option value="16">16x16</option>
                    <option value="32" selected>32x32</option>
                    <option value="48">48x48</option>
                </select>
            </div>

            <div id="action-buttons">
                <button class="btn" id="clear-btn">Clear</button>
                <button class="btn" id="save-btn">Save</button>
            </div>
        </div>
    </div>
</div>

<dialog id="help-dialog">
    <div class="dlg-head">
        <span data-i18n="title">Pixel Art Editor</span>
        <button id="help-close" type="button" aria-label="Close">&times;</button>
    </div>
    <div class="dlg-body">
        <p data-i18n="helpIntro"></p>
        <h3 data-i18n="helpHowTitle"></h3>
        <ul>
            <li data-i18n="helpStep1"></li>
            <li data-i18n="helpStep2"></li>
            <li data-i18n="helpStep3"></li>
            <li data-i18n="helpStep4"></li>
        </ul>
        <h3 data-i18n="helpShortcutsTitle"></h3>
        <p data-i18n="helpShortcut"></p>
    </div>
</dialog>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        // --- DOM Elements ---
        const canvas = document.getElementById('pixel-canvas');
        const ctx = canvas.getContext('2d');
        const gridSizeSelector = document.getElementById('grid-size');
        const colorPaletteContainer = document.getElementById('color-palette');
        const clearBtn = document.getElementById('clear-btn');
        const saveBtn = document.getElementById('save-btn');
        const langBtns = document.querySelectorAll('.lang-btn');

        // --- Application State ---
        let gridSize = parseInt(gridSizeSelector.value, 10);
        let pixelSize = canvas.width / gridSize;
        let isDrawing = false;
        let currentColor = '#000000'; // Initial color: black
        let pixelData = [];

        // --- Translations ---
        const translations = {
            pt: {
                title: "Editor de Pixel Art",
                gridSizeLabel: "Tamanho da Grade",
                clearBtn: "Limpar",
                saveBtn: "Salvar",
                help: "Ajuda",
                close: "Fechar",
                helpIntro: "Um editor de pixel art com visual retrô. O desenho fica só nesta aba.",
                helpHowTitle: "Como usar",
                helpStep1: "Clique ou arraste na tela para pintar com a cor escolhida.",
                helpStep2: "Escolha uma cor na paleta; o branco funciona como borracha.",
                helpStep3: "Mudar o tamanho da grade limpa o desenho. Limpar apaga tudo.",
                helpStep4: "Salvar baixa pixel-art.png sem as linhas da grade.",
                helpShortcutsTitle: "Atalhos",
                helpShortcut: "? abre esta ajuda."
            },
            en: {
                title: "Pixel Art Editor",
                gridSizeLabel: "Grid Size",
                clearBtn: "Clear",
                saveBtn: "Save",
                help: "Help",
                close: "Close",
                helpIntro: "A retro-styled pixel art editor. The drawing stays in this tab only.",
                helpHowTitle: "How to use",
                helpStep1: "Click or drag on the screen to paint with the selected color.",
                helpStep2: "Pick a color from the palette; white works as an eraser.",
                helpStep3: "Changing the grid size clears the drawing. Clear erases everything.",
                helpStep4: "Save downloads pixel-art.png without the grid lines.",
                helpShortcutsTitle: "Shortcuts",
                helpShortcut: "? opens this help."
            },
            ja: {
                title: "ピクセルアートエディタ",
                gridSizeLabel: "グリッドサイズ",
                clearBtn: "クリア",
                saveBtn: "保存",
                help: "ヘルプ",
                close: "閉じる",
                helpIntro: "レトロな見た目のピクセルアートエディタです。絵はこのタブの中だけに残ります。",
                helpHowTitle: "使い方",
                helpStep1: "画面をクリックまたはドラッグして、選んだ色で塗ります。",
                helpStep2: "パレットから色を選びます。白は消しゴムとして使えます。",
                helpStep3: "グリッドサイズを変えると絵は消去されます。「クリア」ですべて消します。",
                helpStep4: "「保存」でグリッド線なしの pixel-art.png をダウンロードします。",
                helpShortcutsTitle: "ショートカット",
                helpShortcut: "? でこのヘルプを開きます。"
            }
        };

        // --- Color Palette ---
        const colors = [
            '#ffffff', '#c2c2c2', '#858585', '#4a4a4a', '#000000', '#ff4c4c', '#ff9b4c', '#ffff4c',
            '#95ff4c', '#4cff4c', '#4cffff', '#4c95ff', '#4c4cff', '#9b4cff', '#ff4cff', '#ff4c9b'
        ];

        // --- Main Functions ---

        /**
         * Initializes the color palette
         */
        function setupColorPalette() {
            colorPaletteContainer.innerHTML = '';
            colors.forEach(color => {
                const swatch = document.createElement('div');
                swatch.className = 'color-swatch';
                swatch.style.backgroundColor = color;
                swatch.dataset.color = color;
                if (color === currentColor) {
                    swatch.classList.add('selected');
                }
                swatch.addEventListener('click', () => {
                    currentColor = color;
                    document.querySelector('.color-swatch.selected').classList.remove('selected');
                    swatch.classList.add('selected');
                });
                colorPaletteContainer.appendChild(swatch);
            });
        }

        /**
         * Initializes or resets the pixel data matrix
         */
        function initializePixelData() {
            pixelData = Array(gridSize).fill(0).map(() => Array(gridSize).fill(null));
        }

        /**
         * Draws the grid on the canvas
         */
        function drawGrid() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#FFFFFF'; // White background
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Redraws the saved pixels
            for(let y = 0; y < gridSize; y++) {
                for (let x = 0; x < gridSize; x++) {
                    if (pixelData[y][x]) {
                        ctx.fillStyle = pixelData[y][x];
                        ctx.fillRect(x * pixelSize, y * pixelSize, pixelSize, pixelSize);
                    }
                }
            }

            // Draws the grid lines
            ctx.strokeStyle = '#e0e0e0';
            ctx.lineWidth = 1;
            for (let i = 0; i <= gridSize; i++) {
                // Vertical lines
                ctx.beginPath();
                ctx.moveTo(i * pixelSize, 0);
                ctx.lineTo(i * pixelSize, canvas.height);
                ctx.stroke();
                // Horizontal lines
                ctx.beginPath();
                ctx.moveTo(0, i * pixelSize);
                ctx.lineTo(canvas.width, i * pixelSize);
                ctx.stroke();
            }
        }

        /**
         * Paints a pixel on the canvas
         * @param {MouseEvent} e - The mouse event
         */
        function paintPixel(e) {
            if (!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            const x = Math.floor(((e.clientX - rect.left) * scaleX) / pixelSize);
            const y = Math.floor(((e.clientY - rect.top) * scaleY) / pixelSize);

            if (x >= 0 && x < gridSize && y >= 0 && y < gridSize) {
                // Saves the color in the data matrix
                pixelData[y][x] = currentColor;
                
                // Paints the rectangle on the canvas
                ctx.fillStyle = currentColor;
                ctx.fillRect(x * pixelSize, y * pixelSize, pixelSize, pixelSize);

                // Redraws the grid line over the pixel to maintain visibility
                ctx.strokeStyle = '#e0e0e0';
                ctx.lineWidth = 1;
                ctx.strokeRect(x * pixelSize, y * pixelSize, pixelSize, pixelSize);
            }
        }

        /**
         * Updates the grid size
         */
        function updateGridSize() {
            gridSize = parseInt(gridSizeSelector.value, 10);
            pixelSize = canvas.width / gridSize;
            initializePixelData();
            drawGrid();
        }

        /**
         * Clears the canvas
         */
        function clearCanvas() {
            initializePixelData();
            drawGrid();
        }

        /**
         * Saves the art as a PNG image
         */
        function saveArt() {
            // Creates a temporary canvas to draw the art without grid lines
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = canvas.width;
            tempCanvas.height = canvas.height;
            const tempCtx = tempCanvas.getContext('2d');

            // Paints the white background
            tempCtx.fillStyle = '#FFFFFF';
            tempCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);

            // Draws each pixel from the data matrix
            for (let y = 0; y < gridSize; y++) {
                for (let x = 0; x < gridSize; x++) {
                    if (pixelData[y][x]) {
                        tempCtx.fillStyle = pixelData[y][x];
                        tempCtx.fillRect(x * pixelSize, y * pixelSize, pixelSize, pixelSize);
                    }
                }
            }
            
            // Creates a download link
            const link = document.createElement('a');
            link.download = 'pixel-art.png';
            link.href = tempCanvas.toDataURL('image/png');
            link.click();
        }
        
        /**
         * Changes the interface language
         * @param {string} lang - The language code (pt, en, ja)
         */
        function changeLanguage(lang) {
            const t = translations[lang];
            document.getElementById('title').innerText = t.title;
            document.getElementById('grid-size-label').innerText = t.gridSizeLabel;
            document.getElementById('clear-btn').innerText = t.clearBtn;
            document.getElementById('save-btn').innerText = t.saveBtn;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.dataset.i18n;
                if (t[key]) el.textContent = t[key];
            });
            ['help-btn', 'help-close'].forEach(id => {
                const label = id === 'help-btn' ? t.help : t.close;
                const el = document.getElementById(id);
                el.title = label;
                el.setAttribute('aria-label', label);
            });
            document.documentElement.lang = lang;

            // Updates the active button
            langBtns.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === lang);
            });
        }

        // --- Event Listeners Configuration ---
        gridSizeSelector.addEventListener('change', updateGridSize);
        clearBtn.addEventListener('click', clearCanvas);
        saveBtn.addEventListener('click', saveArt);

        canvas.addEventListener('mousedown', (e) => {
            isDrawing = true;
            paintPixel(e);
        });
        canvas.addEventListener('mousemove', paintPixel);
        canvas.addEventListener('mouseup', () => {
            isDrawing = false;
        });
        canvas.addEventListener('mouseleave', () => {
            isDrawing = false;
        });
        
        langBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                try { localStorage.setItem('app_lang', btn.dataset.lang); } catch (_) {}
                changeLanguage(btn.dataset.lang);
            });
        });

        // --- Help dialog ---
        const helpDialog = document.getElementById('help-dialog');
        document.getElementById('help-btn').addEventListener('click', () => helpDialog.showModal());
        document.getElementById('help-close').addEventListener('click', () => helpDialog.close());
        helpDialog.addEventListener('click', (e) => { if (e.target === helpDialog) helpDialog.close(); });
        document.addEventListener('keydown', (e) => {
            const el = e.target;
            const typing = el && (el.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName));
            if (e.key === '?' && !typing && !helpDialog.open) {
                e.preventDefault();
                helpDialog.showModal();
            }
        });

        // --- Initialization ---
        function init() {
            setupColorPalette();
            initializePixelData();
            drawGrid();
            let lang = null;
            try { lang = localStorage.getItem('app_lang'); } catch (_) {}
            changeLanguage(translations[lang] ? lang : 'en'); // Shared language, English by default
        }

        init();
    });
</script>

</body>
