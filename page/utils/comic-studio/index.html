<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Comic Studio</title>
    <link
      rel="icon"
      href="../../assets/icons/ico/utils-comic-studio.ico"
      type="image/x-icon"
    />
    <style>
      :root {
        color-scheme: light;
        --bg: #edf0ef;
        --surface: #fff;
        --ink: #233b38;
        --muted: #71837f;
        --line: #d8e1de;
        --accent: #008f7d;
        --wash: #e4f4ef;
        --stage: #d9e1de;
        --danger: #bd4651;
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --bg: #151d1c;
        --surface: #1e2927;
        --ink: #e2eeea;
        --muted: #9aafa7;
        --line: #344541;
        --accent: #50c5af;
        --wash: #253f38;
        --stage: #111a18;
        --danger: #ff8790;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      body {
        font:
          12px system-ui,
          sans-serif;
        color: var(--ink);
        background: var(--bg);
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      button,
      select,
      input[type="number"],
      input[type="text"] {
        height: 30px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--surface);
        padding: 4px 8px;
        min-width: 0;
      }
      button {
        cursor: pointer;
        white-space: nowrap;
      }
      button:hover:not(:disabled) {
        border-color: var(--accent);
        background: var(--wash);
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      button.primary,
      button.active {
        background: var(--accent);
        color: var(--surface);
        border-color: var(--accent);
      }
      button.danger {
        color: var(--danger);
      }
      button.icon {
        min-width: 30px;
        padding: 3px 7px;
        font-size: 16px;
      }
      button:focus-visible,
      select:focus-visible,
      input:focus-visible,
      textarea:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      [hidden] {
        display: none !important;
      }
      .app {
        height: 100%;
        display: grid;
        grid-template-rows: 44px minmax(0, 1fr);
      }
      .topbar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 12px;
        border-bottom: 1px solid var(--line);
        background: var(--surface);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        white-space: nowrap;
      }
      .brand img {
        width: 18px;
        height: 18px;
      }
      .brand strong {
        font-size: 15px;
        font-weight: 650;
      }
      .spacer {
        flex: 1;
      }
      .workbench {
        display: grid;
        grid-template-columns: 184px minmax(0, 1fr) 208px;
        min-height: 0;
      }
      .library,
      .inspector {
        background: var(--surface);
        min-height: 0;
        overflow: auto;
        padding: 12px;
      }
      .library {
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .inspector {
        border-left: 1px solid var(--line);
      }
      .section-label {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 0 0 6px;
      }
      .row {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .row > select,
      .row > .grow {
        flex: 1;
        min-width: 0;
      }
      .row + .row {
        margin-top: 6px;
      }
      label {
        display: block;
        color: var(--muted);
        margin: 10px 0 5px;
      }
      select.full,
      button.full,
      input.full {
        width: 100%;
      }
      .page-list {
        flex: 1;
        min-height: 60px;
        overflow: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 2px;
      }
      .page-card {
        height: 88px;
        flex-shrink: 0;
        padding: 6px;
        display: flex;
        align-items: center;
        gap: 10px;
        text-align: left;
        background: var(--bg);
        position: relative;
      }
      .page-card.active {
        background: var(--wash);
        color: var(--ink);
        box-shadow: 0 0 0 1px var(--accent);
      }
      .page-card.drag-over {
        border: 2px dashed var(--accent);
      }
      .page-card canvas {
        width: 49px;
        height: 69px;
        background: #fff;
        border: 1px solid var(--line);
      }
      .page-card .number {
        font-size: 15px;
        font-weight: 650;
        display: block;
      }
      .page-card .small {
        display: block;
        color: var(--muted);
        font-size: 10px;
        margin-top: 5px;
      }
      .page-tools {
        border-top: 1px solid var(--line);
        padding-top: 8px;
      }
      .editor {
        min-width: 0;
        min-height: 0;
        display: grid;
        grid-template-rows: 40px minmax(0, 1fr) 26px;
      }
      .toolbar {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border-bottom: 1px solid var(--line);
        overflow-x: auto;
      }
      .toolbar button {
        height: 28px;
      }
      .stage {
        min-height: 0;
        overflow: hidden;
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 14px;
        background-color: var(--stage);
        background-image: radial-gradient(var(--line) 1px, transparent 1px);
        background-size: 16px 16px;
      }
      #sheet {
        display: block;
        background: white;
        box-shadow: 0 6px 28px #0003;
        touch-action: none;
        outline: none;
      }
      #sheet:focus-visible {
        outline: 2px solid var(--accent);
      }
      .empty {
        position: absolute;
        text-align: center;
        max-width: 240px;
        color: var(--muted);
        padding: 14px;
      }
      .empty p {
        line-height: 1.6;
      }
      .statusbar {
        padding: 5px 10px;
        display: flex;
        gap: 8px;
        align-items: center;
        color: var(--muted);
        font-size: 10px;
        border-top: 1px solid var(--line);
      }
      #save-status.error {
        color: var(--danger);
      }
      h2 {
        font-size: 13px;
        margin: 0 0 12px;
        font-weight: 650;
      }
      .inspector section + section {
        margin-top: 16px;
        padding-top: 12px;
        border-top: 1px solid var(--line);
      }
      .hint {
        color: var(--muted);
        font-size: 11px;
        line-height: 1.5;
      }
      .chip {
        padding: 3px 6px;
        background: var(--wash);
        border-radius: 4px;
        color: var(--accent);
        font-size: 10px;
      }
      input[type="range"] {
        width: 100%;
        accent-color: var(--accent);
        margin: 4px 0;
      }
      textarea {
        width: 100%;
        height: 92px;
        resize: vertical;
        min-height: 60px;
        max-height: 220px;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 8px;
        line-height: 1.5;
      }
      .two {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .two input,
      .two select {
        width: 100%;
      }
      input[type="color"] {
        height: 30px;
        width: 100%;
        border: 1px solid var(--line);
        background: var(--surface);
        padding: 2px;
        border-radius: 5px;
      }
      dialog {
        width: min(540px, calc(100% - 24px));
        max-height: calc(100% - 24px);
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 12px;
        color: var(--ink);
        background: var(--surface);
        padding: 18px;
        box-shadow: 0 20px 80px #0005;
      }
      dialog::backdrop {
        background: #0c252b80;
        backdrop-filter: blur(3px);
      }
      dialog h2 {
        font-size: 16px;
      }
      .dialog-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 12px;
      }
      .dialog-title h2 {
        margin: 0;
      }
      dialog p,
      dialog li {
        line-height: 1.7;
        color: var(--muted);
      }
      dialog li {
        margin-bottom: 9px;
      }
      dialog .actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 18px;
      }
      #toast {
        position: fixed;
        bottom: 40px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--ink);
        color: var(--surface);
        border-radius: 8px;
        padding: 10px 14px;
        max-width: 80vw;
        z-index: 10;
        box-shadow: 0 3px 14px #0003;
        pointer-events: none;
      }
      .mode-badge {
        font-size: 10px;
        color: var(--muted);
        white-space: nowrap;
      }
      #export-progress {
        display: block;
        min-height: 20px;
        color: var(--accent);
        margin-top: 12px;
      }
      .compact-title {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      body.busy .workbench {
        pointer-events: none;
        opacity: 0.65;
      }
      @media (max-width: 719px) {
        .workbench {
          grid-template-columns: 134px minmax(0, 1fr);
          grid-template-rows: minmax(0, 1fr) 170px;
        }
        .library {
          grid-row: 1 / 3;
          padding: 8px;
        }
        .inspector {
          grid-column: 2;
          grid-row: 2;
          border-top: 1px solid var(--line);
          padding: 10px;
        }
        .inspector section + section {
          margin-top: 8px;
          padding-top: 8px;
        }
        .brand strong {
          font-size: 13px;
        }
        .topbar {
          padding: 0 8px;
          gap: 5px;
        }
        .toolbar {
          padding: 4px;
          gap: 4px;
        }
        .page-card {
          gap: 6px;
        }
        .page-card canvas {
          width: 38px;
          height: 54px;
        }
        .page-card .small {
          display: none;
        }
        .stage {
          padding: 9px;
        }
        .topbar .export-label {
          display: none;
        }
        .mode-badge {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="topbar">
        <div class="brand">
          <img
            src="../../assets/icons/svg/utils-comic-studio.svg"
            alt=""
          /><strong data-i18n="title">Comic Studio</strong>
        </div>
        <span class="spacer"></span
        ><button id="export-open">
          <span>↗ </span><span data-i18n="export">Export</span></button
        ><button id="help-open" class="icon" data-title="help">?</button
        ><select id="lang-switcher" aria-label="Language">
          <option value="en">EN</option>
          <option value="pt">PT</option>
          <option value="ja">JA</option></select
        ><button id="theme-switcher" class="icon" data-title="theme">◐</button>
      </div>
      <div class="workbench">
        <aside class="library">
          <div>
            <div class="row">
              <div class="section-label grow" data-i18n="project">Project</div>
              <button
                id="project-file-open"
                class="icon"
                data-title="projectFiles"
              >
                ⇅
              </button>
            </div>
            <div class="row">
              <select id="project-select" data-title="project"></select
              ><button id="project-new" class="icon" data-title="newProject">
                +
              </button>
            </div>
            <div class="row">
              <button id="project-rename" class="grow" data-i18n="rename">
                Rename</button
              ><button
                id="project-delete"
                class="icon danger"
                data-title="deleteProject"
              >
                ×
              </button>
            </div>
            <label for="project-format" data-i18n="sheetFormat"
              >Page format</label
            >
            <select id="project-format" class="full"></select>
          </div>
          <div>
            <div class="section-label" data-i18n="issue">Issue</div>
            <div class="row">
              <select id="issue-select" data-title="issue"></select
              ><button id="issue-new" class="icon" data-title="newIssue">
                +
              </button>
            </div>
            <div class="row">
              <button id="issue-rename" class="grow" data-i18n="rename">
                Rename</button
              ><button
                id="issue-delete"
                class="icon danger"
                data-title="deleteIssue"
              >
                ×
              </button>
            </div>
          </div>
          <div class="row">
            <span class="section-label grow" data-i18n="pages">Pages</span
            ><button id="page-new" class="icon" data-title="addPage">+</button>
          </div>
          <div class="page-list" id="page-list"></div>
          <div class="page-tools">
            <select id="page-action" class="full" data-title="pageActions">
              <option value="" data-i18n="pageActions">Page actions…</option>
              <option value="before" data-i18n="insertBefore">
                Insert before
              </option>
              <option value="after" data-i18n="insertAfter">
                Insert after
              </option>
              <option value="duplicate" data-i18n="duplicate">Duplicate</option>
              <option value="delete" data-i18n="deletePage">Delete page</option>
            </select>
            <div class="row">
              <button id="page-up" class="icon" data-title="moveUp">↑</button
              ><select id="page-position" data-title="moveTo"></select
              ><button id="page-down" class="icon" data-title="moveDown">
                ↓
              </button>
            </div>
          </div>
        </aside>
        <main class="editor">
          <div class="toolbar">
            <button id="mode-edit" class="active" data-i18n="compose">
              Compose</button
            ><button id="mode-cut" data-i18n="cuts">Cuts</button
            ><span class="spacer"></span
            ><button id="undo" class="icon" data-title="undo">↶</button
            ><button id="redo" class="icon" data-title="redo">↷</button>
          </div>
          <div class="stage" id="stage">
            <canvas
              id="sheet"
              width="840"
              height="1188"
              tabindex="0"
              data-title="canvas"
            ></canvas>
            <div id="empty" class="empty" hidden>
              <h2 data-i18n="emptyTitle">Your next story starts here</h2>
              <p data-i18n="emptyText">
                Create a project and an issue, then add a page.
              </p>
              <button id="empty-create" class="primary" data-i18n="start">
                Create a project
              </button>
            </div>
          </div>
          <div class="statusbar">
            <span id="page-status"></span><span class="spacer"></span
            ><span id="save-status" role="status"></span>
          </div>
        </main>
        <aside class="inspector">
          <section id="layout-tools" hidden>
            <h2 data-i18n="layout">Page layout</h2>
            <div class="row">
              <button id="cut-draw" class="grow active" data-i18n="drawCuts">
                Draw</button
              ><button id="cut-edit" class="grow" data-i18n="editCuts">
                Edit
              </button>
            </div>
            <div id="cut-selection-tools" hidden>
              <label for="cut-select" data-i18n="cutLine">Cut</label>
              <select id="cut-select" class="full"></select>
              <button
                id="cut-remove"
                class="full danger"
                style="margin-top: 8px"
                data-i18n="deleteCut"
              >
                Delete selected cut
              </button>
            </div>
            <span
              id="cut-mode-badge"
              class="chip"
              style="display: inline-block; margin-top: 10px"
              data-i18n="cutBadge"
              >Edge → edge</span
            ><label for="gutter" data-i18n="gutter">Panel spacing</label
            ><input id="gutter" type="range" min="0" max="32" step="2" />
            <div class="row">
              <span class="hint" id="gutter-value"></span
              ><span class="spacer"></span
              ><span class="hint" id="sheet-format-label"></span>
            </div>
            <label for="reuse-page" data-i18n="reuseFrom"
              >Reuse cuts from page</label
            >
            <div class="row">
              <select id="reuse-page"></select
              ><button id="reuse" data-i18n="apply">Apply</button>
            </div>
            <button
              id="reset-layout"
              class="full"
              style="margin-top: 12px"
              data-i18n="resetCuts"
            >
              Reset cuts
            </button>
          </section>
          <section id="compose-tools">
            <h2 id="selection-title" data-i18n="panel">Panel</h2>
            <div id="balloon-layers" hidden>
              <label for="balloon-layer" data-i18n="balloonLayers"
                >Balloons: back → front</label
              >
              <select id="balloon-layer" class="full"></select>
            </div>
            <div id="image-tools">
              <div id="image-layers" hidden>
                <label for="image-layer" data-i18n="panelImages"
                  >Panel images</label
                ><select id="image-layer" class="full"></select
                ><button
                  id="image-front"
                  class="full"
                  style="margin: 6px 0"
                  data-i18n="imageFront"
                >
                  Bring image to front
                </button>
              </div>
              <button id="image-add" class="primary full" data-i18n="addImage">
                Add image</button
              ><label for="image-zoom" data-i18n="zoom">Zoom</label
              ><input
                id="image-zoom"
                type="range"
                min="0.25"
                max="5"
                step="0.01"
              />
              <div class="row">
                <span id="zoom-value" class="hint">100%</span
                ><span class="spacer"></span
                ><button id="image-fit" data-i18n="fit">Reset</button>
              </div>
              <div class="two">
                <div>
                  <label for="image-x">X</label
                  ><input
                    id="image-x"
                    type="number"
                    min="-3000"
                    max="3000"
                    step="5"
                  />
                </div>
                <div>
                  <label for="image-y">Y</label
                  ><input
                    id="image-y"
                    type="number"
                    min="-3000"
                    max="3000"
                    step="5"
                  />
                </div>
              </div>
              <button
                id="image-remove"
                class="full danger"
                style="margin-top: 10px"
                data-i18n="removeImage"
              >
                Remove image
              </button>
            </div>
            <div id="balloon-tools" hidden>
              <label for="balloon-text" data-i18n="text">Text</label
              ><textarea id="balloon-text" maxlength="1200"></textarea>
              <div class="two">
                <div>
                  <label for="balloon-width" data-i18n="width">Width</label
                  ><input id="balloon-width" type="number" min="80" max="780" />
                </div>
                <div>
                  <label for="balloon-height" data-i18n="height">Height</label
                  ><input
                    id="balloon-height"
                    type="number"
                    min="60"
                    max="1080"
                  />
                </div>
              </div>
              <div class="two">
                <div>
                  <label for="balloon-font" data-i18n="fontSize"
                    >Text size</label
                  ><input id="balloon-font" type="number" min="12" max="80" />
                </div>
                <div>
                  <label for="balloon-color" data-i18n="fill">Fill</label
                  ><input id="balloon-color" type="color" />
                </div>
              </div>
              <label for="balloon-kind" data-i18n="style">Style</label
              ><select id="balloon-kind" class="full"></select>
              <div class="row" style="margin-top: 10px">
                <button
                  id="balloon-back"
                  class="grow"
                  data-i18n="back"
                  data-title="sendBack"
                >
                  Back</button
                ><button
                  id="balloon-front"
                  class="grow"
                  data-i18n="front"
                  data-title="sendFront"
                >
                  Front</button
                ><button
                  id="balloon-remove"
                  class="icon danger"
                  data-title="deleteBalloon"
                >
                  ×
                </button>
              </div>
            </div>
          </section>
          <section id="add-balloon-tools">
            <h2 data-i18n="balloons">Balloons</h2>
            <select
              id="new-balloon-kind"
              class="full"
              data-title="style"
            ></select
            ><button
              id="balloon-add"
              class="full"
              style="margin-top: 8px"
              data-i18n="addBalloon"
            >
              + Add balloon
            </button>
          </section>
        </aside>
      </div>
    </div>
    <input
      type="file"
      id="image-file"
      accept="image/png,image/jpeg,image/webp,image/gif,image/avif"
      hidden
    />
    <dialog id="help-dialog">
      <div class="dialog-title">
        <h2 data-i18n="helpTitle">Making a comic</h2>
        <button class="icon" data-close="help-dialog" data-title="close">
          ×
        </button>
      </div>
      <ol>
        <li data-i18n="helpOrganize"></li>
        <li data-i18n="helpFormats"></li>
        <li data-i18n="helpCuts"></li>
        <li data-i18n="helpImages"></li>
        <li data-i18n="helpBalloons"></li>
        <li data-i18n="helpExport"></li>
        <li data-i18n="helpProjectFile"></li>
      </ol>
      <p data-i18n="helpKeys"></p>
      <p data-i18n="helpStorage"></p>
      <a
        href="../backup.html"
        target="_blank"
        rel="noopener"
        data-i18n="openBackup"
      ></a>
    </dialog>
    <dialog id="name-dialog">
      <form id="name-form">
        <h2 id="name-title"></h2>
        <input
          id="name-input"
          class="full"
          type="text"
          maxlength="100"
          required
          autocomplete="off"
        />
        <div id="name-format-group" hidden>
          <label for="name-format" data-i18n="sheetFormat">Page format</label>
          <select id="name-format" class="full"></select>
        </div>
        <div class="actions">
          <button type="button" data-close="name-dialog" data-i18n="cancel">
            Cancel</button
          ><button type="submit" class="primary" data-i18n="save">Save</button>
        </div>
      </form>
    </dialog>
    <dialog id="confirm-dialog">
      <h2 data-i18n="confirmTitle">Confirm</h2>
      <p id="confirm-text"></p>
      <div class="actions">
        <button data-close="confirm-dialog" data-i18n="cancel">Cancel</button
        ><button id="confirm-yes" class="danger" data-i18n="continue">
          Continue

      const MAX_PROJECT_FILE_BYTES = 256 * 1024 * 1024;
      let projectIOBusy = false;
      class ProjectFileError extends Error {}
      function projectFileError(key = "invalidProjectFile") {
        throw new ProjectFileError(key);
      }
      function referencedAssets(p) {
        return new Set(
          p.issues.flatMap((i) =>
            i.pages.flatMap((pg) =>
              pg.panels.flatMap((panel) =>
                panelImages(panel).map((im) => im.asset),
              ),
            ),
          ),
        );
      }
      function blobToBase64(blob) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () =>
            resolve(reader.result.slice(reader.result.indexOf(",") + 1));
          reader.onerror = () => reject(reader.error);
          reader.readAsDataURL(blob);
        });
      }
      async function createProjectFile(p, progress = () => {}) {
        const snapshot = clone(p),
          ids = [...referencedAssets(snapshot)],
          assets = [];
        const tx = db.transaction("assets"),
          store = tx.objectStore("assets");
        const records = await Promise.all(
          ids.map((id) => request(store.get(id))),
        );
        let estimatedBytes = new TextEncoder().encode(
          JSON.stringify(snapshot),
        ).length;
        for (let n = 0; n < records.length; n++) {
          const record = records[n];
          if (!(record?.blob instanceof Blob)) projectFileError("missingImage");
          estimatedBytes += Math.ceil(record.blob.size / 3) * 4 + 256;
          if (estimatedBytes > MAX_PROJECT_FILE_BYTES)
            projectFileError("projectFileTooLarge");
          progress(n + 1, records.length);
          assets.push({
            id: ids[n],
            type: record.blob.type,
            data: await blobToBase64(record.blob),
          });
        }
        const blob = new Blob(
          [
            JSON.stringify({
              format: PROJECT_FILE_FORMAT,
              version: PROJECT_FILE_VERSION,
              exportedAt: new Date().toISOString(),
              project: snapshot,
              assets,
            }),
          ],
          { type: "application/json" },
        );
        if (blob.size > MAX_PROJECT_FILE_BYTES)
          projectFileError("projectFileTooLarge");
        return blob;
      }
      function validateProjectFile(raw) {
        const object = (value) => {
          if (!value || typeof value !== "object" || Array.isArray(value))
            projectFileError();
          return value;
        };
        const text = (value, max, nonempty = false) => {
          if (
            typeof value !== "string" ||
            value.length > max ||
            (nonempty && !value.trim())
          )
            projectFileError();
          return value;
        };
        const list = (value, max, min = 0) => {
          if (!Array.isArray(value) || value.length < min || value.length > max)
            projectFileError();
          return value;
        };
        const num = (value, min, max) => {
          if (!Number.isFinite(value) || value < min || value > max)
            projectFileError();
          return value;
        };
        object(raw);
        if (raw.format !== PROJECT_FILE_FORMAT) projectFileError();
        if (![1, PROJECT_FILE_VERSION].includes(raw.version))
          projectFileError("projectFileVersion");
        const source = object(raw.project);
        if (
          typeof source.format !== "string" ||
          !Object.hasOwn(PAGE_FORMATS, source.format)
        )
          projectFileError();
        const size = PAGE_FORMATS[source.format],
          assetMap = new Map();
        let bytes = 0,
          pageCount = 0,
          panelCount = 0,
          balloonCount = 0;
        for (const a of list(raw.assets, 5000)) {
          object(a);
          const id = text(a.id, 100, true);
          if (assetMap.has(id)) projectFileError();
          text(a.type, 128);
          const data = text(a.data, Math.ceil((40 * 1024 * 1024) / 3) * 4);
          if (!data.length || /[^A-Za-z0-9+/=]/.test(data)) projectFileError();
          let binary;
          try {
            binary = atob(data);
          } catch {
            projectFileError();
          }
          bytes += binary.length;
          if (
            binary.length > 40 * 1024 * 1024 ||
            bytes > MAX_PROJECT_FILE_BYTES
          )
            projectFileError("projectFileTooLarge");
          const buffer = Uint8Array.from(binary, (ch) => ch.charCodeAt(0));
          assetMap.set(id, {
            id: uid(),
            blob: new Blob([buffer], { type: a.type }),
          });
        }
        const used = new Set();
        const imported = {
          id: uid(),
          name: text(source.name, 100, true),
          format: source.format,
          issues: [],
        };
        for (const i of list(source.issues, 2000)) {
          object(i);
          const edition = {
            id: uid(),
            name: text(i.name, 100, true),
            pages: [],
          };
          for (const pg of list(i.pages, 2000)) {
            object(pg);
            if (++pageCount > 2000 || pg.format !== source.format)
              projectFileError();
            const sheet = {
              id: uid(),
              format: source.format,
              gutter: num(pg.gutter, 0, 32),
              panels: [],
              balloons: [],
            };
            if (pg.removedCuts !== undefined)
              sheet.removedCuts = list(pg.removedCuts, 1000).map((c) => {
                object(c);
                object(c.a);
                object(c.b);
                const a = {
                    x: num(c.a.x, -0.001, size.w + 0.001),
                    y: num(c.a.y, -0.001, size.h + 0.001),
                  },
                  b = {
                    x: num(c.b.x, -0.001, size.w + 0.001),
                    y: num(c.b.y, -0.001, size.h + 0.001),
                  };
                if (Math.hypot(b.x - a.x, b.y - a.y) < 0.01) projectFileError();
                return { a, b };
              });
            for (const p of list(pg.panels, 1000, 1)) {
              object(p);
              if (++panelCount > 20000) projectFileError();
              const readCell = (value) => {
                const points = list(value, 128, 3).map((point) => {
                  object(point);
                  return {
                    x: num(point.x, M - 0.001, size.w - M + 0.001),
                    y: num(point.y, M - 0.001, size.h - M + 0.001),
                  };
                });
                if (
                  area(points) < 1 ||
                  points.some((a, n) =>
                    points.some(
                      (c) =>
                        cross(a, points[(n + 1) % points.length], c) < -0.01,
                    ),
                  )
                )
                  projectFileError();
                return points;
              };
              const cells =
                p.cells === undefined
                  ? [readCell(p.points)]
                  : list(p.cells, 1000, 1).map(readCell);
              const panel = panelFromCells(cells, uid());
              const readImage = (value) => {
                const im = object(value),
                  asset = text(im.asset, 100, true);
                if (!assetMap.has(asset))
                  projectFileError("projectFileMissingImage");
                used.add(asset);
                const image = {
                  asset: assetMap.get(asset).id,
                  zoom: num(im.zoom, 0.00001, 10000),
                  x: num(im.x, -1e7, 1e7),
                  y: num(im.y, -1e7, 1e7),
                };
                if (im.frame !== undefined) {
                  const f = object(im.frame);
                  image.frame = {
                    x: num(f.x, -0.001, size.w + 0.001),
                    y: num(f.y, -0.001, size.h + 0.001),
                    w: num(f.w, 0.001, size.w + 0.001),
                    h: num(f.h, 0.001, size.h + 0.001),
                  };
                }
                return image;
              };
              if (p.image !== null) panel.image = readImage(p.image);
              if (p.extraImages !== undefined)
                panel.extraImages = list(p.extraImages, 1000).map(readImage);

              sheet.panels.push(panel);
            }
            for (const b of list(pg.balloons, 1000)) {
              object(b);
              object(b.tail);
              if (
                ++balloonCount > 20000 ||
                !kinds.includes(b.kind) ||
                typeof b.fill !== "string" ||
                !/^#[a-f\d]{6}$/i.test(b.fill)
              )
                projectFileError();
              const balloon = {
                id: uid(),
                kind: b.kind,
                x: num(b.x, 0, size.w),
                y: num(b.y, 0, size.h),
                w: num(b.w, 1, size.w),
                h: num(b.h, 1, size.h),
                tail: {
                  x: num(b.tail.x, -1e5, 1e5),
                  y: num(b.tail.y, -1e5, 1e5),
                },
                font: num(b.font, 1, 80),
                fill: b.fill,
                text: text(b.text, 1200),
              };
              if (
                balloon.x + balloon.w > size.w + 0.001 ||
                balloon.y + balloon.h > size.h + 0.001
              )
                projectFileError();
              sheet.balloons.push(balloon);
            }
            upgradeMergedCuts(sheet);
            edition.pages.push(sheet);
          }
          imported.issues.push(edition);
        }
        if (used.size !== assetMap.size) projectFileError();
        return { project: imported, assets: [...assetMap.values()] };
      }
      function uniqueProjectName(name) {
        const names = new Set(projects.map((p) => p.name));
        if (!names.has(name)) return name;
        for (let n = 2; ; n++) {
          const suffix = ` (${n})`,
            candidate = name.slice(0, 100 - suffix.length) + suffix;
          if (!names.has(candidate)) return candidate;
        }
      }
      async function importProjectFile(file, progress = () => {}) {
        if (file.size > MAX_PROJECT_FILE_BYTES)
          projectFileError("projectFileTooLarge");
        let raw;
        try {
          raw = JSON.parse(await file.text());
        } catch {
          projectFileError();
        }
        const imported = validateProjectFile(raw);
        // Decode before opening a write transaction: invalid images must not leave partial data.
        for (let n = 0; n < imported.assets.length; n++) {
          progress(n + 1, imported.assets.length);
          let image;
          try {
            image = await decodeImage(imported.assets[n].blob);
          } catch {
            projectFileError("projectFileInvalidImage");
          }
          if (image.naturalWidth * image.naturalHeight > 60000000)
            projectFileError("tooLarge");
        }
        if (stale) projectFileError("storageChanged");
        imported.project.name = uniqueProjectName(imported.project.name);
        const tx = db.transaction(["projects", "assets"], "readwrite"),
          done = txDone(tx);
        try {
          for (const asset of imported.assets)
            tx.objectStore("assets").put(asset);
          tx.objectStore("projects").add(imported.project);
        } catch (error) {
          tx.abort();
          await done.catch(() => {});
          throw error;
        }
        await done;
        // Publish to the editor only after every image and the project have committed.
        projects.push(imported.project);
        selection = { project: imported.project.id };
        selectedPanel = selectedBalloon = null;
        gesture = null;
        renderUI();
        savePrefs();
        channel?.postMessage("changed");
        return imported.project;
      }
      function projectFileProgress(n, total) {
        $("project-file-status").textContent =
          `${t("projectFileImages")} ${n} / ${total}`;
      }
      async function runProjectFile(action) {
        if (!ready || stale || projectIOBusy || exportBusy || importing) return;
        projectIOBusy = true;
        importing++;
        $("project-file-status").textContent = t("projectFileWorking");
        for (const id of [
          "project-file-export",
          "project-file-import",
          "project-file-close",
        ])
          $(id).disabled = true;
        document.body.classList.add("busy");
        try {
          await action();
        } catch (error) {
          console.error(error);
          $("project-file-status").textContent = t(
            error instanceof ProjectFileError
              ? error.message
              : "projectFileFailed",
          );
        } finally {
          importing--;
          projectIOBusy = false;
          $("project-file-export").disabled = !project();
          $("project-file-import").disabled = $("project-file-close").disabled =
            false;
          if (!stale) document.body.classList.remove("busy");
        }
      }
      $("project-file-open").onclick = () => {
        if (!ready || stale || exportingOrImporting()) return;
        $("project-file-export").disabled = !project();
        $("project-file-status").textContent = "";
        $("project-file-dialog").showModal();
      };
      function exportingOrImporting() {
        return projectIOBusy || exportBusy || importing > 0;
      }
      $("project-file-dialog").addEventListener("cancel", (e) => {
        if (projectIOBusy) e.preventDefault();
      });
      $("project-file-export").onclick = () =>
        runProjectFile(async () => {
          const p = project();
          if (!p) return;
          const blob = await createProjectFile(p, projectFileProgress);
          const stem = p.name.replace(/[\\/:*?"<>|\u0000-\u001f]/g, "_");
          download(blob, stem + ".comic.json");
          $("project-file-status").textContent = t("projectFileExported");
        });
      $("project-file-import").onclick = () => $("project-file-input").click();
      $("project-file-input").onchange = (e) => {
        const file = e.target.files[0];
        e.target.value = "";
        if (!file) return;
        runProjectFile(async () => {
          const p = await importProjectFile(file, projectFileProgress);
          $("project-file-status").textContent =
            `${t("projectFileImported")} ${p.name}`;
        });
      };

      async function init() {
        try {
          const req = indexedDB.open("ComicStudioDB", 1);
          req.onupgradeneeded = () => {
            const d = req.result;
            d.createObjectStore("projects", { keyPath: "id" });
            d.createObjectStore("assets", { keyPath: "id" });
          };
          req.onblocked = () => message("storageChanged");
          db = await request(req);
          db.onversionchange = () => {
            db.close();
            stale = true;
            document.body.classList.add("busy");
            message("storageChanged");
          };
          projects = await request(
            db.transaction("projects").objectStore("projects").getAll(),
          );
          // Pre-format projects keep their original portrait geometry.
          for (const p of projects) {
            p.format = PAGE_FORMATS[p.format] ? p.format : "portrait";
            p.issues.forEach((i) =>
              i.pages.forEach((pg) => {
                pg.format = p.format;
                upgradeMergedCuts(pg);
              }),
            );
          }
          ready = true;
          try {
            if (parent !== window && parent.OS) {
              lang = I18N[parent.OS.lang] ? parent.OS.lang : lang;
              theme = parent.OS.theme || theme;
            }
          } catch {}
          localize();
          await ensureImages(current());
          render();
          collectUnusedAssets().catch(console.error);
        } catch (e) {
          console.error(e);
          message(ready ? "missingImage" : "loadError");
          if (!ready) {
            document.body.classList.add("busy");
            $("save-status").textContent = t("loadError");
          }
        }
      }
      localize();
      init();
    </script>
  </body>
</html>
