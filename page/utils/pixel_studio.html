<!DOCTYPE html>
<!-- Generated by scripts/build_hubs.py - edit the config there, not this file. -->
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../assets/icons/ico/utils-pixel_studio.ico" type="image/x-icon">
  <title>Pixel Studio</title>
  <link rel="stylesheet" href="../assets/fontawesome/css/all.min.css">
  <style>
    :root {
      --bg: #0f1518; --panel: #151d21; --panel-2: #1c262b; --border: #2a363c;
      --text: #e5edf0; --muted: #8b9ca3; --accent: #00a18c; --accent-ink: #ffffff;
    }
    html[data-theme="light"] {
      --bg: #f2f5f6; --panel: #ffffff; --panel-2: #eef3f4; --border: #d3dde0;
      --text: #1b2427; --muted: #5a6a70; --accent: #008f7d; --accent-ink: #ffffff;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", "Noto Sans JP", sans-serif; overflow: hidden; }
    .app { display: grid; grid-template-rows: auto 1fr; height: 100%; }
    .topbar { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 8px 0 12px; background: var(--panel); border-bottom: 1px solid var(--border); min-width: 0; }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; white-space: nowrap; }
    .brand img { width: 18px; height: 18px; }
    .tabs { display: flex; gap: 2px; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border: 0; border-radius: 6px; background: none; color: var(--muted); font: inherit; font-size: 13px; white-space: nowrap; cursor: pointer; }
    .tab:hover { background: var(--panel-2); color: var(--text); }
    .tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
    .tabs.tight .tab { gap: 4px; padding: 0 6px; font-size: 12.5px; }
    .tabs.compact .tab:not([aria-selected="true"]) span { display: none; }
    .tab:focus-visible, .icon-btn:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .tools { display: flex; align-items: center; gap: 6px; margin-left: auto; }
    .icon-btn { display: grid; place-items: center; width: 30px; height: 30px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel-2); color: var(--text); cursor: pointer; }
    .icon-btn:hover { border-color: var(--accent); color: var(--accent); }
    select { height: 30px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel-2); color: var(--text); font: inherit; font-size: 13px; padding: 0 6px; }
    main { position: relative; min-height: 0; }
    main iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg); }
    main iframe[hidden] { display: none; }
    dialog { width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 32px); padding: 0; border: 1px solid var(--border); border-radius: 10px; background: var(--panel); color: var(--text); }
    dialog::backdrop { background: rgb(0 0 0 / 45%); }
    dialog .dlg-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-bottom: 1px solid var(--border); font-weight: 600; }
    dialog .body { padding: 12px 14px 16px; overflow: auto; }
    dialog h3 { margin: 12px 0 6px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
    dialog ul { margin: 0; padding-left: 18px; }
    dialog li { margin: 4px 0; }
    dialog li.active b { color: var(--accent); }
    dialog p { margin: 0 0 8px; }
    .muted { color: var(--muted); font-size: 12px; }
    @media (max-width: 720px) {
      .brand span { display: none; }
      .tab span { display: none; }
    }
  </style>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-NWZDZ906DJ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-NWZDZ906DJ');
  </script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><img src="../assets/icons/svg/utils-pixel_studio.svg" alt=""><span id="hub-title">Pixel Studio</span></div>
      <nav class="tabs" id="tabs" role="tablist"></nav>
      <div class="tools">
        <button class="icon-btn" id="help-btn" type="button"><i class="fa-solid fa-circle-question"></i></button>
        <select id="lang-switcher" aria-label="Language">
          <option value="en">EN</option>
          <option value="pt">PT</option>
          <option value="ja">JA</option>
        </select>
        <button class="icon-btn" id="theme-switcher" type="button"><i class="fa-solid fa-moon"></i></button>
      </div>
    </header>
    <main id="frames"></main>
  </div>

  <dialog id="help">
    <div class="dlg-head"><span id="help-title"></span><button class="icon-btn" id="help-close" type="button"><i class="fa-solid fa-xmark"></i></button></div>
    <div class="body">
      <p id="help-intro"></p>
      <h3 id="help-tools"></h3>
      <ul id="help-list"></ul>
      <p class="muted" id="help-moved" style="margin-top:12px"></p>
    </div>
  </dialog>

  <script src="../os/js/embed.js"></script>
  <script>
    (() => {
      const HUB = {
        "slug": "utils-pixel_studio",
        "title": {
          "en": "Pixel Studio",
          "pt": "Estúdio Pixel",
          "ja": "ピクセルスタジオ"
        },
        "intro": {
          "en": "Pixel art editors. Sprint adds layers and animation; the other two are earlier versions.",
          "pt": "Editores de pixel art. Sprint tem camadas e animação; os outros dois são versões anteriores.",
          "ja": "ピクセルアートエディタです。Sprint はレイヤーとアニメーション付き、他の 2 つは以前の版です。"
        },
        "fileTab": null,
        "tabs": [
          {
            "id": "sprint",
            "src": "sprint.html",
            "icon": "fa-solid fa-film",
            "label": {
              "en": "Sprint",
              "pt": "Sprint",
              "ja": "Sprint"
            },
            "desc": {
              "en": "Layered pixel animation with frames and export.",
              "pt": "Animação em pixel com camadas, quadros e exportação.",
              "ja": "レイヤーとフレームを使ったピクセルアニメーションと書き出し。"
            },
            "unload": false,
            "langKeys": [],
            "themeKeys": []
          },
          {
            "id": "modern",
            "src": "pixel2.html",
            "icon": "fa-solid fa-table-cells",
            "label": {
              "en": "Modern",
              "pt": "Moderno",
              "ja": "モダン"
            },
            "desc": {
              "en": "Pixel editor with image import.",
              "pt": "Editor de pixel com importação de imagem.",
              "ja": "画像の読み込みができるピクセルエディタ。"
            },
            "unload": false,
            "langKeys": [],
            "themeKeys": []
          },
          {
            "id": "vintage",
            "src": "pixel1.html",
            "icon": "fa-solid fa-gamepad",
            "label": {
              "en": "Vintage",
              "pt": "Retrô",
              "ja": "レトロ"
            },
            "desc": {
              "en": "Retro-styled pixel editor.",
              "pt": "Editor de pixel com visual retrô.",
              "ja": "レトロな見た目のピクセルエディタ。"
            },
            "unload": false,
            "langKeys": [],
            "themeKeys": []
          }
        ]
      };
      const TEXT = {"en": {"help": "Help", "theme": "Toggle theme", "close": "Close", "tools": "Tools on this page", "moved": "Old links to these tools open here, on the matching tab."}, "pt": {"help": "Ajuda", "theme": "Alternar tema", "close": "Fechar", "tools": "Ferramentas desta página", "moved": "Links antigos dessas ferramentas abrem aqui, na aba correspondente."}, "ja": {"help": "ヘルプ", "theme": "テーマ切替", "close": "閉じる", "tools": "このページのツール", "moved": "これらのツールの古いリンクはここの該当タブで開きます。"}};
      const TAB_KEY = "hub:" + HUB.slug + ":tab";
      const tabsEl = document.getElementById("tabs");
      const framesEl = document.getElementById("frames");
      const langSel = document.getElementById("lang-switcher");
      const themeBtn = document.getElementById("theme-switcher");
      const help = document.getElementById("help");
      const frames = new Map();
      let active = null;

      const store = {
        get(key) { try { return localStorage.getItem(key); } catch (_) { return null; } },
        set(key, value) { try { localStorage.setItem(key, value); } catch (_) {} },
      };

      let lang = store.get("app_lang");
      if (!TEXT[lang]) lang = "en";
      let theme = store.get("app_theme") === "light" ? "light" : "dark";

      // Keep page-specific language/theme keys in step with the shared ones,
      // so every tool opens in the language and theme chosen here.
      function syncToolKeys() {
        HUB.tabs.forEach((tab) => {
          (tab.langKeys || []).forEach((key) => store.set(key, lang));
          (tab.themeKeys || []).forEach((key) => store.set(key, theme));
        });
      }

      function tabById(id) { return HUB.tabs.find((tab) => tab.id === id) || null; }

      function parseHash() {
        const raw = decodeURIComponent(location.hash.slice(1));
        const cut = raw.indexOf(":");
        const id = cut < 0 ? raw : raw.slice(0, cut);
        return { tab: tabById(id), inner: cut < 0 ? "" : raw.slice(cut + 1) };
      }

      function frameFor(tab, inner) {
        let frame = frames.get(tab.id);
        if (!frame) {
          frame = document.createElement("iframe");
          frame.title = tab.label[lang] || tab.label.en;
          frame.allow = "camera; microphone; fullscreen; clipboard-read; clipboard-write; autoplay";
          frame.dataset.tab = tab.id;
          if (window.OSEmbed) window.OSEmbed.attach(frame);
          framesEl.appendChild(frame);
          frames.set(tab.id, frame);
        }
        if (!frame.dataset.loaded) {
          frame.src = tab.src + (tab.src.includes("?") ? "&" : "?") + "hub=1" + (inner ? "#" + inner : "");
          frame.dataset.loaded = "1";
        }
        return frame;
      }

      function select(id, opts = {}) {
        const tab = tabById(id) || HUB.tabs[0];
        if (active && active !== tab.id) {
          const prev = tabById(active);
          const prevFrame = frames.get(active);
          if (prevFrame) {
            prevFrame.hidden = true;
            if (prev && prev.unload) {
              prevFrame.src = "about:blank";
              delete prevFrame.dataset.loaded;
            }
          }
        }
        active = tab.id;
        const frame = frameFor(tab, opts.inner || "");
        frame.hidden = false;
        tabsEl.querySelectorAll(".tab").forEach((btn) => {
          const on = btn.dataset.tab === tab.id;
          btn.setAttribute("aria-selected", on ? "true" : "false");
          btn.tabIndex = on ? 0 : -1;
        });
        fitTabs();
        store.set(TAB_KEY, tab.id);
        if (!opts.fromHash && location.hash.slice(1).split(":")[0] !== tab.id) {
          history.replaceState(null, "", "#" + tab.id);
        }
        renderHelp();
      }

      function renderTabs() {
        tabsEl.innerHTML = "";
        HUB.tabs.forEach((tab) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "tab";
          btn.role = "tab";
          btn.dataset.tab = tab.id;
          const label = tab.label[lang] || tab.label.en;
          btn.title = label;
          btn.innerHTML = '<i class="' + tab.icon + '" aria-hidden="true"></i><span></span>';
          btn.querySelector("span").textContent = label;
          btn.setAttribute("aria-selected", tab.id === active ? "true" : "false");
          btn.addEventListener("click", () => select(tab.id));
          tabsEl.appendChild(btn);
        });
        fitTabs();
      }

      // Show every label when they fit; otherwise only the selected tab keeps its label.
      function fitTabs() {
        tabsEl.classList.remove("tight", "compact");
        if (tabsEl.scrollWidth > tabsEl.clientWidth + 1) tabsEl.classList.add("tight");
        if (tabsEl.scrollWidth > tabsEl.clientWidth + 1) tabsEl.classList.add("compact");
      }
      new ResizeObserver(fitTabs).observe(tabsEl);
      // Icon fonts load after the first layout and widen the tabs.
      window.addEventListener("load", fitTabs);
      if (document.fonts) document.fonts.ready.then(fitTabs);

      function renderHelp() {
        const t = TEXT[lang];
        document.getElementById("help-title").textContent = HUB.title[lang] || HUB.title.en;
        document.getElementById("help-intro").textContent = HUB.intro[lang] || HUB.intro.en;
        document.getElementById("help-tools").textContent = t.tools;
        document.getElementById("help-moved").textContent = t.moved;
        const list = document.getElementById("help-list");
        list.innerHTML = "";
        HUB.tabs.forEach((tab) => {
          const li = document.createElement("li");
          if (tab.id === active) li.className = "active";
          const b = document.createElement("b");
          b.textContent = tab.label[lang] || tab.label.en;
          li.appendChild(b);
          li.appendChild(document.createTextNode(" - " + (tab.desc[lang] || tab.desc.en)));
          list.appendChild(li);
        });
      }

      function applyText() {
        const t = TEXT[lang];
        const title = HUB.title[lang] || HUB.title.en;
        document.documentElement.lang = lang;
        document.title = title;
        document.getElementById("hub-title").textContent = title;
        document.getElementById("help-btn").title = t.help;
        document.getElementById("help-btn").setAttribute("aria-label", t.help);
        document.getElementById("help-close").setAttribute("aria-label", t.close);
        themeBtn.title = t.theme;
        themeBtn.setAttribute("aria-label", t.theme);
        langSel.value = lang;
        renderTabs();
        renderHelp();
      }

      function applyTheme() {
        document.documentElement.dataset.theme = theme;
        themeBtn.querySelector("i").className = theme === "light" ? "fa-solid fa-moon" : "fa-solid fa-sun";
      }

      // Tools read language and theme on load, so reload the ones already open.
      function reloadTools() {
        frames.forEach((frame) => {
          if (!frame.dataset.loaded) return;
          try { frame.contentWindow.location.reload(); } catch (_) {}
        });
      }

      langSel.addEventListener("change", () => {
        lang = TEXT[langSel.value] ? langSel.value : "en";
        store.set("app_lang", lang);
        syncToolKeys();
        applyText();
        reloadTools();
      });

      themeBtn.addEventListener("click", () => {
        theme = theme === "light" ? "dark" : "light";
        store.set("app_theme", theme);
        syncToolKeys();
        applyTheme();
        reloadTools();
      });

      document.getElementById("help-btn").addEventListener("click", () => help.showModal());
      document.getElementById("help-close").addEventListener("click", () => help.close());
      help.addEventListener("click", (e) => { if (e.target === help) help.close(); });
      document.addEventListener("keydown", (e) => {
        if (e.key === "?" && !help.open && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) help.showModal();
      });

      tabsEl.addEventListener("keydown", (e) => {
        if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
        const i = HUB.tabs.findIndex((tab) => tab.id === active);
        const next = HUB.tabs[(i + (e.key === "ArrowRight" ? 1 : -1) + HUB.tabs.length) % HUB.tabs.length];
        select(next.id);
        tabsEl.querySelector('[data-tab="' + next.id + '"]').focus();
      });

      window.addEventListener("hashchange", () => {
        const { tab, inner } = parseHash();
        if (tab && tab.id !== active) select(tab.id, { fromHash: true, inner });
      });

      // Files opened from the desktop go to the tool that edits them.
      window.addEventListener("message", (e) => {
        if (e.origin !== location.origin || !e.data) return;
        if (e.data.type !== "os-file-open" && e.data.type !== "os-sheets-open") return;
        if (e.source && Array.from(frames.values()).some((f) => f.contentWindow === e.source)) return;
        const target = tabById(HUB.fileTab) || tabById(active);
        if (!target) return;
        const wasLoaded = frames.has(target.id) && frames.get(target.id).dataset.loaded;
        select(target.id);
        // A freshly loaded tool picks up the file itself; a loaded one needs the message.
        if (wasLoaded) frames.get(target.id).contentWindow.postMessage(e.data, location.origin);
      });

      syncToolKeys();
      applyTheme();
      applyText();
      const start = parseHash();
      select((start.tab && start.tab.id) || store.get(TAB_KEY) || HUB.tabs[0].id, { inner: start.inner });
    })();
  </script>
</body>
</html>
