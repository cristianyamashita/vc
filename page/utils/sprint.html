  <script>
    let fa_icons = [];
    function init_icons() {
      fetch('https://unpkg.com/@iconify-json/fa6-solid/icons.json')
        .then(response => response.json())
        .then(data => {
          fa_icons = data;
          populateIconPicker();
        });
    }

    function populateIconPicker() {
      const iconPickerList = document.getElementById('icon-picker-list');
      iconPickerList.innerHTML = ''; // Clear existing icons

      for (const iconName in fa_icons.icons) {
        const icon = fa_icons.icons[iconName];
        const iconElement = document.createElement('button');
        iconElement.className = 'p-2 rounded-lg hover:bg-blue-500 hover:text-white transition-colors flex items-center justify-center';
        iconElement.title = iconName;
        iconElement.dataset.iconName = iconName;
        iconElement.innerHTML = `<i class="fa-solid fa-${iconName} fa-2x"></i>`;
        iconPickerList.appendChild(iconElement);
      }
    }
    init_icons();
  </script>
  <style>
    html, body { height: 100%; }
    body { font-family: 'Inter', sans-serif; touch-action: none; margin: 0; overflow: hidden; font-size: 14px; }

    .field { height: 30px; width: 100%; padding: 0 8px; border-radius: 6px; font-size: 13px; }
    .canvas-container { cursor: crosshair; min-width: 0; min-height: 0; overflow: hidden; display: grid; place-items: center; padding: 8px; border-radius: 8px; }

    @media (max-width: 720px) {

        select: 'Select', icon: 'Icon',

        select: '選択', icon: 'アイコン',
        colors: 'カラー', gridResolution: 'グリッド解像度', layers: 'レイヤー', addLayer: '追加', duplicate: '複製',

        play: '再生', stop: '停止', layerName: 'レイヤー', exportPrefixPrompt: 'ファイル名のプレフィックスを入力してください', zipNameDefault: 'レイヤー',
        selectAnIcon: 'アイコンを選択', iconColor: 'アイコンの色:', addIcon: 'アイコンを追加', iconSize: 'アイコンサイズ:',
        importImage: '画像を読み込む', help: 'ヘルプ', close: '閉じる', theme: 'テーマ切替', helpTitle: 'ピクセルアート スプリントエディタ',
        helpIntro: 'レイヤーごとにピクセルアートのスプライトを描き、コマ送りアニメーションとして再生できます。',
        helpTools: 'ブラシは選択した色で塗り、消しゴムはピクセルを消します。選択は範囲を選んでドラッグで移動でき、アイコンは Font Awesome のアイコンをアクティブなレイヤーに描きます。',
        helpLayers: '各レイヤーが 1 フレームです。レイヤー名をクリックしてアクティブにし、表示切替、不透明度の変更、↑ / ↓ で並べ替え、複製、削除ができます。再生はフレーム時間に従ってレイヤーを順に表示します。',
        helpExport: '「画像を読み込む」は画像をパレットの色に変換してアクティブなレイヤーに入れます。「アクティブを保存」はアクティブなレイヤーをエクスポートサイズの PNG で保存し、「すべて保存」は全レイヤーを ZIP で保存します。グリッド解像度を変えるとレイヤーは消去されます。',
        helpShortcutsTitle: 'ショートカット', helpShortcut: '? でこのヘルプを開きます。'
      },
      pt: {
        title: 'Editor de Sprint de Pixel Art', language: 'Idioma', tools: 'Ferramentas', brush: 'Pincel', eraser: 'Borracha',
        select: 'Selecionar', icon: 'Ícone',
        colors: 'Cores', gridResolution: 'Resolução da Grade', layers: 'Camadas', addLayer: 'Adicionar', duplicate: 'Duplicar',
        delete: 'Excluir', visibility: 'Visível', opacity: 'Opac.', actions: 'Ações', exportSize: 'Tamanho da Exportação (px)',
        exportActive: 'Exportar Ativa', exportAll: 'Exportar Todas', playback: 'Reprodução', frameDuration: 'Quadro (ms)',
        play: 'Reproduzir', stop: 'Parar', layerName: 'Camada', exportPrefixPrompt: 'Digite o prefixo do nome do arquivo', zipNameDefault: 'camadas',
        selectAnIcon: 'Selecione um Ícone', iconColor: 'Cor do Ícone:', addIcon: 'Adicionar Ícone', iconSize: 'Tamanho do Ícone:',
        importImage: 'Importar Imagem', help: 'Ajuda', close: 'Fechar', theme: 'Alternar tema', helpTitle: 'Editor de Sprint de Pixel Art',
        helpIntro: 'Desenhe sprites de pixel art em camadas e reproduza-as como uma animação quadro a quadro.',
        helpTools: 'Pincel pinta com a cor escolhida, Borracha apaga pixels, Selecionar marca uma área que você pode arrastar para mover, e Ícone carimba um ícone do Font Awesome na camada ativa.',
        helpLayers: 'Cada camada é um quadro. Clique no nome da camada para ativá-la, alterne a visibilidade, mude a opacidade, reordene com ↑ / ↓, duplique ou exclua. Reproduzir percorre as camadas usando a duração do quadro.',
        helpExport: 'Importar Imagem converte uma figura para a paleta na camada ativa. Exportar Ativa salva a camada ativa em PNG no tamanho de exportação; Exportar Todas salva todas as camadas num arquivo ZIP. Mudar a resolução da grade limpa as camadas.',
        helpShortcutsTitle: 'Atalhos', helpShortcut: '? abre esta ajuda.'
      }
    };

    const langSelector = document.getElementById('lang-selector');
    langSelector.addEventListener('change', (e) => {
      const lang = e.target.value;
      try { localStorage.setItem('app_lang', lang); } catch (_) {}
      setLanguage(lang);
    });

    function setLanguage(lang) {
      document.querySelectorAll('[data-lang]').forEach(el => {
        const key = el.getAttribute('data-lang');
        if (translations[lang] && translations[lang][key]) {
          el.textContent = translations[lang][key];
        }
      });
      const tr = translations[lang] || translations.en;
      [['help-btn', 'help'], ['help-close', 'close'], ['theme-switcher', 'theme']].forEach(([id, key]) => {
        const el = document.getElementById(id);
        if (el) { el.title = tr[key]; el.setAttribute('aria-label', tr[key]); }
      });
      document.documentElement.lang = lang;
      updateLayersList();
    }

    const canvas = document.getElementById('pixel-canvas');
    const ctx = canvas.getContext('2d');
    const canvasContainer = document.querySelector('.canvas-container');

    let gridResolution = 32;
    let pixelSize = 0;
    let isDrawing = false;
    let currentColor = '#000000';
    let currentTool = 'brush';
    let isPlaying = false;
    let playTimer = null;
    let playIndex = 0;
    // Selection state (currentTool declared above)
    let isSelecting = false;
    let isDragging = false;
    let selectionRect = { x: 0, y: 0, w: 0, h: 0 };
    let selectedPixelData = null; // {color, dx, dy}[]
    let dragStart = { x: 0, y: 0 };
    const selectionBox = document.getElementById('selection-box');

    const colors = [
      '#ffffff', '#c2c2c2', '#858585', '#474747', '#000000', '#203548',
      '#ff4500', '#ff8c00', '#ffd700', '#9acd32', '#32cd32', '#008080',
      '#00ced1', '#1e90ff', '#4169e1', '#8a2be2', '#9932cc', '#c71585'
    ];

    const colorPalette = document.getElementById('color-palette');
    colors.forEach(color => {
      const colorBox = document.createElement('div');
      colorBox.className = 'w-6 h-6 rounded-full cursor-pointer border-2 border-gray-300 dark:border-gray-600 color-box';
      colorBox.style.backgroundColor = color;
      colorBox.addEventListener('click', () => {
        currentColor = color;
        document.querySelectorAll('.color-box').forEach(b => b.classList.remove('selected'));
        colorBox.classList.add('selected');
      });
      colorPalette.appendChild(colorBox);
    });
    colorPalette.children[4].classList.add('selected');

    // Layers state
    /** @typedef {{ id: number, name: string, pixels: (string|null)[][], opacity: number, visible: boolean }} Layer */
    /** @type {Layer[]} */
    let layers = [];
    let activeLayerIndex = 0;
    let layerIdCounter = 1;

    function createEmptyPixels() {
      return Array(gridResolution).fill(0).map(() => Array(gridResolution).fill(null));
    }

    function addLayer(duplicateFromIndex = null) {
      const pixels = duplicateFromIndex !== null
        ? layers[duplicateFromIndex].pixels.map(row => row.slice())
        : createEmptyPixels();
      const layer = {
        id: layerIdCounter++,
        name: `${translations[langSelector.value].layerName} ${layers.length + 1}`,
        pixels,
        opacity: 1.0,
        visible: true
      };
      layers.push(layer);
      activeLayerIndex = layers.length - 1;
      updateLayersList();
      renderCanvas();
    }

    function removeLayer(index) {
      if (layers.length <= 1) return;
      layers.splice(index, 1);
      if (activeLayerIndex >= layers.length) activeLayerIndex = layers.length - 1;
      updateLayersList();
      renderCanvas();
    }

    function moveLayer(index, direction) {
      const newIndex = index + direction;
      if (newIndex < 0 || newIndex >= layers.length) return;
      const [l] = layers.splice(index, 1);
      layers.splice(newIndex, 0, l);
      activeLayerIndex = newIndex;
      updateLayersList();
      renderCanvas();
    }

    function updateLayersList() {
      const list = document.getElementById('layers-list');
      list.innerHTML = '';
      const t = translations[langSelector.value];
      layers.forEach((layer, idx) => {
        const row = document.createElement('div');
        row.className = `border rounded p-2 space-y-2 ${idx === activeLayerIndex ? 'layer-item active' : ''}`;

        const topBar = document.createElement('div');
        topBar.className = 'flex items-center justify-between gap-2';

        const nameBtn = document.createElement('button');
        nameBtn.className = 'text-left font-medium truncate flex-1 min-w-0';
        nameBtn.title = layer.name;
        nameBtn.textContent = layer.name;
        nameBtn.addEventListener('click', () => { activeLayerIndex = idx; updateLayersList(); renderCanvas(); });

        const controls = document.createElement('div');
        controls.className = 'flex items-center gap-1';

        const upBtn = document.createElement('button');
        upBtn.className = 'px-2 py-1 text-xs rounded bg-gray-200 dark:bg-gray-700 hover:bg-gray-300';
        upBtn.textContent = '↑';
        upBtn.title = 'Up';
        upBtn.addEventListener('click', () => moveLayer(idx, -1));

        const downBtn = document.createElement('button');
        downBtn.className = 'px-2 py-1 text-xs rounded bg-gray-200 dark:bg-gray-700 hover:bg-gray-300';
        downBtn.textContent = '↓';
        downBtn.title = 'Down';
        downBtn.addEventListener('click', () => moveLayer(idx, 1));

        const dupBtn = document.createElement('button');
        dupBtn.className = 'px-2 py-1 text-xs rounded bg-blue-500 text-white hover:bg-blue-600';
        dupBtn.innerHTML = '<i class="fa-solid fa-copy"></i>';
        dupBtn.title = t.duplicate;
        dupBtn.setAttribute('aria-label', t.duplicate);
        dupBtn.addEventListener('click', () => { addLayer(idx); });

        const delBtn = document.createElement('button');
        delBtn.className = 'px-2 py-1 text-xs rounded bg-red-500 text-white hover:bg-red-600';
        delBtn.innerHTML = '<i class="fa-solid fa-trash"></i>';
        delBtn.title = t.delete;
        delBtn.setAttribute('aria-label', t.delete);
        delBtn.addEventListener('click', () => { removeLayer(idx); });

        controls.appendChild(upBtn);
        controls.appendChild(downBtn);
        controls.appendChild(dupBtn);
        controls.appendChild(delBtn);

        topBar.appendChild(nameBtn);
        topBar.appendChild(controls);

        const bottomBar = document.createElement('div');
        bottomBar.className = 'flex items-center gap-2';

        const visLabel = document.createElement('label');
        visLabel.className = 'flex items-center gap-1 text-sm whitespace-nowrap';
        const visCheckbox = document.createElement('input');
        visCheckbox.type = 'checkbox';
        visCheckbox.checked = layer.visible;
        visCheckbox.addEventListener('change', () => { layer.visible = visCheckbox.checked; renderCanvas(); });
        const visText = document.createElement('span');
        visText.textContent = t.visibility;
        visLabel.appendChild(visCheckbox);
        visLabel.appendChild(visText);

        const opLabel = document.createElement('label');
        opLabel.className = 'flex items-center gap-2 text-sm flex-1 min-w-0';
        const opText = document.createElement('span');
        opText.className = 'text-xs whitespace-nowrap';
        opText.textContent = t.opacity;
        const opRange = document.createElement('input');
        opRange.type = 'range';
        opRange.min = '0';
        opRange.max = '100';
        opRange.value = String(Math.round(layer.opacity * 100));
        opRange.className = 'flex-1 min-w-0 max-w-[110px]';
        const opVal = document.createElement('span');
        opVal.className = 'w-8 text-right text-xs';
        opVal.textContent = `${Math.round(layer.opacity * 100)}%`;
        opRange.addEventListener('input', () => { layer.opacity = parseInt(opRange.value, 10) / 100; opVal.textContent = `${opRange.value}%`; renderCanvas(); });

        opLabel.appendChild(opText);
        opLabel.appendChild(opRange);
        opLabel.appendChild(opVal);

        bottomBar.appendChild(visLabel);
        bottomBar.appendChild(opLabel);

        row.appendChild(topBar);
        row.appendChild(bottomBar);
        list.appendChild(row);
      });
    }

    function resizeAndRender() {
      const containerRect = canvasContainer.getBoundingClientRect();
      const size = Math.min(containerRect.width, containerRect.height) - 16;
      canvas.width = size;
      canvas.height = size;
      pixelSize = canvas.width / gridResolution;
      renderCanvas();
    }

    function drawGrid() {
      ctx.strokeStyle = '#e0e0e0';
      ctx.lineWidth = 1;
      for (let i = 0; i <= gridResolution; i++) {
        const pos = i * pixelSize;
        ctx.beginPath(); ctx.moveTo(pos + 0.5, 0); ctx.lineTo(pos + 0.5, canvas.height); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, pos + 0.5); ctx.lineTo(canvas.width, pos + 0.5); ctx.stroke();
      }
    }

    function renderCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (isPlaying) {
        const frame = layers[playIndex];
        if (frame && frame.visible) {
          ctx.globalAlpha = 1.0; // preview as final frame
          drawLayerPixels(frame.pixels);
          ctx.globalAlpha = 1.0;
        }
      } else {
        // Composite visible layers bottom to top with their opacities
        layers.forEach((layer, idx) => {
          if (!layer.visible) return;
          ctx.globalAlpha = layer.opacity;
          drawLayerPixels(layer.pixels);
        });
        ctx.globalAlpha = 1.0;
      }

      drawGrid();

      // Update selection box if exists
      if (selectedPixelData || isSelecting || isDragging) {
        updateSelectionBox(isDragging);
      } else {
        selectionBox.classList.add('hidden');
      }
    }

    function drawLayerPixels(pixels) {
      for (let y = 0; y < gridResolution; y++) {
        for (let x = 0; x < gridResolution; x++) {
          const color = pixels[y][x];
          if (color) {
            ctx.fillStyle = color;
            ctx.fillRect(x * pixelSize, y * pixelSize, pixelSize, pixelSize);
          }
        }
      }
    }

    function getMousePos(evt) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
      const clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
      return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
    }

    function drawOnActiveLayer(x, y) {
      const gridX = Math.floor(x / pixelSize);
      const gridY = Math.floor(y / pixelSize);
      if (gridX < 0 || gridX >= gridResolution || gridY < 0 || gridY >= gridResolution) return;
      const layer = layers[activeLayerIndex];
      if (!layer) return;
      layer.pixels[gridY][gridX] = (currentTool === 'eraser') ? null : currentColor;
      renderCanvas();
    }

    function handleStart(e) {
      e.preventDefault();
      const pos = getMousePos(e);
      if (currentTool === 'select') {
        if (selectedPixelData && pos.x >= selectionRect.x && pos.x <= selectionRect.x + selectionRect.w && pos.y >= selectionRect.y && pos.y <= selectionRect.y + selectionRect.h) {
          isDragging = true;
          dragStart = { x: pos.x - selectionRect.x, y: pos.y - selectionRect.y };
        } else {
          stampSelection();
          isSelecting = true;
          selectionRect.x = pos.x;
          selectionRect.y = pos.y;
          selectionRect.w = 0;
          selectionRect.h = 0;
        }
      } else {
        isDrawing = true;
        drawOnActiveLayer(pos.x, pos.y);
      }
    }

    function handleMove(e) {
      if (!isDrawing && !isSelecting && !isDragging) return;
      e.preventDefault();
      const pos = getMousePos(e);
      if (isDrawing) {
        drawOnActiveLayer(pos.x, pos.y);
      } else if (isSelecting) {
        selectionRect.w = pos.x - selectionRect.x;
        selectionRect.h = pos.y - selectionRect.y;
        updateSelectionBox();
      } else if (isDragging) {
        renderCanvas();
        selectionRect.x = pos.x - dragStart.x;
        selectionRect.y = pos.y - dragStart.y;
        // Preview floating selection
        const layer = layers[activeLayerIndex];
        if (layer && selectedPixelData) {
          ctx.globalAlpha = 0.7;
          for (const pixel of selectedPixelData) {
            ctx.fillStyle = pixel.color;
            const drawX = selectionRect.x + pixel.dx * pixelSize;
            const drawY = selectionRect.y + pixel.dy * pixelSize;
            ctx.fillRect(drawX, drawY, pixelSize, pixelSize);
          }
          ctx.globalAlpha = 1.0;
        }
        updateSelectionBox(true);
      }
    }

    function handleEnd(e) {
      e.preventDefault();
      isDrawing = false;
      if (isSelecting) {
        isSelecting = false;
        captureSelection();
      }
      if (isDragging) {
        isDragging = false;
        stampSelection();
      }
    }

    function updateSelectionBox(isDraggingBox = false) {
      const sx = Math.min(selectionRect.x, selectionRect.x + selectionRect.w);
      const sy = Math.min(selectionRect.y, selectionRect.y + selectionRect.h);
      const sw = Math.abs(selectionRect.w);
      const sh = Math.abs(selectionRect.h);
      selectionBox.classList.remove('hidden');
      selectionBox.style.left = `${sx}px`;
      selectionBox.style.top = `${sy}px`;
      selectionBox.style.width = `${sw}px`;
      selectionBox.style.height = `${sh}px`;
      selectionBox.classList.toggle('border-dashed', !isDraggingBox);
      selectionBox.classList.toggle('border-solid', isDraggingBox);
    }

    function captureSelection() {
      const startX = Math.floor(Math.min(selectionRect.x, selectionRect.x + selectionRect.w) / pixelSize);
      const startY = Math.floor(Math.min(selectionRect.y, selectionRect.y + selectionRect.h) / pixelSize);
      const endX = Math.ceil(Math.max(selectionRect.x, selectionRect.x + selectionRect.w) / pixelSize);
      const endY = Math.ceil(Math.max(selectionRect.y, selectionRect.y + selectionRect.h) / pixelSize);
      const layer = layers[activeLayerIndex];
      if (!layer) return;
      selectedPixelData = [];
      for (let y = startY; y < endY; y++) {
        for (let x = startX; x < endX; x++) {
          if (y >= 0 && y < gridResolution && x >= 0 && x < gridResolution && layer.pixels[y][x]) {
            selectedPixelData.push({ color: layer.pixels[y][x], dx: x - startX, dy: y - startY });
            layer.pixels[y][x] = null; // cut
          }
        }
      }
      if (selectedPixelData.length > 0) {
        selectionRect = { x: startX * pixelSize, y: startY * pixelSize, w: (endX - startX) * pixelSize, h: (endY - startY) * pixelSize };
        renderCanvas();
        updateSelectionBox(true);
      } else {
        resetSelection();
      }
    }

    function stampSelection() {
      if (!selectedPixelData) { resetSelection(); return; }
      const gridX = Math.round(selectionRect.x / pixelSize);
      const gridY = Math.round(selectionRect.y / pixelSize);
      const layer = layers[activeLayerIndex];
      if (!layer) { resetSelection(); return; }
      for (const pixel of selectedPixelData) {
        const finalX = gridX + pixel.dx;
        const finalY = gridY + pixel.dy;
        if (finalY >= 0 && finalY < gridResolution && finalX >= 0 && finalX < gridResolution) {
          layer.pixels[finalY][finalX] = pixel.color;
        }
      }
      resetSelection();
      renderCanvas();
    }

    function resetSelection() {
      selectedPixelData = null;
      selectionBox.classList.add('hidden');
    }

    // Grid resolution change
    document.getElementById('grid-resolution').addEventListener('change', (e) => {
      const newRes = parseInt(e.target.value, 10);
      gridResolution = newRes;
      layers.forEach(l => { l.pixels = Array(gridResolution).fill(0).map(() => Array(gridResolution).fill(null)); });
      resizeAndRender();
      try { localStorage.setItem('sprint_grid', String(newRes)); } catch (_) {}
    });

    // Tools
    const toolButtons = document.querySelectorAll('.tool-btn');
    toolButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        toolButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentTool = btn.id.replace('-tool', '');
        if (currentTool !== 'select') resetSelection();
      });
    });

    // Layers controls
    document.getElementById('add-layer-btn').addEventListener('click', () => addLayer());

    // Playback controls
    document.getElementById('play-btn').addEventListener('click', () => {
      if (isPlaying || layers.length === 0) return;
      isPlaying = true;
      playIndex = 0;
      const frameMs = Math.max(50, parseInt(document.getElementById('frame-duration').value, 10) || 300);
      playTimer = setInterval(() => {
        playIndex = (playIndex + 1) % layers.length;
        renderCanvas();
      }, frameMs);
      renderCanvas();
    });
    document.getElementById('stop-btn').addEventListener('click', () => {
      isPlaying = false; if (playTimer) clearInterval(playTimer); playTimer = null; renderCanvas();
    });

    // Export helpers
    function renderLayerToCanvas(layer, exportSize) {
      const temp = document.createElement('canvas');
      temp.width = exportSize; temp.height = exportSize;
      const tctx = temp.getContext('2d');
      tctx.fillStyle = '#ffffff'; tctx.fillRect(0, 0, exportSize, exportSize);
      const exportPixel = exportSize / gridResolution;
      for (let y = 0; y < gridResolution; y++) {
        for (let x = 0; x < gridResolution; x++) {
          const color = layer.pixels[y][x];
          if (color) { tctx.fillStyle = color; tctx.fillRect(x * exportPixel, y * exportPixel, exportPixel, exportPixel); }
        }
      }
      return temp;
    }

    document.getElementById('export-active-btn').addEventListener('click', () => {
      const exportSize = parseInt(document.getElementById('export-size').value, 10) || 512;
      const layer = layers[activeLayerIndex];
      if (!layer) return;
      const c = renderLayerToCanvas(layer, exportSize);
      c.toBlob((blob) => { if (blob) saveAs(blob, `${layer.name.replace(/\s+/g, '_')}.png`); });
    });

    document.getElementById('export-all-btn').addEventListener('click', async () => {
      const exportSize = parseInt(document.getElementById('export-size').value, 10) || 512;
      const t = translations[langSelector.value];
      let prefix = prompt(t.exportPrefixPrompt, 'frame');
      if (prefix === null) return; // cancelled
      prefix = (prefix || 'frame').trim().replace(/[^\w.\-]+/g, '_');
      const zip = new JSZip();
      for (let i = 0; i < layers.length; i++) {
        const layer = layers[i];
        const c = renderLayerToCanvas(layer, exportSize);
        // eslint-disable-next-line no-await-in-loop
        const blob = await new Promise(resolve => c.toBlob(resolve));
        if (blob) zip.file(`${prefix}_${String(i+1).padStart(2,'0')}.png`, blob);
      }
      const zipBlob = await zip.generateAsync({ type: 'blob' });
      const zipName = `${prefix || t.zipNameDefault}.zip`;
      saveAs(zipBlob, zipName);
    });

    // Image import (palette quantization) into active layer
    function hexToRgb(hex) {
      const clean = hex.replace('#', '');
      const num = parseInt(clean, 16);
      return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
    }

    function nearestPaletteColor(r, g, b) {
      let best = colors[0];
      let bestDist = Infinity;
      for (const c of colors) {
        const rgb = hexToRgb(c);
        const dr = r - rgb.r; const dg = g - rgb.g; const db = b - rgb.b;
        const dist = dr * dr + dg * dg + db * db;
        if (dist < bestDist) { bestDist = dist; best = c; }
      }
      return best;
    }

    function importImageIntoActiveLayer(file) {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const small = document.createElement('canvas');
        small.width = gridResolution; small.height = gridResolution;
        const sctx = small.getContext('2d');
        sctx.imageSmoothingEnabled = true;
        sctx.clearRect(0, 0, small.width, small.height);
        sctx.drawImage(img, 0, 0, small.width, small.height);
        const data = sctx.getImageData(0, 0, small.width, small.height).data;
        const layer = layers[activeLayerIndex]; if (!layer) { URL.revokeObjectURL(url); return; }
        for (let y = 0; y < gridResolution; y++) {
          for (let x = 0; x < gridResolution; x++) {
            const idx = (y * gridResolution + x) * 4;
            const r = data[idx], g = data[idx + 1], b = data[idx + 2], a = data[idx + 3];
            if (a < 8) layer.pixels[y][x] = null; else layer.pixels[y][x] = nearestPaletteColor(r, g, b);
          }
        }
        renderCanvas();
        URL.revokeObjectURL(url);
      };
      img.onerror = () => URL.revokeObjectURL(url);
      img.src = url;
    }

    const importBtn = document.getElementById('import-btn');
    const imageInput = document.getElementById('image-input');
    importBtn.addEventListener('click', () => imageInput.click());
    imageInput.addEventListener('change', (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      stampSelection();
      resetSelection();
      importImageIntoActiveLayer(file);
      imageInput.value = '';
    });

    // Canvas events
    canvas.addEventListener('mousedown', handleStart);
    canvas.addEventListener('mousemove', handleMove);
    canvas.addEventListener('mouseup', handleEnd);
    canvas.addEventListener('mouseleave', handleEnd);
    canvas.addEventListener('touchstart', handleStart, { passive: false });
    canvas.addEventListener('touchmove', handleMove, { passive: false });
    canvas.addEventListener('touchend', handleEnd, { passive: false });
    canvas.addEventListener('touchcancel', handleEnd, { passive: false });

    window.addEventListener('resize', resizeAndRender);

    // Icon Modal Logic
    const iconModal = document.getElementById('icon-modal');
    const iconToolBtn = document.getElementById('icon-tool');
    const closeIconModalBtn = document.getElementById('close-icon-modal');
    const addIconBtn = document.getElementById('add-icon-btn');
    const iconPickerList = document.getElementById('icon-picker-list');
    const iconColorPicker = document.getElementById('icon-color-picker');

    let selectedIcon = null;

    iconToolBtn.addEventListener('click', () => {
      iconModal.classList.remove('hidden');
    });

    closeIconModalBtn.addEventListener('click', () => {
      iconModal.classList.add('hidden');
    });

    iconPickerList.addEventListener('click', (e) => {
      const button = e.target.closest('button');
      if (button && button.dataset.iconName) {
        if (selectedIcon) {
          selectedIcon.classList.remove('bg-blue-500', 'text-white');
        }
        selectedIcon = button;
        selectedIcon.classList.add('bg-blue-500', 'text-white');
      }
    });

    function drawIconOnCanvas(iconData, color, sizePercentage) {
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = gridResolution;
      tempCanvas.height = gridResolution;
      const tCtx = tempCanvas.getContext('2d');

      const pathData = iconData.body.match(/d="([^"]+)"/)[1];
      const path = new Path2D(pathData);

      const iconWidth = iconData.width || fa_icons.width;
      const iconHeight = iconData.height || fa_icons.height;

      const size = gridResolution * (sizePercentage / 100);
      const scale = size / Math.max(iconWidth, iconHeight);
      const scaledWidth = iconWidth * scale;
      const scaledHeight = iconHeight * scale;
      const tx = (gridResolution - scaledWidth) / 2;
      const ty = (gridResolution - scaledHeight) / 2;

      tCtx.fillStyle = color;
      tCtx.translate(tx, ty);
      tCtx.scale(scale, scale);
      tCtx.fill(path);

      const imageData = tCtx.getImageData(0, 0, gridResolution, gridResolution).data;
      const layer = layers[activeLayerIndex];
      if (!layer) return;

      for (let y = 0; y < gridResolution; y++) {
        for (let x = 0; x < gridResolution; x++) {
          const index = (y * gridResolution + x) * 4;
          // If alpha is greater than a threshold, draw the pixel
          if (imageData[index + 3] > 128) {
            layer.pixels[y][x] = color;
          }
        }
      }
      renderCanvas();
    }

    addIconBtn.addEventListener('click', () => {
      if (selectedIcon) {
        const iconName = selectedIcon.dataset.iconName;
        const iconData = fa_icons.icons[iconName];
        const color = iconColorPicker.value;
        const size = parseInt(document.getElementById('icon-size-slider').value, 10);
        drawIconOnCanvas(iconData, color, size);
        iconModal.classList.add('hidden');
        selectedIcon.classList.remove('bg-blue-500', 'text-white');
        selectedIcon = null;
      }
    });


    // Help dialog and theme
    const helpDialog = document.getElementById('help-dialog');
    document.getElementById('help-btn').addEventListener('click', () => helpDialog.showModal());
    document.getElementById('help-close').addEventListener('click', () => helpDialog.close());
    helpDialog.addEventListener('click', (e) => { if (e.target === helpDialog) helpDialog.close(); });
    document.addEventListener('keydown', (e) => {
      const el = e.target;
      const typing = el && (el.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName));
      if (e.key === '?' && !typing && !helpDialog.open) {
        e.preventDefault();
        helpDialog.showModal();
      }
    });
    document.getElementById('theme-switcher').addEventListener('click', () => {
      const dark = document.documentElement.classList.toggle('dark');
      try { localStorage.setItem('app_theme', dark ? 'dark' : 'light'); } catch (_) {}
    });

    // Init
    function init() {
      // Restore language
      const savedLang = (() => { try { return localStorage.getItem('app_lang'); } catch (_) { return null; } })();
      const initialLang = (savedLang && translations[savedLang]) ? savedLang : 'en';
      langSelector.value = initialLang;
      setLanguage(initialLang);

      // Restore grid resolution
      const gridSelect = document.getElementById('grid-resolution');
      const savedGridStr = (() => { try { return localStorage.getItem('sprint_grid'); } catch (_) { return null; } })();
      const validGrids = ['16','32','64','128'];
      if (savedGridStr && validGrids.includes(savedGridStr)) {
        gridResolution = parseInt(savedGridStr, 10);
        gridSelect.value = savedGridStr;
      }

      layers = [];
      addLayer();
      resizeAndRender();
    }
    init();
  </script>
</body>
</html>
