function render(){applyI18n();renderDecks();renderLibrary();if(state.view==='study')renderStudy()}
function applyI18n(){$$('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));$$('[data-i18n-placeholder]').forEach(e=>e.placeholder=t(e.dataset.i18nPlaceholder));$('#lang').value=lang;document.documentElement.lang=lang;document.title='Orbit Cards — '+t('study')}
function renderDecks(){const now=Date.now();$('#deck-list').innerHTML=state.decks.map(d=>{const all=state.cards.filter(c=>c.deckId===d.id),due=all.filter(c=>c.due<=now).length;return `<button class="deck ${d.id===state.deckId?'active':''}" data-deck="${d.id}" style="--deck:${d.color}"><span class="deck-dot"></span><span class="deck-copy"><strong>${esc(d.name)}</strong><small>${all.length} · ${due}</small></span></button>`}).join('');$('#mobile-decks').innerHTML=state.decks.map(d=>`<option value="${d.id}" ${d.id===state.deckId?'selected':''}>${esc(d.name)}</option>`).join('');$('#deck-count').textContent=state.decks.length;$('#due-total').textContent=state.cards.filter(c=>c.due<=now).length;$('#learned-total').textContent=state.cards.filter(c=>c.repetitions>0).length}
function renderLibrary(){const cards=deckCards(),due=dueCards().length,deck=currentDeck();$('#hero-title').textContent=t('ready');$('#hero-sub').textContent=due?t('dueMessage',{n:due}):t('clearMessage');$('#deck-title').textContent=deck?.name||'';$('#deck-subtitle').textContent=t('cards',{n:cards.length,d:due});const reviewed=cards.filter(c=>c.repetitions>0),ret=reviewed.length?Math.round(reviewed.reduce((s,c)=>s+Math.min(1,c.ease/2.5),0)/reviewed.length*100):0;$('#retention').textContent=ret+'%';$('#ring').style.setProperty('--p',ret);filterRows()}
function filterRows(){const q=$('#search').value.trim().toLowerCase(),cards=deckCards().filter(c=>!q||[c.front,c.back,c.notes,c.tags].join(' ').toLowerCase().includes(q)).sort((a,b)=>a.due-b.due);$('#card-rows').innerHTML=cards.map(c=>`<tr><td class="front-cell"><strong>${esc(c.front)}</strong><small>${esc(c.back)}</small></td><td>${c.tags.split(',').filter(Boolean).map(x=>`<span class="tag">${esc(x.trim())}</span>`).join('')}</td><td class="due">${formatDue(c.due)}</td><td><div class="row-actions"><button class="mini" data-edit="${c.id}" title="${t('edit')}">✎</button><button class="mini danger" data-delete="${c.id}" title="${t('delete')}">×</button></div></td></tr>`).join('');$('#empty').classList.toggle('hidden',cards.length>0);$('.card-table').classList.toggle('hidden',cards.length===0)}
function formatDue(ts){let d=ts-Date.now();if(d<=0)return t('now');if(d<3600000)return t('minutes',{n:Math.ceil(d/60000)});if(d<86400000)return t('hours',{n:Math.ceil(d/3600000)});return new Intl.DateTimeFormat(lang,{month:'short',day:'numeric'}).format(ts)}
function showView(view){state.view=view;$('#library-view').classList.toggle('hidden',view!=='library');$('#study-view').classList.toggle('hidden',view!=='study');$$('.tab').forEach(b=>b.classList.toggle('active',b.dataset.view===view));if(view==='study')startStudy()}
function startStudy(){state.queue=dueCards().sort((a,b)=>a.due-b.due);state.queueIndex=0;state.reviewed=0;renderStudy()}
function renderStudy(){const c=state.queue[state.queueIndex];$('#study-shell').classList.toggle('hidden',!c);$('#study-empty').classList.toggle('hidden',!!c);if(!c)return;$('#study-card').classList.remove('flipped');$('#rating').classList.add('hidden');$('#show-answer').classList.remove('hidden');$('#study-front').textContent=c.front;$('#study-back').textContent=c.back;$('#study-notes').textContent=c.notes;$('#study-progress').textContent=t('progress',{a:state.queueIndex+1,b:state.queue.length});$('#study-deck').textContent=currentDeck().name;const iv=Math.max(1,c.interval||1);$('#hard-time').textContent=t('days',{n:Math.max(1,Math.ceil(iv*1.2))});$('#good-time').textContent=t('days',{n:c.repetitions===0?1:c.repetitions===1?3:Math.max(1,Math.round(iv*c.ease))});$('#easy-time').textContent=t('days',{n:c.repetitions===0?4:Math.max(2,Math.round(iv*c.ease*1.3))})}
function reveal(){if(!state.queue[state.queueIndex])return;$('#study-card').classList.add('flipped');$('#rating').classList.remove('hidden');$('#show-answer').classList.add('hidden')}
async function rate(kind){const c=state.queue[state.queueIndex],day=86400000;if(kind==='again'){c.interval=0;c.repetitions=0;c.lapses++;c.ease=Math.max(1.3,c.ease-.2);c.due=Date.now()+600000}else if(kind==='hard'){c.interval=Math.max(1,Math.ceil((c.interval||1)*1.2));c.repetitions++;c.ease=Math.max(1.3,c.ease-.15);c.due=Date.now()+c.interval*day}else if(kind==='good'){c.interval=c.repetitions===0?1:c.repetitions===1?3:Math.max(1,Math.round(c.interval*c.ease));c.repetitions++;c.due=Date.now()+c.interval*day}else{c.interval=c.repetitions===0?4:Math.max(2,Math.round((c.interval||1)*c.ease*1.3));c.repetitions++;c.ease=Math.min(3.2,c.ease+.15);c.due=Date.now()+c.interval*day}c.updatedAt=Date.now();await store('readwrite','cards',c);state.queueIndex++;state.reviewed++;renderDecks();renderStudy()}
function openCard(id){const c=state.cards.find(x=>x.id===id);$('#card-form').reset();$('#card-id').value=c?.id||'';$('#front').value=c?.front||'';$('#back').value=c?.back||'';$('#notes').value=c?.notes||'';$('#tags').value=c?.tags||'';$('#card-modal-title').textContent=c?t('edit'):t('newCard');$('#card-modal').classList.remove('hidden');$('#front').focus()}
async function saveCard(e){e.preventDefault();const id=$('#card-id').value,old=state.cards.find(c=>c.id===id),data=old?{...old,front:$('#front').value.trim(),back:$('#back').value.trim(),notes:$('#notes').value.trim(),tags:$('#tags').value.trim(),updatedAt:Date.now()}:newCardData({deckId:state.deckId,front:$('#front').value.trim(),back:$('#back').value.trim(),notes:$('#notes').value.trim(),tags:$('#tags').value.trim()});await store('readwrite','cards',data);if(old)Object.assign(old,data);else state.cards.push(data);closeModal('card-modal');toast(t('cardSaved'));render()}
async function addDeck(e){e.preventDefault();const d={id:crypto.randomUUID(),name:$('#deck-name').value.trim(),color:$('#deck-color').value,createdAt:Date.now()};await store('readwrite','decks',d);state.decks.push(d);state.deckId=d.id;localStorage.setItem('flashcards-deck',d.id);closeModal('deck-modal');toast(t('deckCreated'));render()}
async function removeCard(id){if(!confirm(t('confirmDelete')))return;await store('readwrite','cards',null,id);state.cards=state.cards.filter(c=>c.id!==id);render()}
function parseCSV(text){const rows=[];let row=[],cell='',q=false;for(let i=0;i<text.length;i++){const ch=text[i],n=text[i+1];if(q&&ch==='"'&&n==='"'){cell+='"';i++}else if(ch==='"')q=!q;else if(ch===','&&!q){row.push(cell);cell=''}else if((ch==='\n'||ch==='\r')&&!q){if(ch==='\r'&&n==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))rows.push(row);row=[];cell=''}else cell+=ch}row.push(cell);if(row.some(x=>x.trim()))rows.push(row);if(!rows.length)return[];const head=rows.shift().map(x=>x.trim().toLowerCase());return rows.map(r=>Object.fromEntries(head.map((h,i)=>[h,r[i]||''])))}
async function importCSV(file){try{const rows=parseCSV(await file.text()).filter(r=>r.front&&r.back);for(const r of rows){const c=newCardData({deckId:state.deckId,front:r.front,back:r.back,notes:r.notes||'',tags:r.tags||''});await store('readwrite','cards',c);state.cards.push(c)}toast(t('imported',{n:rows.length}));render()}catch(e){toast(t('importError'))}}
function exportCSV(){const cards=deckCards();if(!cards.length)return toast(t('exportEmpty'));const quote=v=>'"'+String(v||'').replaceAll('"','""')+'"',csv=['front,back,notes,tags',...cards.map(c=>[c.front,c.back,c.notes,c.tags].map(quote).join(','))].join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));a.download=(currentDeck().name||'deck').replace(/[^\p{L}\p{N}_-]+/gu,'_')+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function closeModal(id){$('#'+id).classList.add('hidden')}function toast(s){const e=$('#toast');e.textContent=s;e.classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>e.classList.add('hidden'),2500)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.deck){state.deckId=b.dataset.deck;localStorage.setItem('flashcards-deck',state.deckId);render()}if(b.dataset.view)showView(b.dataset.view);if(b.dataset.close)closeModal(b.dataset.close);if(b.dataset.edit)openCard(b.dataset.edit);if(b.dataset.delete)removeCard(b.dataset.delete);if(b.dataset.rate)rate(b.dataset.rate)});
$('#add-card').onclick=()=>openCard();$('#add-deck').onclick=()=>{$('#deck-form').reset();$('#deck-color').value='#70e1c1';$('#deck-modal').classList.remove('hidden');$('#deck-name').focus()};$('#start-study').onclick=()=>showView('study');$('#show-answer').onclick=reveal;$('#study-card').onclick=reveal;$('#study-card').onkeydown=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();reveal()}};$('#card-form').onsubmit=saveCard;$('#deck-form').onsubmit=addDeck;$('#search').oninput=filterRows;$('#mobile-decks').onchange=e=>{state.deckId=e.target.value;render()};$('#import-btn').onclick=()=>$('#file-input').click();$('#file-input').onchange=e=>{if(e.target.files[0])importCSV(e.target.files[0]);e.target.value=''};$('#export-btn').onclick=exportCSV;$('#lang').onchange=e=>{lang=e.target.value;localStorage.setItem('flashcards-lang',lang);render()};$('#theme').onclick=()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('flashcards-theme',n)};document.documentElement.dataset.theme=localStorage.getItem('flashcards-theme')||localStorage.getItem('app_theme')||'dark';
load().catch(e=>{console.error(e);toast('IndexedDB error')});
</script>
</body>
