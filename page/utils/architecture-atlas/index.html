const DIRECTIONS=['forward','reverse','both'];
const DEFAULT_FLOW={rate:25,parallel:1,size:2};
const REVERSE_COLOR='#ff9a5c';
function edgeDirection(e){return DIRECTIONS.includes(e.direction)?e.direction:e.bidirectional?'both':'forward';}
function edgeFlow(e,side){return{...DEFAULT_FLOW,...e.flow?.[side]};}
function edgeSymbol(e){return edgeDirection(e)==='both'?'↔':edgeDirection(e)==='reverse'?'←':'→';}
function flowProgress(elapsed,rate,parallel,index,reverse=false){if(rate<=0)return null;const fraction=(elapsed*rate/(60000*parallel)+index/parallel)%1;return reverse?1-fraction:fraction;}

const children=(s,id)=>s.nodes.filter(n=>n.parent===id);
function canEnterDetails(s,id){const item=s.nodes.find(n=>n.id===id);return !!item&&(item.type==='app'||children(s,id).length>0);}
function descendants(s,id){const result=new Set(),todo=[id];while(todo.length){const current=todo.pop();for(const n of s.nodes)if(n.parent===current&&!result.has(n.id)){result.add(n.id);todo.push(n.id);}}return result;}
function worldPosition(s,n){const p=[...n.position],seen=new Set([n.id]);let parent=n.parent;while(parent){if(seen.has(parent))throw Error('Containment cycle');seen.add(parent);const item=s.nodes.find(x=>x.id===parent);if(!item)break;item.position.forEach((v,i)=>p[i]+=v);parent=item.parent;}return p;}
function visibleEndpoint(s,id,visible){const seen=new Set();let n=s.nodes.find(n=>n.id===id);while(n&&!seen.has(n.id)){if(visible.has(n.id))return n.id;seen.add(n.id);n=s.nodes.find(p=>p.id===n.parent);}return null;}
function aggregateLinks(s,visible){const groups=new Map();for(const edge of s.edges){const a=visibleEndpoint(s,edge.source,visible),b=visibleEndpoint(s,edge.target,visible);if(!a||!b||a===b)continue;const direction=edgeDirection(edge),key=JSON.stringify([a,b,edge.kind,direction,edge.color||null,edge.reverseColor||null,edgeFlow(edge,'forward'),edgeFlow(edge,'reverse')]);const existing=groups.get(key);if(existing)existing.edges.push(edge);else groups.set(key,{source:a,target:b,kind:edge.kind,direction,bidirectional:direction==='both',edges:[edge]});}return [...groups.values()];}

function removeNode(s,id){const ids=descendants(s,id);ids.add(id);s.nodes=s.nodes.filter(n=>!ids.has(n.id));s.edges=s.edges.filter(e=>!ids.has(e.source)&&!ids.has(e.target));s.tour=s.tour.filter(v=>!ids.has(v.focus));s.views=s.views.filter(v=>!ids.has(v.focus));return ids;}
function reparent(s,id,parent){const n=s.nodes.find(n=>n.id===id);if(!n)throw Error('Missing object');if(parent===id||descendants(s,id).has(parent))throw Error('Containment cycle');if(parent&&!s.nodes.some(n=>n.id===parent))throw Error('Missing parent');const p=worldPosition(s,n),parentPosition=parent?worldPosition(s,s.nodes.find(n=>n.id===parent)):[0,0,0];n.parent=parent;n.position=p.map((v,i)=>v-parentPosition[i]);}

function architecturePrompt(){
 const intro=tr([
  'Examine the repository/code I provide and model its actual application architecture for Architecture Atlas 3D. Return one complete valid JSON object, with no Markdown fences or surrounding prose. Inspect source code, routes, services, API clients, configuration, deployment files, ORM models, SQL schemas and migrations. Do not invent systems, tables or relationships. Put file paths and relevant symbols in each description as evidence. If deployment is unknown, use a logical group rather than claiming a particular provider/server; clearly describe any inference.',

  `形式の契約（プロパティ名と列挙値は大文字小文字を区別）:
- ルート: format="${FORMAT}", version=${VERSION}, id, name, updated（Unixミリ秒）, assets={}, settings, scenarios, activeScenario, baseline。activeScenario/baselineはシナリオIDを参照します。
- scenariosは1〜20件。各シナリオはid, name, nodes, edges, views=[], tour=[]。「現在」のシナリオ一つから開始します。IDは空でない100文字以内の文字列。__proto__, prototype, constructorは禁止。シナリオID、各シナリオ内のノードID、接続IDはそれぞれ一意にします。
- ノード: id, name, type, shape, parent（ノードIDまたはnull）, position=[x,y,z], size=[幅,高さ,奥行], icon, technology, description, tags, locked=false, definitionId, meta={}, style={}。座標は親に対するローカル座標。親は存在し、循環は禁止。各寸法は0.02〜1000、座標は-10000〜10000。nameは200文字、technology/tagsは500文字、descriptionは10000文字以内。

- 接続: id, source, target, kind, label, protocol, port, description, direction="forward"|"reverse"|"both", bidirectional（旧形式用、bothのみtrue）、color（順方向）、reverseColor（逆方向）はnullまたは#RRGGBB。flow={forward:{rate,parallel,size},reverse:{rate,parallel,size}}。フロー省略時はrate=25個/分（0〜6000、0は停止）、parallel=1（整数1〜24）、size=2（接続長の%、0.5〜25）。各方向で値を変更可能。実際の流量が不明な場合は既定値を使い、可視化用設定を測定済みの指標として扱わないでください。移動秒数=60*parallel/rate。Aはsource、BはtargetでforwardはA→B、reverseはB→A、bothは双方向。旧bidirectionalのみのJSONも読み込めます。source/targetはAPI・テーブル・カラムを含む実ノードを参照し、自己接続は禁止。kind: ${RELATIONS.join(', ')}。呼出元/発行元/読取元/書込元 → 接続先の方向にします。読取・書込・呼出・非同期イベントを区別。labelは200文字、protocol/portは100文字、descriptionは10000文字以内。
- アイコンは下記リストのIDかnone。assetsは{}で構いません。明示的に提供された画像はdata:image/png|jpeg|webp;base64,...とicon="asset:<キー>"を使用し、参照先のキーはassetsに必要です。
- settings: fontはsystem-ui/Arial/Georgia/monospace、fontSize 9〜28、iconSize 12〜60、lineWidth 0.01〜0.2、lineColorは#RRGGBB、background/gridColor/textColorはnullまたは#RRGGBB、grid/snapは真偽値、colorsはノード種別から色へのマップ。visualThemeはstandard/neon/matrix、baseColorは#RRGGBB、labelMode/fieldLabelsはfloating/printed、compactFieldsは真偽値。省略された任意設定は既定値を使用。

for(const button of document.querySelectorAll('[data-mode]'))button.onclick=()=>setMode(button.dataset.mode);
for(const button of document.querySelectorAll('[data-panel]'))button.onclick=()=>{panel=button.dataset.panel;document.querySelectorAll('[data-panel]').forEach(b=>b.classList.toggle('active',b===button));renderInspector();};
$('inspector').onchange=e=>{if(e.target.id==='edge-animate-flow'){setFlow(e.target.checked);return;}if(e.target.id==='visual-theme'){applyVisualTheme(e.target.value);return;}if(e.target.id==='matrix-color'){applyVisualTheme('matrix',e.target.value);return;}if(e.target.dataset.edit)updateField(e.target);if(e.target.id==='style-preset'){const themeValue=e.target.value;change(()=>{project.settings.background=null;project.settings.gridColor=null;project.settings.textColor=null;});localStorage.setItem('app_theme',themeValue);applyTheme(themeValue);}};
$('inspector').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.palette){applyVisualTheme('matrix',b.dataset.palette);return;}if(b.dataset.edge){selectEdge(b.dataset.edge);return;}if(b.dataset.jump){gotoNode(b.dataset.jump);return;}switch(b.dataset.inspect){case'add':addDialog();break;case'duplicate':duplicateNode(selection.id);break;case'delete':removeSelected();break;case'open':enter(selection.id);break;case'icon':iconDialog();break;case'upload':iconTarget=selection.id;$('icon-file').click();break;case'resetStyle':change(()=>node(selection.id).style={});break;case'highlight':highlight.size?(highlight.clear(),buildScene()):highlightPath();break;case'views':viewsDialog();break;case'globalReset':change(()=>project.settings=makeProject().settings);break;}};
$('context-menu').onclick=e=>{const b=e.target.closest('[data-context]');if(!b)return;$('context-menu').classList.remove('show');switch(b.dataset.context){case'open':enter(selection.id);break;case'duplicate':duplicateNode(selection.id);break;case'highlight':highlightPath();break;case'delete':removeSelected();break;}};
$('project-file').onchange=e=>{const file=e.target.files[0];e.target.value='';importProject(file);};$('icon-file').onchange=e=>{const file=e.target.files[0];e.target.value='';uploadIcon(file);};
function setFlow(value){flow=value;message('');$('flow-button').classList.toggle('active',flow);$('flow-button').setAttribute('aria-pressed',String(flow));for(const id of ['edge-animate-flow','animate-flow','tour-flow'])if($(id))$(id).checked=flow;saveCamera();}
function stopPresentation(){tourIndex=-1;setFlow(false);$('tour-overlay').classList.remove('show');}
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&fullscreen&&!$('dialog').open&&!$('view-dialog').open&&!$('context-menu').classList.contains('show')&&tourIndex<0){e.preventDefault();toggleFullscreen();return;}if(e.target.closest('input,textarea,select,[contenteditable]'))return;if((e.code==='Space'||e.key===' ')&&!$('dialog').open&&!$('view-dialog').open){e.preventDefault();if(!e.repeat)spacePanUsed=false;spaceKeyDown=true;setSpacePan(true);return;}if(e.key==='?'&&!$('dialog').open){e.preventDefault();helpDialog();}if(e.key==='Escape'){spaceKeyDown=false;setSpacePan(false);connectionSource=null;$('context-menu').classList.remove('show');if(tourIndex>=0)stopPresentation();else if(!$('dialog').open)message('');}if($('dialog').open||$('view-dialog').open)return;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo();}if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();removeSelected();}if(e.key==='Enter'&&selection?.kind==='node')enter(selection.id);if(e.altKey&&e.key==='ArrowLeft'){e.preventDefault();back();}});
window.addEventListener('keyup',e=>{if((e.code==='Space'||e.key===' ')){e.preventDefault();spaceKeyDown=false;if(spacePanUsed&&!pointerStart)setSpacePan(false);}});window.addEventListener('blur',()=>{spaceKeyDown=false;setSpacePan(false);});window.addEventListener('pointerdown',e=>{if(!viewport.contains(e.target)){spaceKeyDown=false;setSpacePan(false);}},{capture:true});
window.addEventListener('pagehide',()=>{if(project&&dirty){clearTimeout(saveTimer);saveNow(clone(project));}saveCamera();});
window.ArchitectureAtlas={exportProject:()=>clone(project),validateProject,format:FORMAT,version:VERSION};
applyLanguage();document.documentElement.dataset.theme=theme;
try{db=await openDB();const stored=await readProjects();for(const item of stored){try{library.push(validateProject(item));}catch(error){console.warn('Architecture Atlas: invalid saved project retained in storage',error.message);}}}catch(error){console.warn(error);}
if(!library.length){project=exampleProject();rememberLibrary(project);}else project=clone(library.find(p=>p.id===prefs.current)||library[0]);
$('context-view').value=prefs.context==='isolated'?'isolated':'context';$('auto-detail').checked=!!prefs.auto;$('zoom-exit').checked=prefs.zoomExit!==false;
setProject(project);init3D();buildScene();fitScene();if(prefs.view?.project===project.id&&prefs.view?.scenario===project.activeScenario){try{const view=prefs.view;if(Array.isArray(view.position)&&view.position.length===3&&view.position.every(Number.isFinite)&&Array.isArray(view.target)&&view.target.length===3&&view.target.every(Number.isFinite))restoreView(view);}catch{}}
if(!db){$('save-status').textContent=t('saveFailed');message(t('saveFailed'),true);}else{scheduleSave();}
</script>
<script>
setTimeout(()=>{const loading=document.getElementById('loading');if(!window.ArchitectureAtlas&&!loading.classList.contains('hide')){const language=document.documentElement.lang;loading.textContent=language==='pt'?'Não foi possível carregar o 3D. Verifique a conexão e recarregue.':language==='ja'?'3Dを読み込めません。接続を確認して再読み込みしてください。':'Could not load 3D. Check your connection and reload.';}},12000);
</script>
</body>
</html>
