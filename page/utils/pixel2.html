    <style>
        html, body { height: 100%; }
        body {
            font-family: 'Inter', sans-serif;
            touch-action: none;
            margin: 0;
            overflow: hidden;
            font-size: 14px;
        }
        .app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 8px; padding: 8px; }
        .toolbar { display: flex; align-items: center; gap: 6px; min-height: 40px; padding: 4px 8px; border-radius: 8px; overflow-x: auto; scrollbar-width: thin; }
        .toolbar .brand { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; white-space: nowrap; margin-right: 4px; }
        .toolbar .brand img { width: 18px; height: 18px; }
        html[data-hub] .toolbar .brand { display: none; }
        .toolbar .spacer { flex: 1; }
        .tb-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 6px; font-size: 13px; white-space: nowrap; flex: none; }
        .tb-btn svg { width: 16px; height: 16px; }
        .tb-btn.icon-only { width: 30px; padding: 0; }
        .tb-select { height: 30px; padding: 0 6px; border-radius: 6px; font-size: 13px; }
        .tb-sep { width: 1px; height: 20px; flex: none; background: currentColor; opacity: .15; }
        .workspace { min-height: 0; display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 8px; }
        .side { min-height: 0; overflow: auto; padding: 10px; border-radius: 8px; display: flex; flex-direction: column; gap: 12px; }
        .side h3, .side label.head { font-size: 13px; font-weight: 700; margin-bottom: 6px; display: block; }
        .field { height: 30px; width: 100%; padding: 0 8px; border-radius: 6px; font-size: 13px; }
        .canvas-container {
            cursor: crosshair;
            min-width: 0;
            min-height: 0;
            overflow: hidden;
            display: grid;
            place-items: center;
            padding: 8px;
            border-radius: 8px;
        }
        .canvas-stage { position: relative; line-height: 0; }
        canvas {
            display: block;
        }
        dialog.help { width: min(520px, calc(100vw - 32px)); max-height: calc(100vh - 32px); padding: 0; border-radius: 10px; border: 1px solid rgba(128,128,128,.35); background: #ffffff; color: #1f2937; }
        html.dark dialog.help { background: #1f2937; color: #e5e7eb; }
        dialog.help::backdrop { background: rgb(0 0 0 / 45%); }
        dialog.help .dlg-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px; border-bottom: 1px solid rgba(128,128,128,.3); font-weight: 700; }
        dialog.help .dlg-body { padding: 10px 12px 12px; overflow: auto; font-size: 14px; }
        dialog.help h4 { margin: 10px 0 4px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; opacity: .7; }
        dialog.help p { margin: 0 0 6px; }
        @media (max-width: 720px) {
            body { overflow: auto; }
            .app { height: auto; min-height: 100%; }
            .workspace { grid-template-columns: 1fr; }
            .canvas-container { height: min(92vw, 480px); }
            .side { overflow: visible; }
            .tb-btn .tb-label { display: none; }
        }
        .color-box {
            transition: transform 0.1s ease-in-out;
        }
        .color-box:hover {
            transform: scale(1.1);
        }
        .color-box.selected {
            transform: scale(1.1);
            box-shadow: 0 0 0 3px #3b82f6;
        }
        .tool-btn.active {
            background-color: #3b82f6;
            color: white;
        }
        #selection-box {
            position: absolute;
            border: 2px dashed #007bff;
            pointer-events: none;
            display: none;
        }
        select:focus, input:focus {
            outline: 2px solid #3b82f6;
            outline-offset: 2px;
        }

    <script>
        const translations = {
            en: {
                title: 'Pixel Art Editor', language: 'Language', tools: 'Tools', brush: 'Brush',
                eraser: 'Eraser', select: 'Select', colors: 'Colors', gridResolution: 'Grid Resolution',
                actions: 'Actions', exportSize: 'Export Size (px)', save: 'Save as PNG', clear: 'Clear Canvas',
                importImage: 'Import Image', help: 'Help', close: 'Close', theme: 'Toggle theme',
                helpIntro: 'Draw pixel art on a square grid and save it as a PNG.',
                helpTools: 'Brush paints with the selected color, Eraser clears pixels, and Select marks an area you can drag to move.',
                helpActions: 'Grid Resolution changes the grid size and clears the drawing. Import Image converts a picture to the palette colors. Save as PNG exports the drawing at the export size. Clear Canvas erases everything after confirming.',
                helpShortcutsTitle: 'Shortcuts', helpShortcut: '? opens this help.',
            },
            ja: {
                title: 'ピクセルアートエディター', language: '言語', tools: 'ツール', brush: 'ブラシ',
                eraser: '消しゴム', select: '選択', colors: 'カラー', gridResolution: 'グリッド解像度',
                actions: 'アクション', exportSize: 'エクスポートサイズ (px)', save: 'PNGで保存', clear: 'クリア',
                importImage: '画像を読み込む', help: 'ヘルプ', close: '閉じる', theme: 'テーマ切替',
                helpIntro: '正方形のグリッドにピクセルアートを描き、PNG として保存します。',
                helpTools: 'ブラシは選択した色で塗り、消しゴムはピクセルを消し、選択は範囲を選んでドラッグで移動できます。',
                helpActions: 'グリッド解像度を変えるとグリッドの大きさが変わり、絵は消去されます。「画像を読み込む」は画像をパレットの色に変換します。「PNGで保存」はエクスポートサイズで書き出します。「クリア」は確認後にすべて消去します。',
                helpShortcutsTitle: 'ショートカット', helpShortcut: '? でこのヘルプを開きます。',
            },
            pt: {
                title: 'Editor de Pixel Art', language: 'Idioma', tools: 'Ferramentas', brush: 'Pincel',
                eraser: 'Borracha', select: 'Selecionar', colors: 'Cores', gridResolution: 'Resolução da Grade',
                actions: 'Ações', exportSize: 'Tamanho da Exportação (px)', save: 'Salvar como PNG', clear: 'Limpar Tela',
                importImage: 'Importar Imagem', help: 'Ajuda', close: 'Fechar', theme: 'Alternar tema',
                helpIntro: 'Desenhe pixel art numa grade quadrada e salve como PNG.',
                helpTools: 'Pincel pinta com a cor escolhida, Borracha apaga pixels e Selecionar marca uma área que você pode arrastar para mover.',
                helpActions: 'Resolução da Grade muda o tamanho da grade e limpa o desenho. Importar Imagem converte uma figura para as cores da paleta. Salvar como PNG exporta o desenho no tamanho de exportação. Limpar Tela apaga tudo após confirmar.',
                helpShortcutsTitle: 'Atalhos', helpShortcut: '? abre esta ajuda.',
            }
        };

        const langSelector = document.getElementById('lang-selector');
        langSelector.addEventListener('change', (e) => {
            try { localStorage.setItem('app_lang', e.target.value); } catch (_) {}
            setLanguage(e.target.value);
        });

        function setLanguage(lang) {
            if (!translations[lang]) lang = 'en';
            langSelector.value = lang;
            document.documentElement.lang = lang;
            document.querySelectorAll('[data-lang]').forEach(el => {
                const key = el.getAttribute('data-lang');
                if (translations[lang] && translations[lang][key]) {
                    el.textContent = translations[lang][key];
                }
            });
            const tr = translations[lang];
            [['help-btn', 'help'], ['help-close', 'close'], ['theme-switcher', 'theme']].forEach(([id, key]) => {
                const el = document.getElementById(id);
                if (el) { el.title = tr[key]; el.setAttribute('aria-label', tr[key]); }
            });
        }

        const helpDialog = document.getElementById('help-dialog');
        document.getElementById('help-btn').addEventListener('click', () => helpDialog.showModal());
        document.getElementById('help-close').addEventListener('click', () => helpDialog.close());
        helpDialog.addEventListener('click', (e) => { if (e.target === helpDialog) helpDialog.close(); });
        document.addEventListener('keydown', (e) => {
            const el = e.target;
            const typing = el && (el.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName));
            if (e.key === '?' && !typing && !helpDialog.open) {
                e.preventDefault();
                helpDialog.showModal();
            }
        });
        document.getElementById('theme-switcher').addEventListener('click', () => {
            const dark = document.documentElement.classList.toggle('dark');
            try { localStorage.setItem('app_theme', dark ? 'dark' : 'light'); } catch (_) {}
        });

        const canvas = document.getElementById('pixel-canvas');
        const ctx = canvas.getContext('2d');
        const canvasContainer = document.querySelector('.canvas-container');
        
        // --- Data Model ---
        let pixelGrid = [];
        let gridResolution = 32;
        
        let pixelSize = 0;
        let isDrawing = false;
        let currentColor = '#000000';
        let currentTool = 'brush';

        let isSelecting = false;
        let isDragging = false;
        let selectionRect = { x: 0, y: 0, w: 0, h: 0 };
        let selectedPixelData = null; // Will store pixel data from our model
        let selectionStartGrid = {x: 0, y: 0};
        let dragStart = { x: 0, y: 0 };
        const selectionBox = document.getElementById('selection-box');

        const colors = [
            '#ffffff', '#c2c2c2', '#858585', '#474747', '#000000', '#203548',
            '#ff4500', '#ff8c00', '#ffd700', '#9acd32', '#32cd32', '#008080',
            '#00ced1', '#1e90ff', '#4169e1', '#8a2be2', '#9932cc', '#c71585'
        ];

        const colorPalette = document.getElementById('color-palette');
        colors.forEach(color => {
            const colorBox = document.createElement('div');
            colorBox.className = 'w-6 h-6 rounded-full cursor-pointer border-2 border-gray-300 dark:border-gray-600 color-box';
            colorBox.style.backgroundColor = color;
            colorBox.addEventListener('click', () => {
                currentColor = color;
                document.querySelectorAll('.color-box').forEach(b => b.classList.remove('selected'));
                colorBox.classList.add('selected');
            });
            colorPalette.appendChild(colorBox);
        });
        colorPalette.children[4].classList.add('selected');

        function initializeGrid(resolution) {
            gridResolution = resolution;
            pixelGrid = Array(resolution).fill(0).map(() => Array(resolution).fill(null));
        }

        function renderCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let y = 0; y < gridResolution; y++) {
                for (let x = 0; x < gridResolution; x++) {
                    if (pixelGrid[y][x]) {
                        ctx.fillStyle = pixelGrid[y][x];
                        ctx.fillRect(x * pixelSize, y * pixelSize, pixelSize, pixelSize);
                    }
                }
            }
            drawGrid();
        }

        function resizeAndRender() {
            const containerRect = canvasContainer.getBoundingClientRect();
            const size = Math.min(containerRect.width, containerRect.height) - 16;
            
            canvas.width = size;
            canvas.height = size;
            
            pixelSize = canvas.width / gridResolution;

            renderCanvas();
        }

        function drawGrid() {
            ctx.strokeStyle = '#e0e0e0';
            ctx.lineWidth = 1;
            for (let i = 0; i <= gridResolution; i++) {
                const pos = i * pixelSize;
                ctx.beginPath();
                ctx.moveTo(pos + 0.5, 0);
                ctx.lineTo(pos + 0.5, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, pos + 0.5);
                ctx.lineTo(canvas.width, pos + 0.5);
                ctx.stroke();
            }
        }

        function getMousePos(evt) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            let clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
            let clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
            return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
        }

        function drawOnGrid(x, y) {
            const gridX = Math.floor(x / pixelSize);
            const gridY = Math.floor(y / pixelSize);

            if (gridX >= 0 && gridX < gridResolution && gridY >= 0 && gridY < gridResolution) {
                pixelGrid[gridY][gridX] = (currentTool === 'eraser') ? null : currentColor;
                renderCanvas();
            }
        }

        function handleStart(e) {
            e.preventDefault();
            const pos = getMousePos(e);
            if (currentTool === 'select') {
                if (selectedPixelData && pos.x >= selectionRect.x && pos.x <= selectionRect.x + selectionRect.w && pos.y >= selectionRect.y && pos.y <= selectionRect.y + selectionRect.h) {
                    isDragging = true;
                    dragStart = { x: pos.x - selectionRect.x, y: pos.y - selectionRect.y };
                    canvasContainer.style.cursor = 'move';
                } else {
                    stampSelection();
                    isSelecting = true;
                    selectionRect.x = pos.x;
                    selectionRect.y = pos.y;
                    selectionRect.w = 0;
                    selectionRect.h = 0;
                }
            } else {
                isDrawing = true;
                drawOnGrid(pos.x, pos.y);
            }
        }

        function handleMove(e) {
            if (!isDrawing && !isSelecting && !isDragging) return;
            e.preventDefault();
            const pos = getMousePos(e);

            if (isDrawing) {
                drawOnGrid(pos.x, pos.y);
            } else if (isSelecting) {
                selectionRect.w = pos.x - selectionRect.x;
                selectionRect.h = pos.y - selectionRect.y;
                updateSelectionBox();
            } else if (isDragging) {
                renderCanvas(); // Redraw canvas from model (already has the hole)
                selectionRect.x = pos.x - dragStart.x;
                selectionRect.y = pos.y - dragStart.y;
                
                // Draw the floating selection data on top
                ctx.globalAlpha = 0.7;
                for (const pixel of selectedPixelData) {
                    ctx.fillStyle = pixel.color;
                    const drawX = selectionRect.x + pixel.dx * pixelSize;
                    const drawY = selectionRect.y + pixel.dy * pixelSize;
                    ctx.fillRect(drawX, drawY, pixelSize, pixelSize);
                }
                ctx.globalAlpha = 1.0;
                
                updateSelectionBox(true);
            }
        }

        function handleEnd(e) {
            e.preventDefault();
            isDrawing = false;
            if (isSelecting) {
                isSelecting = false;
                captureSelection();
            }
            if (isDragging) {
                isDragging = false;
                canvasContainer.style.cursor = 'crosshair';
                stampSelection();
            }
        }

        function updateSelectionBox(isDragging = false) {
            const sx = Math.min(selectionRect.x, selectionRect.x + selectionRect.w);
            const sy = Math.min(selectionRect.y, selectionRect.y + selectionRect.h);
            const sw = Math.abs(selectionRect.w);
            const sh = Math.abs(selectionRect.h);

            selectionBox.style.display = 'block';
            selectionBox.style.left = `${sx / canvas.width * 100}%`;
            selectionBox.style.top = `${sy / canvas.height * 100}%`;
            selectionBox.style.width = `${sw / canvas.width * 100}%`;
            selectionBox.style.height = `${sh / canvas.height * 100}%`;
            selectionBox.style.borderStyle = isDragging ? 'solid' : 'dashed';
        }

        function captureSelection() {
            const startX = Math.floor(Math.min(selectionRect.x, selectionRect.x + selectionRect.w) / pixelSize);
            const startY = Math.floor(Math.min(selectionRect.y, selectionRect.y + selectionRect.h) / pixelSize);
            const endX = Math.ceil(Math.max(selectionRect.x, selectionRect.x + selectionRect.w) / pixelSize);
            const endY = Math.ceil(Math.max(selectionRect.y, selectionRect.y + selectionRect.h) / pixelSize);
            
            selectedPixelData = [];
            for (let y = startY; y < endY; y++) {
                for (let x = startX; x < endX; x++) {
                    if (y >= 0 && y < gridResolution && x >= 0 && x < gridResolution && pixelGrid[y][x]) {
                        selectedPixelData.push({ color: pixelGrid[y][x], dx: x - startX, dy: y - startY });
                        pixelGrid[y][x] = null; // Cut from the model
                    }
                }
            }

            if (selectedPixelData.length > 0) {
                selectionRect = { x: startX * pixelSize, y: startY * pixelSize, w: (endX - startX) * pixelSize, h: (endY - startY) * pixelSize };
                renderCanvas(); // Redraw to show the hole
                updateSelectionBox(true);
            } else {
                resetSelection();
            }
        }

        function stampSelection() {
            if (selectedPixelData) {
                const gridX = Math.round(selectionRect.x / pixelSize);
                const gridY = Math.round(selectionRect.y / pixelSize);
                
                for (const pixel of selectedPixelData) {
                    const finalX = gridX + pixel.dx;
                    const finalY = gridY + pixel.dy;
                    if (finalY >= 0 && finalY < gridResolution && finalX >= 0 && finalX < gridResolution) {
                        pixelGrid[finalY][finalX] = pixel.color;
                    }
                }
            }
            resetSelection();
            renderCanvas();
        }

        function resetSelection() {
            selectedPixelData = null;
            selectionBox.style.display = 'none';
        }

        window.addEventListener('resize', resizeAndRender);
        
        document.getElementById('grid-resolution').addEventListener('change', (e) => {
            const newRes = parseInt(e.target.value);
            initializeGrid(newRes);
            resizeAndRender();
        });

        document.getElementById('save-btn').addEventListener('click', () => {
            stampSelection();
            const exportSize = parseInt(document.getElementById('export-size').value) || 512;
            
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = exportSize;
            tempCanvas.height = exportSize;
            const tempCtx = tempCanvas.getContext('2d');
            tempCtx.fillStyle = '#ffffff';
            tempCtx.fillRect(0, 0, exportSize, exportSize);

            const exportPixelSize = exportSize / gridResolution;
            for (let y = 0; y < gridResolution; y++) {
                for (let x = 0; x < gridResolution; x++) {
                    if (pixelGrid[y][x]) {
                        tempCtx.fillStyle = pixelGrid[y][x];
                        tempCtx.fillRect(x * exportPixelSize, y * exportPixelSize, exportPixelSize, exportPixelSize);
                    }
                }
            }

            const dataURL = tempCanvas.toDataURL('image/png');
            const link = document.createElement('a');
            link.download = `pixel-art-${gridResolution}x${gridResolution}.png`;
            link.href = dataURL;
            link.click();
        });

        document.getElementById('clear-btn').addEventListener('click', () => {
            if (confirm('Are you sure you want to clear the canvas?')) {
                resetSelection();
                initializeGrid(gridResolution);
                renderCanvas();
            }
        });

        // --- Image Import to Pixel Grid ---
        function hexToRgb(hex) {
            const clean = hex.replace('#', '');
            const num = parseInt(clean, 16);
            return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
        }

        function nearestPaletteColor(r, g, b) {
            let best = colors[0];
            let bestDist = Infinity;
            for (const c of colors) {
                const rgb = hexToRgb(c);
                const dr = r - rgb.r;
                const dg = g - rgb.g;
                const db = b - rgb.b;
                const dist = dr * dr + dg * dg + db * db;
                if (dist < bestDist) {
                    bestDist = dist;
                    best = c;
                }
            }
            return best;
        }

        function importImageFromFile(file) {
            const url = URL.createObjectURL(file);
            const img = new Image();
            img.onload = () => {
                // Draw the image scaled to gridResolution x gridResolution
                const small = document.createElement('canvas');
                small.width = gridResolution;
                small.height = gridResolution;
                const sctx = small.getContext('2d');
                sctx.imageSmoothingEnabled = true;
                sctx.clearRect(0, 0, small.width, small.height);
                sctx.drawImage(img, 0, 0, small.width, small.height);

                const imgData = sctx.getImageData(0, 0, small.width, small.height).data;
                for (let y = 0; y < gridResolution; y++) {
                    for (let x = 0; x < gridResolution; x++) {
                        const idx = (y * gridResolution + x) * 4;
                        const r = imgData[idx];
                        const g = imgData[idx + 1];
                        const b = imgData[idx + 2];
                        const a = imgData[idx + 3];
                        if (a < 8) {
                            pixelGrid[y][x] = null; // transparent -> empty
                        } else {
                            pixelGrid[y][x] = nearestPaletteColor(r, g, b);
                        }
                    }
                }
                renderCanvas();
                URL.revokeObjectURL(url);
            };
            img.onerror = () => URL.revokeObjectURL(url);
            img.src = url;
        }

        const importBtn = document.getElementById('import-btn');
        const imageInput = document.getElementById('image-input');
        importBtn.addEventListener('click', () => imageInput.click());
        imageInput.addEventListener('change', (e) => {
            const file = e.target.files && e.target.files[0];
            if (!file) return;
            stampSelection();
            resetSelection();
            importImageFromFile(file);
            imageInput.value = '';
        });

        // Input events (mouse and touch) for drawing/selecting
        canvas.addEventListener('mousedown', handleStart);
        canvas.addEventListener('mousemove', handleMove);
        canvas.addEventListener('mouseup', handleEnd);
        canvas.addEventListener('mouseleave', handleEnd);

        canvas.addEventListener('touchstart', handleStart, { passive: false });
        canvas.addEventListener('touchmove', handleMove, { passive: false });
        canvas.addEventListener('touchend', handleEnd, { passive: false });
        canvas.addEventListener('touchcancel', handleEnd, { passive: false });

        const toolButtons = document.querySelectorAll('.tool-btn');
        toolButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                stampSelection();
                toolButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentTool = btn.id.replace('-tool', '');
                canvasContainer.style.cursor = 'crosshair';
                if (currentTool !== 'select') resetSelection();
            });
        });

        setLanguage((() => { try { return localStorage.getItem('app_lang'); } catch (_) { return null; } })() || 'en');
        initializeGrid(gridResolution);
        resizeAndRender();
    </script>
</body>
</html>
